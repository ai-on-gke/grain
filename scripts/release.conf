# The release train's operator settings (scripts/release-from-trunk.sh,
# scripts/build-version.sh, design/design/release-from-trunk.design.md, "Version
# Numbering Rules Under Release-from-Trunk"). The train reads this file as
# origin/main has it, so a change takes effect at the next run after it
# merges; build-version.sh reads it as the commit being built has it. Only
# these keys are read, and nothing here is executed.

# The major version the train releases. Above every promoted major, the
# next release is that major's first, v{M}.<floor>.0, and goes on as
# v{M}.<floor+1>.0 and so on. Set to 2 for grain 2.0.0 (task 4873), the
# first single-tenant release, and to 3 for v3.0.0, the first release from
# ai-on-gke/grain. A RELEASE_MAJOR behind the newest released major never
# moves the version backwards: the train and build-version.sh both release
# that major instead.
RELEASE_MAJOR=3

# The lowest minor RELEASE_MAJOR's next release may have. The next release
# is otherwise v{M}.{P+1}.0, P being the highest v{M}.P.0 tag (for
# scripts/build-version.sh, the highest in the build's history). Version
# numbers never repeat or go backwards, so v2.3, v2.4 and v2.5 are all
# consumed: the legacy cut used v2.3.0-rc.1 and v2.4.0-rc.1 (v2.4.0 was
# promoted off candidate's history, not main's), main built v2.5.0-dev
# before release from trunk, and v2.5.0 is a placeholder tag on main --
# a version number, not a release -- that makes main build v2.6.0-dev.
# The first release from trunk is v2.6.0 (design/design/release-from-trunk.design.md,
# "Version Numbering Rules"). v3 has no consumed minors: v3.0.0 is
# promoted, so the next release is v3.1.0 and the floor is 0.
RELEASE_FLOOR_MINOR=0

# Tags the train never promotes, space-separated, whatever the soak says:
# a release (vX.Y.0, whose minor is stepped over entirely) or one release
# candidate (vX.Y.0-rc.N, which the soak gate fails, so the next cut of
# the same minor is rc.N+1). v1.14.0-rc.1 holds only the single-tenant
# reset's first stage, so v1.14.0 is skipped and the next release was
# v2.0.0. v2.3.0-rc.1 and v2.4.0-rc.1 were cut by the legacy candidate
# cut, off candidate's own history (93a7ceb95 is the unverified 8-file
# back-merge, and its release.yml failed in tests/installer); the train
# never promotes either. v2.5.0 is the placeholder tag above: it still
# counts as the highest vX.Y.0, so the next release is v2.6.0, but the
# train writes v2.6.0's release notes from v2.4.0, the newest vX.Y.0 not
# named here, since nothing was ever released as v2.5.0.
RELEASE_NEVER_PROMOTE="v1.14.0 v2.3.0-rc.1 v2.4.0-rc.1 v2.5.0"
