# The release train's operator settings (scripts/release-from-trunk.sh,
# scripts/build-version.sh, design/design/release-from-trunk.design.md, "Version
# Numbering Rules Under Release-from-Trunk"). The train reads this file as
# origin/main has it, so a change takes effect at the next run after it
# merges; build-version.sh reads it as the commit being built has it. Only
# these keys are read, and nothing here is executed.

# The major version the train releases. Above every promoted major, the
# next release is that major's first, v{M}.<floor>.0, and goes on as
# v{M}.<floor+1>.0 and so on. Set to 2 for grain 2.0.0 (task 4873), the
# first single-tenant release, and to 3 for v3.0.0, the first release from
# ai-on-gke/grain. A RELEASE_MAJOR behind the newest released major never
# moves the version backwards: the train and build-version.sh both release
# that major instead.
RELEASE_MAJOR=3

# The lowest minor RELEASE_MAJOR's next release may have. The next release
# is otherwise v{M}.{P+1}.0, P being the highest v{M}.P.0 tag (for
# scripts/build-version.sh, the highest in the build's history). Version
# numbers never repeat or go backwards, so v2.3, v2.4 and v2.5 are all
# consumed: the legacy cut used v2.3.0-rc.1 and v2.4.0-rc.1 (v2.4.0 was
# promoted off candidate's history, not main's), main built v2.5.0-dev
# before release from trunk, and v2.5.0 is a placeholder tag on main --
# a version number, not a release -- that makes main build v2.6.0-dev.
# The first release from trunk is v2.6.0 (design/design/release-from-trunk.design.md,
# "Version Numbering Rules"). v3 has no consumed minors: v3.0.0 is
# promoted, so the next release is v3.1.0 and the floor is 0.
RELEASE_FLOOR_MINOR=0

# Tags the train never promotes, space-separated, whatever qualification says:
# a release (vX.Y.0, whose minor is stepped over entirely) or one release
# candidate (vX.Y.0-rc.N, which the qualification gate fails, so the next cut of
# the same minor is rc.N+1). v1.14.0-rc.1 holds only the single-tenant
# reset's first stage, so v1.14.0 is skipped and the next release was
# v2.0.0. v2.3.0-rc.1 and v2.4.0-rc.1 were cut by the legacy candidate
# cut, off candidate's own history (93a7ceb95 is the unverified 8-file
# back-merge, and its release.yml failed in tests/installer); the train
# never promotes either. v2.5.0 is the placeholder tag above: it still
# counts as the highest vX.Y.0, so the next release is v2.6.0, but the
# train writes v2.6.0's release notes from v2.4.0, the newest vX.Y.0 not
# named here, since nothing was ever released as v2.5.0.
RELEASE_NEVER_PROMOTE="v1.14.0 v2.3.0-rc.1 v2.4.0-rc.1 v2.5.0"

# The shortest time between releases, in minutes
# (design/playbook/releases.playbook.md, section 7): the train cuts a new
# version's rc.1 only this long after the newest release (promoted or
# pending) was tagged, so bursts of merges batch into one release, and
# releases a qualified rc only this long after the newest promoted release
# (a later run releases it). 0 cuts back to back; FORCE=true on the train
# skips it once for the cut, never for the release.
RELEASE_MIN_INTERVAL_MINUTES=120

# How many release candidates one version may use (playbook section 5):
# rc.1 and rc.2 are cut from main, rc.3 from the release/vX.Y.Z
# convergence branch, and once the last is dropped the train cuts no more
# of that version until a person resets or advances it.
RELEASE_MAX_RC_ATTEMPTS=3

# Whether the train releases a qualified rc itself (playbook section 1,
# "promotion gate"): true tags vX.Y.Z on the rc's commit and moves latest
# onto it with no person's approval. false stages every qualified rc as
# vX.Y.Z-pending for a person to approve (promote-release.yml), as before
# 2026-11-04. Whatever this says, the first release of a new RELEASE_MAJOR
# and a release carrying breaking changes are always staged for a person,
# and nothing RELEASE_NEVER_PROMOTE names is ever released.
RELEASE_AUTO_PROMOTE=true

# The GitHub App (slug or numeric id) grain's forge connection posts the
# grain/release-qualification (Stage 2) and grain/rc-hold check runs as,
# when neither the environment (vars.RELEASE_QUALIFICATION_APP) nor
# grain's own forge connection (grain ci checks' grain_app) names one.
# Only that App's check runs qualify an rc or hold the next one. "none" is
# for a deployment whose forge connection is a personal access token, which
# cannot post check runs: Stage 2 is skipped, so nightly.yml (Stage 1)
# alone qualifies an rc for release, and no grain/rc-hold ever holds the
# next cut. Unset, nothing is trusted and the train stops at Stage 2 rather
# than release on Stage 1 alone; it is never "none" by default.
#
# ai-on-gke/grain's own grain connects to GitHub with a personal access
# token (grain ci checks reports grain_app ""), and vars.RELEASE_QUALIFICATION_APP
# is unset, so without this the train stops at phase 2 of every tick. Set
# to none so a green nightly.yml qualifies an rc; replace it with the App's
# slug once grain's forge connection is a GitHub App with checks:write.
RELEASE_QUALIFICATION_APP=none
