# grain's templates, in the format a repository writes one in
# (.grain/templates/<name>.yml, docs/declarations.md), with the keys a
# repository is not allowed to write as well. Edit it in a pull request:
# a merged change is live on the next tick.

# `id` is the identity and is grain's to allocate -- it is what history
# and the other settings refer this template by, so changing one is a
# delete and a create rather than a rename. Everything else is yours.
templates:
  - id: golden-tpl
    name: nightly
    title: Nightly sweep
    body: Look for anything rotting.
    base: ""
    team: default
    auto-merge: false
    network: ""
    nothing-needed: ""
    model: ""
    custom-fields:
      customer: acme
    target: ""
    reads:
      - owner/payments-api
    writes:
      - owner/docs
    created-at: "2026-08-27T12:00:00Z"
