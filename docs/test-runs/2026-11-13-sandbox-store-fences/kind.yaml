# kind cluster for §12 item 1: no default CNI, so Calico (which enforces
# NetworkPolicy) can be installed:
#   kind create cluster --name fences --config kind.yaml
#   kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.29.3/manifests/calico.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
- role: control-plane
- role: worker
