# grain's templates, in the format a repository writes one in
# (.grain/templates/<name>.yml, docs/declarations.md), with the keys a
# repository is not allowed to write as well. Edit it in a pull request:
# a merged change is live on the next tick.

# `id` is the identity and is grain's to allocate -- it is what history
# and the other settings refer this template by, so changing one is a
# delete and a create rather than a rename. Everything else is yours.
templates:
  - id: template-1
    name: walk-plain
    title: Walk plain access
    body: Touch walk.txt in every write target.
    base: main
    auto-merge: false
    network: ""
    nothing-needed: ""
    model: ""
    goal: ""
    interactive: false
    keep-running: false
    admission: ""
    hosting: ""
    skills: ""
    sandbox: ""
    target: acme/widgets
    change-target: ""
    reviewers: ""
    priority: 0
    grants:
      - https://grain.dev/capabilities/repo#read={"repo":"acme/docs"}
      - https://grain.dev/capabilities/repo#write={"base":"main","repo":"acme/gadgets"}
    created-at: "2026-11-15T07:33:24.077246627Z"
