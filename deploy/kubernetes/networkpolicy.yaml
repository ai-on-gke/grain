# The policy that makes "no network access" mean something for a sandbox
# pod.
#
# It is a separate file from grain.yaml because it is separately
# *optional*, and because installing it is only half of turning the
# feature on. A NetworkPolicy object is accepted by every cluster and
# enforced by only some -- a cluster running kubenet, or a managed
# cluster with its network plugin left off, stores this happily and
# ignores it. So grain refuses a task that asked for no network access
# unless the deployment has passed -k8s-network-policy, which is an
# operator asserting something about their cluster that grain cannot
# check from inside a pod (orchestrator.K8sConfig.NetworkPolicyEnforced).
#
# The order to do this in:
#
#   1. kubectl apply -f networkpolicy.yaml
#   2. confirm your CNI enforces policies -- Calico, Cilium, Antrea,
#      Weave and GKE's dataplane all do; check rather than assume
#   3. verify it: run a pod carrying the label below and confirm it
#      cannot reach the internet
#   4. add -k8s-network-policy to the Deployment's args
#
# Doing (4) without (1)-(3) is worse than not doing it at all: a task
# that was promised an air-gapped sandbox gets a fully networked one and
# nothing anywhere says so.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grain-sandbox-network-none
  namespace: grain
  labels:
    app.kubernetes.io/name: grain
spec:
  # grain labels exactly those sandbox pods whose task asked for no
  # network access (orchestrator.NetworkLabel). Every other sandbox pod
  # is unselected by this policy and keeps the namespace's ordinary
  # networking.
  podSelector:
    matchLabels:
      grain.dev/network: none
  policyTypes:
    - Ingress
    - Egress
  # No ingress at all. Nothing dials a sandbox: grain reaches one through
  # the API server with `kubectl exec`, which is the kubelet's connection
  # to the container and not a network route into the pod, so denying
  # ingress costs this backend nothing.
  ingress: []
  egress:
    # The one exception, and the reason this is a policy rather than
    # "deny everything": a sandbox with no route at all is not an
    # isolated sandbox, it is a broken one. Its first act is to clone the
    # task's repository through grain's own git proxy, and its model
    # calls go through grain's model proxy -- both of which live in the
    # grain pod. Take that away and every task in such a sandbox fails
    # during preparation, which is the failure orchestrator's own
    # enforceGuestNetwork exists to prevent on the granule backend.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grain
      # This also covers the grain-sandbox Service (grain.yaml), which
      # is where a sandbox reaches the git proxy and the model proxies:
      # a policy sees the pod a Service forwards to, not the cluster IP,
      # and the daemon hands sandboxes that IP rather than a name, so no
      # rule for kube-dns is needed either.
      #
      # No ports: named, deliberately. What a sandbox reaches here moves
      # with -sandbox-port-base and with the package cache's interception
      # listeners (53, 80 and 443), so a port list is one more thing to
      # keep in step -- what is narrowed here is the peer, which is the
      # part that matters: one pod in one namespace, rather than the
      # internet.
