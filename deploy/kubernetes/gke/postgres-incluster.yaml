# Optional in-cluster PostgreSQL 16 StatefulSet for cost-sensitive GKE deployments
# selected via `scripts/deploy-gke.sh --postgres=in-cluster`.
#
# By default, Grain on GKE uses Cloud SQL for PostgreSQL 16 (private IP + IAM auth).
# When `--postgres=in-cluster` is chosen instead, `scripts/deploy-gke.sh` applies
# this manifest on the `daemon` node pool and configures `Deployment/grain`'s
# `DATABASE_URL` to connect to `grain-postgres.grain.svc.cluster.local:5432`.
apiVersion: v1
kind: Service
metadata:
  name: grain-postgres
  namespace: grain
  labels:
    app.kubernetes.io/name: grain-postgres
    app.kubernetes.io/part-of: grain
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grain-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grain-postgres
  namespace: grain
  labels:
    app.kubernetes.io/name: grain-postgres
    app.kubernetes.io/part-of: grain
spec:
  serviceName: grain-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grain-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grain-postgres
        app.kubernetes.io/part-of: grain
    spec:
      automountServiceAccountToken: false
      priorityClassName: grain-daemon
      nodeSelector:
        grain.dev/pool: daemon
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-bookworm@sha256:e8a07d2c7579b038938cdba6c539e580e5001caf9ea203d397b5cc83e76bd938
          args:
            - "-c"
            - "max_connections=200"
            - "-c"
            - "shared_buffers=512MB"
          env:
            - name: POSTGRES_DB
              value: grain
            - name: POSTGRES_USER
              value: grain
            - name: POSTGRES_PASSWORD_FILE
              value: /var/run/grain/postgres/password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "grain", "-d", "grain"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "grain", "-d", "grain"]
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: postgres-secret
              mountPath: /var/run/grain/postgres
              readOnly: true
      volumes:
        - name: postgres-secret
          secret:
            secretName: grain-postgres-credentials
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 50Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grain-postgres-isolation
  namespace: grain
  labels:
    app.kubernetes.io/name: grain-postgres
    app.kubernetes.io/part-of: grain
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grain-postgres
  policyTypes:
    - Ingress
    - Egress
  egress: []
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grain
              app.kubernetes.io/component: daemon
      ports:
        - protocol: TCP
          port: 5432
