# Companion GKE manifest for running grain as a standalone GitHub App bot.
#
# Service/grain in grain.yaml sits behind Google Cloud IAP and grain's own
# access-code gate: GitHub's webhook servers cannot complete an interactive
# OAuth redirect, so routing GitHub webhooks straight to Service/grain fails
# with 302/401 at the load balancer. Disabling IAP on Service/grain would
# expose the UI and API to the public internet.
#
# Instead, this manifest deploys `github-webhook` (/usr/local/bin/github-webhook,
# shipped inside the same ghcr.io/bwsalmon/grain/grain image) as a separate
# unprivileged pod with zero GitHub credentials and zero access to grain-data.
# On GKE Ingress, route `/webhooks/github` to `Service/grain-webhook` (whose
# BackendConfig explicitly keeps IAP disabled) and `/*` to `Service/grain`
# (behind IAP). Then pass `-github-webhook-url=http://grain-webhook.grain.svc.cluster.local`
# and `GITHUB_WEBHOOK_RELAY_SECRET` to `Deployment/grain`.
#
# Before applying, create the Kubernetes Secret carrying both shared keys:
#
#   kubectl -n grain create secret generic grain-github-webhook \
#     --from-literal=webhook-secret='<github-app-webhook-secret>' \
#     --from-literal=relay-secret="$(openssl rand -hex 32)"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grain-webhook
  namespace: grain
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grain-webhook-data
  namespace: grain
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grain-webhook
  namespace: grain
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grain-webhook
  template:
    metadata:
      labels:
        app: grain-webhook
    spec:
      serviceAccountName: grain-webhook
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: github-webhook
          image: ghcr.io/bwsalmon/grain/grain:CHANGEME
          command: ["/usr/local/bin/github-webhook"]
          args:
            - "serve"
            - "-addr=:8080"
            - "-store=/data/events.jsonl"
          env:
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: grain-github-webhook
                  key: webhook-secret
            - name: GITHUB_WEBHOOK_RELAY_SECRET
              valueFrom:
                secretKeyRef:
                  name: grain-github-webhook
                  key: relay-secret
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grain-webhook-data
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: grain-webhook-backendconfig
  namespace: grain
spec:
  iap:
    enabled: false
  timeoutSec: 35
  healthCheck:
    type: HTTP
    requestPath: /healthz
    port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: grain-webhook
  namespace: grain
  annotations:
    cloud.google.com/backend-config: '{"default": "grain-webhook-backendconfig"}'
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector:
    app: grain-webhook
  ports:
    - name: http
      port: 80
      targetPort: http
