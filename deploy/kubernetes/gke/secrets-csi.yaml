# Secret Manager CSI driver (secrets-store-gke) configuration for Grain on GKE.
#
# Mounts long-lived keys and bootstrap credentials directly into the daemon pod
# at /var/run/grain/secrets/ via Workload Identity (grain/grain -> grain-daemon@...).
# Syncs only the shared webhook/relay and hostd tokens to Kubernetes Secrets
# (`grain-github-webhook` and `grain-hostd-token`) so `Deployment/grain-webhook`
# and `Deployment/grain` can consume them via `secretKeyRef` while keeping
# `secrets.key` and GitHub App private keys off the API server. The sandbox-access
# CA (grain-sandbox-ca-key) is not mounted: the daemon reads it from Secret
# Manager itself (-sandbox-access-ca-secret) and creates its first version, and
# a CSI mount of a secret with no version would keep the pod from starting.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: grain-secrets
  namespace: grain
  labels:
    app.kubernetes.io/name: grain
    app.kubernetes.io/part-of: grain
spec:
  provider: gke
  secretObjects:
    - secretName: grain-github-webhook
      type: Opaque
      data:
        - objectName: "github-webhook-secret"
          key: "webhook-secret"
        - objectName: "github-webhook-relay-secret"
          key: "relay-secret"
    - secretName: grain-hostd-token
      type: Opaque
      data:
        - objectName: "hostd-token"
          key: "token"
  parameters:
    secrets: |
      - resourceName: "projects/PROJECT_ID/secrets/grain-secrets-key/versions/latest"
        fileName: "secrets.key"
      - resourceName: "projects/PROJECT_ID/secrets/grain-state-repo-token/versions/latest"
        fileName: "state-repo-token"
      - resourceName: "projects/PROJECT_ID/secrets/grain-secrets-repo-token/versions/latest"
        fileName: "secrets-repo-token"
      - resourceName: "projects/PROJECT_ID/secrets/grain-github-app-private-key/versions/latest"
        fileName: "github-app.pem"
      - resourceName: "projects/PROJECT_ID/secrets/grain-github-webhook-secret/versions/latest"
        fileName: "github-webhook-secret"
      - resourceName: "projects/PROJECT_ID/secrets/grain-github-webhook-relay-secret/versions/latest"
        fileName: "github-webhook-relay-secret"
      - resourceName: "projects/PROJECT_ID/secrets/grain-hostd-token/versions/latest"
        fileName: "hostd-token"
