# The NetworkPolicies around the sandbox-access channel
# (docs/design/grain-on-gke.md, Security 3) for -k8s-granule-sandboxes
# with -sandbox-access-addr: nothing dials a sandbox pod, a sandbox pod's
# wrapper reaches grain only on the acceptor's port, and the grain pod
# admits that port only from sandbox pods.
#
# What these policies cannot do, and what does it instead: with
# CHV_NET_MODE=inline a guest *is* its pod's IP and MAC, so to a policy
# the wrapper's packets and the guest's are the same pod's. Keeping the
# guest off the acceptor is done inside the pod: granule's netshim drops
# every guest-originated packet to the acceptor's addresses on the
# guest's tap (third_party/granule/pkg/netshim/splice.go,
# controllerDropRules), which grain names to it as
# GRANULE_ACCESS_CONTROLLER_IPS (the grain-access ClusterIP and the grain
# pod's IP). Even past that, a guest has no client key and the acceptor
# requires a client certificate before any application byte. These
# policies bound what the pod as a whole can reach.
#
# The wrapper's need (7443) and the guest's (the internet) are separate
# rules -- and here separate policies -- so a change to one cannot widen
# the other without its own review.
#
# Fill in the CHANGEME CIDRs for this cluster (`gcloud container clusters
# describe`: clusterIpv4Cidr, servicesIpv4Cidr, the node subnet and the
# control plane's endpoint; the Gateway's proxy-only subnet), confirm the
# cluster's dataplane enforces NetworkPolicy, then:
#
#   kubectl apply -f deploy/kubernetes/sandbox-access-networkpolicy.yaml
#
# networkpolicy.yaml's grain-sandbox-network-none policy needs no change
# for the acceptor: its one egress peer is the grain pod on every port,
# which already includes 7443. On this backend a network: none guest has
# no NIC at all (CHV_NET_MODE=none), so that rule is the wrapper's.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grain-sandbox-egress
  namespace: grain
  labels:
    app.kubernetes.io/name: grain
spec:
  # Every sandbox pod grain creates (pkg/k8s.ManagedByLabel and
  # SandboxLabel).
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: grain
      app.kubernetes.io/component: sandbox
  policyTypes:
    - Ingress
    - Egress
  # Nothing dials a sandbox. grain reaches one over the channel its
  # wrapper dialled, or `kubectl exec`, which is the kubelet's
  # connection and not a network route into the pod.
  ingress: []
  egress:
    # The wrapper's rule: the acceptor, and nothing else of grain's.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grain
      ports:
        - protocol: TCP
          port: 7443
    # DNS, to resolve grain-access.grain.svc (and, for open-network
    # guests, the internet's names).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grain-sandbox-egress-internet
  namespace: grain
  labels:
    app.kubernetes.io/name: grain
spec:
  # The guest's rule, for open-network sandboxes only: a pod labelled
  # grain.dev/network=none (orchestrator.NetworkLabel) is not selected,
  # so it gets grain-sandbox-egress's rules and nothing more. It is its
  # own policy because policies are additive per pod -- a rule here
  # cannot be kept off network: none pods any other way.
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: grain
      app.kubernetes.io/component: sandbox
    matchExpressions:
      - key: grain.dev/network
        operator: NotIn
        values: ["none"]
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              # The metadata server: no Workload Identity for a sandbox.
              - 169.254.169.254/32
              # CHANGEME: the cluster's pod CIDR, services CIDR, node
              # subnet and control-plane endpoint, so a guest reaches
              # the internet and not the cluster. (grain's own pod is in
              # the pod CIDR; the acceptor is reached by the wrapper rule
              # above, never by this one.)
              - 10.0.0.0/8
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grain-access-ingress
  namespace: grain
  labels:
    app.kubernetes.io/name: grain
spec:
  # The grain pod.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grain
  policyTypes:
    - Ingress
  ingress:
    # The acceptor, only from sandbox pods.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: grain
              app.kubernetes.io/component: sandbox
      ports:
        - protocol: TCP
          port: 7443
    # The UI and API: only from the Gateway's proxy-only subnet and the
    # webhook receiver.
    - from:
        - ipBlock:
            # CHANGEME: the Gateway's proxy-only subnet.
            cidr: 10.129.0.0/23
        - podSelector:
            matchLabels:
              app: grain-webhook
      ports:
        - protocol: TCP
          port: 8080
