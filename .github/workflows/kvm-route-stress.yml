# GitHub Actions port of .grain/workflows/kvm-route-stress.yml.
#
# Runs twenty consecutive two-VM boots of
# TestGranuleSandboxesAcquireCreatesTwoRealVMsConcurrently on demand.
# See docs/github-actions-ci.md for why this job is gated behind
# vars.ENABLE_SELF_HOSTED_TESTS and vars.SELF_HOSTED_RUNNER.

name: kvm route stress

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  # Disabled by default on stock GitHub-hosted ubuntu-latest runners:
  #
  # kvm-route-stress boots two concurrent Firecracker/Cloud-Hypervisor
  # microVMs (4 vCPUs, 4096 MiB RAM each) twenty times in a row. It requires a
  # pre-published guest VM image in GHCR matching ./scripts/granule/guest-inputs.sh
  # (or a host-level guest cache; building Granulefile inline on a cache miss
  # takes 50-110 minutes and >30 GB free disk, exceeding hosted runner disk
  # budgets) plus nested KVM with at least 16 GiB dedicated RAM and 60 GB disk.
  # Enable by setting repository variable ENABLE_SELF_HOSTED_TESTS=true (and
  # optionally SELF_HOSTED_RUNNER to the self-hosted runner label).
  kvm-route-stress:
    name: twenty two-VM boots
    if: vars.ENABLE_SELF_HOSTED_TESTS == 'true'
    runs-on: ${{ vars.SELF_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 110
    concurrency:
      group: ${{ github.workflow }}-kvm-route-stress-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Require KVM
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            iproute2 iptables dnsmasq-base e2fsprogs socat openssh-client
          if [ ! -e /dev/kvm ]; then
            echo "/dev/kvm is not in this runner, so the suite below would skip rather than run. A green tick here would mean nothing." >&2
            exit 1
          fi
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm
          docker version
          command -v ssh-keygen
          df -h /

      - name: Resolve the sandbox guest
        timeout-minutes: 120
        env:
          IMAGE: grain-guest:e2e-test
        run: |
          set -euo pipefail
          ./scripts/granule-guest-resolve.sh

      - name: Twenty consecutive two-VM boots
        env:
          GRAIN_REAL_VM_TESTS: "1"
        run: |
          set -uo pipefail
          runs=20
          mkdir -p /tmp/consoles
          (
            while true; do
              for c in $(docker ps -aq --filter 'name=granule-vm-' 2>/dev/null); do
                if [ ! -e "/tmp/consoles/$c.started" ]; then
                  touch "/tmp/consoles/$c.started"
                  name="$(docker inspect -f '{{.Name}}' "$c" 2>/dev/null | tr -d /)"
                  (docker logs -f "$c" > "/tmp/consoles/${name:-$c}.log" 2>&1 &)
                fi
              done
              sleep 2
            done
          ) &
          sampler=$!
          failed=""
          go test ./pkg/orchestrator/ \
            -run 'TestGranuleSandboxesAcquireCreatesTwoRealVMsConcurrently' \
            -count="$runs" -v -timeout 100m 2>&1 | tee /tmp/granule-stress.log || failed="the stress run"
          kill "$sampler" 2>/dev/null || true

          passes="$(grep -c -- '--- PASS: TestGranuleSandboxesAcquireCreatesTwoRealVMsConcurrently' /tmp/granule-stress.log || true)"
          echo "TestGranuleSandboxesAcquireCreatesTwoRealVMsConcurrently: ${passes}/${runs} boots passed"
          if [ "$passes" != "$runs" ]; then
            echo "expected ${runs} passing boots and got ${passes}; this job only means something when every one of them runs and passes" >&2
            failed="${failed:-a boot that did not run}"
          fi

          if [ -n "$failed" ]; then
            echo "===== the failing iterations ====="
            grep -n -- '--- FAIL\|no default route\|FAIL\b' /tmp/granule-stress.log | head -60
            echo "===== nproc / free -m / df -h / ====="
            nproc; free -m; df -h /
            echo "===== docker ps -a ====="
            docker ps -a
            echo "===== dmesg tail ====="
            (sudo dmesg 2>/dev/null || dmesg 2>/dev/null || echo "no dmesg here") | tail -80
            for f in /tmp/consoles/*.log; do
              [ -e "$f" ] || continue
              echo "===== guest console $f ====="
              tail -200 "$f"
            done
            exit 1
          fi
