# GitHub Actions port of .grain/workflows/release-train.yml: the continuous
# release train (design/playbook/releases.playbook.md). Each run drives
# `scripts/release-from-trunk.sh` one step around the loop and stops:
#   1. Judges the release candidate in qualification, if there is one,
#      through `candidate-gate.sh check-qualification`: Stage 1 is
#      nightly.yml on `vX.Y.Z-rc.N`, Stage 2 the grain/release-qualification
#      check run grain posts on its commit. PASS stages `vX.Y.Z-pending`
#      (images published as `:vX.Y.Z-pending`) for the one person action of
#      a release, the Approve that runs promote-release.yml (playbook §0);
#      FAIL tags `vX.Y.Z-rc.N-discarded`; PENDING and INFRA say which jobs
#      to re-run. An rc RELEASE_NEVER_PROMOTE names is dropped unqualified.
#   2. With nothing qualifying, selects the newest known-good `main` commit
#      (`select-lkg`: tests.yml and release.yml green), past
#      RELEASE_MIN_INTERVAL_MINUTES since the last release, tags
#      `vX.Y.Z-rc.N`, force-moves `refs/heads/candidate`, and publishes
#      `:vX.Y.Z-rc.N`, `:candidate`, and `:rc` images. After
#      RELEASE_MAX_RC_ATTEMPTS dropped rcs of a version it cuts no more.
# Then `scripts/release-train-actions.sh` does what the run asked of
# GitHub Actions (`actions: write`): starts Stage 1 on a new rc when its tag
# push could not, dispatches the one flake retry and the infra re-runs of
# nightly.yml jobs on the rc, and cancels a dropped rc's runs (§6).
#
# The train never pushes vX.Y.Z and never moves `latest`, as a git tag or
# an image: only a person's approval through promote-release.yml does
# (TestTheReleaseTrainNeverPromotesARelease, tests/deploy).
#
# It is event-driven: a finished release.yml run (a new LKG candidate), a
# finished nightly.yml run (Stage 1 on an rc) and a finished
# grain/release-qualification check run (Stage 2) each wake it, and an
# hourly cron is a safety wake for an event that never came. Every wake is
# idempotent, and the concurrency group runs one at a time.
#
# Tags are pushed with a GitHub App installation token (vars.RELEASE_APP_ID
# and secrets.RELEASE_APP_PRIVATE_KEY) or secrets.REPO_WRITE_TOKEN, either
# of which fires nightly.yml's `push: tags` (§14). With neither, tags go
# out with GITHUB_TOKEN, which fires nothing, so the train dispatches
# Stage 1 itself.
#
# Nothing here needs the grain deployment: verdicts come from this
# repository's own workflow runs and check runs (RELEASE_CI_SOURCE=github,
# GITHUB_TOKEN), and grain watches for the rc and -pending tags outbound.
# vars.GRAIN_API_URL with secrets.GRAIN_API_TOKEN are optional, for a
# deployment a hosted runner can reach (the release.pending notification).
#
# On non-main refs, `dry_run` defaults to and is enforced as `true`.

name: release-train

on:
  schedule:
    - cron: "17 * * * *"
  # A workflow_run or check_run run is a run of the default branch: it
  # checks out main, never the triggering run's head, and reads nothing
  # from its artifacts.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [release, nightly]
    types: [completed]
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run release-from-trunk in dry-run mode without pushing git refs or images, or calling the Actions API (always true on non-main refs)"
        required: false
        default: false
        type: boolean
      force:
        description: "Cut an rc.1 inside RELEASE_MIN_INTERVAL_MINUTES of the last release (FORCE=true)"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  checks: read
  contents: write
  packages: write
  id-token: write

env:
  GOFLAGS: -mod=readonly
  RELEASE_IMAGE_REPO: ${{ vars.RELEASE_IMAGE_REPO || 'bwsalmon/grain' }}

jobs:
  train:
    name: cut, qualify and stage a release from trunk
    # Wake on what moves the loop and nothing else: release.yml on main or
    # a convergence branch, nightly.yml on an rc tag, and the Stage 2
    # check run.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && (
        (github.event.workflow_run.name == 'release' &&
          (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'release/'))) ||
        (github.event.workflow_run.name == 'nightly' && contains(github.event.workflow_run.head_branch, '-rc.')))) ||
      (github.event_name == 'check_run' && github.event.check_run.name == 'grain/release-qualification')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: ${{ github.workflow }}-train
      cancel-in-progress: false
    steps:
      - name: Mint the release App's token
        id: app
        if: vars.RELEASE_APP_ID != ''
        env:
          APP_ID: ${{ vars.RELEASE_APP_ID }}
          APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${APP_KEY:-}" ]; then
            echo "release-train: vars.RELEASE_APP_ID is set but secrets.RELEASE_APP_PRIVATE_KEY is not; tags fall back to REPO_WRITE_TOKEN or GITHUB_TOKEN" >&2
            exit 0
          fi
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          key="${RUNNER_TEMP}/release-app.pem"
          printf '%s\n' "$APP_KEY" > "$key"
          chmod 600 "$key"
          now="$(date +%s)"
          unsigned="$(printf '{"alg":"RS256","typ":"JWT"}' | b64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((now - 60))" "$((now + 540))" "$APP_ID" | b64)"
          jwt="${unsigned}.$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key" -binary | b64)"
          rm -f "$key"
          installation="$(curl -fsS -H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json" \
            "$API/repos/$REPO/installation" | jq -r .id)"
          token="$(curl -fsS -X POST -H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json" \
            -d "$(jq -cn --arg r "${REPO#*/}" '{repositories: [$r], permissions: {contents: "write"}}')" \
            "$API/app/installations/$installation/access_tokens" | jq -r .token)"
          if [ -z "$token" ] || [ "$token" = null ]; then
            echo "release-train: could not mint the release App's installation token" >&2
            exit 1
          fi
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app.outputs.token || secrets.REPO_WRITE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache npm and node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.npm
            ui/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Resolve release context and dry-run mode
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          GH_REF_NAME: ${{ github.head_ref || github.ref_name }}
          # Whether the tags this run pushes start workflows of their own:
          # only an App token's or REPO_WRITE_TOKEN's do.
          TAGS_FIRE: ${{ (steps.app.outputs.token != '' || secrets.REPO_WRITE_TOKEN != '') && 'true' || 'false' }}
        run: |
          set -euo pipefail
          git config --global user.name "grain-ci"
          git config --global user.email "grain-ci@example.com"

          case "${GITHUB_REF:-}" in
            refs/heads/main)
              is_main_ref=true
              ;;
            *)
              is_main_ref=false
              ;;
          esac

          dry_run="${INPUT_DRY_RUN:-}"
          if [ "$is_main_ref" != "true" ]; then
            dry_run="true"
          elif [ -z "$dry_run" ]; then
            dry_run="false"
          fi
          {
            echo "GRAIN_CI_REPO=${GITHUB_REPOSITORY}"
            echo "GRAIN_CI_COMMIT=${GITHUB_SHA}"
            echo "GRAIN_CI_REF=${GH_REF_NAME}"
            echo "GRAIN_CI_EVENT=${GITHUB_EVENT_NAME}"
            echo "DRY_RUN=${dry_run}"
            echo "RELEASE_TAGS_FIRE=${TAGS_FIRE}"
            echo "RELEASE_TRAIN_OUTPUT=${RUNNER_TEMP}/release-train.out"
          } >> "$GITHUB_ENV"
          : > "${RUNNER_TEMP}/release-train.out"
          if [ "$dry_run" != true ] && [ "$TAGS_FIRE" != true ]; then
            echo "::warning::release-train: no release App token or REPO_WRITE_TOKEN; tags are pushed with GITHUB_TOKEN, which tag rulesets may refuse and which starts no workflow, so this run dispatches Stage 1 itself"
          fi
          echo "Resolved GRAIN_CI_EVENT=${GITHUB_EVENT_NAME} GRAIN_CI_REF=${GH_REF_NAME} DRY_RUN=${dry_run} RELEASE_TAGS_FIRE=${TAGS_FIRE}"

      - name: Authenticate to Google Cloud (WIF)
        if: vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_EMAIL != ''
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Configure Artifact Registry Docker authentication
        if: vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_EMAIL != ''
        run: gcloud auth configure-docker us-docker.pkg.dev --quiet

      - name: Configure package-publish credentials
        if: env.DRY_RUN != 'true'
        env:
          GHCR_PAT: ${{ secrets.GHCR_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_REGISTRY: ${{ vars.PACKAGE_PUBLISH_REGISTRY || 'ghcr.io' }}
          PUBLISH_USERNAME: ${{ vars.GHCR_USERNAME || 'bwsalmon' }}
        run: |
          set -euo pipefail
          token="${GHCR_PAT:-}"
          username="${PUBLISH_USERNAME}"
          if [ -z "$token" ]; then
            case "${RELEASE_IMAGE_REPO}" in
              bwsalmon/*)
                token=""
                ;;
              *)
                token="${FALLBACK_TOKEN}"
                username="${GITHUB_ACTOR}"
                ;;
            esac
          fi
          if [ -n "$token" ]; then
            echo "::add-mask::${token}"
            {
              echo "PACKAGE_PUBLISH_REGISTRY=${PUBLISH_REGISTRY}"
              echo "PACKAGE_PUBLISH_USERNAME=${username}"
              echo "PACKAGE_PUBLISH_TOKEN=${token}"
            } >> "$GITHUB_ENV"
            sudo mkdir -p /home/debian
            printf '%s\n' "${PUBLISH_REGISTRY}" | sudo tee /home/debian/.package-publish-registry >/dev/null
            printf '%s\n' "${username}" | sudo tee /home/debian/.package-publish-username >/dev/null
            printf '%s\n' "${token}" | sudo tee /home/debian/.package-publish-token >/dev/null
            sudo chmod 600 /home/debian/.package-publish-token
          fi

      - name: Configure optional image-signing key
        if: env.DRY_RUN != 'true'
        env:
          SIGNING_KEY_PEM: ${{ secrets.IMAGE_SIGNING_KEY }}
          SIGNING_KEY_PASS: ${{ secrets.IMAGE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY_PEM:-}" ]; then
            echo "WARNING: IMAGE_SIGNING_KEY secret is not set; release-train images will be published unsigned." >&2
            exit 0
          fi
          if ! command -v cosign >/dev/null 2>&1; then
            cosign_version="v2.4.1"
            curl -fsSL "https://github.com/sigstore/cosign/releases/download/${cosign_version}/cosign-linux-amd64" \
              -o /usr/local/bin/cosign
            chmod +x /usr/local/bin/cosign
          fi
          key_file="${RUNNER_TEMP}/image-signing.key"
          printf '%s\n' "${SIGNING_KEY_PEM}" > "$key_file"
          chmod 600 "$key_file"
          pass_file="${RUNNER_TEMP}/image-signing.pass"
          printf '%s' "${SIGNING_KEY_PASS:-}" > "$pass_file"
          chmod 600 "$pass_file"
          {
            echo "IMAGE_SIGNING_KEY=${key_file}"
            echo "IMAGE_SIGNING_PASSWORD_FILE=${pass_file}"
          } >> "$GITHUB_ENV"

      - name: Require the publishing credential
        env:
          RELEASE_IMAGES: ${{ vars.RELEASE_IMAGES }}
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry-run mode enabled: skipping package-publish credential requirement"
            exit 0
          fi
          if [ -z "${PACKAGE_PUBLISH_TOKEN:-}" ] && [ ! -s /home/debian/.package-publish-token ] && [ "${RELEASE_IMAGES:-}" != off ]; then
            echo "release-train: no package-publish credential reached this ${GRAIN_CI_EVENT:-} run, so the rc and pending images could not be published; nothing was tagged." >&2
            echo "release-train: configure the GHCR_TOKEN secret (see docs/github-actions-ci.md)." >&2
            exit 1
          fi

      - name: Run the release train
        env:
          # Optional: a deployment a hosted runner can reach takes the
          # release.pending notification here; without one, grain sees the
          # -pending tag outbound.
          GRAIN_API_URL: ${{ vars.GRAIN_API_URL }}
          GRAIN_API_TOKEN: ${{ secrets.GRAIN_API_TOKEN }}
          RELEASE_CI_SOURCE: ${{ vars.RELEASE_CI_SOURCE || 'github' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_IMAGES: ${{ vars.RELEASE_IMAGES }}
          RELEASE_NOTES_TASK: ${{ vars.RELEASE_NOTES_TASK }}
          RELEASE_NOTIFY: ${{ vars.RELEASE_NOTIFY }}
          # The GitHub App (slug or id) grain posts grain/release-qualification
          # as; a same-named check run from anything else never qualifies an rc.
          RELEASE_QUALIFICATION_APP: ${{ vars.RELEASE_QUALIFICATION_APP }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          if [ "${RELEASE_CI_SOURCE}" != github ] && [ -z "${GRAIN_API_TOKEN:-}" ] && [ "${DRY_RUN}" = "true" ]; then
            echo '[]' > "${RUNNER_TEMP}/dry-run-empty.json"
            export RELEASE_RUNS_JSON="${RUNNER_TEMP}/dry-run-empty.json"
          fi
          bash ./scripts/release-from-trunk.sh

      - name: Start Stage 1, re-run qualification jobs and cancel superseded runs
        # Also after a train that stopped with an error: an rc it dropped,
        # or a version it escalated, still has to be acted on.
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_GITHUB_REPO: ${{ github.repository }}
        run: bash ./scripts/release-train-actions.sh "$RELEASE_TRAIN_OUTPUT"
