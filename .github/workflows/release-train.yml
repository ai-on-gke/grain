# GitHub Actions port of .grain/workflows/release-train.yml -- retired as a
# train (design/playbook/releases.playbook.md §0.4, task 2382).
#
# The release train is a grain task now, filed from
# .grain/templates/release-train.yml on grain's own schedule, and it pushes
# the rc, -pending and -discarded tags and candidate with that template's
# narrow `push:` grant. This workflow used to cut on a daily cron, but a
# GitHub-hosted runner cannot reach the grain deployment or grain-candidate
# (vars.GRAIN_API_URL, secrets.GRAIN_API_TOKEN, vars.RELEASE_STAGING_URL), so
# every scheduled run failed preflight. It has no `schedule:` any more, and
# every run is a dry run, so the two trains can never both cut: a dispatch
# selects the LKG from GitHub's own runs and says what it would tag, and
# pushes, publishes and files nothing. Making it cut again is a change to
# this file, which waits for a review.
#
# scripts/release-from-trunk.sh reads main's tests.yml, release.yml and
# nightly.yml verdicts from this repository's own workflow runs
# (RELEASE_CI_SOURCE=github, through GITHUB_TOKEN with `actions: read`).

name: release-train

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Ignored: this workflow is retired as a train and always runs dry (the release train is .grain/templates/release-train.yml)"
        required: false
        default: true
        type: boolean
      force:
        description: "Cut an rc.1 inside RELEASE_MIN_INTERVAL_MINUTES of the last release (FORCE=true; a dry run only says what it would cut)"
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  # grain/release-qualification and grain/rc-hold check runs.
  checks: read
  contents: write
  packages: write
  id-token: write

env:
  GOFLAGS: -mod=readonly
  RELEASE_IMAGE_REPO: ${{ vars.RELEASE_IMAGE_REPO }}

jobs:
  train:
    name: dry-run the release train
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: ${{ github.workflow }}-train
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.REPO_WRITE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache npm and node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.npm
            ui/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Resolve release context and dry-run mode
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          GH_REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config --global user.name "grain-ci"
          git config --global user.email "grain-ci@example.com"

          case "${GITHUB_REF:-}" in
            refs/heads/main)
              is_main_ref=true
              ;;
            *)
              is_main_ref=false
              ;;
          esac

          # Retired as a train: the grain task filed from
          # .grain/templates/release-train.yml cuts, so this never does.
          dry_run="true"
          if [ "${INPUT_DRY_RUN:-}" = "false" ]; then
            echo "release-train: this workflow is retired as a train and always runs dry; the release train is .grain/templates/release-train.yml" >&2
          fi
          echo "Running on main: ${is_main_ref}"
          {
            echo "GRAIN_CI_REPO=${GITHUB_REPOSITORY}"
            echo "GRAIN_CI_COMMIT=${GITHUB_SHA}"
            echo "GRAIN_CI_REF=${GH_REF_NAME}"
            echo "GRAIN_CI_EVENT=${GITHUB_EVENT_NAME}"
            echo "DRY_RUN=${dry_run}"
          } >> "$GITHUB_ENV"
          echo "Resolved GRAIN_CI_REF=${GH_REF_NAME} DRY_RUN=${dry_run}"

      - name: Authenticate to Google Cloud (WIF)
        if: vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_EMAIL != ''
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Configure Artifact Registry Docker authentication
        if: vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_EMAIL != ''
        run: gcloud auth configure-docker us-docker.pkg.dev --quiet

      - name: Configure package-publish credentials
        if: env.DRY_RUN != 'true'
        env:
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_TOKEN }}
          PUBLISH_REGISTRY: ${{ vars.PACKAGE_PUBLISH_REGISTRY }}
        run: |
          set -euo pipefail
          bash ./scripts/configure-dockerhub-auth.sh
          sudo mkdir -p /home/debian
          # shellcheck source=scripts/release-image-repos.sh
          . ./scripts/release-image-repos.sh
          printf '%s\n' "${PUBLISH_REGISTRY:-$RELEASE_IMAGE_REGISTRY_DEFAULT}" | sudo tee /home/debian/.package-publish-registry >/dev/null
          printf '%s\n' "${DOCKERHUB_USERNAME:-$DOCKERHUB_USERNAME_DEFAULT}" | sudo tee /home/debian/.package-publish-username >/dev/null
          printf '%s\n' "${DOCKER_PAT:-${GHCR_PAT:-}}" | sudo tee /home/debian/.package-publish-token >/dev/null
          sudo chmod 600 /home/debian/.package-publish-token

      - name: Configure optional image-signing key
        if: env.DRY_RUN != 'true'
        env:
          SIGNING_KEY_PEM: ${{ secrets.IMAGE_SIGNING_KEY }}
          SIGNING_KEY_PASS: ${{ secrets.IMAGE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY_PEM:-}" ]; then
            echo "WARNING: IMAGE_SIGNING_KEY secret is not set; release-train images will be published unsigned." >&2
            exit 0
          fi
          if ! command -v cosign >/dev/null 2>&1; then
            cosign_version="v2.6.5"
            if ! curl -4 -fsSL --max-time 60 --retry 2 --retry-max-time 45 --retry-connrefused --retry-all-errors \
              "https://github.com/sigstore/cosign/releases/download/${cosign_version}/cosign-linux-amd64" \
              -o /usr/local/bin/cosign; then
              rm -f /usr/local/bin/cosign
              cosign_image="ghcr.io/sigstore/cosign/cosign:v2.6.5@sha256:ad281047f85c5e1fc6ffbc30c2b55be3b07b4032bef715a12122ce5829619aca"
              docker pull "$cosign_image"
              cid="$(docker create "$cosign_image")"
              docker cp "$cid:/ko-app/cosign" /usr/local/bin/cosign
              docker rm "$cid" >/dev/null
              echo "8d5b7d0097b61a89161ef7ac4f169879bf6de798af1be431b595bb552b235d48  /usr/local/bin/cosign" | sha256sum -c -
            else
              echo "c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644  /usr/local/bin/cosign" | sha256sum -c -
            fi
            chmod +x /usr/local/bin/cosign
          fi
          key_file="${RUNNER_TEMP}/image-signing.key"
          printf '%s\n' "${SIGNING_KEY_PEM}" > "$key_file"
          chmod 600 "$key_file"
          pass_file="${RUNNER_TEMP}/image-signing.pass"
          printf '%s' "${SIGNING_KEY_PASS:-}" > "$pass_file"
          chmod 600 "$pass_file"
          {
            echo "IMAGE_SIGNING_KEY=${key_file}"
            echo "IMAGE_SIGNING_PASSWORD_FILE=${pass_file}"
          } >> "$GITHUB_ENV"

      - name: Require the publishing credential
        env:
          RELEASE_IMAGES: ${{ vars.RELEASE_IMAGES }}
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry-run mode enabled: skipping package-publish credential requirement"
            exit 0
          fi
          if [ -z "${PACKAGE_PUBLISH_TOKEN:-}" ] && [ ! -s /home/debian/.package-publish-token ] && [ "${RELEASE_IMAGES:-}" != off ]; then
            echo "release-train: no package-publish credential reached this ${GRAIN_CI_EVENT:-} run, so the rc and pending images could not be published; nothing was tagged." >&2
            echo "release-train: configure the DOCKER_PAT secret (see docs/github-actions-ci.md)." >&2
            exit 1
          fi

      - name: Run the release train
        env:
          GRAIN_API_URL: ${{ vars.GRAIN_API_URL }}
          GRAIN_API_TOKEN: ${{ secrets.GRAIN_API_TOKEN }}
          RELEASE_CI_SOURCE: ${{ vars.RELEASE_CI_SOURCE || 'github' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_IMAGES: ${{ vars.RELEASE_IMAGES }}
          RELEASE_NOTES_TASK: ${{ vars.RELEASE_NOTES_TASK }}
          RELEASE_NOTIFY: ${{ vars.RELEASE_NOTIFY }}
          # The GitHub App (slug or id) grain posts grain/release-qualification
          # and grain/rc-hold as; a same-named check run from anything else
          # never qualifies an rc or lifts a hold.
          RELEASE_QUALIFICATION_APP: ${{ vars.RELEASE_QUALIFICATION_APP }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ] && [ -z "${GRAIN_API_TOKEN:-}" ]; then
            echo '[]' > "${RUNNER_TEMP}/dry-run-empty.json"
            if [ "${RELEASE_CI_SOURCE}" != github ]; then
              export RELEASE_RUNS_JSON="${RUNNER_TEMP}/dry-run-empty.json"
            fi
          fi
          bash ./scripts/release-from-trunk.sh
