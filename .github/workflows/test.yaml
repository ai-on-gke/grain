name: Go Test

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Install dependencies
      run: go mod download

    # License headers and the Google-name boundary (tests/hygiene).
    - name: Check Licenses
      run: go test -v ./tests/hygiene/...

    # Grain's own suite runs on grain CI (.grain/workflows/tests.yml);
    # this only checks that the module builds and vets.
    - name: Go Build
      run: go build ./... && go vet ./...
