          retention-days: 7

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-lint-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install shellcheck and actionlint
        run: |
          # Pin ShellCheck to v0.9.0 (matching Debian Bookworm in Granulefile) so
          # newer ShellCheck releases on ubuntu-latest (0.11.0+) do not fail on
          # unmodified scripts.
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.9.0/shellcheck-v0.9.0.linux.x86_64.tar.xz \
            | sudo tar -xJ --strip-components=1 -C /usr/local/bin shellcheck-v0.9.0/shellcheck
          if ! command -v actionlint >/dev/null 2>&1; then
            curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.4/actionlint_1.7.4_linux_amd64.tar.gz \
              | sudo tar -xz -C /usr/local/bin actionlint
          fi
          /usr/local/bin/shellcheck --version
          actionlint -version

      - name: Lint GitHub Actions workflows
        run: actionlint

      - name: Lint scripts
        run: |
          set -euo pipefail
          /usr/local/bin/shellcheck --version
          mapfile -t scripts < <(git ls-files -- 'scripts/*.sh' 'deploy/terraform/*.sh')
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "no shell scripts matched; this job is checking nothing" >&2
            exit 1
          fi
          printf 'checking %s\n' "${scripts[@]}"
          /usr/local/bin/shellcheck --color=always "${scripts[@]}"

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-terraform-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Format
        working-directory: deploy/terraform/gcp
        run: |
          terraform version
          terraform fmt -check -recursive -diff ../..

      - name: Init
        working-directory: deploy/terraform/gcp
        run: |
          for i in 1 2 3 4 5; do
            if terraform init -backend=false -input=false; then
              break
            fi
            if [ "$i" -eq 5 ]; then
              exit 1
            fi
            sleep 2
          done
          cd ../../gke/terraform
          for i in 1 2 3 4 5; do
            if terraform init -backend=false -input=false; then
              exit 0
            fi
            if [ "$i" -eq 5 ]; then
              exit 1
            fi
            sleep 2
          done

      - name: Validate
        working-directory: deploy/terraform/gcp
        run: |
          terraform validate
          terraform -chdir=../../gke/terraform validate

  installer-e2e:
    name: installer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-installer-e2e-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache npm and node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.npm
            ui/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Fill the npm cache from the registry
        run: |
          sudo git config --system user.name "grain-ci"
          sudo git config --system user.email "grain-ci@example.com"
          git config --global user.name "grain-ci"
          git config --global user.email "grain-ci@example.com"
          ./scripts/warm-npm-cache.sh ui

      - name: Assemble the image to install
        env:
          GRAIN_INSTALLER_BASE_IMAGE: ghcr.io/bwsalmon/grain/grain:main
          GRAIN_INSTALLER_SANDBOX_IMAGE: ghcr.io/bwsalmon/grain/k8s-sandbox:main
        run: |
          set +e
          ./scripts/installer-test-image.sh grain-installer:test 2>&1 | tee /tmp/installer-image.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 10 /tmp/installer-image.log | while IFS= read -r line; do
              echo "::error title=installer-image::$line"
            done
            exit "$status"
          fi

      - name: Run the installer e2e suite
        env:
          GRAIN_TEST_IMAGE: grain-installer:test
          GRAIN_INSTALLER_E2E: "1"
        run: |
          set +e
          GRAIN_GOTEST_LOG=/tmp/installer.log ./scripts/run-go-tests.sh \
            go test ./tests/installer -count=1 -v -timeout 15m
          status=$?
          if grep -q -- "--- SKIP" /tmp/installer.log; then
            grep -- "--- SKIP" /tmp/installer.log >&2
            echo "::error title=installer-e2e::tests/installer skipped a test"
            status=1
          fi
          if ! grep -q -- "--- PASS" /tmp/installer.log; then
            echo "::error title=installer-e2e::tests/installer passed no test at all"
            status=1
          fi
          if [ "$status" -ne 0 ]; then
            grep -aE -- '--- FAIL:|--- SKIP:|^FAIL[[:space:]]|_test\.go:[0-9]+:' /tmp/installer.log | tail -n 8 | while IFS= read -r line; do
              echo "::error title=installer-e2e::$line"
            done
            exit "$status"
          fi

  package-cache:
    name: package cache
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-package-cache-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Seed Granulefile /etc/docker/daemon.json
        run: |
          sudo mkdir -p /usr/local/lib/grain-real-bin
          if [ ! -e /usr/local/lib/grain-real-bin/install ]; then
            real_install="$(readlink -f "$(command -v install)")"
            sudo cp -f "$real_install" /usr/local/lib/grain-real-bin/install
            sudo chmod 0755 /usr/local/lib/grain-real-bin/install
          fi
          tmpsrc="$(mktemp -d)"
          cat >"$tmpsrc/main.go" <<'EOF'
          package main

          import (
          	"fmt"
          	"io"
          	"os"
          	"os/exec"
          	"path/filepath"
          	"strconv"
          	"syscall"
          )

          func main() {
          	args := os.Args[1:]
          	if len(args) == 4 && args[0] == "-m" {
          		mode, err := strconv.ParseUint(args[1], 8, 32)
          		if err == nil {
          			src, dst := args[2], args[3]
          			var data []byte
          			if src == "/dev/stdin" || src == "-" {
          				data, err = io.ReadAll(os.Stdin)
          			} else {
          				data, err = os.ReadFile(src)
          			}
          			if err != nil {
          				fmt.Fprintf(os.Stderr, "install: reading %s: %v\n", src, err)
          				os.Exit(1)
          			}
          			if err := os.MkdirAll(filepath.Dir(dst), 0o755); err != nil {
          				fmt.Fprintf(os.Stderr, "install: mkdir %s: %v\n", filepath.Dir(dst), err)
          				os.Exit(1)
          			}
          			tmp := fmt.Sprintf("%s.tmp.%d", dst, os.Getpid())
          			if err := os.WriteFile(tmp, data, os.FileMode(mode)); err != nil {
          				fmt.Fprintf(os.Stderr, "install: writing %s: %v\n", tmp, err)
          				os.Exit(1)
          			}
          			_ = os.Chmod(tmp, os.FileMode(mode))
          			if err := os.Rename(tmp, dst); err != nil {
          				_ = os.Remove(tmp)
          				fmt.Fprintf(os.Stderr, "install: renaming %s: %v\n", dst, err)
          				os.Exit(1)
          			}
          			os.Exit(0)
          		}
          	}
          	const realInstall = "/usr/local/lib/grain-real-bin/install"
          	if err := syscall.Exec(realInstall, append([]string{"install"}, args...), os.Environ()); err != nil {
          		cmd := exec.Command(realInstall, args...)
          		cmd.Stdin = os.Stdin
          		cmd.Stdout = os.Stdout
          		cmd.Stderr = os.Stderr
          		if err := cmd.Run(); err != nil {
          			os.Exit(1)
          		}
          	}
          }
          EOF
          CGO_ENABLED=0 go build -o "$tmpsrc/install" "$tmpsrc/main.go"
          sudo rm -f /usr/local/bin/install /usr/bin/install
          sudo cp -f "$tmpsrc/install" /usr/local/bin/install
          sudo cp -f "$tmpsrc/install" /usr/bin/install
          sudo chmod 0755 /usr/local/bin/install /usr/bin/install
          rm -rf "$tmpsrc"
          sudo mkdir -p /etc/docker
          sudo tee /etc/docker/daemon.json >/dev/null <<'EOF'
          {
            "bip": "10.240.0.1/24",
            "default-address-pools": [
              {"base": "10.241.0.0/16", "size": 24}
            ],
            "features": {
              "containerd-snapshotter": true
            },
            "mtu": 1460
          }
          EOF
          sudo systemctl restart docker
          docker info >/dev/null

      - name: Pull an image through the cache this sandbox is pointed at
        env:
          GRAIN_REAL_DOCKER_CACHE_TESTS: "1"
        run: |
          set +e
          GRAIN_GOTEST_LOG=/tmp/pkgcache.log ./scripts/run-go-tests.sh \
            go test ./pkg/orchestrator/ -run 'PackageCache|ReloadDockerScript|AsRootScript' \
            -count=1 -v -timeout 20m | tee /tmp/pkgcache.out
          status=${PIPESTATUS[0]}
          for want in TestPackageCachePullsThroughARealDockerd TestPackageCacheReachesAChildContainerBuild TestPackageCacheLeavesASandboxWithNoRunningDockerdAlone; do
            if ! grep -q -- "--- PASS: $want" /tmp/pkgcache.log; then
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            python3 - /tmp/pkgcache.out package-cache <<'PY'
          import sys
          text = open(sys.argv[1], errors="replace").read()
          title = sys.argv[2]
          if "=== failing tests ===" in text:
              sec = text.split("=== failing tests ===", 1)[1].split("=== per-package results ===", 1)[0]
              blocks, cur = [], []
              for line in sec.splitlines():
                  if line.startswith("=== ") and line.endswith(" ==="):
                      continue
                  if line.startswith("--- FAIL:") or line.startswith("panic:") or line.startswith("WARNING: DATA RACE"):
                      if cur:
                          blocks.append(" | ".join(cur)[:900])
                      cur = [line.strip()]
                  elif line.strip():
                      cur.append(line.strip())
              if cur:
                  blocks.append(" | ".join(cur)[:900])
              for b in blocks[:9]:
                  print(f"::error title={title}::{b}")
          PY
            exit "$status"
          fi

      - name: Serve a container's own fetches through real interception
        env:
          GRAIN_REAL_INTERCEPT_TESTS: "1"
        run: |
          set +e
          want=TestInterceptionServesASandboxFromStandInArchives
          go test -c -o /var/tmp/grain-intercept.test ./pkg/daemon
          sudo setcap cap_net_bind_service=+ep /var/tmp/grain-intercept.test
          GRAIN_GOTEST_LOG=/tmp/intercept.log ./scripts/run-go-tests.sh \
            /var/tmp/grain-intercept.test -test.v -test.count=1 -test.timeout 15m \
            -test.run "$want"
          status=$?
          if ! grep -q -- "--- PASS: $want" /tmp/intercept.log; then
            status=1
          fi
          if [ "$status" -ne 0 ]; then
            grep -aE -- '--- FAIL:|--- SKIP:|_test\.go:[0-9]+:|^FAIL' /tmp/intercept.log | tail -n 10 | while IFS= read -r line; do
              echo "::error title=package-cache-intercept::$line"
            done
            exit "$status"
          fi

  # Disabled on GitHub-hosted ubuntu-latest runners:
  #
  # real-vm boots two concurrent Firecracker/Cloud-Hypervisor microVMs
  # inside Docker containers (TestGranuleSandboxesAgainstARealDockerBackedVM,
  # TestGranuleSandboxesAcquireCreatesTwoRealVMsConcurrently, and
  # TestTheModelProxiesAreReachableFromInsideARealGuest). It requires a
  # pre-published guest VM image in GHCR matching ./scripts/granule/guest-inputs.sh
  # (or ~45 minutes and >30 GB disk to build Granulefile from scratch), plus
  # nested KVM with at least 16 GiB dedicated RAM and 60 GB disk. Move to a
  # self-hosted runner with KVM and pre-warmed guest image cache to enable.
  real-vm:
    name: real vm
    if: vars.ENABLE_SELF_HOSTED_TESTS == 'true'
    runs-on: ${{ vars.SELF_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-real-vm-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Real VM sandbox tests
        env:
          GRAIN_REAL_VM_TESTS: "1"
        run: |
          ./scripts/run-go-tests.sh go test -v -count=1 -timeout 20m \
            -run 'TestGranuleSandboxesAgainstARealDockerBackedVM|TestGranuleSandboxesAcquireCreatesTwoRealVMsConcurrently|TestTheModelProxiesAreReachableFromInsideARealGuest' \
            ./pkg/orchestrator/

  # Disabled on GitHub-hosted ubuntu-latest runners:
  #
  # real-kubernetes boots a multi-node kind cluster with Calico CNI to enforce
  # NetworkPolicy egress isolation and tests real pod sandboxes and Kubernetes
  # run-host handoffs (pkg/orchestrator and pkg/cli). Provisioning kind + Calico
  # + building and loading the sandbox images exceeds standard hosted runner
  # memory/disk budgets and belongs on a larger or self-hosted runner.
  real-kubernetes:
    name: real kubernetes
    if: vars.ENABLE_SELF_HOSTED_TESTS == 'true'
    runs-on: ${{ vars.SELF_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-real-kubernetes-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Real Kubernetes sandbox tests
        env:
          GRAIN_REAL_K8S_TESTS: "1"
        run: |
          ./scripts/run-go-tests.sh go test -v -count=1 -timeout 20m ./pkg/k8s/...
