      group: ${{ github.workflow }}-host-script-container-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build the sandbox image
        run: |
          set -euo pipefail
          docker build -q -f Dockerfile.k8s-sandbox \
            --build-arg INSTALL_CLAUDE_CLI=0 --build-arg INSTALL_AGY_CLI=0 --build-arg INSTALL_CODEX_CLI=0 \
            -t grain-k8s-sandbox:host-script .

      - name: Test
        env:
          GRAIN_HOST_SCRIPT_CONTAINER_IMAGE: grain-k8s-sandbox:host-script
        run: |
          set -euo pipefail
          GRAIN_GOTEST_LOG=/tmp/host-script.log ./scripts/run-go-tests.sh \
            go test -count=1 -timeout 10m -run '^TestHostScriptGrantInARealContainerSandbox$' -v ./pkg/orchestrator/
          if ! grep -q -- "--- PASS: TestHostScriptGrantInARealContainerSandbox" /tmp/host-script.log; then
            echo "TestHostScriptGrantInARealContainerSandbox did not run and pass; this job only means something when it does" >&2
            exit 1
          fi

  frontend:
    name: frontend
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-frontend-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Cache npm and node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.npm
            ui/node_modules
            ui-ng/node_modules
            ui-hub/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('ui/package-lock.json', 'ui-ng/package-lock.json', 'ui-hub/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Fill the npm cache from the registry
        run: ./scripts/warm-npm-cache.sh ui && ./scripts/warm-npm-cache.sh ui-ng && ./scripts/warm-npm-cache.sh ui-hub

      - name: Build frontend
        run: make frontend

      - name: Format frontend
        run: make fmt-frontend

      - name: Test frontend
        working-directory: ui
        run: npm test -- --maxWorkers=4

      - name: Lint and test the new (Angular) frontend
        working-directory: ui-ng
        run: npm ci && npm run lint && npm test -- --maxWorkers=4

      - name: Test registry frontend
        working-directory: ui-hub
        run: npm ci && npm test -- --maxWorkers=4

  ui-e2e:
    name: ui e2e
    needs: [changes]
    if: needs.changes.outputs.go_program == 'true' && needs.changes.outputs.ui-e2e == 'true'
    runs-on: ubuntu-latest
    # The suite alone runs about 32 minutes now (887 tests, one worker per
    # two cores), and the frontend build and browser download come on top:
    # at 35 a slow runner was cancelled mid-suite with no verdict at all.
    timeout-minutes: 50
    concurrency:
      group: ${{ github.workflow }}-ui-e2e-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    env:
      PLAYWRIGHT_BROWSERS: chromium
      PLAYWRIGHT_PROJECT: chromium
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache npm and node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.npm
            ui/node_modules
            ui-ng/node_modules
            ui-hub/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('ui/package-lock.json', 'ui-ng/package-lock.json', 'ui-hub/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Prepare Playwright browser cache directory
        run: |
          sudo mkdir -p /var/cache/playwright
          sudo chown -R "$USER:$USER" /var/cache/playwright

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /var/cache/playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}

      - name: Disable unused third-party apt sources
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list

      - name: Fill the npm cache from the registry
        run: ./scripts/warm-npm-cache.sh ui && ./scripts/warm-npm-cache.sh ui-ng && ./scripts/warm-npm-cache.sh ui-hub

      - name: Build frontend
        run: make frontend

      - name: Download the browsers the suite drives
        run: make playwright-browsers

      - name: Test e2e
        run: |
          set -uo pipefail
          make test-e2e-suite
          status=$?
          node ui/scripts/summarize-trace-network.mjs || true
          exit $status

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-test-results
          path: ui/test-results
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: lint
    needs: [changes]
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-lint-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install shellcheck and actionlint
        run: |
          set -euo pipefail
          # Pin ShellCheck to v0.9.0 (matching Debian Bookworm in Granulefile) so
          # newer ShellCheck releases on ubuntu-latest (0.11.0+) do not fail on
          # unmodified scripts. Fall back to the digest-pinned upstream container
          # image when GitHub Releases downloads return HTTP 504.
          if curl -4 -fsSL --max-time 60 --retry 2 --retry-max-time 45 --retry-connrefused --retry-all-errors \
            https://github.com/koalaman/shellcheck/releases/download/v0.9.0/shellcheck-v0.9.0.linux.x86_64.tar.xz \
            -o /tmp/shellcheck.tar.xz; then
            sudo tar -xJf /tmp/shellcheck.tar.xz --strip-components=1 -C /usr/local/bin shellcheck-v0.9.0/shellcheck
            rm -f /tmp/shellcheck.tar.xz
          else
            rm -f /tmp/shellcheck.tar.xz
            sc_image="docker.io/koalaman/shellcheck:v0.9.0@sha256:f35e8987b02760d4e76fc99a68ad5c42cc10bb32f3dd2143a3cf92f1e5446a45"
            docker pull "$sc_image"
            cid="$(docker create "$sc_image")"
            docker cp "$cid:/bin/shellcheck" /tmp/shellcheck
            docker rm "$cid" >/dev/null
            echo "7087178d54de6652b404c306233264463cb9e7a9afeb259bb663cc4dbfd64149  /tmp/shellcheck" | sha256sum -c -
            sudo install -m 0755 /tmp/shellcheck /usr/local/bin/shellcheck
            rm -f /tmp/shellcheck
          fi
          if ! command -v actionlint >/dev/null 2>&1; then
            if curl -4 -fsSL --max-time 60 --retry 2 --retry-max-time 45 --retry-connrefused --retry-all-errors \
              https://github.com/rhysd/actionlint/releases/download/v1.7.4/actionlint_1.7.4_linux_amd64.tar.gz \
              -o /tmp/actionlint.tar.gz; then
              sudo tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
              rm -f /tmp/actionlint.tar.gz
            elif command -v go >/dev/null 2>&1; then
              rm -f /tmp/actionlint.tar.gz
              GOBIN=/tmp/actionlint-bin go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.4
              sudo install -m 0755 /tmp/actionlint-bin/actionlint /usr/local/bin/actionlint
              rm -rf /tmp/actionlint-bin
            else
              rm -f /tmp/actionlint.tar.gz
              al_image="docker.io/rhysd/actionlint:1.7.4@sha256:82244e1db1c60d82c7792180a48dd0bcb838370bb589d53ff132503fc9485868"
              docker pull "$al_image"
              cid="$(docker create "$al_image")"
              docker cp "$cid:/usr/local/bin/actionlint" /tmp/actionlint
              docker rm "$cid" >/dev/null
              echo "ccecc05e701f9f6453b412f074a6ebd99e0556845068c55a226ce5a93acbde86  /tmp/actionlint" | sha256sum -c -
              sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
              rm -f /tmp/actionlint
            fi
          fi
          /usr/local/bin/shellcheck --version
          actionlint -version

      - name: Lint GitHub Actions workflows
        run: actionlint

      - name: Lint scripts
        run: |
          set -euo pipefail
          /usr/local/bin/shellcheck --version
          mapfile -t scripts < <(git ls-files -- 'scripts/*.sh' 'deploy/terraform/*.sh')
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "no shell scripts matched; this job is checking nothing" >&2
            exit 1
          fi
          printf 'checking %s\n' "${scripts[@]}"
          /usr/local/bin/shellcheck --color=always "${scripts[@]}"

  terraform:
    name: terraform
    needs: [changes]
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-terraform-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Format
        working-directory: deploy/terraform/gcp
        run: |
          terraform version
          terraform fmt -check -recursive -diff ..

      - name: Init
        working-directory: deploy/terraform/gcp
        run: |
          for i in 1 2 3 4 5; do
            if terraform init -backend=false -input=false; then
              exit 0
            fi
            if [ "$i" -eq 5 ]; then
              exit 1
            fi
            sleep 2
          done

      - name: Validate
        working-directory: deploy/terraform/gcp
        run: terraform validate

