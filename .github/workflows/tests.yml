# GitHub Actions port of .grain/workflows/tests.yml on GitHub-hosted runners
# (ubuntu-latest).
#
# See docs/github-actions-ci.md for the job-by-job mapping from grain CI,
# how the pre-provisioned Granulefile guest environment is emulated on
# stock ubuntu-latest runners, and which suites remain gated for
# self-hosted runners.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Comma-separated job IDs to run (e.g. go-model,postgres); leave empty to run all jobs"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  PLAYWRIGHT_BROWSERS_PATH: /var/cache/playwright
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  npm_config_prefer_offline: "true"
  npm_config_audit: "false"
  npm_config_fund: "false"
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_mintimeout: "10000"
  npm_config_fetch_retry_maxtimeout: "120000"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-changes-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    outputs:
      go_program: ${{ steps.guard.outputs.go_program || steps.filter.outputs.go_program }}
      go_backend: ${{ steps.guard.outputs.go_backend || steps.filter.outputs.go_backend }}
      go_unit: ${{ steps.guard.outputs.go_unit || steps.filter.outputs.go_unit }}
      granule: ${{ steps.guard.outputs.granule || steps.filter.outputs.granule }}
      frontend: ${{ steps.guard.outputs.frontend || steps.filter.outputs.frontend }}
      lint: ${{ steps.guard.outputs.lint || steps.filter.outputs.lint }}
      terraform: ${{ steps.guard.outputs.terraform || steps.filter.outputs.terraform }}
      go: ${{ steps.guard.outputs.go || steps.filter.outputs.go }}
      go-e2e: ${{ steps.guard.outputs.go-e2e || steps.filter.outputs.go-e2e }}
      go-orchestrator: ${{ steps.guard.outputs.go-orchestrator || steps.filter.outputs.go-orchestrator }}
      go-model: ${{ steps.guard.outputs.go-model || steps.filter.outputs.go-model }}
      go-unit: ${{ steps.guard.outputs.go-unit || steps.filter.outputs.go-unit }}
      postgres: ${{ steps.guard.outputs.postgres || steps.filter.outputs.postgres }}
      run-host: ${{ steps.guard.outputs.run-host || steps.filter.outputs.run-host }}
      host-script-container: ${{ steps.guard.outputs.host-script-container || steps.filter.outputs.host-script-container }}
      ui-e2e: ${{ steps.guard.outputs.ui-e2e || steps.filter.outputs.ui-e2e }}
      installer-e2e: ${{ steps.guard.outputs.installer-e2e || steps.filter.outputs.installer-e2e }}
      installer: ${{ steps.guard.outputs.installer || steps.filter.outputs.installer }}
      package-cache: ${{ steps.guard.outputs.package-cache || steps.filter.outputs.package-cache }}
      real-vm: ${{ steps.guard.outputs.real-vm || steps.filter.outputs.real-vm }}
      real-kubernetes: ${{ steps.guard.outputs.real-kubernetes || steps.filter.outputs.real-kubernetes }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The path filter is the code under test when a change edits it (or
      # this workflow), so it must not decide what that change runs: a
      # filter edited to say "nothing changed" would skip every job, and a
      # skipped job does not fail the pull request. This step decides that
      # case here, in the workflow file, before the script runs at all.
      # push and merge_group run everything either way.
      - name: Run every job when the path filter or this workflow changes
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          run_all=false
          case "$EVENT_NAME" in
            pull_request)
              if [[ -n "$BASE_SHA" && -n "$HEAD_SHA" ]] &&
                changed="$(git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA")"; then
                if grep -qxF -e scripts/github-ci-changes.sh -e .github/workflows/tests.yml <<< "$changed"; then
                  echo "the path filter or the Tests workflow changed; running every job"
                  run_all=true
                fi
              else
                echo "could not diff $BASE_SHA...$HEAD_SHA; running every job"
                run_all=true
              fi
              ;;
            push|merge_group)
              run_all=true
              ;;
          esac
          echo "run_all=$run_all" >> "$GITHUB_OUTPUT"
          if [[ "$run_all" == "true" ]]; then
            for key in go_program go_backend go_unit granule frontend lint terraform go go-e2e go-orchestrator go-model go-unit postgres run-host host-script-container ui-e2e installer-e2e installer package-cache real-vm real-kubernetes; do
              echo "$key=true" >> "$GITHUB_OUTPUT"
            done
          fi

      - name: Classify changed paths and selected jobs
        id: filter
        if: steps.guard.outputs.run_all != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          INPUT_JOBS: ${{ inputs.jobs }}
        run: ./scripts/github-ci-changes.sh

  go:
    name: go
    needs: [changes]
    if: needs.changes.outputs.go_program == 'true' && needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-go-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache npm and node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.npm
            ui/node_modules
            ui-ng/node_modules
            ui-hub/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('ui/package-lock.json', 'ui-ng/package-lock.json', 'ui-hub/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install sandbox guest dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bubblewrap expect zstd socat psmisc
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo git config --system user.name "grain-ci"
          sudo git config --system user.email "grain-ci@example.com"
          git config --global user.name "grain-ci"
          git config --global user.email "grain-ci@example.com"

      - name: Format
        run: make fmt

      - name: Fill the npm cache from the registry
        run: ./scripts/warm-npm-cache.sh ui && ./scripts/warm-npm-cache.sh ui-ng && ./scripts/warm-npm-cache.sh ui-hub

      - name: Build frontend
        run: make frontend

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: ./scripts/run-go-tests.sh go test -race -timeout 35m ./pkg/ui/... ./cmd/grain/... ./ui/e2e/...

  go-e2e:
    name: go e2e
    needs: [changes]
    if: needs.changes.outputs.go_program == 'true' && needs.changes.outputs.go-e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-go-e2e-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache npm and node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.npm
            ui/node_modules
            ui-ng/node_modules
            ui-hub/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('ui/package-lock.json', 'ui-ng/package-lock.json', 'ui-hub/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install sandbox guest dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bubblewrap expect zstd socat psmisc shellcheck
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true
          tmpsrc="$(mktemp -d)"
          cat >"$tmpsrc/main.go" <<'EOF'
          package main

          import (
          	"math"
          	"os"
          	"strconv"
          	"strings"
          	"time"
          )

          func main() {
          	for _, arg := range os.Args[1:] {
          		if strings.HasPrefix(arg, "-") {
          			continue
          		}
          		if d, err := time.ParseDuration(arg); err == nil {
          			time.Sleep(d)
          			continue
          		}
          		s := strings.TrimSuffix(arg, "s")
          		if v, err := strconv.ParseFloat(s, 64); err == nil {
          			// `sleep infinity` (a container kept alive) blocks for
          			// good: +Inf seconds would overflow to a negative
          			// Duration and return at once.
          			if math.IsInf(v, 1) {
          				for {
          					time.Sleep(math.MaxInt64)
          				}
          			}
          			time.Sleep(time.Duration(v * float64(time.Second)))
          		}
          	}
          }
          EOF
          CGO_ENABLED=0 go build -o "$tmpsrc/sleep" "$tmpsrc/main.go"
          sudo rm -f /usr/local/bin/sleep /usr/bin/sleep
          sudo cp -f "$tmpsrc/sleep" /usr/local/bin/sleep
          sudo cp -f "$tmpsrc/sleep" /usr/bin/sleep
          sudo chmod 0755 /usr/local/bin/sleep /usr/bin/sleep
          rm -rf "$tmpsrc"
          sudo git config --system user.name "grain-ci"
          sudo git config --system user.email "grain-ci@example.com"
          git config --global user.name "grain-ci"
          git config --global user.email "grain-ci@example.com"

      - name: Fill the npm cache from the registry
        run: ./scripts/warm-npm-cache.sh ui && ./scripts/warm-npm-cache.sh ui-ng && ./scripts/warm-npm-cache.sh ui-hub

      - name: Build frontend
        run: make frontend

      - name: Test
        run: |
          set +e
          GRAIN_GOTEST_LOG=/tmp/go-e2e.log ./scripts/run-go-tests.sh go test -race -timeout 40m ./tests/e2e/... ./tests/deploy/... | tee /tmp/go-e2e.out
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 - /tmp/go-e2e.out go-e2e <<'PY'
          import sys
          text = open(sys.argv[1], errors="replace").read()
          title = sys.argv[2]
          if "=== failing tests ===" in text:
              sec = text.split("=== failing tests ===", 1)[1].split("=== per-package results ===", 1)[0]
              blocks, cur = [], []
              for line in sec.splitlines():
                  if line.startswith("=== ") and line.endswith(" ==="):
                      continue
                  if line.startswith("--- FAIL:") or line.startswith("panic:") or line.startswith("WARNING: DATA RACE"):
                      if cur:
                          blocks.append(" | ".join(cur)[:900])
                      cur = [line.strip()]
                  elif line.strip():
                      cur.append(line.strip())
              if cur:
                  blocks.append(" | ".join(cur)[:900])
              for b in blocks[:9]:
                  print(f"::error title={title}::{b}")
          PY
            exit "$status"
          fi

  go-orchestrator:
    name: go orchestrator
    needs: [changes]
    if: needs.changes.outputs.go_backend == 'true' && needs.changes.outputs.go-orchestrator == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-go-orchestrator-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install sandbox guest dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bubblewrap expect zstd socat psmisc iproute2 iptables
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo git config --system user.name "grain-ci"
          sudo git config --system user.email "grain-ci@example.com"
          git config --global user.name "grain-ci"
          git config --global user.email "grain-ci@example.com"

      - name: Test
        run: |
          set +e
          GRAIN_GOTEST_LOG=/tmp/go-orchestrator.log ./scripts/run-go-tests.sh go test -race -timeout 25m ./pkg/orchestrator/... | tee /tmp/go-orchestrator.out
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 - /tmp/go-orchestrator.out go-orchestrator <<'PY'
          import sys
          text = open(sys.argv[1], errors="replace").read()
          title = sys.argv[2]
          if "=== failing tests ===" in text:
              sec = text.split("=== failing tests ===", 1)[1].split("=== per-package results ===", 1)[0]
              blocks, cur = [], []
              for line in sec.splitlines():
                  if line.startswith("=== ") and line.endswith(" ==="):
                      continue
                  if line.startswith("--- FAIL:") or line.startswith("panic:") or line.startswith("WARNING: DATA RACE"):
                      if cur:
                          blocks.append(" | ".join(cur)[:900])
                      cur = [line.strip()]
                  elif line.strip():
                      cur.append(line.strip())
              if cur:
                  blocks.append(" | ".join(cur)[:900])
              for b in blocks[:9]:
                  print(f"::error title={title}::{b}")
          PY
            exit "$status"
          fi

  go-model:
    name: go model
    needs: [changes]
    if: needs.changes.outputs.go_backend == 'true' && needs.changes.outputs.go-model == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-go-model-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure git identity
        run: |
          sudo systemctl stop postgresql 2>/dev/null || true
          sudo systemctl disable postgresql 2>/dev/null || true
          sudo rm -rf /usr/lib/postgresql
          sudo git config --system user.name "grain-ci"
          sudo git config --system user.email "grain-ci@example.com"
          git config --global user.name "grain-ci"
          git config --global user.email "grain-ci@example.com"

      - name: Test
        run: |
          set +e
          GRAIN_GOTEST_LOG=/tmp/go-model.log ./scripts/run-go-tests.sh go test -race -timeout 25m ./pkg/model/... ./pkg/staterepo/... ./tests/security/... | tee /tmp/go-model.out
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 - /tmp/go-model.out go-model <<'PY'
          import sys
          text = open(sys.argv[1], errors="replace").read()
          title = sys.argv[2]
          if "=== failing tests ===" in text:
              sec = text.split("=== failing tests ===", 1)[1].split("=== per-package results ===", 1)[0]
              blocks, cur = [], []
              for line in sec.splitlines():
                  if line.startswith("=== ") and line.endswith(" ==="):
                      continue
                  if line.startswith("--- FAIL:") or line.startswith("panic:") or line.startswith("WARNING: DATA RACE"):
                      if cur:
                          blocks.append(" | ".join(cur)[:900])
                      cur = [line.strip()]
                  elif line.strip():
                      cur.append(line.strip())
              if cur:
                  blocks.append(" | ".join(cur)[:900])
              for b in blocks[:9]:
                  print(f"::error title={title}::{b}")
          PY
            exit "$status"
          fi

  go-unit:
    name: go unit
    needs: [changes]
    if: needs.changes.outputs.go_unit == 'true' && needs.changes.outputs.go-unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-go-unit-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install sandbox guest dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bubblewrap expect zstd socat psmisc iproute2 iptables
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo git config --system user.name "grain-ci"
          sudo git config --system user.email "grain-ci@example.com"
          git config --global user.name "grain-ci"
          git config --global user.email "grain-ci@example.com"

      - name: Test
        run: |
          set +e
          GRAIN_GOTEST_LOG=/tmp/go-unit.log ./scripts/run-go-tests.sh go test -race -timeout 25m \
            ./cmd/checkpost/... ./cmd/ghcr-prune/... ./cmd/github-webhook/... ./cmd/image-vulns/... ./cmd/grain-agentd/... ./cmd/grain-connect/... ./cmd/grain-hub/... ./cmd/grain-registry/... ./cmd/grain-sandbox/... ./cmd/grit/... ./cmd/reviewed-merge/... \
            ./docs/releases/... ./tests/agentdcompat/... ./tests/hygiene/... ./tests/container/... ./tests/installer/... \
            ./pkg/access/... ./pkg/actionscache/... ./pkg/agent/... ./pkg/agentd/... ./pkg/apierror/... ./pkg/attest/... \
            ./pkg/authfix/... ./pkg/backup/... ./pkg/capability/... ./pkg/change/... ./pkg/checkpost/... \
            ./pkg/ci/... ./pkg/cifault/... ./pkg/cli/... ./pkg/console/... ./pkg/daemon/... \
            ./pkg/declschema/... ./pkg/demo/... ./pkg/designdoc/... ./pkg/dispatch/... \
            ./pkg/forge/... ./pkg/forkhead/... ./pkg/gcpsetup/... ./pkg/ghwebhook/... ./pkg/github/... ./pkg/gitproxy/... ./pkg/gitrefs/... \
            ./pkg/granule/... ./pkg/grit/... ./pkg/gritapi/... ./pkg/hostd/... ./pkg/hostinit/... ./pkg/hostscriptcli/... ./pkg/whererun/... ./pkg/workflows/... \
            ./pkg/hosttop/... ./pkg/iapreconciler/... ./pkg/infrasig/... ./pkg/installtrack/... ./pkg/jwks/... \
            ./pkg/k8s/... ./pkg/kubectlgate/... ./pkg/lifecycle/... ./pkg/localexec/... ./pkg/mcp/... \
            ./pkg/mergelogins/... ./pkg/metrics/... ./pkg/modelproxy/... ./pkg/namespace/... ./pkg/nsclient/... ./pkg/objectstore/... ./pkg/pkgcache/... ./pkg/playbooks/... \
            ./pkg/policy/... ./pkg/portpick/... ./pkg/ports/... ./pkg/procgroup/... ./pkg/redact/... ./pkg/hub/... ./pkg/registryauth/... ./pkg/hubenv/... \
            ./pkg/releaseapproval/... ./pkg/releasenotes/... ./pkg/reviewedmerge/... ./pkg/repodecl/... ./pkg/runhost/... ./pkg/safepath/... \
            ./pkg/sandboxaccess/... ./pkg/sandboxaddr/... ./pkg/sandboxcli/... ./pkg/sandboximage/... ./pkg/schedulefilter/... ./pkg/secrets/... \
            ./pkg/secretsrepo/... ./pkg/statemachine/... ./pkg/sysstat/... \
            ./pkg/systemlog/... ./pkg/treeid/... ./pkg/trustboundary/... ./pkg/tunnel/... ./pkg/upgrade/... ./pkg/usage/... \
            ./pkg/version/... ./pkg/webauth/... ./tests/bench/... | tee /tmp/go-unit.out
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 - /tmp/go-unit.out go-unit <<'PY'
          import sys
          text = open(sys.argv[1], errors="replace").read()
          title = sys.argv[2]
          if "=== failing tests ===" in text:
              sec = text.split("=== failing tests ===", 1)[1].split("=== per-package results ===", 1)[0]
              blocks, cur = [], []
              for line in sec.splitlines():
                  if line.startswith("=== ") and line.endswith(" ==="):
                      continue
                  if line.startswith("--- FAIL:") or line.startswith("panic:") or line.startswith("WARNING: DATA RACE"):
                      if cur:
                          blocks.append(" | ".join(cur)[:900])
                      cur = [line.strip()]
                  elif line.strip():
                      cur.append(line.strip())
              if cur:
                  blocks.append(" | ".join(cur)[:900])
              for b in blocks[:9]:
                  print(f"::error title={title}::{b}")
          PY
            exit "$status"
          fi

  granule:
    name: granule
    needs: [changes]
    if: needs.changes.outputs.granule == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-granule-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    env:
      GOFLAGS: -mod=vendor
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure /dev/kvm udev permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [ -e /dev/kvm ]; then
            sudo chmod 0666 /dev/kvm
          fi
          sudo usermod -aG kvm "$USER" || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo git config --system user.name "grain-ci"
          sudo git config --system user.email "grain-ci@example.com"
          git config --global user.name "grain-ci"
          git config --global user.email "grain-ci@example.com"

      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            iproute2 iptables dnsmasq-base e2fsprogs socat

      - name: Test
        working-directory: third_party/granule
        run: |
          set +e
          export PATH="$PATH:/sbin:/usr/sbin"
          python3 -c '
          import socket, time
          try:
              s = socket.socket(socket.AF_VSOCK, socket.SOCK_STREAM)
              s.bind((socket.VMADDR_CID_ANY, 1024))
              s.listen(1)
              time.sleep(3600)
          except Exception:
              pass
          ' &
          vsock_pid=$!
          sleep 0.2
          GRAIN_GOTEST_LOG=/tmp/granule.log ../../scripts/run-go-tests.sh go test -race -count=1 -timeout 10m ./... | tee /tmp/granule.out
          status=${PIPESTATUS[0]}
          kill "$vsock_pid" 2>/dev/null || true
          if [ "$status" -ne 0 ]; then
            python3 - /tmp/granule.out granule <<'PY'
          import sys
          text = open(sys.argv[1], errors="replace").read()
          title = sys.argv[2]
          if "=== failing tests ===" in text:
              sec = text.split("=== failing tests ===", 1)[1].split("=== per-package results ===", 1)[0]
              blocks, cur = [], []
              for line in sec.splitlines():
                  if line.startswith("=== ") and line.endswith(" ==="):
                      continue
                  if line.startswith("--- FAIL:") or line.startswith("panic:") or line.startswith("WARNING: DATA RACE"):
                      if cur:
                          blocks.append(" | ".join(cur)[:900])
                      cur = [line.strip()]
                  elif line.strip():
                      cur.append(line.strip())
              if cur:
                  blocks.append(" | ".join(cur)[:900])
              for b in blocks[:9]:
                  print(f"::error title={title}::{b}")
          PY
            exit "$status"
          fi

  postgres:
    name: postgres
    needs: [changes]
    if: needs.changes.outputs.go_backend == 'true' && needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-postgres-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: graintest
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --tmpfs /var/lib/postgresql/data:rw
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install PostgreSQL
        run: |
          sudo systemctl stop postgresql 2>/dev/null || true
          sudo systemctl disable postgresql 2>/dev/null || true
          if ! ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1; then
            if [ ! -e /usr/sbin/policy-rc.d ]; then
              printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
              sudo chmod +x /usr/sbin/policy-rc.d
            fi
            sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql >/dev/null
          fi
          ls /usr/lib/postgresql/*/bin/initdb

      - name: Test
        env:
          GRAIN_REQUIRE_POSTGRES: "1"
        run: ./scripts/run-go-tests.sh go test -count=1 -timeout 15m -exec "$PWD/scripts/exec-unprivileged.sh" ./pkg/model/postgres/... ./pkg/model/ ./pkg/hub/store/...

  run-host:
    name: run host
    needs: [changes]
    if: needs.changes.outputs.go_backend == 'true' && needs.changes.outputs.run-host == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: ${{ github.workflow }}-run-host-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Every release tag: the host agent compatibility step builds
          # grain-agentd from each released tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Pull the run-host test image
        run: docker pull -q debian:bookworm-slim

      - name: Test
        env:
          GRAIN_RUNHOST_DOCKER: "1"
        run: ./scripts/run-go-tests.sh go test -race -count=1 -timeout 15m ./pkg/runhost/

      - name: Daemon restart acceptance test
        env:
          GRAIN_RUNHOST_DOCKER: "1"
        run: ./scripts/run-go-tests.sh go test -count=1 -timeout 20m -run '^(TestDaemonRestartAdoptsTheRunAndItOpensItsPullRequest|TestDaemonRestartKeepsAWarmSessionSandboxOnlyUnderItsRecordedKeys|TestRunHostAgentCannotReachAHostDirectorySandbox)$' -v ./pkg/cli/

      # The host agent contract (design/design/agentd-stable-contract.design.md,
      # "Guard rails"): this tree's daemon side against grain-agentd built
      # from the oldest release still accepted and the newest releases after
      # it -- start, detached start, reattach after a daemon restart,
      # cancel, stage, listen and drain. A change that would strand an
      # installed host agent fails here rather than on an operator's machine.
      - name: Released host agents still work with this daemon
        run: ./scripts/agentd-compat.sh -timeout 10m

  host-script-container:
    name: host-script container
    needs: [changes]
    if: needs.changes.outputs.go_backend == 'true' && needs.changes.outputs.host-script-container == 'true'
