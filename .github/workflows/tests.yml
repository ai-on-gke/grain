    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache npm and node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.npm
            ui/node_modules
            ui-ng/node_modules
            ui-hub/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('ui/package-lock.json', 'ui-ng/package-lock.json', 'ui-hub/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Fill the npm cache from the registry
        run: |
          sudo git config --system user.name "grain-ci"
          sudo git config --system user.email "grain-ci@example.com"
          git config --global user.name "grain-ci"
          git config --global user.email "grain-ci@example.com"
          ./scripts/warm-npm-cache.sh ui && ./scripts/warm-npm-cache.sh ui-ng && ./scripts/warm-npm-cache.sh ui-hub

      - name: Configure authenticated Docker Hub pulls
        env:
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: ./scripts/configure-dockerhub-auth.sh --pull-only

      - name: Assemble the image to install
        run: |
          set +e
          ./scripts/installer-test-image.sh grain-installer:test 2>&1 | tee /tmp/installer-image.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 10 /tmp/installer-image.log | while IFS= read -r line; do
              echo "::error title=installer-image::$line"
            done
            exit "$status"
          fi

      - name: Run the installer e2e suite
        env:
          GRAIN_TEST_IMAGE: grain-installer:test
          GRAIN_INSTALLER_E2E: "1"
        run: |
          set +e
          GRAIN_GOTEST_LOG=/tmp/installer.log ./scripts/run-go-tests.sh \
            go test ./tests/installer -count=1 -v -timeout 15m
          status=$?
          if grep -q -- "--- SKIP" /tmp/installer.log; then
            grep -- "--- SKIP" /tmp/installer.log >&2
            echo "::error title=installer-e2e::tests/installer skipped a test"
            status=1
          fi
          if ! grep -q -- "--- PASS" /tmp/installer.log; then
            echo "::error title=installer-e2e::tests/installer passed no test at all"
            status=1
          fi
          if [ "$status" -ne 0 ]; then
            grep -aE -- '--- FAIL:|--- SKIP:|^FAIL[[:space:]]|_test\.go:[0-9]+:' /tmp/installer.log | tail -n 8 | while IFS= read -r line; do
              echo "::error title=installer-e2e::$line"
            done
            exit "$status"
          fi

  package-cache:
    name: package cache
    needs: [changes]
    if: needs.changes.outputs.go_backend == 'true' && needs.changes.outputs.package-cache == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-package-cache-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Seed Granulefile /etc/docker/daemon.json
        run: |
          sudo mkdir -p /usr/local/lib/grain-real-bin
          if [ ! -e /usr/local/lib/grain-real-bin/install ]; then
            real_install="$(readlink -f "$(command -v install)")"
            sudo cp -f "$real_install" /usr/local/lib/grain-real-bin/install
            sudo chmod 0755 /usr/local/lib/grain-real-bin/install
          fi
          tmpsrc="$(mktemp -d)"
          cat >"$tmpsrc/main.go" <<'EOF'
          package main

          import (
          	"fmt"
          	"io"
          	"os"
          	"os/exec"
          	"path/filepath"
          	"strconv"
          	"syscall"
          )

          func main() {
          	args := os.Args[1:]
          	if len(args) == 4 && args[0] == "-m" {
          		mode, err := strconv.ParseUint(args[1], 8, 32)
          		if err == nil {
          			src, dst := args[2], args[3]
          			var data []byte
          			if src == "/dev/stdin" || src == "-" {
          				data, err = io.ReadAll(os.Stdin)
          			} else {
          				data, err = os.ReadFile(src)
          			}
          			if err != nil {
          				fmt.Fprintf(os.Stderr, "install: reading %s: %v\n", src, err)
          				os.Exit(1)
          			}
          			if err := os.MkdirAll(filepath.Dir(dst), 0o755); err != nil {
          				fmt.Fprintf(os.Stderr, "install: mkdir %s: %v\n", filepath.Dir(dst), err)
          				os.Exit(1)
          			}
          			tmp := fmt.Sprintf("%s.tmp.%d", dst, os.Getpid())
          			if err := os.WriteFile(tmp, data, os.FileMode(mode)); err != nil {
          				fmt.Fprintf(os.Stderr, "install: writing %s: %v\n", tmp, err)
          				os.Exit(1)
          			}
          			_ = os.Chmod(tmp, os.FileMode(mode))
          			if err := os.Rename(tmp, dst); err != nil {
          				_ = os.Remove(tmp)
          				fmt.Fprintf(os.Stderr, "install: renaming %s: %v\n", dst, err)
          				os.Exit(1)
          			}
          			os.Exit(0)
          		}
          	}
          	const realInstall = "/usr/local/lib/grain-real-bin/install"
          	if err := syscall.Exec(realInstall, append([]string{"install"}, args...), os.Environ()); err != nil {
          		cmd := exec.Command(realInstall, args...)
          		cmd.Stdin = os.Stdin
          		cmd.Stdout = os.Stdout
          		cmd.Stderr = os.Stderr
          		if err := cmd.Run(); err != nil {
          			os.Exit(1)
          		}
          	}
          }
          EOF
          CGO_ENABLED=0 go build -o "$tmpsrc/install" "$tmpsrc/main.go"
          sudo rm -f /usr/local/bin/install /usr/bin/install
          sudo cp -f "$tmpsrc/install" /usr/local/bin/install
          sudo cp -f "$tmpsrc/install" /usr/bin/install
          sudo chmod 0755 /usr/local/bin/install /usr/bin/install
          rm -rf "$tmpsrc"
          sudo mkdir -p /etc/docker
          sudo tee /etc/docker/daemon.json >/dev/null <<'EOF'
          {
            "bip": "10.240.0.1/24",
            "default-address-pools": [
              {"base": "10.241.0.0/16", "size": 24}
            ],
            "features": {
              "containerd-snapshotter": true
            },
            "mtu": 1460
          }
          EOF
          sudo systemctl restart docker
          docker info >/dev/null

      - name: Pull an image through the cache this sandbox is pointed at
        env:
          GRAIN_REAL_DOCKER_CACHE_TESTS: "1"
        run: |
          set +e
          GRAIN_GOTEST_LOG=/tmp/pkgcache.log ./scripts/run-go-tests.sh \
            go test ./pkg/orchestrator/ -run 'PackageCache|ReloadDockerScript|AsRootScript' \
            -count=1 -v -timeout 20m | tee /tmp/pkgcache.out
          status=${PIPESTATUS[0]}
          for want in TestPackageCachePullsThroughARealDockerd TestPackageCacheReachesAChildContainerBuild TestPackageCacheLeavesASandboxWithNoRunningDockerdAlone; do
            if ! grep -q -- "--- PASS: $want" /tmp/pkgcache.log; then
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            python3 - /tmp/pkgcache.out package-cache <<'PY'
          import sys
          text = open(sys.argv[1], errors="replace").read()
          title = sys.argv[2]
          if "=== failing tests ===" in text:
              sec = text.split("=== failing tests ===", 1)[1].split("=== per-package results ===", 1)[0]
              blocks, cur = [], []
              for line in sec.splitlines():
                  if line.startswith("=== ") and line.endswith(" ==="):
                      continue
                  if line.startswith("--- FAIL:") or line.startswith("panic:") or line.startswith("WARNING: DATA RACE"):
                      if cur:
                          blocks.append(" | ".join(cur)[:900])
                      cur = [line.strip()]
                  elif line.strip():
                      cur.append(line.strip())
              if cur:
                  blocks.append(" | ".join(cur)[:900])
              for b in blocks[:9]:
                  print(f"::error title={title}::{b}")
          PY
            exit "$status"
          fi

      - name: Serve a container's own fetches through real interception
        env:
          GRAIN_REAL_INTERCEPT_TESTS: "1"
        run: |
          set +e
          want=TestInterceptionServesASandboxFromStandInArchives
          go test -c -o /var/tmp/grain-intercept.test ./pkg/daemon
          sudo setcap cap_net_bind_service=+ep /var/tmp/grain-intercept.test
          GRAIN_GOTEST_LOG=/tmp/intercept.log ./scripts/run-go-tests.sh \
            /var/tmp/grain-intercept.test -test.v -test.count=1 -test.timeout 15m \
            -test.run "$want"
          status=$?
          if ! grep -q -- "--- PASS: $want" /tmp/intercept.log; then
            status=1
          fi
          if [ "$status" -ne 0 ]; then
            grep -aE -- '--- FAIL:|--- SKIP:|_test\.go:[0-9]+:|^FAIL' /tmp/intercept.log | tail -n 10 | while IFS= read -r line; do
              echo "::error title=package-cache-intercept::$line"
            done
            exit "$status"
          fi

  real-vm:
    name: real vm
    needs: [changes]
    if: needs.changes.outputs.go_backend == 'true' && needs.changes.outputs.real-vm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-real-vm-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure sufficient runner disk space
        run: |
          avail_mb=$(df -BM --output=avail / | tail -1 | tr -dc '0-9')
          if [ "${avail_mb:-0}" -lt 35000 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          fi
          df -h /

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure /dev/kvm udev permissions
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            iproute2 iptables nftables dnsmasq-base e2fsprogs socat openssh-client
          if [ ! -e /dev/kvm ]; then
            echo "/dev/kvm is not in this runner, so the suite below would skip rather than run. A green tick here would mean nothing." >&2
            exit 1
          fi
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 0666 /dev/kvm
          sudo usermod -aG kvm "$USER" || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo git config --system user.name "grain-ci"
          sudo git config --system user.email "grain-ci@example.com"
          git config --global user.name "grain-ci"
          git config --global user.email "grain-ci@example.com"
          ls -l /dev/kvm
          docker version
          command -v ssh-keygen
          sudo -n nft --version
          nproc
          free -m
          df -h /

      - name: Resolve the sandbox guest
        timeout-minutes: 50
        env:
          IMAGE: grain-guest:e2e-test
        run: ./scripts/granule-guest-resolve.sh

      - name: Real VM sandbox tests
        env:
          GRAIN_REAL_VM_TESTS: "1"
          GRAIN_REAL_VM_CPUS: "2"
          GRAIN_REAL_VM_MEMORY_MB: "2048"
        run: |
          set -uo pipefail
          mkdir -p /tmp/consoles
          (
            while true; do
              for c in $(docker ps -aq --filter 'name=granule-vm-' 2>/dev/null); do
                if [ ! -e "/tmp/consoles/$c.started" ]; then
                  touch "/tmp/consoles/$c.started"
                  name="$(docker inspect -f '{{.Name}}' "$c" 2>/dev/null | tr -d /)"
                  (docker logs -f "$c" > "/tmp/consoles/${name:-$c}.log" 2>&1 &)
                fi
              done
              sleep 2
            done
          ) &
          watcher=$!
          failed=""
          go test ./pkg/orchestrator/ \
            -run 'TestGranuleSandboxesAgainstARealDockerBackedVM|TestGranuleSandboxesAcquireCreatesTwoRealVMsConcurrently|TestTheModelProxiesAreReachableFromInsideARealGuest' \
            -count=1 -v -timeout 25m 2>&1 | tee /tmp/granule-vm.log || failed="the suite"
          kill "$watcher" 2>/dev/null || true

          for t in TestGranuleSandboxesAgainstARealDockerBackedVM \
                   TestGranuleSandboxesAcquireCreatesTwoRealVMsConcurrently \
                   TestTheModelProxiesAreReachableFromInsideARealGuest; do
            if ! grep -q -- "--- PASS: $t" /tmp/granule-vm.log; then
              echo "$t did not run and pass; this job only means something when all of them do" >&2
              failed="${failed:-a test that did not run}"
            fi
          done
          if [ -n "$failed" ]; then
            echo "===== nproc / free -m / df -h / ====="
            nproc; free -m; df -h /
            echo "===== docker ps -a ====="
            docker ps -a
            echo "===== dmesg tail ====="
            (sudo dmesg 2>/dev/null || dmesg 2>/dev/null || echo "no dmesg here") | tail -80
            for f in /tmp/consoles/*.log; do
              [ -e "$f" ] || continue
              echo "===== guest console $f ====="
              tail -200 "$f"
            done
            exit 1
          fi

  # Boots a single-node kind cluster with Calico CNI (v3.33.0) on ubuntu-latest
  # to enforce NetworkPolicy egress isolation and exercise real Kubernetes pod
  # sandboxes (TestK8sSandboxesAgainstARealKindCluster).
  real-kubernetes:
    name: real kubernetes
    needs: [changes]
    if: needs.changes.outputs.go_backend == 'true' && needs.changes.outputs.real-kubernetes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: ${{ github.workflow }}-real-kubernetes-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Free runner disk space
        run: |
          echo "=== Disk and memory before cleanup ==="
          df -h /
          free -m
          for dir in \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /opt/az; do
            sudo rm -rf "$dir" &
          done
          wait || true
          echo "=== Disk after cleanup ==="
          df -h /

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache kind and Calico images
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/grain-k8s
          key: k8s-images-${{ runner.os }}-${{ hashFiles('scripts/prepare-real-k8s-ci.sh') }}
          restore-keys: |
            k8s-images-${{ runner.os }}-

      - name: Prepare kind and Calico images
        run: ./scripts/prepare-real-k8s-ci.sh

      - name: Real Kubernetes sandbox tests
        env:
          GRAIN_REAL_K8S_TESTS: "1"
        run: |
          set +e
          want=TestK8sSandboxesAgainstARealKindCluster
          rm -f /tmp/k8s-metrics.csv /tmp/real-k8s.log
          (
            while true; do
              ts="$(date +%s)"
              mem="$(free -m | awk '/^Mem:/ {print $2 "," $3 "," $7}')"
              dsk="$(df -BM / | awk 'NR==2 {gsub(/M/,""); print $2 "," $3 "," $4}')"
              echo "${ts},${mem},${dsk}" >> /tmp/k8s-metrics.csv
              sleep 2
            done
          ) >/dev/null 2>&1 &
          sampler=$!
          t0="$(date +%s)"
          GRAIN_GOTEST_LOG=/tmp/real-k8s.log ./scripts/run-go-tests.sh \
            go test -v -count=1 -timeout 18m -run "^${want}\$" ./pkg/orchestrator/
          status=$?
          t1="$(date +%s)"
          kill "$sampler" 2>/dev/null || true
          wait "$sampler" 2>/dev/null || true

          echo "=== Real Kubernetes resource summary (elapsed $((t1 - t0))s) ==="
          awk -F, '
            BEGIN { max_mem=0; min_avail=999999; max_disk=0; min_free_disk=999999 }
            NF==7 {
              total_mem=$2; if ($3+0 > max_mem) max_mem=$3+0; if ($4+0 < min_avail) min_avail=$4+0;
              total_disk=$5; if ($6+0 > max_disk) max_disk=$6+0; if ($7+0 < min_free_disk) min_free_disk=$7+0;
            }
            END {
              printf "mem_total_mb=%s peak_mem_used_mb=%d min_mem_avail_mb=%d | disk_total_mb=%s peak_disk_used_mb=%d min_disk_free_mb=%d\n",
                total_mem, max_mem, min_avail, total_disk, max_disk, min_free_disk
            }
          ' /tmp/k8s-metrics.csv
          df -h /
          free -m

          if ! grep -q -- "--- PASS: ${want}" /tmp/real-k8s.log || grep -q -- "--- SKIP:" /tmp/real-k8s.log; then
            echo "::error title=real-kubernetes::${want} did not run and pass"
            status=1
          fi
          if [ "$status" -ne 0 ]; then
            grep -aE -- '--- FAIL:|--- SKIP:|_test\.go:[0-9]+:|^FAIL' /tmp/real-k8s.log | tail -n 10 | while IFS= read -r line; do
              echo "::error title=real-kubernetes::$line"
            done
            exit "$status"
          fi
