# GitHub Actions port of .grain/workflows/promote-release.yml.
#
# Makes a pending release (`vX.Y.0-pending`) official (`approve` + `promote`),
# or drops it (`reject`). Triggered exclusively via `workflow_dispatch` by a
# human operator (`GRAIN_CI_REQUESTED_BY_KIND=human`).
#
# On non-main refs, `dry_run` defaults to and is enforced as `true`.

name: promote-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Pending release version to approve or reject (e.g. v3.1.0)"
        required: true
        type: string
      decision:
        description: "Whether to approve (promote) or reject (drop) the pending release"
        required: true
        default: approve
        type: choice
        options:
          - approve
          - reject
      dry_run:
        description: "Verify promotion or rejection plan without pushing git tags or container images (always true on non-main refs)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  RELEASE_IMAGE_REPO: ${{ vars.RELEASE_IMAGE_REPO || 'bwsalmon/grain' }}

jobs:
  approve:
    name: approve the pending release
    if: inputs.decision == 'approve' || inputs.decision == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
    concurrency:
      group: ${{ github.workflow }}-approve-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.REPO_WRITE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Refuse anybody but a person and resolve context
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          GH_REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ]; then
            echo "promote-release: only workflow_dispatch by a person may approve a release" >&2
            exit 1
          fi
          case "${GITHUB_ACTOR:-}" in
            ""|*"[bot]"|grain-ci*)
              echo "promote-release: only a person approves a release (actor=${GITHUB_ACTOR:-})" >&2
              exit 1
              ;;
          esac
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"

          case "${GITHUB_REF:-}" in
            refs/heads/main)
              is_main_ref=true
              ;;
            *)
              is_main_ref=false
              ;;
          esac

          dry_run="${INPUT_DRY_RUN:-}"
          if [ "$is_main_ref" != "true" ]; then
            dry_run="true"
          elif [ -z "$dry_run" ]; then
            dry_run="false"
          fi
          {
            echo "GRAIN_CI_REQUESTED_BY_KIND=human"
            echo "GRAIN_CI_REQUESTED_BY=${GITHUB_ACTOR}"
            echo "GRAIN_CI_RELEASE_VERSION=${INPUT_VERSION}"
            echo "GRAIN_CI_REPO=${GITHUB_REPOSITORY}"
            echo "GRAIN_CI_COMMIT=${GITHUB_SHA}"
            echo "GRAIN_CI_REF=${GH_REF_NAME}"
            echo "DRY_RUN=${dry_run}"
          } >> "$GITHUB_ENV"
          echo "Resolved GRAIN_CI_RELEASE_VERSION=${INPUT_VERSION} DRY_RUN=${dry_run}"

      - name: Authenticate to Google Cloud (WIF)
        if: vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_EMAIL != ''
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Configure Artifact Registry Docker authentication
        if: vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_EMAIL != ''
        run: gcloud auth configure-docker us-docker.pkg.dev --quiet

      - name: Configure package-publish credentials
        if: env.DRY_RUN != 'true'
        env:
          GHCR_PAT: ${{ secrets.GHCR_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_REGISTRY: ${{ vars.PACKAGE_PUBLISH_REGISTRY || 'ghcr.io' }}
          PUBLISH_USERNAME: ${{ vars.GHCR_USERNAME || 'bwsalmon' }}
        run: |
          set -euo pipefail
          token="${GHCR_PAT:-}"
          username="${PUBLISH_USERNAME}"
          if [ -z "$token" ]; then
            case "${RELEASE_IMAGE_REPO}" in
              bwsalmon/*)
                echo "::error::GHCR_TOKEN secret is required to publish packages under ghcr.io/${RELEASE_IMAGE_REPO} from ${GITHUB_REPOSITORY}" >&2
                exit 1
                ;;
              *)
                token="${FALLBACK_TOKEN}"
                username="${GITHUB_ACTOR}"
                ;;
            esac
          fi
          echo "::add-mask::${token}"
          {
            echo "PACKAGE_PUBLISH_REGISTRY=${PUBLISH_REGISTRY}"
            echo "PACKAGE_PUBLISH_USERNAME=${username}"
            echo "PACKAGE_PUBLISH_TOKEN=${token}"
          } >> "$GITHUB_ENV"

      - name: Configure optional image-signing key
        if: env.DRY_RUN != 'true'
        env:
          SIGNING_KEY_PEM: ${{ secrets.IMAGE_SIGNING_KEY }}
          SIGNING_KEY_PASS: ${{ secrets.IMAGE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY_PEM:-}" ]; then
            echo "WARNING: IMAGE_SIGNING_KEY secret is not set; promoted release images will be published unsigned." >&2
            exit 0
          fi
          if ! command -v cosign >/dev/null 2>&1; then
            cosign_version="v2.4.1"
            curl -fsSL "https://github.com/sigstore/cosign/releases/download/${cosign_version}/cosign-linux-amd64" \
              -o /usr/local/bin/cosign
            chmod +x /usr/local/bin/cosign
          fi
          key_file="${RUNNER_TEMP}/image-signing.key"
          printf '%s\n' "${SIGNING_KEY_PEM}" > "$key_file"
          chmod 600 "$key_file"
          pass_file="${RUNNER_TEMP}/image-signing.pass"
          printf '%s' "${SIGNING_KEY_PASS:-}" > "$pass_file"
          chmod 600 "$pass_file"
          {
            echo "IMAGE_SIGNING_KEY=${key_file}"
            echo "IMAGE_SIGNING_PASSWORD_FILE=${pass_file}"
          } >> "$GITHUB_ENV"

      - name: Promote the pending release a person approved
        env:
          GRAIN_API_URL: ${{ vars.GRAIN_API_URL || 'http://127.0.0.1:4200' }}
          GRAIN_API_TOKEN: ${{ secrets.GRAIN_API_TOKEN }}
          RELEASE_IMAGES: ${{ vars.RELEASE_IMAGES }}
          RELEASE_NOTIFY: ${{ vars.RELEASE_NOTIFY }}
        run: bash ./scripts/release-from-trunk.sh approve "$GRAIN_CI_RELEASE_VERSION"

  promote:
    name: publish the promoted release as latest
    needs: [approve]
    if: inputs.decision == 'approve' || inputs.decision == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    concurrency:
      group: ${{ github.workflow }}-promote-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Refuse anybody but a person
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          GH_REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ]; then
            echo "promote-release: only a person approves a release" >&2
            exit 1
          fi
          case "${GITHUB_ACTOR:-}" in
            ""|*"[bot]"|grain-ci*)
              echo "promote-release: only a person approves a release" >&2
              exit 1
              ;;
          esac

          case "${GITHUB_REF:-}" in
            refs/heads/main)
              is_main_ref=true
              ;;
            *)
              is_main_ref=false
              ;;
          esac

          dry_run="${INPUT_DRY_RUN:-}"
          if [ "$is_main_ref" != "true" ]; then
            dry_run="true"
          elif [ -z "$dry_run" ]; then
            dry_run="false"
          fi
          {
            echo "GRAIN_CI_REQUESTED_BY_KIND=human"
            echo "GRAIN_CI_REPO=${GITHUB_REPOSITORY}"
            echo "GRAIN_CI_COMMIT=${GITHUB_SHA}"
            echo "GRAIN_CI_REF=${GH_REF_NAME}"
            echo "DRY_RUN=${dry_run}"
          } >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud (WIF)
        if: vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_EMAIL != ''
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Configure Artifact Registry Docker authentication
        if: vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_EMAIL != ''
        run: gcloud auth configure-docker us-docker.pkg.dev --quiet

      - name: Configure package-publish credentials
        if: env.DRY_RUN != 'true'
        env:
          GHCR_PAT: ${{ secrets.GHCR_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_REGISTRY: ${{ vars.PACKAGE_PUBLISH_REGISTRY || 'ghcr.io' }}
          PUBLISH_USERNAME: ${{ vars.GHCR_USERNAME || 'bwsalmon' }}
        run: |
          set -euo pipefail
          token="${GHCR_PAT:-}"
          username="${PUBLISH_USERNAME}"
          if [ -z "$token" ]; then
            case "${RELEASE_IMAGE_REPO}" in
              bwsalmon/*)
                echo "::error::GHCR_TOKEN secret is required to publish packages under ghcr.io/${RELEASE_IMAGE_REPO} from ${GITHUB_REPOSITORY}" >&2
                exit 1
                ;;
              *)
                token="${FALLBACK_TOKEN}"
                username="${GITHUB_ACTOR}"
                ;;
            esac
          fi
          echo "::add-mask::${token}"
          {
            echo "PACKAGE_PUBLISH_REGISTRY=${PUBLISH_REGISTRY}"
            echo "PACKAGE_PUBLISH_USERNAME=${username}"
            echo "PACKAGE_PUBLISH_TOKEN=${token}"
          } >> "$GITHUB_ENV"

      - name: Configure optional image-signing key
        if: env.DRY_RUN != 'true'
        env:
          SIGNING_KEY_PEM: ${{ secrets.IMAGE_SIGNING_KEY }}
          SIGNING_KEY_PASS: ${{ secrets.IMAGE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY_PEM:-}" ]; then
            echo "WARNING: IMAGE_SIGNING_KEY secret is not set; promoted release images will be published unsigned." >&2
            exit 0
          fi
          if ! command -v cosign >/dev/null 2>&1; then
            cosign_version="v2.4.1"
            curl -fsSL "https://github.com/sigstore/cosign/releases/download/${cosign_version}/cosign-linux-amd64" \
              -o /usr/local/bin/cosign
            chmod +x /usr/local/bin/cosign
          fi
          key_file="${RUNNER_TEMP}/image-signing.key"
          printf '%s\n' "${SIGNING_KEY_PEM}" > "$key_file"
          chmod 600 "$key_file"
          pass_file="${RUNNER_TEMP}/image-signing.pass"
          printf '%s' "${SIGNING_KEY_PASS:-}" > "$pass_file"
          chmod 600 "$pass_file"
          {
            echo "IMAGE_SIGNING_KEY=${key_file}"
            echo "IMAGE_SIGNING_PASSWORD_FILE=${pass_file}"
          } >> "$GITHUB_ENV"

      - name: Publish the last promoted release as latest
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            bash ./scripts/release-images.sh --dry-run promote
          else
            bash ./scripts/release-images.sh promote
          fi

  reject:
    name: reject the pending release
    if: inputs.decision == 'reject'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    concurrency:
      group: ${{ github.workflow }}-reject-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.REPO_WRITE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Refuse anybody but a person and resolve context
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          GH_REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ]; then
            echo "promote-release: only workflow_dispatch by a person may reject a release" >&2
            exit 1
          fi
          case "${GITHUB_ACTOR:-}" in
            ""|*"[bot]"|grain-ci*)
              echo "promote-release: only a person rejects a release (actor=${GITHUB_ACTOR:-})" >&2
              exit 1
              ;;
          esac
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"

          case "${GITHUB_REF:-}" in
            refs/heads/main)
              is_main_ref=true
              ;;
            *)
              is_main_ref=false
              ;;
          esac

          dry_run="${INPUT_DRY_RUN:-}"
          if [ "$is_main_ref" != "true" ]; then
            dry_run="true"
          elif [ -z "$dry_run" ]; then
            dry_run="false"
          fi
          {
            echo "GRAIN_CI_REQUESTED_BY_KIND=human"
            echo "GRAIN_CI_REQUESTED_BY=${GITHUB_ACTOR}"
            echo "GRAIN_CI_RELEASE_VERSION=${INPUT_VERSION}"
            echo "GRAIN_CI_REPO=${GITHUB_REPOSITORY}"
            echo "GRAIN_CI_COMMIT=${GITHUB_SHA}"
            echo "GRAIN_CI_REF=${GH_REF_NAME}"
            echo "DRY_RUN=${dry_run}"
          } >> "$GITHUB_ENV"

      - name: Configure package-publish credentials
        if: env.DRY_RUN != 'true'
        env:
          GHCR_PAT: ${{ secrets.GHCR_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_REGISTRY: ${{ vars.PACKAGE_PUBLISH_REGISTRY || 'ghcr.io' }}
          PUBLISH_USERNAME: ${{ vars.GHCR_USERNAME || 'bwsalmon' }}
        run: |
          set -euo pipefail
          token="${GHCR_PAT:-}"
          username="${PUBLISH_USERNAME}"
          if [ -z "$token" ]; then
            case "${RELEASE_IMAGE_REPO}" in
              bwsalmon/*)
                echo "::error::GHCR_TOKEN secret is required to publish packages under ghcr.io/${RELEASE_IMAGE_REPO} from ${GITHUB_REPOSITORY}" >&2
                exit 1
                ;;
              *)
                token="${FALLBACK_TOKEN}"
                username="${GITHUB_ACTOR}"
                ;;
            esac
          fi
          echo "::add-mask::${token}"
          {
            echo "PACKAGE_PUBLISH_REGISTRY=${PUBLISH_REGISTRY}"
            echo "PACKAGE_PUBLISH_USERNAME=${username}"
            echo "PACKAGE_PUBLISH_TOKEN=${token}"
          } >> "$GITHUB_ENV"

      - name: Drop the pending release a person rejected
        env:
          GRAIN_API_URL: ${{ vars.GRAIN_API_URL || 'http://127.0.0.1:4200' }}
          GRAIN_API_TOKEN: ${{ secrets.GRAIN_API_TOKEN }}
          RELEASE_IMAGES: ${{ vars.RELEASE_IMAGES }}
        run: bash ./scripts/release-from-trunk.sh reject "$GRAIN_CI_RELEASE_VERSION"
