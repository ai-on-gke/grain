# GitHub Actions port of .grain/workflows/promote-release.yml.
#
# Makes a pending release (`vX.Y.0-pending`) official (`approve` + `promote`),
# drops it (`reject`), or rolls a bad release back (`rollback`). Triggered
# exclusively via `workflow_dispatch` by a human operator
# (`GRAIN_CI_REQUESTED_BY_KIND=human`). The release train stages
# `vX.Y.0-pending` when an rc passes qualification; approving it is the one
# person action of a release (design/playbook/releases.playbook.md §0).
#
# `rollback` (playbook §11) never deletes or moves `version`: it tags
# `vX.Y.Z-retracted` on it (who, and `reason`), marks its images retracted,
# and re-points `latest` -- the git tag and the images -- at `rollback_to`,
# by default the newest earlier release neither retracted nor in
# RELEASE_NEVER_PROMOTE (scripts/release-from-trunk.sh rollback).
#
# On non-main refs, `dry_run` defaults to and is enforced as `true`.
#
# The person who decides is either the run's own actor -- somebody who
# pressed "Run workflow" here -- or, when grain dispatched the run on a
# person's Approve or Reject in its Inbox or on a person's rollback
# (POST /api/releases/{version}/rollback), the person named in the signed
# `approval` record: grain's own forge identity is a bot, which is refused
# as an actor, and the record is the proof a person decided. It is
# verified against the deployment's public key in the repository variable
# GRAIN_RELEASE_APPROVAL_KEY (`grain release approval-key`) by
# scripts/verify-release-approval.sh, and is bound to this repository,
# version, decision, short-soak and allow-breaking answers and the commit vX.Y.Z-pending
# stages -- for a rollback, the commit vX.Y.Z tags, `rollback_to` and the
# SHA-256 of `reason` -- for 15 minutes. No schedule and no other event runs this.
#
# `approve` refuses a pending release whose recorded staging soak is under
# the minimum (scripts/release-from-trunk.sh records it on the -pending tag)
# unless `short_soak_ok` is true; the vX.Y.0 tag message then says so.
#
# `approve` also refuses a release that carries breaking changes unless it
# is the major release RELEASE_MAJOR asks for (scripts/release-notes.sh
# check-breaking) or `allow_breaking` is true, which passes
# RELEASE_ALLOW_BREAKING=<version>; the vX.Y.0 tag message then says so.
#
# `version` must be vX.Y.Z: the approve and reject jobs refuse anything
# else before writing it to $GITHUB_ENV, where a newline in it could set
# any variable for the steps after.

name: promote-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Pending release version to approve or reject, or the bad release to roll back (e.g. v3.1.0)"
        required: true
        type: string
      decision:
        description: "Whether to approve (promote) or reject (drop) the pending release, or roll a promoted release back (retract it and re-point latest)"
        required: true
        default: approve
        type: choice
        options:
          - approve
          - reject
          - rollback
      short_soak_ok:
        description: "Approve even though the pending release's recorded staging soak is under the minimum (24h less the slack), e.g. one staged with FORCE=true; the release tag records the override"
        required: false
        default: false
        type: boolean
      allow_breaking:
        description: "Approve even though the pending release carries breaking changes and is not the major release RELEASE_MAJOR asks for; passes RELEASE_ALLOW_BREAKING=<version> and the release tag records the override"
        required: false
        default: false
        type: boolean
      rollback_to:
        description: "Rollback only: the release `latest` goes back to (vA.B.C); empty picks the newest earlier release neither retracted nor in RELEASE_NEVER_PROMOTE"
        required: false
        default: ""
        type: string
      reason:
        description: "Rollback only: why the release is retracted, recorded on its vX.Y.Z-retracted tag"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Verify promotion or rejection plan without pushing git tags or container images (always true on non-main refs)"
        required: false
        default: false
        type: boolean
      approval:
        description: "Set by grain only: the signed record of a person's Approve, Reject or rollback in grain (base64). Leave empty when dispatching by hand"
        required: false
        default: ""
        type: string
      approval_signature:
        description: "Set by grain only: the record's signature (base64), verified against vars.GRAIN_RELEASE_APPROVAL_KEY"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  RELEASE_IMAGE_REPO: ${{ vars.RELEASE_IMAGE_REPO }}
  # A promoted commit whose release run a newer merge superseded has no
  # sha- images: release-images.sh dispatches release.yml with
  # commit=<sha> to build, test and publish it, and waits (grain/task-3334).
  RELEASE_ON_DEMAND_BUILD: dispatch

jobs:
  approve:
    name: approve the pending release
    if: inputs.decision == 'approve' || inputs.decision == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
    concurrency:
      group: ${{ github.workflow }}-approve-${{ inputs.version }}
      cancel-in-progress: false
    outputs:
      # The person the signed approval record named, once
      # scripts/verify-release-approval.sh accepted it; empty on a run a
      # person dispatched by hand. `promote` reads it: by then this job
      # has deleted vX.Y.Z-pending, so the record cannot be checked again.
      approved_by: ${{ steps.person.outputs.approved_by }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.REPO_WRITE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Refuse anybody but a person and resolve context
        id: person
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          GH_REF_NAME: ${{ github.head_ref || github.ref_name }}
          APPROVAL: ${{ inputs.approval }}
          APPROVAL_SIGNATURE: ${{ inputs.approval_signature }}
          APPROVAL_PUBLIC_KEY: ${{ vars.GRAIN_RELEASE_APPROVAL_KEY }}
          EXPECT_DECISION: approve
          EXPECT_SHORT_SOAK_OK: ${{ inputs.short_soak_ok }}
          EXPECT_ALLOW_BREAKING: ${{ inputs.allow_breaking }}
        run: |
          set -euo pipefail
          if ! [[ "${INPUT_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "promote-release: version must be vX.Y.Z, not ${INPUT_VERSION@Q}" >&2
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ]; then
            echo "promote-release: only workflow_dispatch by a person may approve a release" >&2
            exit 1
          fi
          if [ -n "${APPROVAL:-}${APPROVAL_SIGNATURE:-}" ]; then
            # Dispatched by grain on a person's answer in its Inbox: the
            # signed record names the person, whoever the actor is.
            by="$(EXPECT_REPO="${GITHUB_REPOSITORY}" EXPECT_VERSION="${INPUT_VERSION}" bash ./scripts/verify-release-approval.sh)"
            echo "promote-release: ${by} approved ${INPUT_VERSION} in grain's Inbox (dispatched as ${GITHUB_ACTOR:-})"
            echo "approved_by=${by}" >>"$GITHUB_OUTPUT"
          else
            case "${GITHUB_ACTOR:-}" in
              ""|*"[bot]"|grain-ci*)
                echo "promote-release: only a person approves a release (actor=${GITHUB_ACTOR:-})" >&2
                exit 1
                ;;
            esac
            by="${GITHUB_ACTOR}"
          fi
          git config --global user.name "${by}"
          git config --global user.email "${by%%@*}@users.noreply.github.com"

          case "${GITHUB_REF:-}" in
            refs/heads/main)
              is_main_ref=true
              ;;
            *)
              is_main_ref=false
              ;;
          esac

          dry_run="${INPUT_DRY_RUN:-}"
          if [ "$is_main_ref" != "true" ]; then
            dry_run="true"
          elif [ -z "$dry_run" ]; then
            dry_run="false"
          fi
          {
            echo "GRAIN_CI_REQUESTED_BY_KIND=human"
            echo "GRAIN_CI_REQUESTED_BY=${by}"
            echo "GRAIN_CI_RELEASE_VERSION=${INPUT_VERSION}"
            echo "GRAIN_CI_REPO=${GITHUB_REPOSITORY}"
            echo "GRAIN_CI_COMMIT=${GITHUB_SHA}"
            echo "GRAIN_CI_REF=${GH_REF_NAME}"
            echo "DRY_RUN=${dry_run}"
          } >> "$GITHUB_ENV"
          echo "Resolved GRAIN_CI_RELEASE_VERSION=${INPUT_VERSION} DRY_RUN=${dry_run}"

      - name: Authenticate to Google Cloud (WIF)
        if: vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_EMAIL != ''
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Configure Artifact Registry Docker authentication
        if: vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_EMAIL != ''
        run: gcloud auth configure-docker us-docker.pkg.dev --quiet

      - name: Configure package-publish credentials
        if: env.DRY_RUN != 'true'
        env:
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_TOKEN }}
          PUBLISH_REGISTRY: ${{ vars.PACKAGE_PUBLISH_REGISTRY }}
        run: bash ./scripts/configure-dockerhub-auth.sh

      - name: Configure optional image-signing key
        if: env.DRY_RUN != 'true'
        env:
          SIGNING_KEY_PEM: ${{ secrets.IMAGE_SIGNING_KEY }}
          SIGNING_KEY_PASS: ${{ secrets.IMAGE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY_PEM:-}" ]; then
            echo "WARNING: IMAGE_SIGNING_KEY secret is not set; promoted release images will be published unsigned." >&2
            exit 0
          fi
          if ! command -v cosign >/dev/null 2>&1; then
            cosign_version="v2.6.5"
            curl -fsSL "https://github.com/sigstore/cosign/releases/download/${cosign_version}/cosign-linux-amd64" \
              -o /usr/local/bin/cosign
            echo "c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644  /usr/local/bin/cosign" | sha256sum -c -
            chmod +x /usr/local/bin/cosign
          fi
          key_file="${RUNNER_TEMP}/image-signing.key"
          printf '%s\n' "${SIGNING_KEY_PEM}" > "$key_file"
          chmod 600 "$key_file"
          pass_file="${RUNNER_TEMP}/image-signing.pass"
          printf '%s' "${SIGNING_KEY_PASS:-}" > "$pass_file"
          chmod 600 "$pass_file"
          {
            echo "IMAGE_SIGNING_KEY=${key_file}"
            echo "IMAGE_SIGNING_PASSWORD_FILE=${pass_file}"
          } >> "$GITHUB_ENV"

      - name: Promote the pending release a person approved
        env:
          GRAIN_API_URL: ${{ vars.GRAIN_API_URL || 'http://127.0.0.1:4200' }}
          GRAIN_API_TOKEN: ${{ secrets.GRAIN_API_TOKEN }}
          RELEASE_IMAGES: ${{ vars.RELEASE_IMAGES }}
          RELEASE_NOTIFY: ${{ vars.RELEASE_NOTIFY }}
          # The person's explicit acceptance of a short soak; without it,
          # approve refuses a -pending release that soaked under the minimum.
          RELEASE_SHORT_SOAK_OK: ${{ inputs.short_soak_ok }}
          # The person's explicit acceptance of breaking changes in a release
          # that is not the major one RELEASE_MAJOR asks for; check-breaking
          # honours it only when it names this release. inputs.version was
          # checked against vX.Y.Z in this job's first step.
          RELEASE_ALLOW_BREAKING: ${{ inputs.allow_breaking && inputs.version || '' }}
        run: bash ./scripts/release-from-trunk.sh approve "$GRAIN_CI_RELEASE_VERSION"

  promote:
    name: publish the promoted release as latest
    needs: [approve]
    if: inputs.decision == 'approve' || inputs.decision == ''
    runs-on: ubuntu-latest
    # Room for an on-demand release build (release.yml's 120 minutes).
    timeout-minutes: 180
    permissions:
      # actions: write dispatches release.yml for an on-demand build.
      actions: write
      contents: read
      packages: write
      id-token: write
    concurrency:
      group: ${{ github.workflow }}-promote-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Refuse anybody but a person
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          GH_REF_NAME: ${{ github.head_ref || github.ref_name }}
          APPROVAL: ${{ inputs.approval }}
          APPROVAL_SIGNATURE: ${{ inputs.approval_signature }}
          APPROVED_BY: ${{ needs.approve.outputs.approved_by }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ]; then
            echo "promote-release: only a person approves a release" >&2
            exit 1
          fi
          if [ -n "${APPROVAL:-}${APPROVAL_SIGNATURE:-}" ]; then
            # Dispatched by grain on a person's Inbox Approve: `approve`,
            # in this same run, verified the signed record and names the
            # person; without that name this job does not run as anybody.
            if [ -z "${APPROVED_BY:-}" ]; then
              echo "promote-release: the approval record was not verified by the approve job" >&2
              exit 1
            fi
            echo "promote-release: publishing for ${APPROVED_BY}'s Inbox approval (dispatched as ${GITHUB_ACTOR:-})"
          else
            case "${GITHUB_ACTOR:-}" in
              ""|*"[bot]"|grain-ci*)
                echo "promote-release: only a person approves a release" >&2
                exit 1
                ;;
            esac
          fi

          case "${GITHUB_REF:-}" in
            refs/heads/main)
              is_main_ref=true
              ;;
            *)
              is_main_ref=false
              ;;
          esac

          dry_run="${INPUT_DRY_RUN:-}"
          if [ "$is_main_ref" != "true" ]; then
            dry_run="true"
          elif [ -z "$dry_run" ]; then
            dry_run="false"
          fi
          {
            echo "GRAIN_CI_REQUESTED_BY_KIND=human"
            echo "GRAIN_CI_REPO=${GITHUB_REPOSITORY}"
            echo "GRAIN_CI_COMMIT=${GITHUB_SHA}"
            echo "GRAIN_CI_REF=${GH_REF_NAME}"
            echo "DRY_RUN=${dry_run}"
          } >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud (WIF)
        if: vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_EMAIL != ''
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Configure Artifact Registry Docker authentication
        if: vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_EMAIL != ''
        run: gcloud auth configure-docker us-docker.pkg.dev --quiet

      - name: Configure package-publish credentials
        if: env.DRY_RUN != 'true'
        env:
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_TOKEN }}
          PUBLISH_REGISTRY: ${{ vars.PACKAGE_PUBLISH_REGISTRY }}
        run: bash ./scripts/configure-dockerhub-auth.sh

      - name: Configure optional image-signing key
        if: env.DRY_RUN != 'true'
        env:
          SIGNING_KEY_PEM: ${{ secrets.IMAGE_SIGNING_KEY }}
          SIGNING_KEY_PASS: ${{ secrets.IMAGE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY_PEM:-}" ]; then
            echo "WARNING: IMAGE_SIGNING_KEY secret is not set; promoted release images will be published unsigned." >&2
            exit 0
          fi
          if ! command -v cosign >/dev/null 2>&1; then
            cosign_version="v2.6.5"
            curl -fsSL "https://github.com/sigstore/cosign/releases/download/${cosign_version}/cosign-linux-amd64" \
              -o /usr/local/bin/cosign
            echo "c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644  /usr/local/bin/cosign" | sha256sum -c -
            chmod +x /usr/local/bin/cosign
          fi
          key_file="${RUNNER_TEMP}/image-signing.key"
          printf '%s\n' "${SIGNING_KEY_PEM}" > "$key_file"
          chmod 600 "$key_file"
          pass_file="${RUNNER_TEMP}/image-signing.pass"
          printf '%s' "${SIGNING_KEY_PASS:-}" > "$pass_file"
          chmod 600 "$pass_file"
          {
            echo "IMAGE_SIGNING_KEY=${key_file}"
            echo "IMAGE_SIGNING_PASSWORD_FILE=${pass_file}"
          } >> "$GITHUB_ENV"

      - name: Publish the last promoted release as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            bash ./scripts/release-images.sh --dry-run promote
          else
            bash ./scripts/release-images.sh promote
          fi

  # The approved release as GitHub release assets (scripts/release-assets.sh,
  # release-asset contract v2, docs/release-assets.md): vX.Y.0 gets copies of
  # its commit's sha-<12 hex> tarballs and images.json, and GitHub's
  # latest-release marker when the git tag latest names it. Its own job, so
  # `contents: write` sits beside nothing but release-assets.sh.
  assets:
    name: publish the promoted release's assets
    needs: [approve, promote]
    if: inputs.decision == 'approve' || inputs.decision == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-assets-${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish the promoted release's assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Off main, dry_run is enforced, as in every job here.
          DRY_RUN: ${{ inputs.dry_run || github.ref != 'refs/heads/main' }}
          RELEASE_ASSETS_DIR: ${{ runner.temp }}/release-assets
        run: bash ./scripts/release-assets.sh promote

  # The promoted release's grain CLI (GET /cli/install.sh, pkg/ui/cli_install.sh):
  # scripts/build-cli.sh's four grain-<os>-<arch>.tar.gz archives and their
  # checksums.txt, built from the tag approve pushed (or from -pending in a dry
  # run) with `contents: read` and no token, and uploaded by cli-assets once
  # assets has published the GitHub Release, so GET /cli/install.sh works as
  # soon as promote-release.yml finishes without waiting for a merge to main.
  cli:
    name: build the promoted release's grain CLI
    needs: [approve]
    if: inputs.decision == 'approve' || inputs.decision == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      build: ${{ steps.release.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the release and whether it still needs its CLI
        id: release
        env:
          RELEASE: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run || github.ref != 'refs/heads/main' }}
        run: |
          set -euo pipefail
          if ! [[ "${RELEASE}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "promote-release: version must be vX.Y.Z, not ${RELEASE@Q}" >&2
            exit 1
          fi
          build=true
          if curl -fsSIL -o /dev/null "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE}/checksums.txt"; then
            echo "promote-release: ${RELEASE} already carries the grain CLI"
            build=false
          fi
          ref="refs/tags/${RELEASE}"
          if [ "${build}" = "true" ] && ! git rev-parse -q --verify "${ref}^{commit}" >/dev/null; then
            if [ "${DRY_RUN}" = "true" ] && git rev-parse -q --verify "refs/tags/${RELEASE}-pending^{commit}" >/dev/null; then
              ref="refs/tags/${RELEASE}-pending"
            elif [ "${DRY_RUN}" = "true" ]; then
              echo "promote-release: dry run: neither ${RELEASE} nor ${RELEASE}-pending is tagged; skipping CLI build"
              build=false
            else
              echo "promote-release: ${RELEASE} is not tagged after approve" >&2
              exit 1
            fi
          fi
          {
            echo "version=${RELEASE}"
            echo "ref=${ref}"
            echo "build=${build}"
          } >> "$GITHUB_OUTPUT"

      - name: Cache Go modules and build cache
        if: steps.release.outputs.build == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        if: steps.release.outputs.build == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build the grain CLI
        if: steps.release.outputs.build == 'true'
        env:
          RELEASE: ${{ steps.release.outputs.version }}
          RELEASE_REF: ${{ steps.release.outputs.ref }}
        run: |
          set -euo pipefail
          bash ./scripts/build-cli.sh --ref "${RELEASE_REF}" "${RUNNER_TEMP}/release-cli"
          bash ./scripts/release-assets.sh cli-validate "${RUNNER_TEMP}/release-cli"

      - name: Hand the archives to cli-assets
        if: steps.release.outputs.build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grain-cli
          path: |
            ${{ runner.temp }}/release-cli/*.tar.gz
            ${{ runner.temp }}/release-cli/checksums.txt
          if-no-files-found: error
          retention-days: 1

  # Uploads what cli built to the vX.Y.Z release assets published: the
  # archives, then checksums.txt (scripts/release-assets.sh cli-publish).
  cli-assets:
    name: publish the promoted release's grain CLI
    needs: [assets, cli]
    if: (inputs.decision == 'approve' || inputs.decision == '') && needs.cli.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # One group per release, shared by promote.yml, promote-release.yml,
    # publish-release.yml and release-train-assets.yml (concurrency groups
    # span a repository's workflows): cli-publish replaces archives left
    # without checksums.txt, so two runs uploading to the same release at
    # once could leave one run's archive beside the other's checksums.txt.
    concurrency:
      group: grain-cli-assets-${{ needs.cli.outputs.version }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the archives cli built
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: grain-cli
          path: ${{ runner.temp }}/release-cli

      - name: Publish the grain CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || github.ref != 'refs/heads/main' }}
          RELEASE_VERSION: ${{ needs.cli.outputs.version }}
        run: bash ./scripts/release-assets.sh cli-publish "${RELEASE_VERSION}" "${RUNNER_TEMP}/release-cli"

  agentd:
    name: build the promoted release's grain-agentd
    needs: [approve]
    if: inputs.decision == 'approve' || inputs.decision == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      build: ${{ steps.release.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the release and whether it still needs grain-agentd
        id: release
        env:
          RELEASE: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run || github.ref != 'refs/heads/main' }}
        run: |
          set -euo pipefail
          if ! [[ "${RELEASE}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "promote-release: version must be vX.Y.Z, not ${RELEASE@Q}" >&2
            exit 1
          fi
          build=true
          if curl -fsSIL -o /dev/null "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE}/grain-agentd-linux-amd64.manifest.json" &&
             curl -fsSIL -o /dev/null "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE}/grain-agentd-linux-arm64.manifest.json"; then
            echo "promote-release: ${RELEASE} already carries grain-agentd"
            build=false
          fi
          ref="refs/tags/${RELEASE}"
          if [ "${build}" = "true" ] && ! git rev-parse -q --verify "${ref}^{commit}" >/dev/null; then
            if [ "${DRY_RUN}" = "true" ] && git rev-parse -q --verify "refs/tags/${RELEASE}-pending^{commit}" >/dev/null; then
              ref="refs/tags/${RELEASE}-pending"
            elif [ "${DRY_RUN}" = "true" ]; then
              echo "promote-release: dry run: neither ${RELEASE} nor ${RELEASE}-pending is tagged; skipping grain-agentd build"
              build=false
            else
              echo "promote-release: ${RELEASE} is not tagged after approve" >&2
              exit 1
            fi
          fi
          {
            echo "version=${RELEASE}"
            echo "ref=${ref}"
            echo "build=${build}"
          } >> "$GITHUB_OUTPUT"

      - name: Cache Go modules and build cache
        if: steps.release.outputs.build == 'true'
        # zizmor: ignore[cache-poisoning]
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        if: steps.release.outputs.build == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build grain-agentd
        if: steps.release.outputs.build == 'true'
        env:
          RELEASE: ${{ steps.release.outputs.version }}
          RELEASE_REF: ${{ steps.release.outputs.ref }}
          AGENTD_RELEASE_PUBLIC_KEY: ${{ vars.AGENTD_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          bash ./scripts/build-agentd.sh --ref "${RELEASE_REF}" "${RUNNER_TEMP}/release-agentd"
          bash ./scripts/release-assets.sh agentd-validate "${RUNNER_TEMP}/release-agentd"

      - name: Hand grain-agentd to agentd-assets
        if: steps.release.outputs.build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grain-agentd
          path: |
            ${{ runner.temp }}/release-agentd/grain-agentd-*
          if-no-files-found: error
          retention-days: 1

  agentd-assets:
    name: publish the promoted release's grain-agentd
    needs: [assets, agentd]
    if: (inputs.decision == 'approve' || inputs.decision == '') && needs.agentd.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # AGENTD_RELEASE_SIGNING_KEY is an agentd-release environment secret,
    # released only to the refs that environment's deployment rules allow
    # (docs/agentd-release-signing.md), not a repository secret any
    # workflow on any pushed branch could read.
    environment: agentd-release
    permissions:
      contents: write
    concurrency:
      group: grain-agentd-assets-${{ needs.agentd.outputs.version }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch grain-agentd built by agentd
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: grain-agentd
          path: ${{ runner.temp }}/release-agentd

      - name: Sign and publish grain-agentd
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || github.ref != 'refs/heads/main' }}
          RELEASE_VERSION: ${{ needs.agentd.outputs.version }}
          SIGNING_KEY_PEM: ${{ secrets.AGENTD_RELEASE_SIGNING_KEY }}
          AGENTD_RELEASE_PUBLIC_KEY: ${{ vars.AGENTD_RELEASE_PUBLIC_KEY }}
          ROTATIONS_JSON: ${{ vars.AGENTD_RELEASE_ROTATIONS }}
          REQUIRE_AGENTD_SIGNING: ${{ vars.REQUIRE_AGENTD_SIGNING }}
        run: |
          set -euo pipefail
          key_file=""
          rot_file=""
          cleanup() { rm -f "${key_file}" "${rot_file}"; }
          trap cleanup EXIT
          if [ "${DRY_RUN}" != "true" ] && [ -n "${SIGNING_KEY_PEM:-}" ]; then
            key_file="${RUNNER_TEMP}/agentd-signing.key"
            printf '%s\n' "${SIGNING_KEY_PEM}" > "${key_file}"
            chmod 600 "${key_file}"
            export AGENTD_RELEASE_SIGNING_KEY="${key_file}"
          fi
          if [ "${DRY_RUN}" != "true" ] && [ -n "${ROTATIONS_JSON:-}" ]; then
            rot_file="${RUNNER_TEMP}/agentd-rotations.json"
            printf '%s\n' "${ROTATIONS_JSON}" > "${rot_file}"
            export AGENTD_RELEASE_ROTATIONS="${rot_file}"
          fi
          bash ./scripts/release-assets.sh agentd-sign "${RUNNER_TEMP}/release-agentd"
          bash ./scripts/release-assets.sh agentd-publish "${RELEASE_VERSION}" "${RUNNER_TEMP}/release-agentd"

  reject:
    name: reject the pending release
    if: inputs.decision == 'reject'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    concurrency:
      group: ${{ github.workflow }}-reject-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.REPO_WRITE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Refuse anybody but a person and resolve context
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          GH_REF_NAME: ${{ github.head_ref || github.ref_name }}
          APPROVAL: ${{ inputs.approval }}
          APPROVAL_SIGNATURE: ${{ inputs.approval_signature }}
          APPROVAL_PUBLIC_KEY: ${{ vars.GRAIN_RELEASE_APPROVAL_KEY }}
          EXPECT_DECISION: reject
          EXPECT_SHORT_SOAK_OK: false
          EXPECT_ALLOW_BREAKING: false
        run: |
          set -euo pipefail
          if ! [[ "${INPUT_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "promote-release: version must be vX.Y.Z, not ${INPUT_VERSION@Q}" >&2
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ]; then
            echo "promote-release: only workflow_dispatch by a person may reject a release" >&2
            exit 1
          fi
          if [ -n "${APPROVAL:-}${APPROVAL_SIGNATURE:-}" ]; then
            # Dispatched by grain on a person's answer in its Inbox: the
            # signed record names the person, whoever the actor is.
            by="$(EXPECT_REPO="${GITHUB_REPOSITORY}" EXPECT_VERSION="${INPUT_VERSION}" bash ./scripts/verify-release-approval.sh)"
            echo "promote-release: ${by} rejected ${INPUT_VERSION} in grain's Inbox (dispatched as ${GITHUB_ACTOR:-})"
          else
            case "${GITHUB_ACTOR:-}" in
              ""|*"[bot]"|grain-ci*)
                echo "promote-release: only a person rejects a release (actor=${GITHUB_ACTOR:-})" >&2
                exit 1
                ;;
            esac
            by="${GITHUB_ACTOR}"
          fi
          git config --global user.name "${by}"
          git config --global user.email "${by%%@*}@users.noreply.github.com"

          case "${GITHUB_REF:-}" in
            refs/heads/main)
              is_main_ref=true
              ;;
            *)
              is_main_ref=false
              ;;
          esac

          dry_run="${INPUT_DRY_RUN:-}"
          if [ "$is_main_ref" != "true" ]; then
            dry_run="true"
          elif [ -z "$dry_run" ]; then
            dry_run="false"
          fi
          {
            echo "GRAIN_CI_REQUESTED_BY_KIND=human"
            echo "GRAIN_CI_REQUESTED_BY=${by}"
            echo "GRAIN_CI_RELEASE_VERSION=${INPUT_VERSION}"
            echo "GRAIN_CI_REPO=${GITHUB_REPOSITORY}"
            echo "GRAIN_CI_COMMIT=${GITHUB_SHA}"
            echo "GRAIN_CI_REF=${GH_REF_NAME}"
            echo "DRY_RUN=${dry_run}"
          } >> "$GITHUB_ENV"

      - name: Configure package-publish credentials
        if: env.DRY_RUN != 'true'
        env:
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_TOKEN }}
          PUBLISH_REGISTRY: ${{ vars.PACKAGE_PUBLISH_REGISTRY }}
        run: bash ./scripts/configure-dockerhub-auth.sh

      - name: Drop the pending release a person rejected
        env:
          GRAIN_API_URL: ${{ vars.GRAIN_API_URL || 'http://127.0.0.1:4200' }}
          GRAIN_API_TOKEN: ${{ secrets.GRAIN_API_TOKEN }}
          RELEASE_IMAGES: ${{ vars.RELEASE_IMAGES }}
        run: bash ./scripts/release-from-trunk.sh reject "$GRAIN_CI_RELEASE_VERSION"

      - name: Mark the rejected release in release assets
        # The vX.Y.Z-rejected pointer release (docs/release-assets.md): a
        # record, so a failure here leaves the rejection itself standing.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || github.ref != 'refs/heads/main' }}
        run: bash ./scripts/release-assets.sh discard-pending "$GRAIN_CI_RELEASE_VERSION"

  rollback:
    name: roll a promoted release back
    if: inputs.decision == 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    concurrency:
      group: ${{ github.workflow }}-rollback-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.REPO_WRITE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Refuse anybody but a person and resolve context
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ROLLBACK_TO: ${{ inputs.rollback_to }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          GH_REF_NAME: ${{ github.head_ref || github.ref_name }}
          APPROVAL: ${{ inputs.approval }}
          APPROVAL_SIGNATURE: ${{ inputs.approval_signature }}
          APPROVAL_PUBLIC_KEY: ${{ vars.GRAIN_RELEASE_APPROVAL_KEY }}
          EXPECT_DECISION: rollback
          EXPECT_SHORT_SOAK_OK: false
          EXPECT_ALLOW_BREAKING: false
          EXPECT_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if ! [[ "${INPUT_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "promote-release: version must be vX.Y.Z, not ${INPUT_VERSION@Q}" >&2
            exit 1
          fi
          if [ -n "${INPUT_ROLLBACK_TO:-}" ] && ! [[ "${INPUT_ROLLBACK_TO}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "promote-release: rollback_to must be empty or vX.Y.Z, not ${INPUT_ROLLBACK_TO@Q}" >&2
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ]; then
            echo "promote-release: only workflow_dispatch by a person may roll a release back" >&2
            exit 1
          fi
          if [ -n "${APPROVAL:-}${APPROVAL_SIGNATURE:-}" ]; then
            by="$(EXPECT_REPO="${GITHUB_REPOSITORY}" EXPECT_VERSION="${INPUT_VERSION}" EXPECT_ROLLBACK_TO="${INPUT_ROLLBACK_TO:-}" bash ./scripts/verify-release-approval.sh)"
            echo "promote-release: ${by} rolled ${INPUT_VERSION} back in grain (dispatched as ${GITHUB_ACTOR:-})"
          else
            case "${GITHUB_ACTOR:-}" in
              ""|*"[bot]"|grain-ci*)
                echo "promote-release: only a person rolls a release back (actor=${GITHUB_ACTOR:-})" >&2
                exit 1
                ;;
            esac
            by="${GITHUB_ACTOR}"
          fi
          git config --global user.name "${by}"
          git config --global user.email "${by%%@*}@users.noreply.github.com"

          case "${GITHUB_REF:-}" in
            refs/heads/main)
              is_main_ref=true
              ;;
            *)
              is_main_ref=false
              ;;
          esac

          dry_run="${INPUT_DRY_RUN:-}"
          if [ "$is_main_ref" != "true" ]; then
            dry_run="true"
          elif [ -z "$dry_run" ]; then
            dry_run="false"
          fi
          {
            echo "GRAIN_CI_REQUESTED_BY_KIND=human"
            echo "GRAIN_CI_REQUESTED_BY=${by}"
            echo "GRAIN_CI_RELEASE_VERSION=${INPUT_VERSION}"
            echo "RELEASE_ROLLBACK_TO=${INPUT_ROLLBACK_TO:-}"
            echo "GRAIN_CI_REPO=${GITHUB_REPOSITORY}"
            echo "GRAIN_CI_COMMIT=${GITHUB_SHA}"
            echo "GRAIN_CI_REF=${GH_REF_NAME}"
            echo "DRY_RUN=${dry_run}"
          } >> "$GITHUB_ENV"

      - name: Configure package-publish credentials
        if: env.DRY_RUN != 'true'
        env:
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_TOKEN }}
          PUBLISH_REGISTRY: ${{ vars.PACKAGE_PUBLISH_REGISTRY }}
        run: bash ./scripts/configure-dockerhub-auth.sh

      - name: Retract the release a person rolled back and re-point latest
        env:
          RELEASE_IMAGES: ${{ vars.RELEASE_IMAGES }}
          # Free text: only ever this step's environment, never $GITHUB_ENV,
          # where a newline in it could set a variable for later steps.
          RELEASE_ROLLBACK_REASON: ${{ inputs.reason }}
        run: bash ./scripts/release-from-trunk.sh rollback --bad "$GRAIN_CI_RELEASE_VERSION"

      - name: Retract the release in release assets and re-point latest
        # The vX.Y.Z-retracted pointer release, then GitHub's latest-release
        # marker moved onto the release the git tag latest now names.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || github.ref != 'refs/heads/main' }}
          RELEASE_ASSETS_DIR: ${{ runner.temp }}/release-assets
        run: |
          set -euo pipefail
          bash ./scripts/release-assets.sh retract "$GRAIN_CI_RELEASE_VERSION" ||
            echo "::warning::could not publish the ${GRAIN_CI_RELEASE_VERSION}-retracted release-asset marker"
          bash ./scripts/release-assets.sh promote
