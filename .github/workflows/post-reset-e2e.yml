# GitHub Actions port of .grain/workflows/post-reset-e2e.yml on GitHub-hosted
# runners (ubuntu-latest).
#
# Runs the automatable rows of the post-reset end-to-end qualification
# (docs/test-plans/2026-10-20-post-reset-e2e.md) nightly and on demand.

name: post-reset-e2e

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  npm_config_prefer_offline: "true"
  npm_config_audit: "false"
  npm_config_fund: "false"
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_mintimeout: "10000"
  npm_config_fetch_retry_maxtimeout: "120000"

jobs:
  deployments:
    name: deployments (SQLite and Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-deployments-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install PostgreSQL
        run: |
          sudo systemctl stop postgresql 2>/dev/null || true
          sudo systemctl disable postgresql 2>/dev/null || true
          if ! ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1; then
            if [ ! -e /usr/sbin/policy-rc.d ]; then
              printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
              sudo chmod +x /usr/sbin/policy-rc.d
            fi
            sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql >/dev/null
          fi
          sudo git config --system user.name "grain-ci"
          sudo git config --system user.email "grain-ci@example.com"
          git config --global user.name "grain-ci"
          git config --global user.email "grain-ci@example.com"
          ls /usr/lib/postgresql/*/bin/initdb

      - name: Build the core and v1.13.0 binaries
        run: |
          set -euo pipefail
          mkdir -p "$HOME/qual"
          go build -o "$HOME/qual/grain-core" ./cmd/grain
          if git rev-parse -q --verify refs/tags/v1.13.0 >/dev/null 2>&1 || git fetch -q --depth 1 origin tag v1.13.0 2>/dev/null; then
            git worktree add -q "$HOME/qual/v1.13.0" v1.13.0
            (cd "$HOME/qual/v1.13.0" && go build -o "$HOME/qual/grain-v1.13.0" ./cmd/grain)
          fi

      - name: Qualify the two deployments
        run: |
          set -uo pipefail
          old=()
          [ -x "$HOME/qual/grain-v1.13.0" ] && old=(-old-grain "$HOME/qual/grain-v1.13.0")
          rc=0
          for build in core; do
            for db in sqlite postgres; do
              echo "== $build / $db"
              if ! ./scripts/post-reset-e2e.sh -build "$build" -db "$db" \
                -grain "$HOME/qual/grain-$build" "${old[@]}" \
                -out "$HOME/qual/$build-$db.md"; then
                rc=1
                grep -- '\*\*FAIL\*\*' "$HOME/qual/$build-$db.md" | while IFS= read -r line; do
                  echo "::error title=post-reset-e2e ($build/$db)::$line"
                done
              fi
            done
          done
          exit $rc

  harness:
    name: e2e harness (githubsim)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-harness-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache npm and node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.npm
            ui/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install sandbox guest dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bubblewrap expect zstd socat psmisc
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo git config --system user.name "grain-ci"
          sudo git config --system user.email "grain-ci@example.com"
          git config --global user.name "grain-ci"
          git config --global user.email "grain-ci@example.com"

      - name: Fill the npm cache from the registry
        run: ./scripts/warm-npm-cache.sh ui

      - name: Build frontend
        run: make frontend

      - name: tests/e2e
        run: |
          set +e
          GRAIN_GOTEST_LOG=/tmp/post-reset-harness.log ./scripts/run-go-tests.sh go test -count=1 -timeout 25m ./tests/e2e/
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E '--- FAIL:|^FAIL[[:space:]]|_test\.go:[0-9]+:' /tmp/post-reset-harness.log | tail -n 15 | while IFS= read -r line; do
              echo "::error title=post-reset-harness::$line"
            done
            exit "$status"
          fi

  security:
    name: route authorization
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-security-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: tests/security
        run: ./scripts/run-go-tests.sh go test -count=1 -timeout 15m ./tests/security/...
