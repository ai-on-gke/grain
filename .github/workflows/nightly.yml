        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: govulncheck
        run: |
          set +e
          make vuln 2>&1 | tee /tmp/vuln.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -aE -- 'Vulnerability|GO-[0-9]{4}-[0-9]+|FAIL' /tmp/vuln.log | tail -n 10 | while IFS= read -r line; do
              echo "::error title=vulns::$line"
            done
            exit "$status"
          fi

  # The release images' vulnerability gate (docs/image-vulnerability-scanning.md)
  # against the images this RC's commit published: Trivy over every image's OS
  # and language packages, failing on a fixable CRITICAL or HIGH finding that
  # .grain/baselines/image-vulns-allowlist.yaml does not waive. govulncheck
  # above reads Go source; this reads what ships -- the Debian packages,
  # the bundled docker, kubectl and cosign binaries, the agent CLIs.
  # The release train pushes git refs only (RELEASE_IMAGES=off), while
  # release.yml publishes each commit's immutable images as :sha-<7> (and
  # moves :main or :candidate); on an RC tag this scans that commit's :sha-<7>
  # images, and on the schedule or a branch dispatch :main (:candidate on
  # candidate).
  image-vulns:
    name: release image vulnerabilities
    needs: [idle-gate]
    if: needs.idle-gate.outputs.run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',image-vulns,'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    concurrency:
      group: ${{ github.workflow }}-image-vulns-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}
    env:
      RELEASE_IMAGE_REPO: ${{ vars.RELEASE_IMAGE_REPO }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Free runner disk space
        # The guest's disk is copied out of its image to be scanned
        # (scripts/scan-images.sh), several gigabytes beside the pull.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Date the vulnerability database
        id: trivy-db
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache the scanner and its vulnerability database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/trivy
            ~/.cache/grain
          key: trivy-${{ runner.os }}-${{ steps.trivy-db.outputs.day }}
          restore-keys: |
            trivy-${{ runner.os }}-

      - name: Scan the RC's images
        env:
          IMAGE_VULNS_SARIF_CATEGORY: rc-images
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag=main
          title="Release image vulnerabilities (:main)"
          if [ "$REF_TYPE" = tag ]; then
            tag="sha-${GITHUB_SHA:0:7}"
            title="RC image vulnerabilities (${REF_NAME}, :${tag})"
          elif [ "$REF_NAME" = candidate ]; then
            tag=candidate
            title="RC image vulnerabilities (:candidate)"
          fi
          echo "scanning the images published as :$tag"
          bash ./scripts/scan-images.sh --tag "$tag" --wait 3600 --out image-vulns-report \
            --title "$title"

      - name: Upload the scan to code scanning
        if: ${{ !cancelled() && hashFiles('image-vulns-report/*.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: image-vulns-report

      - name: Keep the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-vulns-${{ github.ref_name }}
          path: image-vulns-report
          if-no-files-found: ignore

  cmd-grain-stress:
    name: pkg/cli stress under load
    needs: [idle-gate]
    if: needs.idle-gate.outputs.run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',cmd-grain-stress,'))
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: ${{ github.workflow }}-cmd-grain-stress-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install sandbox guest dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bubblewrap expect zstd socat psmisc
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo git config --system user.name "grain-ci"
          sudo git config --system user.email "grain-ci@example.com"
          git config --global user.name "grain-ci"
          git config --global user.email "grain-ci@example.com"

      # Built once, ahead of the stress step, so a sample's cap times only
      # the tests: compiling a -race binary four times over on a loaded
      # runner used to eat the cap, and the outer timeout then killed the
      # sample before go's own -timeout could print its goroutine dump.
      - name: Build the pkg/cli race test binary
        timeout-minutes: 12
        run: |
          set -euo pipefail
          built=$(date +%s)
          go test -race -c -o "$RUNNER_TEMP/cli.test" ./pkg/cli
          echo "built the pkg/cli race test binary in $(( $(date +%s) - built ))s"

      - name: Stress pkg/cli under load
        run: |
          set -euo pipefail
          budget=1800
          deadline=1920
          started=$(date +%s)
          round=0
          longest=0
          # slowest LOG N: the N slowest top-level tests a -test.v log
          # finished, with their times.
          slowest() {
            grep -aE '^--- (PASS|FAIL|SKIP): ' "$1" | sed -E 's/^--- [A-Z]+: ([^ ]+) \(([0-9.]+)s\)$/\2s \1/' | sort -rn | head -n "$2" || true
          }
          # still_running LOG: the top-level tests a -test.v log shows
          # running (not paused waiting for a parallel slot) and never
          # finished -- what a killed sample was stuck in.
          still_running() {
            awk '$1 == "===" && $3 !~ /\// { if ($2 == "RUN" || $2 == "CONT") s[$3] = 1; else if ($2 == "PAUSE") delete s[$3] }
              $1 == "---" && $3 !~ /\// && $2 ~ /^(PASS|FAIL|SKIP):$/ { delete s[$3] }
              END { for (k in s) print k }' "$1" | sort || true
          }
          diagnose() {
            echo "===== nproc / free -m / df -h / ====="
            nproc; free -m; df -h /
            echo "===== dmesg tail ====="
            (sudo dmesg 2>/dev/null || dmesg 2>/dev/null || echo "no dmesg here") | tail -80
          }
          while :; do
            elapsed=$(( $(date +%s) - started ))
            if [ "$round" -gt 0 ] && [ $(( elapsed + longest * 3 / 2 )) -gt "$budget" ]; then
              echo "=== stopping after $round rounds: ${elapsed}s spent, longest round ${longest}s, budget ${budget}s ==="
              break
            fi
            round=$((round + 1))
            round_started=$(date +%s)
            cap=$(( deadline - elapsed ))
            if [ "$cap" -gt 960 ]; then
              cap=960
            fi
            echo "=== pkg/cli stress round $round (at ${elapsed}s, samples capped at ${cap}s) ==="
            (
              while sleep 60; do
                echo "--- round $round +$(( $(date +%s) - round_started ))s: $(free -m | awk '/^Mem:/ {print "mem used " $3 "M, available " $7 "M"}'), load $(cut -d' ' -f1-3 /proc/loadavg) ---"
              done
            ) &
            heartbeat=$!
            pids=()
            for i in 1 2 3 4; do
              # go test runs a package's binary in its own directory; so
              # does this. -test.timeout fires a minute inside the cap, so
              # a hang ends in go's goroutine dump rather than a kill.
              (cd pkg/cli && exec timeout -k 30s "$cap" "$RUNNER_TEMP/cli.test" -test.v -test.timeout "$(( cap - 60 ))s" -test.count=1) > /tmp/sample-$round-$i.log 2>&1 &
              pids+=($!)
            done
            failed=0
            for i in 1 2 3 4; do
              rc=0
              wait "${pids[$((i - 1))]}" || rc=$?
              if [ "$rc" -ne 0 ] || ! grep -qx PASS /tmp/sample-$round-$i.log; then
                if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
                  echo "=== round $round sample $i outlived its ${cap}s cap and was killed (exit $rc) ==="
                else
                  echo "=== failure in round $round sample $i (exit $rc) ==="
                fi
                echo "--- failure headers in round $round sample $i ---"
                grep -n -A40 -E -- '^[[:space:]]*--- FAIL|WARNING: DATA RACE|^panic:|test timed out' /tmp/sample-$round-$i.log | head -400 || true
                echo "--- tests still running in round $round sample $i (started, never finished) ---"
                still_running /tmp/sample-$round-$i.log
                echo "--- slowest tests in round $round sample $i ---"
                slowest /tmp/sample-$round-$i.log 15
                grep -aE -- '--- FAIL:|^FAIL[[:space:]]|_test\.go:[0-9]+:' /tmp/sample-$round-$i.log | tail -n 10 | while IFS= read -r line; do
                  echo "::error title=cmd-grain-stress::$line"
                done
                echo "--- last 300 lines of round $round sample $i ---"
                tail -300 /tmp/sample-$round-$i.log
                failed=1
              fi
            done
            pkill -P "$heartbeat" 2>/dev/null || true
            kill "$heartbeat" 2>/dev/null || true
            wait "$heartbeat" 2>/dev/null || true
            if [ "$failed" -ne 0 ]; then
              diagnose
              echo "pkg/cli stress testing failed in round $round"
              exit 1
            fi
            took=$(( $(date +%s) - round_started ))
            echo "=== round $round took ${took}s; slowest tests in its sample 1: ==="
            slowest /tmp/sample-$round-1.log 5
            if [ "$took" -gt "$longest" ]; then
              longest=$took
            fi
          done
          echo "pkg/cli stress test completed successfully ($round rounds)"

  kvm-sandboxes:
    name: real KVM sandboxes
    needs: [idle-gate]
    if: needs.idle-gate.outputs.run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',kvm-sandboxes,'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-kvm-sandboxes-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure sufficient runner disk space
        run: |
          avail_mb=$(df -BM --output=avail / | tail -1 | tr -dc '0-9')
          if [ "${avail_mb:-0}" -lt 35000 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          fi
          df -h /

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure /dev/kvm udev permissions
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            iproute2 iptables nftables dnsmasq-base e2fsprogs socat openssh-client
          if [ ! -e /dev/kvm ]; then
            echo "/dev/kvm is not in this runner, so the suite below would skip rather than run. A green tick here would mean nothing." >&2
            exit 1
          fi
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 0666 /dev/kvm
          sudo usermod -aG kvm "$USER" || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo git config --system user.name "grain-ci"
          sudo git config --system user.email "grain-ci@example.com"
          git config --global user.name "grain-ci"
          git config --global user.email "grain-ci@example.com"
          ls -l /dev/kvm
          docker version
          command -v ssh-keygen
          sudo -n nft --version
          nproc
          free -m
          df -h /

      - name: Configure authenticated Docker Hub pulls
        env:
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: ./scripts/configure-dockerhub-auth.sh --pull-only

      - name: Resolve the sandbox guest
        timeout-minutes: 50
        env:
          IMAGE: grain-guest:e2e-test
        run: ./scripts/granule-guest-resolve.sh

      - name: Real KVM sandbox suite
        env:
          GRAIN_REAL_VM_TESTS: "1"
          GRAIN_REAL_VM_CPUS: "2"
          GRAIN_REAL_VM_MEMORY_MB: "2048"
        run: |
          set -uo pipefail
          mkdir -p /tmp/consoles
          (
            while true; do
              for c in $(docker ps -aq --filter 'name=granule-vm-' 2>/dev/null); do
                if [ ! -e "/tmp/consoles/$c.started" ]; then
                  touch "/tmp/consoles/$c.started"
                  name="$(docker inspect -f '{{.Name}}' "$c" 2>/dev/null | tr -d /)"
                  (docker logs -f "$c" > "/tmp/consoles/${name:-$c}.log" 2>&1 &)
                fi
              done
              sleep 2
            done
          ) &
          watcher=$!
          failed=""
          go test ./pkg/orchestrator/ \
            -run 'TestGranuleSandboxesAgainstARealDockerBackedVM|TestGranuleSandboxesAcquireCreatesTwoRealVMsConcurrently|TestTheModelProxiesAreReachableFromInsideARealGuest|TestGranuleSandboxNetworkNoneIsolationOutsideGuestVM|TestGranuleSandboxOpenNetworkFenceBlocksMetadataHostAndPeers|TestHostScriptGrantInARealGranuleVM' \
            -count=1 -v -timeout 40m 2>&1 | tee /tmp/granule-vm.log || failed="the suite"
          kill "$watcher" 2>/dev/null || true

          for t in TestGranuleSandboxesAgainstARealDockerBackedVM \
                   TestGranuleSandboxesAcquireCreatesTwoRealVMsConcurrently \
                   TestTheModelProxiesAreReachableFromInsideARealGuest \
                   TestGranuleSandboxNetworkNoneIsolationOutsideGuestVM \
                   TestGranuleSandboxOpenNetworkFenceBlocksMetadataHostAndPeers \
                   TestHostScriptGrantInARealGranuleVM; do
            if ! grep -q -- "--- PASS: $t" /tmp/granule-vm.log; then
              echo "$t did not run and pass; this job only means something when all of them do" >&2
              failed="${failed:-a test that did not run}"
            fi
          done
          if [ -n "$failed" ]; then
            echo "===== nproc / free -m / df -h / ====="
            nproc; free -m; df -h /
            echo "===== docker ps -a ====="
            docker ps -a
            echo "===== dmesg tail ====="
            (sudo dmesg 2>/dev/null || dmesg 2>/dev/null || echo "no dmesg here") | tail -80
            for f in /tmp/consoles/*.log; do
              [ -e "$f" ] || continue
              echo "===== guest console $f ====="
              tail -200 "$f"
            done
            exit 1
          fi

