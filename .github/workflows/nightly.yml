        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache npm and node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.npm
            ui/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Fill the npm cache from the registry
        run: |
          sudo git config --system user.name "grain-ci"
          sudo git config --system user.email "grain-ci@example.com"
          git config --global user.name "grain-ci"
          git config --global user.email "grain-ci@example.com"
          ./scripts/warm-npm-cache.sh ui

      - name: Configure authenticated Docker Hub pulls
        env:
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: ./scripts/configure-dockerhub-auth.sh --pull-only

      - name: Assemble the image to install
        run: ./scripts/installer-test-image.sh grain-installer:test

      - name: Run the installer trixie e2e suite
        env:
          GRAIN_INSTALLER_TRIXIE_E2E: "1"
        run: |
          set +e
          GRAIN_GOTEST_LOG=/tmp/installer-trixie.log ./scripts/run-go-tests.sh \
            go test ./tests/installer/trixie -count=1 -v -timeout 15m
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -aE -- '--- FAIL:|^FAIL[[:space:]]|_test\.go:[0-9]+:' /tmp/installer-trixie.log | tail -n 10 | while IFS= read -r line; do
              echo "::error title=installer-variants::$line"
            done
            exit "$status"
          fi
          if grep -q -- "--- SKIP" /tmp/installer-trixie.log; then
            grep -- "--- SKIP" /tmp/installer-trixie.log >&2
            echo "::error title=installer-variants::tests/installer/trixie skipped a test"
            echo "tests/installer/trixie skipped a test in a runner that has everything it asks for: a skip here is this commit's verdict quietly not existing, which is what this job is for." >&2
            exit 1
          fi
          if ! grep -q -- "--- PASS" /tmp/installer-trixie.log; then
            echo "::error title=installer-variants::tests/installer/trixie passed no test at all"
            echo "tests/installer/trixie passed no test at all, so its green tick would mean nothing." >&2
            exit 1
          fi

      - name: Run the installer hostmode e2e suite
        env:
          GRAIN_INSTALLER_HOSTMODE_E2E: "1"
