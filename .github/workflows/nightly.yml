              echo "::error title=ui-e2e-long::$line"
            done
            exit "$status"
          fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.pass }}
