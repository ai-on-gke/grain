    concurrency:
      group: ${{ github.workflow }}-upgrade-test-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure git
        run: |
          sudo git config --system user.name "grain-ci"
          sudo git config --system user.email "grain-ci@example.com"
          git config --global user.name "grain-ci"
          git config --global user.email "grain-ci@example.com"

      - name: Build deployment image to test upgrade into
        run: bash scripts/ci-docker-build.sh -t grain-e2e:test .

      # Two real upgrades onto this build as well as the self-built one
      # (playbook section 10): from the newest promoted release below it
      # (latest -> RC) and from the oldest supported release of its major
      # (floor -> RC), both pulled from the published images. Each has to
      # PASS; a skip means it proved nothing and fails the job.
      - name: Configure authenticated Docker Hub pulls
        env:
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: ./scripts/configure-dockerhub-auth.sh --pull-only

      - name: Run upgrade tests
        env:
          PACKAGE_PUBLISH_REGISTRY: ${{ vars.PACKAGE_PUBLISH_REGISTRY }}
          RELEASE_IMAGE_REPO: ${{ vars.RELEASE_IMAGE_REPO }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set +e
          # shellcheck source=scripts/release-image-repos.sh
          . ./scripts/release-image-repos.sh
          GRAIN_UPGRADE_RELEASE_IMAGE="$(release_image_repo_for daemon)"
          export GRAIN_UPGRADE_RELEASE_IMAGE
          if [ "$REF_TYPE" = tag ]; then
            export GRAIN_UPGRADE_TARGET="$REF_NAME"
          fi
          make test-upgrade 2>&1 | tee /tmp/upgrade-test.log
          status=${PIPESTATUS[0]}
          for want in TestUpgradeFromPreviousVersion TestUpgradeFromReleasedVersions/latest TestUpgradeFromReleasedVersions/floor; do
            if ! grep -q -- "--- PASS: ${want} " /tmp/upgrade-test.log; then
              echo "::error title=upgrade-test::${want} did not run and pass"
              status=1
            fi
          done
          if grep -q -- "--- SKIP:" /tmp/upgrade-test.log; then
            echo "::error title=upgrade-test::an upgrade test skipped"
            status=1
          fi
          if [ "$status" -ne 0 ]; then
            grep -aE -- '--- FAIL:|--- SKIP:|^FAIL[[:space:]]|_test\.go:[0-9]+:' /tmp/upgrade-test.log | tail -n 10 | while IFS= read -r line; do
              echo "::error title=upgrade-test::$line"
            done
            exit "$status"
          fi

  real-kubernetes:
    name: real kubernetes
    needs: [idle-gate]
    if: needs.idle-gate.outputs.run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',real-kubernetes,'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: ${{ github.workflow }}-real-kubernetes-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Free runner disk space
        run: |
          echo "=== Disk and memory before cleanup ==="
          df -h /
          free -m
          for dir in \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /opt/az; do
            sudo rm -rf "$dir" &
          done
          wait || true
          echo "=== Disk after cleanup ==="
          df -h /

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache kind and Calico images
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/grain-k8s
          key: k8s-images-${{ runner.os }}-${{ hashFiles('scripts/prepare-real-k8s-ci.sh') }}
          restore-keys: |
            k8s-images-${{ runner.os }}-

      - name: Prepare kind and Calico images
        run: ./scripts/prepare-real-k8s-ci.sh

      - name: Real Kubernetes sandbox tests
        env:
          GRAIN_REAL_K8S_TESTS: "1"
        run: |
          set +e
          want=TestK8sSandboxesAgainstARealKindCluster
          rm -f /tmp/k8s-metrics.csv /tmp/real-k8s.log
          (
            while true; do
              ts="$(date +%s)"
              mem="$(free -m | awk '/^Mem:/ {print $2 "," $3 "," $7}')"
              dsk="$(df -BM / | awk 'NR==2 {gsub(/M/,""); print $2 "," $3 "," $4}')"
              echo "${ts},${mem},${dsk}" >> /tmp/k8s-metrics.csv
              sleep 2
            done
          ) >/dev/null 2>&1 &
          sampler=$!
          t0="$(date +%s)"
          GRAIN_GOTEST_LOG=/tmp/real-k8s.log ./scripts/run-go-tests.sh \
            go test -v -count=1 -timeout 18m -run "^${want}\$" ./pkg/orchestrator/
          status=$?
          t1="$(date +%s)"
          kill "$sampler" 2>/dev/null || true
          wait "$sampler" 2>/dev/null || true

          echo "=== Real Kubernetes resource summary (elapsed $((t1 - t0))s) ==="
          awk -F, '
            BEGIN { max_mem=0; min_avail=999999; max_disk=0; min_free_disk=999999 }
            NF==7 {
              total_mem=$2; if ($3+0 > max_mem) max_mem=$3+0; if ($4+0 < min_avail) min_avail=$4+0;
              total_disk=$5; if ($6+0 > max_disk) max_disk=$6+0; if ($7+0 < min_free_disk) min_free_disk=$7+0;
            }
            END {
              printf "mem_total_mb=%s peak_mem_used_mb=%d min_mem_avail_mb=%d | disk_total_mb=%s peak_disk_used_mb=%d min_disk_free_mb=%d\n",
                total_mem, max_mem, min_avail, total_disk, max_disk, min_free_disk
            }
          ' /tmp/k8s-metrics.csv
          df -h /
          free -m

          if ! grep -q -- "--- PASS: ${want}" /tmp/real-k8s.log || grep -q -- "--- SKIP:" /tmp/real-k8s.log; then
            echo "::error title=real-kubernetes::${want} did not run and pass"
            status=1
          fi
          if [ "$status" -ne 0 ]; then
            grep -aE -- '--- FAIL:|--- SKIP:|_test\.go:[0-9]+:|^FAIL' /tmp/real-k8s.log | tail -n 10 | while IFS= read -r line; do
              echo "::error title=real-kubernetes::$line"
            done
            exit "$status"
          fi

  # The one verdict Stage 1 hands the release train: every hosted job in
  # the playbook's Stage 1 table ran and succeeded. GitHub calls a run
  # with skipped jobs a success; this does not, so a job that never ran
  # cannot qualify an RC. A scheduled run idle-gate turned off skips this
  # job too, so the no-op run concludes green and grain files no Stage 1
  # repair for it. A dispatch naming `jobs` (a flake retry) is
  # judged on the jobs it named. The KVM and real-kubernetes jobs
  # (kvm-sandboxes, kvm-route-stress, real-kubernetes) are required like
  # the rest; scripts/candidate-gate.sh's CHECK_QUALIFICATION_JOBS lists
  # the same jobs, and tests/deploy/nightly_rc_qualification_test.go
  # keeps the two in step.
  stage-1:
    name: stage 1 qualification verdict
    if: always() && needs.idle-gate.outputs.run == 'true'
    needs:
      - idle-gate
      - go-long
      - staterepo-soak
      - loadtest
      - scalability
      - merge-stress
      - long-term-test
      - long-sim
      - postgres-stress
      - tunnel-stress
      - ui-e2e-long
      - installer-variants
      - vulns
      - image-vulns
      - cmd-grain-stress
      - upgrade-test
      - kvm-sandboxes
      - kvm-route-stress
      - real-kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Stage 1 job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTED: ${{ inputs.jobs }}
        run: |
          failed=0
          judged=0
          for job in $(jq -r 'keys[]' <<<"$NEEDS"); do
            if [ "$job" = idle-gate ]; then
              continue
            fi
            if [ -n "$SELECTED" ] && [[ ",${SELECTED// /}," != *",${job},"* ]]; then
              continue
            fi
            judged=$((judged + 1))
            result="$(jq -r --arg j "$job" '.[$j].result' <<<"$NEEDS")"
            echo "${job}: ${result}"
            if [ "$result" != success ]; then
              echo "::error title=stage-1::${job} ended ${result}, and Stage 1 requires success"
              failed=1
            fi
          done
          echo "judged ${judged} Stage 1 job(s)"
          exit "$failed"
