  cmd-grain-stress:
    name: pkg/cli stress under load
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: ${{ github.workflow }}-cmd-grain-stress-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install sandbox guest dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bubblewrap expect zstd socat psmisc
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo git config --system user.name "grain-ci"
          sudo git config --system user.email "grain-ci@example.com"
          git config --global user.name "grain-ci"
          git config --global user.email "grain-ci@example.com"

      - name: Stress pkg/cli under load
        run: |
          set -euo pipefail
          budget=1800
          deadline=1920
          started=$(date +%s)
          round=0
          longest=0
          diagnose() {
            echo "===== nproc / free -m / df -h / ====="
            nproc; free -m; df -h /
            echo "===== dmesg tail ====="
            (sudo dmesg 2>/dev/null || dmesg 2>/dev/null || echo "no dmesg here") | tail -80
          }
          while :; do
            elapsed=$(( $(date +%s) - started ))
            if [ "$round" -gt 0 ] && [ $(( elapsed + longest * 3 / 2 )) -gt "$budget" ]; then
              echo "=== stopping after $round rounds: ${elapsed}s spent, longest round ${longest}s, budget ${budget}s ==="
              break
            fi
            round=$((round + 1))
            round_started=$(date +%s)
            cap=$(( deadline - elapsed ))
            if [ "$cap" -gt 960 ]; then
              cap=960
            fi
            echo "=== pkg/cli stress round $round (at ${elapsed}s, samples capped at ${cap}s) ==="
            (
              while sleep 60; do
                echo "--- round $round +$(( $(date +%s) - round_started ))s: $(free -m | awk '/^Mem:/ {print "mem used " $3 "M, available " $7 "M"}'), load $(cut -d' ' -f1-3 /proc/loadavg) ---"
              done
            ) &
            heartbeat=$!
            pids=()
            for i in 1 2 3 4; do
              timeout -k 30s "$cap" go test -race -timeout "$(( cap - 60 ))s" -count=1 ./pkg/cli > /tmp/sample-$round-$i.log 2>&1 &
              pids+=($!)
            done
            failed=0
            for i in 1 2 3 4; do
              rc=0
              wait "${pids[$((i - 1))]}" || rc=$?
              if [ "$rc" -ne 0 ] || ! grep -qE '^ok[[:space:]]+github.com/ai-on-gke/grain/pkg/cli' /tmp/sample-$round-$i.log; then
                if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
                  echo "=== round $round sample $i outlived its ${cap}s cap and was killed (exit $rc) ==="
                else
                  echo "=== failure in round $round sample $i (exit $rc) ==="
                fi
                echo "--- failure headers in round $round sample $i ---"
                grep -n -A40 -E -- '^[[:space:]]*--- FAIL|^=== NAME|WARNING: DATA RACE|^panic:|test timed out' /tmp/sample-$round-$i.log | head -400 || true
                grep -aE -- '--- FAIL:|^FAIL[[:space:]]|_test\.go:[0-9]+:' /tmp/sample-$round-$i.log | tail -n 10 | while IFS= read -r line; do
                  echo "::error title=cmd-grain-stress::$line"
                done
                echo "--- last 300 lines of round $round sample $i ---"
                tail -300 /tmp/sample-$round-$i.log
                failed=1
              fi
            done
            pkill -P "$heartbeat" 2>/dev/null || true
            kill "$heartbeat" 2>/dev/null || true
            wait "$heartbeat" 2>/dev/null || true
            if [ "$failed" -ne 0 ]; then
              diagnose
              echo "pkg/cli stress testing failed in round $round"
              exit 1
            fi
            took=$(( $(date +%s) - round_started ))
            echo "=== round $round took ${took}s ==="
            if [ "$took" -gt "$longest" ]; then
              longest=$took
            fi
          done
          echo "pkg/cli stress test completed successfully ($round rounds)"

  # Disabled by default on stock GitHub-hosted ubuntu-latest runners:
  #
  # kvm-sandboxes boots concurrent Firecracker/Cloud-Hypervisor microVMs
  # (4 vCPUs, 4096 MiB RAM each) inside Docker containers. It requires a
  # pre-published guest VM image in GHCR matching ./scripts/granule/guest-inputs.sh
  # (or ~45-110 minutes and >30 GB free disk to build Granulefile from scratch),
  # plus nested KVM with at least 16 GiB dedicated RAM and 60 GB disk.
  # Enable by setting repository variable ENABLE_SELF_HOSTED_TESTS=true (and
  # optionally SELF_HOSTED_RUNNER to the self-hosted runner label).
  kvm-sandboxes:
    name: real KVM sandboxes
    if: vars.ENABLE_SELF_HOSTED_TESTS == 'true'
    runs-on: ${{ vars.SELF_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 50
    concurrency:
      group: ${{ github.workflow }}-kvm-sandboxes-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Require KVM
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            iproute2 iptables dnsmasq-base e2fsprogs socat openssh-client
          if [ ! -e /dev/kvm ]; then
            echo "/dev/kvm is not in this runner, so the suite below would skip rather than run. A green tick here would mean nothing." >&2
            exit 1
          fi
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm
          docker version
          command -v ssh-keygen
          df -h /

      - name: Resolve the sandbox guest
        timeout-minutes: 120
        env:
          IMAGE: grain-guest:e2e-test
        run: |
          set -euo pipefail
          ./scripts/granule-guest-resolve.sh

      - name: Real KVM sandbox suite
        env:
          GRAIN_REAL_VM_TESTS: "1"
        run: |
          set -uo pipefail
          mkdir -p /tmp/consoles
          (
            while true; do
              for c in $(docker ps -aq --filter 'name=granule-vm-' 2>/dev/null); do
                if [ ! -e "/tmp/consoles/$c.started" ]; then
                  touch "/tmp/consoles/$c.started"
                  name="$(docker inspect -f '{{.Name}}' "$c" 2>/dev/null | tr -d /)"
                  (docker logs -f "$c" > "/tmp/consoles/${name:-$c}.log" 2>&1 &)
                fi
              done
              sleep 2
            done
          ) &
          sampler=$!
          failed=""
          go test ./pkg/orchestrator/ \
            -run 'TestGranuleSandboxesAgainstARealDockerBackedVM|TestGranuleSandboxesAcquireCreatesTwoRealVMsConcurrently|TestTheModelProxiesAreReachableFromInsideARealGuest|TestGranuleSandboxNetworkNoneIsolationOutsideGuestVM|TestHostScriptGrantInARealGranuleVM' \
            -count=1 -v -timeout 40m 2>&1 | tee /tmp/granule-vm.log || failed="the suite"
          kill "$sampler" 2>/dev/null || true
          for t in TestGranuleSandboxesAgainstARealDockerBackedVM \
                   TestGranuleSandboxesAcquireCreatesTwoRealVMsConcurrently \
                   TestTheModelProxiesAreReachableFromInsideARealGuest \
                   TestGranuleSandboxNetworkNoneIsolationOutsideGuestVM \
                   TestHostScriptGrantInARealGranuleVM; do
            if ! grep -q -- "--- PASS: $t" /tmp/granule-vm.log; then
              echo "$t did not run and pass; this job only means something when all of them do" >&2
              failed="${failed:-a test that did not run}"
            fi
          done
          if [ -n "$failed" ]; then
            echo "===== nproc / free -m / df -h / ====="
            nproc; free -m; df -h /
            echo "===== docker ps -a ====="
            docker ps -a
            echo "===== dmesg tail ====="
            (sudo dmesg 2>/dev/null || dmesg 2>/dev/null || echo "no dmesg here") | tail -80
            for f in /tmp/consoles/*.log; do
              [ -e "$f" ] || continue
              echo "===== guest console $f ====="
              tail -200 "$f"
            done
            exit 1
          fi

  # Disabled by default on stock GitHub-hosted ubuntu-latest runners:
  #
  # kvm-route-stress boots two concurrent Firecracker/Cloud-Hypervisor
  # microVMs (4 vCPUs, 4096 MiB RAM each) twenty times in a row. Same
  # guest-image and nested-KVM requirements as kvm-sandboxes above.
  kvm-route-stress:
    name: twenty two-VM boots
    if: vars.ENABLE_SELF_HOSTED_TESTS == 'true'
    runs-on: ${{ vars.SELF_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 70
    concurrency:
      group: ${{ github.workflow }}-kvm-route-stress-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Require KVM
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            iproute2 iptables dnsmasq-base e2fsprogs socat openssh-client
          if [ ! -e /dev/kvm ]; then
            echo "/dev/kvm is not in this runner, so the suite below would skip rather than run. A green tick here would mean nothing." >&2
            exit 1
          fi
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm
          docker version
          command -v ssh-keygen
          df -h /

      - name: Resolve the sandbox guest
        timeout-minutes: 120
        env:
          IMAGE: grain-guest:e2e-test
        run: |
          set -euo pipefail
          ./scripts/granule-guest-resolve.sh

      - name: Twenty consecutive two-VM boots
        env:
          GRAIN_REAL_VM_TESTS: "1"
        run: |
          set -uo pipefail
          runs=20
          mkdir -p /tmp/consoles
          (
            while true; do
              for c in $(docker ps -aq --filter 'name=granule-vm-' 2>/dev/null); do
                if [ ! -e "/tmp/consoles/$c.started" ]; then
                  touch "/tmp/consoles/$c.started"
                  name="$(docker inspect -f '{{.Name}}' "$c" 2>/dev/null | tr -d /)"
                  (docker logs -f "$c" > "/tmp/consoles/${name:-$c}.log" 2>&1 &)
                fi
              done
              sleep 2
            done
          ) &
          sampler=$!
          failed=""
          go test ./pkg/orchestrator/ \
            -run 'TestGranuleSandboxesAcquireCreatesTwoRealVMsConcurrently' \
            -count="$runs" -v -timeout 65m 2>&1 | tee /tmp/granule-stress.log || failed="the stress run"
          kill "$sampler" 2>/dev/null || true

          passes="$(grep -c -- '--- PASS: TestGranuleSandboxesAcquireCreatesTwoRealVMsConcurrently' /tmp/granule-stress.log || true)"
          echo "TestGranuleSandboxesAcquireCreatesTwoRealVMsConcurrently: ${passes}/${runs} boots passed"
          if [ "$passes" != "$runs" ]; then
            echo "expected ${runs} passing boots and got ${passes}; this job only means something when every one of them runs and passes" >&2
            failed="${failed:-a boot that did not run}"
          fi

          if [ -n "$failed" ]; then
            echo "===== the failing iterations ====="
            grep -n -- '--- FAIL\|no default route\|FAIL\b' /tmp/granule-stress.log | head -60
            echo "===== nproc / free -m / df -h / ====="
            nproc; free -m; df -h /
            echo "===== docker ps -a ====="
            docker ps -a
            echo "===== dmesg tail ====="
            (sudo dmesg 2>/dev/null || dmesg 2>/dev/null || echo "no dmesg here") | tail -80
            for f in /tmp/consoles/*.log; do
              [ -e "$f" ] || continue
              echo "===== guest console $f ====="
              tail -200 "$f"
            done
            exit 1
          fi

  upgrade-test:
    name: upgrade from previous version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: ${{ github.workflow }}-upgrade-test-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure git
        run: |
          sudo git config --system user.name "grain-ci"
          sudo git config --system user.email "grain-ci@example.com"
          git config --global user.name "grain-ci"
          git config --global user.email "grain-ci@example.com"

      - name: Build deployment image to test upgrade into
        run: bash scripts/ci-docker-build.sh -t grain-e2e:test .

      - name: Run upgrade tests
        run: |
          set +e
          make test-upgrade 2>&1 | tee /tmp/upgrade-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -aE -- '--- FAIL:|^FAIL[[:space:]]|_test\.go:[0-9]+:' /tmp/upgrade-test.log | tail -n 10 | while IFS= read -r line; do
              echo "::error title=upgrade-test::$line"
            done
            exit "$status"
          fi
