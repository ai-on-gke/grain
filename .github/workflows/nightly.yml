          path: /var/cache/playwright
          key: playwright-all-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}

      - name: Fill the npm cache from the registry
        run: ./scripts/warm-npm-cache.sh ui

      - name: Repeated e2e
        run: |
          set +e
          echo "=== Playwright e2e pass ${{ matrix.pass }} of 3 ==="
          make frontend || exit 1
          make playwright-browsers || exit 1
          make test-e2e-suite 2>&1 | tee /tmp/ui-e2e-long.log
