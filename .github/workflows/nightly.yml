# GitHub Actions port of .grain/workflows/nightly.yml on GitHub-hosted
# runners (ubuntu-latest).
#
# See docs/github-actions-ci.md for the job-by-job mapping from grain CI and
# how the pre-provisioned Granulefile guest environment is emulated on stock
# ubuntu-latest runners.

name: nightly

# Stage 1 of release-candidate qualification
# (design/playbook/releases.playbook.md, "What pass means"): every
# vX.Y.Z-rc.N tag runs this whole workflow on the RC's own ref, so a
# candidate's verdict never waits on cron health. The -discarded,
# -retracted and other suffixed markers a failed RC is given are excluded:
# they name an RC that already has its verdict.
#
# A tag pushed with the default GITHUB_TOKEN fires no `push` workflows, so
# a train pushing with it has to `workflow_dispatch` this file on the tag
# instead (gh workflow run nightly.yml --ref vX.Y.Z-rc.N), which lands on
# the same ref with the same jobs. The `jobs` input is how the train
# re-runs only the job that failed on the same RC, once, as a flake retry
# (playbook section 3).
#
# The schedule stays as a safety net on main, which idle-gate turns into
# a no-op when an rc's Stage 1 concluded in the last 24h (playbook
# section 15).
on:
  push:
    tags:
      - "v*-rc.*"
      - "!v*-rc.*-*"
  schedule:
    - cron: "11 2 * * *"
  workflow_dispatch:
    inputs:
      jobs:
        description: "Optional comma-separated job IDs to run (for example: upgrade-test or kvm-sandboxes,kvm-route-stress), such as one failed job re-run on the same RC. Leave empty to run all jobs."
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  PLAYWRIGHT_BROWSERS_PATH: /var/cache/playwright
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  npm_config_prefer_offline: "true"
  npm_config_audit: "false"
  npm_config_fund: "false"
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_mintimeout: "10000"
  npm_config_fetch_retry_maxtimeout: "120000"

jobs:
  # On schedule only, skip the 02:11 UTC safety-net run on main when any
  # nightly.yml run on a vX.Y.Z-rc.N ref already concluded in the last 24h
  # (playbook section 15): Stage 1 is running on rcs, so main's run would
  # only duplicate it. Tag pushes and workflow_dispatch always run. An
  # Actions API error fails open (run=true), so the safety net never goes
  # blind, and a gated-off run skips every job, stage-1 included, so it
  # concludes green rather than red.
  idle-gate:
    name: idle-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Skip a scheduled run when an rc ran Stage 1 in the last 24h
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "event is ${EVENT_NAME}; running Stage 1"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now="${IDLE_GATE_NOW_EPOCH:-$(date -u +%s)}"
          cutoff="$(( now - 86400 ))"
          tmp="$(mktemp)"
          trap 'rm -f "${tmp:-}"' EXIT
          for page in 1 2 3; do
            url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/nightly.yml/runs?status=completed&per_page=100&page=${page}"
            if ! curl -fsSL --retry 3 --retry-all-errors \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url" -o "$tmp"; then
              echo "::warning title=idle-gate::could not list nightly.yml runs from the Actions API; running Stage 1 as the safety net"
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! match="$(jq -r --argjson cutoff "$cutoff" '
              def ts: sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601;
              [ (.workflow_runs // [])[]
                | select(.status == "completed" and .conclusion != null and .conclusion != "cancelled")
                | select(((.head_branch // "") | sub("^refs/tags/"; "")) | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-rc\\.[0-9]+$"))
                | select(((.updated_at // .created_at // "") | if . == "" then 0 else ts end) >= $cutoff)
              ] | first // empty | "\(.head_branch)\t\(.conclusion)\t\(.updated_at // .created_at)\t\(.html_url // .id)"
            ' "$tmp")"; then
              echo "::warning title=idle-gate::could not read the Actions API's answer; running Stage 1 as the safety net"
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -n "$match" ]; then
              IFS=$'\t' read -r rc conclusion finished where <<< "$match"
              echo "skipping the scheduled nightly on main: ${rc}'s Stage 1 concluded ${conclusion} at ${finished} (${where})"
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            count="$(jq '(.workflow_runs // []) | length' "$tmp")"
            oldest="$(jq -r '
              def ts: sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601;
              [ (.workflow_runs // [])[] | (.updated_at // .created_at // "") | select(. != "") | ts ] | min // 0
            ' "$tmp")"
            if [ "$count" -lt 100 ] || [ "$oldest" -lt "$cutoff" ]; then
              break
            fi
          done
          echo "no vX.Y.Z-rc.N Stage 1 run concluded in the last 24h; running the scheduled nightly on main"
          echo "run=true" >> "$GITHUB_OUTPUT"

  go-long:
    name: go, shuffled and repeated
    needs: [idle-gate]
    if: needs.idle-gate.outputs.run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',go-long,'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Every job's group is keyed on the ref. A run on main or on an RC tag
    # is never cancelled by the next one on the same ref: a flake retry
    # dispatched on vX.Y.Z-rc.N queues behind the run it retries rather
    # than killing it (playbook section 6). Branch runs still supersede.
    concurrency:
      group: ${{ github.workflow }}-go-long-${{ matrix.shard }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache npm and node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.npm
            ui/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install sandbox guest dependencies
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          sudo systemctl stop postgresql 2>/dev/null || true
          sudo systemctl disable postgresql 2>/dev/null || true
          sudo rm -rf /usr/lib/postgresql
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bubblewrap expect zstd socat psmisc iproute2 iptables shellcheck
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true
          # The stand-in `sleep` is for tests/deploy's
          # TestHostdUpgradeScriptDrainsOnlyAHostdOnAnOldBinary, which copies
          # `sleep` under another name and so cannot use Ubuntu 26's multi-call
          # uutils binary -- the same reason tests.yml's go-e2e job installs it.
          # It goes on shard 2 only, the shard that runs tests/deploy. A Go
          # program cannot keep a SIGTERM disposition it inherited as ignored
          # (the Go runtime installs its own handler at startup), so under it
          # `trap '' TERM; sleep 60` dies on the first SIGTERM where coreutils'
          # `sleep` does not, and pkg/mcp's
          # TestSSHRunCommandKillsACommandThatIgnoresSIGTERM sees timeout's 124
          # instead of the 137 its SIGKILL escalation produces. Every other
          # shard keeps the runner's own `sleep`, as tests.yml's go unit job does.
          if [ "$SHARD" = 2 ]; then
            tmpsrc="$(mktemp -d)"
            cat >"$tmpsrc/main.go" <<'EOF'
          package main

          import (
          	"math"
          	"os"
          	"strconv"
          	"strings"
          	"time"
          )

          func main() {
          	for _, arg := range os.Args[1:] {
          		if strings.HasPrefix(arg, "-") {
          			continue
          		}
          		if d, err := time.ParseDuration(arg); err == nil {
          			time.Sleep(d)
          			continue
          		}
          		s := strings.TrimSuffix(arg, "s")
          		if v, err := strconv.ParseFloat(s, 64); err == nil {
          			// `sleep infinity` (a container kept alive) blocks for
          			// good: +Inf seconds would overflow to a negative
          			// Duration and return at once.
          			if math.IsInf(v, 1) {
          				for {
          					time.Sleep(math.MaxInt64)
          				}
          			}
          			time.Sleep(time.Duration(v * float64(time.Second)))
          		}
          	}
          }
          EOF
            CGO_ENABLED=0 go build -o "$tmpsrc/sleep" "$tmpsrc/main.go"
            sudo rm -f /usr/local/bin/sleep /usr/bin/sleep
            sudo cp -f "$tmpsrc/sleep" /usr/local/bin/sleep
            sudo cp -f "$tmpsrc/sleep" /usr/bin/sleep
            sudo chmod 0755 /usr/local/bin/sleep /usr/bin/sleep
            rm -rf "$tmpsrc"
          fi
          sudo git config --system user.name "grain-ci"
          sudo git config --system user.email "grain-ci@example.com"
          git config --global user.name "grain-ci"
          git config --global user.email "grain-ci@example.com"

      - name: Fill the npm cache from the registry
        run: ./scripts/warm-npm-cache.sh ui

      - name: Long Go suite
        run: |
          set +e
          make frontend || exit 1
          case "${{ matrix.shard }}" in
            1)
              PKGS=(./pkg/ui/... ./cmd/grain/... ./ui/e2e/...)
              ;;
            2)
              PKGS=(./tests/e2e/... ./tests/deploy/...)
              ;;
            3)
              PKGS=(./pkg/orchestrator/... ./pkg/model/... ./pkg/staterepo/... ./tests/security/...)
              ;;
            4)
              mapfile -t PKGS < <(go list ./... | grep -vE '^github\.com/ai-on-gke/grain/(pkg/ui|cmd/grain|ui/e2e|tests/e2e|tests/deploy|pkg/orchestrator|pkg/model|pkg/staterepo|tests/security)(/|$)')
              ;;
          esac
          GRAIN_GOTEST_LOG=/tmp/go-long.log ./scripts/run-go-tests.sh \
            go test -race -shuffle=on -count=2 -timeout 80m "${PKGS[@]}" | tee /tmp/go-long.out
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            if ! python3 - /tmp/go-long.out go-long <<'PY'; then
          import sys
          text = open(sys.argv[1], errors="replace").read()
          title = sys.argv[2]
          emitted = 0
          for header in ("=== failing tests ===", "=== panics ===", "=== data races ==="):
              if header in text:
                  sec = text.split(header, 1)[1].split("=== per-package results ===", 1)[0]
                  blocks, cur = [], []
                  for line in sec.splitlines():
                      if line.startswith("=== ") and line.endswith(" ==="):
                          break
                      if line.startswith("--- FAIL:") or line.startswith("panic:") or line.startswith("WARNING: DATA RACE"):
                          if cur:
                              blocks.append(" | ".join(cur)[:900])
                          cur = [line.strip()]
                      elif line.strip():
                          cur.append(line.strip())
                  if cur:
                      blocks.append(" | ".join(cur)[:900])
                  for b in blocks[:9]:
                      print(f"::error title={title}::{b}")
                      emitted += 1
          if emitted == 0 and "=== per-package results ===" in text:
              sec = text.split("=== per-package results ===", 1)[1]
              for line in sec.splitlines():
                  if line.strip().startswith("FAIL"):
                      print(f"::error title={title}::{line.strip()}")
                      emitted += 1
          sys.exit(0 if emitted > 0 else 1)
          PY
              grep -aE -- '--- FAIL:|^FAIL[[:space:]]|_test\.go:[0-9]+:' /tmp/go-long.log | tail -n 10 | while IFS= read -r line; do
                echo "::error title=go-long::$line"
              done
            fi
            exit "$status"
          fi

      - name: Upload go-long test log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-long-log-${{ matrix.shard }}
          path: /tmp/go-long.log
          if-no-files-found: ignore
          retention-days: 7

  staterepo-soak:
    name: state repository soak
    needs: [idle-gate]
    if: needs.idle-gate.outputs.run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',staterepo-soak,'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: ${{ github.workflow }}-staterepo-soak-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Require git
        run: |
          sudo git config --system user.name "grain-ci"
          sudo git config --system user.email "grain-ci@example.com"
          git config --global user.name "grain-ci"
          git config --global user.email "grain-ci@example.com"
          git --version

      - name: Soak
        run: |
          set +e
          make soak 2>&1 | tee /tmp/soak.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -aE -- '--- FAIL:|^FAIL[[:space:]]|_test\.go:[0-9]+:' /tmp/soak.log | tail -n 10 | while IFS= read -r line; do
              echo "::error title=staterepo-soak::$line"
            done
            exit "$status"
          fi

  grant-matrix-ui:
    name: grant matrix through the UI
    needs: [idle-gate]
    if: needs.idle-gate.outputs.run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',grant-matrix-ui,'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-grant-matrix-ui-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache npm and node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.npm
            ui/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Fill the npm cache from the registry
        run: ./scripts/warm-npm-cache.sh ui

      - name: Install Playwright browsers
        run: |
          sudo mkdir -p /var/cache/playwright
          sudo chown -R "$USER:$USER" /var/cache/playwright
          make frontend playwright-browsers

      # Every capability method through the real Add grant… form
      # (ui/e2e/grant-matrix-ui.spec.js, grain/task-4401); the API half
      # of the same matrix runs in ui e2e on every pull request.
      - name: Grant matrix
        env:
          GRANT_MATRIX_UI: "1"
          GRANT_MATRIX_OUT: /tmp/grant-matrix-ui.json
          GRANT_MATRIX_SHOTS: /tmp/grant-matrix-shots
        run: cd ui && npx playwright test e2e/grant-matrix-ui.spec.js --project=chromium

      - name: Upload grant matrix results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grant-matrix-ui
          path: |
            /tmp/grant-matrix-ui.json
            /tmp/grant-matrix-shots
          if-no-files-found: ignore

  loadtest:
    name: sustained load
    needs: [idle-gate]
    if: needs.idle-gate.outputs.run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',loadtest,'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: ${{ github.workflow }}-loadtest-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache npm and node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.npm
            ui/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install sandbox guest dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bubblewrap expect zstd socat psmisc
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo git config --system user.name "grain-ci"
          sudo git config --system user.email "grain-ci@example.com"
          git config --global user.name "grain-ci"
          git config --global user.email "grain-ci@example.com"

      - name: Fill the npm cache from the registry
        run: ./scripts/warm-npm-cache.sh ui

      - name: Load test
        run: |
          set +e
          make loadtest 2>&1 | tee /tmp/loadtest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -aE -- '--- FAIL:|^FAIL[[:space:]]|_test\.go:[0-9]+:' /tmp/loadtest.log | tail -n 10 | while IFS= read -r line; do
              echo "::error title=loadtest::$line"
            done
            exit "$status"
          fi

  scalability:
    name: metadata and model scalability
    needs: [idle-gate]
    if: needs.idle-gate.outputs.run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',scalability,'))
