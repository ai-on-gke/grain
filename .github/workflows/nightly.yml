            grep -- "--- SKIP" /tmp/installer-hostmode.log >&2
            echo "::error title=installer-variants::tests/installer/hostmode skipped a test"
            echo "tests/installer/hostmode skipped a test in a runner that has everything it asks for: a skip here is this commit's verdict quietly not existing, which is what this job is for." >&2
            exit 1
          fi
