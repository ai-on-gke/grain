          key: npm-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Prepare Playwright browser cache directory
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo mkdir -p /var/cache/playwright
          sudo chown -R "$USER:$USER" /var/cache/playwright

