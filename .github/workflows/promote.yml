# GitHub Actions port of .grain/workflows/promote.yml.
#
# Keeps this repository's `vX.Y.Z` and `latest` GitHub releases aligned with
# the git `latest` tag by running `scripts/release-assets.sh promote`: the
# commit's `sha-<short>` release assets (the tarballs the release job built
# and tested) are published again under the release's name, with only
# images.json's version and createdAt changed (docs/release-assets.md).
# Nothing is rebuilt and no registry is written to.

name: promote

on:
  push:
    branches: [main, candidate]
  release:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional vX.Y.Z release tag to promote (defaults to the release named by git tag 'latest')"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Verify the promotion plan without writing any release (always true on non-main refs)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  GOFLAGS: -mod=readonly
  RELEASE_ASSETS_DIR: /tmp/release-assets

jobs:
  latest:
    name: promote release images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-latest-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a patch tag that did not come from its release branch
        # Whatever this run would publish as vX.Y.Z (Z >= 1) -- the tag it
        # runs on, the version asked for, or the release `latest` names --
        # must have been cut on release/vX.Y.Z from vX.Y.<Z-1>, or carry
        # nothing but fix: commits past vX.Y.0
        # (docs/release-candidate-management.md, section 9).
        env:
          PROMOTE_VERSION: ${{ inputs.version }}
        run: bash ./scripts/patch-tag-guard.sh --latest "${GITHUB_REF:-}" "${PROMOTE_VERSION:-}"

      - name: Resolve release context and dry-run mode
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          GH_REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          case "${GITHUB_REF:-}" in
            refs/heads/main|refs/heads/candidate|refs/tags/v*)
              is_release_ref=true
              ;;
            *)
              is_release_ref=false
              ;;
          esac

          dry_run="${INPUT_DRY_RUN:-}"
          if [ "$is_release_ref" != "true" ] && [ "${GITHUB_EVENT_NAME:-}" != "release" ]; then
            dry_run="true"
          elif [ -z "$dry_run" ]; then
            dry_run="false"
          fi
          {
            echo "GRAIN_CI_REPO=${GITHUB_REPOSITORY}"
            echo "GRAIN_CI_COMMIT=${GITHUB_SHA}"
            echo "GRAIN_CI_REF=${GH_REF_NAME}"
            echo "DRY_RUN=${dry_run}"
          } >> "$GITHUB_ENV"
          echo "Resolved GRAIN_CI_REF=${GH_REF_NAME} DRY_RUN=${dry_run}"

      - name: Publish the last promoted release as latest
        env:
          PROMOTE_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          args=()
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          args+=(promote)
          if [ -n "${PROMOTE_VERSION:-}" ]; then
            args+=("${PROMOTE_VERSION}")
          fi
          bash ./scripts/release-assets.sh "${args[@]}"
