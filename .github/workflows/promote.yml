# GitHub Actions port of .grain/workflows/promote.yml.
#
# Keeps the `:latest` and `:vX.Y.Z` image tags on `docker.io/grainai/*`
# aligned with the git `latest` tag by running `scripts/release-images.sh promote`,
# and the `vX.Y.Z` GitHub release's assets (and GitHub's latest-release
# marker) with it by running `scripts/release-assets.sh promote`, and puts
# the release's grain CLI archives on it (`scripts/build-cli.sh`, then
# `scripts/release-assets.sh cli-publish`).

name: promote

on:
  push:
    branches: [main, candidate]
  release:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional vX.Y.Z release tag to promote (defaults to the release named by git tag 'latest')"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Verify promotion plan without pushing tags to the registry (always true on non-main refs)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  RELEASE_IMAGE_REPO: ${{ vars.RELEASE_IMAGE_REPO }}

jobs:
  # A promoted commit whose release run a newer merge superseded has no
  # sha- images. On a tag or a dispatch -- which is when a release can
  # name such a commit -- this job has release.yml build, test and
  # publish it (`workflow_dispatch` with commit=<sha>) and waits, before
  # `latest` promotes it (grain/task-3334). It is a job of its own so the
  # token that can dispatch workflows (`actions: write`) is held only
  # here: never on the push to main or candidate that runs this workflow
  # on every merge, and never beside the registry credentials `latest`
  # publishes with. It reads the registry anonymously and pushes nothing.
  on-demand:
    name: build the release on demand
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # Room for release.yml's 120 minutes.
    timeout-minutes: 180
    permissions:
      # actions: write dispatches release.yml for an on-demand build.
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a patch tag that did not come from its release branch
        env:
          PROMOTE_VERSION: ${{ inputs.version }}
        run: bash ./scripts/patch-tag-guard.sh --latest "${GITHUB_REF:-}" "${PROMOTE_VERSION:-}"

      - name: Build the promoted commit on demand if it has no images
        env:
          PROMOTE_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          GH_REF_NAME: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          PACKAGE_PUBLISH_REGISTRY: ${{ vars.PACKAGE_PUBLISH_REGISTRY }}
          RELEASE_ON_DEMAND_BUILD: dispatch
        run: |
          set -euo pipefail
          export GRAIN_CI_REPO="${GITHUB_REPOSITORY}" GRAIN_CI_COMMIT="${GITHUB_SHA}" GRAIN_CI_REF="${GH_REF_NAME}"
          args=(on-demand)
          if [ -n "${PROMOTE_VERSION:-}" ]; then
            args+=("${PROMOTE_VERSION}")
          fi
          # The same dry-run rule as `latest` below.
          case "${GITHUB_REF:-}" in
            refs/heads/main|refs/heads/candidate|refs/tags/v*) is_release_ref=true ;;
            *) is_release_ref=false ;;
          esac
          if [ "${INPUT_DRY_RUN:-}" = "true" ] ||
             { [ "$is_release_ref" != "true" ] && [ "${GITHUB_EVENT_NAME:-}" != "release" ]; }; then
            bash ./scripts/release-images.sh --dry-run "${args[@]}"
          else
            bash ./scripts/release-images.sh "${args[@]}"
          fi

  latest:
    name: promote release images
    needs: on-demand
    # On a push on-demand is skipped, and a commit with no images fails
    # here naming what is missing, as it always did.
    if: ${{ !cancelled() && (needs.on-demand.result == 'success' || needs.on-demand.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    concurrency:
      group: ${{ github.workflow }}-latest-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a patch tag that did not come from its release branch
        # Whatever this run would publish as vX.Y.Z (Z >= 1) -- the tag it
        # runs on, the version asked for, or the release `latest` names --
        # must have been cut on release/vX.Y.Z from vX.Y.<Z-1>, or carry
        # nothing but fix: commits past vX.Y.0
        # (docs/release-candidate-management.md, section 9).
        env:
          PROMOTE_VERSION: ${{ inputs.version }}
        run: bash ./scripts/patch-tag-guard.sh --latest "${GITHUB_REF:-}" "${PROMOTE_VERSION:-}"

      - name: Cache Go modules and build cache
        # zizmor: ignore[cache-poisoning]
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Node.js
        # zizmor: ignore[cache-poisoning]
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache npm and node_modules
        # zizmor: ignore[cache-poisoning]
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.npm
            ui/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Resolve release context and dry-run mode
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          GH_REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          case "${GITHUB_REF:-}" in
            refs/heads/main|refs/heads/candidate|refs/tags/v*)
              is_release_ref=true
              ;;
            *)
              is_release_ref=false
              ;;
          esac

          dry_run="${INPUT_DRY_RUN:-}"
          if [ "$is_release_ref" != "true" ] && [ "${GITHUB_EVENT_NAME:-}" != "release" ]; then
            dry_run="true"
          elif [ -z "$dry_run" ]; then
            dry_run="false"
          fi
          {
            echo "GRAIN_CI_REPO=${GITHUB_REPOSITORY}"
            echo "GRAIN_CI_COMMIT=${GITHUB_SHA}"
            echo "GRAIN_CI_REF=${GH_REF_NAME}"
            echo "DRY_RUN=${dry_run}"
          } >> "$GITHUB_ENV"
          echo "Resolved GRAIN_CI_REF=${GH_REF_NAME} DRY_RUN=${dry_run}"

      - name: Authenticate to Google Cloud (WIF)
        if: vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_EMAIL != ''
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Configure Artifact Registry Docker authentication
        if: vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_EMAIL != ''
        run: gcloud auth configure-docker us-docker.pkg.dev --quiet

      - name: Configure package-publish credentials
        if: env.DRY_RUN != 'true'
        env:
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_TOKEN }}
          PUBLISH_REGISTRY: ${{ vars.PACKAGE_PUBLISH_REGISTRY }}
        run: bash ./scripts/configure-dockerhub-auth.sh

      - name: Configure optional image-signing key
        if: env.DRY_RUN != 'true'
        env:
          SIGNING_KEY_PEM: ${{ secrets.IMAGE_SIGNING_KEY }}
          SIGNING_KEY_PASS: ${{ secrets.IMAGE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY_PEM:-}" ]; then
            echo "WARNING: IMAGE_SIGNING_KEY secret is not set; promoted release images will be published unsigned." >&2
            exit 0
          fi
          if ! command -v cosign >/dev/null 2>&1; then
            cosign_version="v2.6.5"
            if ! curl -4 -fsSL --max-time 60 --retry 2 --retry-max-time 45 --retry-connrefused --retry-all-errors \
              "https://github.com/sigstore/cosign/releases/download/${cosign_version}/cosign-linux-amd64" \
              -o /usr/local/bin/cosign; then
              rm -f /usr/local/bin/cosign
              cosign_image="ghcr.io/sigstore/cosign/cosign:v2.6.5@sha256:ad281047f85c5e1fc6ffbc30c2b55be3b07b4032bef715a12122ce5829619aca"
              docker pull "$cosign_image"
              cid="$(docker create "$cosign_image")"
              docker cp "$cid:/ko-app/cosign" /usr/local/bin/cosign
              docker rm "$cid" >/dev/null
              echo "8d5b7d0097b61a89161ef7ac4f169879bf6de798af1be431b595bb552b235d48  /usr/local/bin/cosign" | sha256sum -c -
            else
              echo "c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644  /usr/local/bin/cosign" | sha256sum -c -
            fi
            chmod +x /usr/local/bin/cosign
          fi
          key_file="${RUNNER_TEMP}/image-signing.key"
          printf '%s\n' "${SIGNING_KEY_PEM}" > "$key_file"
          chmod 600 "$key_file"
          pass_file="${RUNNER_TEMP}/image-signing.pass"
          printf '%s' "${SIGNING_KEY_PASS:-}" > "$pass_file"
          chmod 600 "$pass_file"
          {
            echo "IMAGE_SIGNING_KEY=${key_file}"
            echo "IMAGE_SIGNING_PASSWORD_FILE=${pass_file}"
          } >> "$GITHUB_ENV"

      - name: Publish the last promoted release as latest
        env:
          PROMOTE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          args=(promote)
          if [ -n "${PROMOTE_VERSION:-}" ]; then
            args+=("${PROMOTE_VERSION}")
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            bash ./scripts/release-images.sh --dry-run "${args[@]}"
          else
            bash ./scripts/release-images.sh "${args[@]}"
          fi

  # The same promotion as release assets (scripts/release-assets.sh,
  # release-asset contract v2, docs/release-assets.md): vX.Y.Z gets its
  # own copies of its commit's sha-<12 hex> tarballs and images.json, and
  # is marked GitHub's latest release when the git tag latest names it.
  # A job of its own so `contents: write` is held by nothing but
  # release-assets.sh -- no build, no registry credential.
  assets:
    name: promote release assets
    needs: on-demand
    if: ${{ !cancelled() && (needs.on-demand.result == 'success' || needs.on-demand.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-assets-${{ github.ref }}
      cancel-in-progress: false
    env:
      RELEASE_ASSETS_DIR: /tmp/release-assets
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a patch tag that did not come from its release branch
        env:
          PROMOTE_VERSION: ${{ inputs.version }}
        run: bash ./scripts/patch-tag-guard.sh --latest "${GITHUB_REF:-}" "${PROMOTE_VERSION:-}"

      - name: Promote the release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          PROMOTE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "${GITHUB_REF:-}" in
            refs/heads/main|refs/heads/candidate|refs/tags/v*) is_release_ref=true ;;
            *) is_release_ref=false ;;
          esac
          dry_run="${INPUT_DRY_RUN:-}"
          if [ "$is_release_ref" != "true" ] && [ "${GITHUB_EVENT_NAME:-}" != "release" ]; then
            dry_run="true"
          fi
          args=()
          if [ "${dry_run}" = "true" ]; then
            args+=(--dry-run)
          fi
          args+=(promote)
          if [ -n "${PROMOTE_VERSION:-}" ]; then
            args+=("${PROMOTE_VERSION}")
          fi
          bash ./scripts/release-assets.sh "${args[@]}"

  # The grain CLI GET /cli/install.sh fetches off the promoted release
  # (pkg/ui/cli_install.sh): scripts/build-cli.sh's four
  # grain-<os>-<arch>.tar.gz archives and their checksums.txt, built from
  # the release's tag and stamped with its version as the daemon is. Built
  # in a job holding nothing but `contents: read`, and skipped once the
  # release carries its checksums.txt -- which is every push to main or
  # candidate after the first.
  cli:
    name: build the release's grain CLI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      build: ${{ steps.release.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a patch tag that did not come from its release branch
        env:
          PROMOTE_VERSION: ${{ inputs.version }}
        run: bash ./scripts/patch-tag-guard.sh --latest "${GITHUB_REF:-}" "${PROMOTE_VERSION:-}"

      - name: Resolve the release and whether it still needs its CLI
        id: release
        env:
          PROMOTE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # promote-version prints nothing but a vX.Y.Z.
          version="$(bash ./scripts/release-assets.sh promote-version "${PROMOTE_VERSION:-}")"
          build=true
          # The probes' stderr goes to /dev/null: a 404 is an answer here,
          # not an error, and curl's "(22) ... error: 404" lines only hid
          # the reason this step logs below.
          if curl -fsSIL -o /dev/null "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${version}/checksums.txt" 2>/dev/null; then
            echo "promote: ${version} already carries the grain CLI"
            build=false
          elif [ -n "${PROMOTE_VERSION:-}" ]; then
            echo "promote: building the grain CLI for ${version}: asked for by name, and it carries no checksums.txt"
          else
            commit="$(git rev-parse "refs/tags/${version}^{commit}")"
            sha_release="sha-${commit:0:12}"
            status="$(curl -fsSIL -o /dev/null -w '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${version}" 2>/dev/null || true)"
            if [ "$status" = "200" ]; then
              echo "promote: building the grain CLI for ${version}: its GitHub Release exists and carries no checksums.txt"
            elif [ "$status" != "404" ]; then
              echo "promote: building the grain CLI for ${version}: the GitHub API answered ${status:-nothing} for releases/tags/${version}, so whether it exists is unknown"
            elif curl -fsSIL -o /dev/null "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${sha_release}/images.json" 2>/dev/null; then
              echo "promote: building the grain CLI for ${version}: GitHub Release ${version} does not exist yet, but ${sha_release} has the release assets the assets job creates it from"
            else
              echo "promote: GitHub Release ${version} does not exist and ${sha_release} has no release assets to create it; skipping grain CLI build"
              build=false
            fi
          fi
          {
            echo "version=${version}"
            echo "build=${build}"
          } >> "$GITHUB_OUTPUT"

      - name: Cache Go modules and build cache
        if: steps.release.outputs.build == 'true'
        # zizmor: ignore[cache-poisoning]
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        if: steps.release.outputs.build == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build the grain CLI
        if: steps.release.outputs.build == 'true'
        env:
          RELEASE: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          bash ./scripts/build-cli.sh --ref "refs/tags/${RELEASE}" "${RUNNER_TEMP}/release-cli"
          bash ./scripts/release-assets.sh cli-validate "${RUNNER_TEMP}/release-cli"

      - name: Hand the archives to cli-assets
        if: steps.release.outputs.build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grain-cli
          path: |
            ${{ runner.temp }}/release-cli/*.tar.gz
            ${{ runner.temp }}/release-cli/checksums.txt
          if-no-files-found: error
          retention-days: 1

  # Uploads what cli built to the vX.Y.Z release the assets job promoted
  # (scripts/release-assets.sh cli-publish): the archives, then
  # checksums.txt, never replacing a release that carries one. On a push,
  # a release that predates release assets -- which promote skips -- is
  # skipped here too (RELEASE_CLI_SKIP_UNRELEASED); asked for by name, it
  # fails.
  cli-assets:
    name: publish the release's grain CLI
    needs: [cli, assets]
    if: ${{ !cancelled() && needs.cli.result == 'success' && needs.assets.result == 'success' && needs.cli.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # One group per release, shared by promote.yml, promote-release.yml,
    # publish-release.yml and release-train-assets.yml (concurrency groups
    # span a repository's workflows): cli-publish replaces archives left
    # without checksums.txt, so two runs uploading to the same release at
    # once could leave one run's archive beside the other's checksums.txt.
    concurrency:
      group: grain-cli-assets-${{ needs.cli.outputs.version }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the archives cli built
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: grain-cli
          path: ${{ runner.temp }}/release-cli

      - name: Publish the grain CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          PROMOTE_VERSION: ${{ inputs.version }}
          RELEASE_VERSION: ${{ needs.cli.outputs.version }}
        run: |
          set -euo pipefail
          # The same dry-run rule as the assets job.
          case "${GITHUB_REF:-}" in
            refs/heads/main|refs/heads/candidate|refs/tags/v*) is_release_ref=true ;;
            *) is_release_ref=false ;;
          esac
          dry_run="${INPUT_DRY_RUN:-}"
          if [ "$is_release_ref" != "true" ] && [ "${GITHUB_EVENT_NAME:-}" != "release" ]; then
            dry_run="true"
          fi
          args=()
          if [ "${dry_run}" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ -z "${PROMOTE_VERSION:-}" ]; then
            export RELEASE_CLI_SKIP_UNRELEASED=true
          fi
          bash ./scripts/release-assets.sh "${args[@]}" cli-publish "${RELEASE_VERSION}" "${RUNNER_TEMP}/release-cli"

  agentd:
    name: build the release's grain-agentd
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      build: ${{ steps.release.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a patch tag that did not come from its release branch
        env:
          PROMOTE_VERSION: ${{ inputs.version }}
        run: bash ./scripts/patch-tag-guard.sh --latest "${GITHUB_REF:-}" "${PROMOTE_VERSION:-}"

      - name: Resolve the release and whether it still needs grain-agentd
        id: release
        env:
          PROMOTE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(bash ./scripts/release-assets.sh promote-version "${PROMOTE_VERSION:-}")"
          build=true
          if curl -fsSIL -o /dev/null "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${version}/grain-agentd-linux-amd64.manifest.json" 2>/dev/null &&
             curl -fsSIL -o /dev/null "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${version}/grain-agentd-linux-arm64.manifest.json" 2>/dev/null; then
            echo "promote: ${version} already carries grain-agentd"
            build=false
          elif [ -n "${PROMOTE_VERSION:-}" ]; then
            echo "promote: building grain-agentd for ${version}: asked for by name, and it carries no grain-agentd manifests"
          else
            commit="$(git rev-parse "refs/tags/${version}^{commit}")"
            sha_release="sha-${commit:0:12}"
            status="$(curl -fsSIL -o /dev/null -w '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${version}" 2>/dev/null || true)"
            if [ "$status" = "200" ]; then
              echo "promote: building grain-agentd for ${version}: its GitHub Release exists and carries no grain-agentd manifests"
            elif [ "$status" != "404" ]; then
              echo "promote: building grain-agentd for ${version}: the GitHub API answered ${status:-nothing} for releases/tags/${version}"
            elif curl -fsSIL -o /dev/null "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${sha_release}/images.json" 2>/dev/null; then
              echo "promote: building grain-agentd for ${version}: GitHub Release ${version} does not exist yet, but ${sha_release} has release assets"
            else
              echo "promote: GitHub Release ${version} does not exist and ${sha_release} has no release assets; skipping grain-agentd build"
              build=false
            fi
          fi
          {
            echo "version=${version}"
            echo "build=${build}"
          } >> "$GITHUB_OUTPUT"

      - name: Cache Go modules and build cache
        if: steps.release.outputs.build == 'true'
        # zizmor: ignore[cache-poisoning]
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        if: steps.release.outputs.build == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build grain-agentd
        if: steps.release.outputs.build == 'true'
        env:
          RELEASE: ${{ steps.release.outputs.version }}
          AGENTD_RELEASE_PUBLIC_KEY: ${{ vars.AGENTD_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          bash ./scripts/build-agentd.sh --ref "refs/tags/${RELEASE}" "${RUNNER_TEMP}/release-agentd"
          bash ./scripts/release-assets.sh agentd-validate "${RUNNER_TEMP}/release-agentd"

      - name: Hand grain-agentd to agentd-assets
        if: steps.release.outputs.build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grain-agentd
          path: |
            ${{ runner.temp }}/release-agentd/grain-agentd-*
          if-no-files-found: error
          retention-days: 1

  agentd-assets:
    name: publish the release's grain-agentd
    needs: [agentd, assets]
    if: ${{ !cancelled() && needs.agentd.result == 'success' && needs.assets.result == 'success' && needs.agentd.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: grain-agentd-assets-${{ needs.agentd.outputs.version }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch grain-agentd built by agentd
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: grain-agentd
          path: ${{ runner.temp }}/release-agentd

      - name: Sign and publish grain-agentd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          PROMOTE_VERSION: ${{ inputs.version }}
          RELEASE_VERSION: ${{ needs.agentd.outputs.version }}
          SIGNING_KEY_PEM: ${{ secrets.AGENTD_RELEASE_SIGNING_KEY }}
          AGENTD_RELEASE_PUBLIC_KEY: ${{ vars.AGENTD_RELEASE_PUBLIC_KEY }}
          ROTATIONS_JSON: ${{ vars.AGENTD_RELEASE_ROTATIONS }}
          REQUIRE_AGENTD_SIGNING: ${{ vars.REQUIRE_AGENTD_SIGNING }}
        run: |
          set -euo pipefail
          case "${GITHUB_REF:-}" in
            refs/heads/main|refs/heads/candidate|refs/tags/v*) is_release_ref=true ;;
            *) is_release_ref=false ;;
          esac
          dry_run="${INPUT_DRY_RUN:-}"
          if [ "$is_release_ref" != "true" ] && [ "${GITHUB_EVENT_NAME:-}" != "release" ]; then
            dry_run="true"
          fi
          key_file=""
          rot_file=""
          cleanup() { rm -f "${key_file}" "${rot_file}"; }
          trap cleanup EXIT
          if [ "${dry_run}" != "true" ] && [ -n "${SIGNING_KEY_PEM:-}" ]; then
            key_file="${RUNNER_TEMP}/agentd-signing.key"
            printf '%s\n' "${SIGNING_KEY_PEM}" > "${key_file}"
            chmod 600 "${key_file}"
            export AGENTD_RELEASE_SIGNING_KEY="${key_file}"
          fi
          if [ "${dry_run}" != "true" ] && [ -n "${ROTATIONS_JSON:-}" ]; then
            rot_file="${RUNNER_TEMP}/agentd-rotations.json"
            printf '%s\n' "${ROTATIONS_JSON}" > "${rot_file}"
            export AGENTD_RELEASE_ROTATIONS="${rot_file}"
          fi
          args=()
          if [ "${dry_run}" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ -z "${PROMOTE_VERSION:-}" ]; then
            export RELEASE_AGENTD_SKIP_UNRELEASED=true
          fi
          bash ./scripts/release-assets.sh agentd-sign "${RUNNER_TEMP}/release-agentd"
          bash ./scripts/release-assets.sh "${args[@]}" agentd-publish "${RELEASE_VERSION}" "${RUNNER_TEMP}/release-agentd"
