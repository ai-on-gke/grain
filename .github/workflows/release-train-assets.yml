# Publishes the release train's names as GitHub release assets
# (docs/release-assets.md) when the train pushes their git tags. The train
# itself -- the grain task .grain/templates/release-train.yml files -- runs
# with RELEASE_IMAGES=off and publishes nothing; what it pushes is tags:
#
#   vX.Y.Z-rc.N            -> release vX.Y.Z-rc.N, and channel-candidate when
#                             it is the newest rc
#   vX.Y.Z-pending         -> release vX.Y.Z-pending (version vX.Y.Z)
#   vX.Y.Z-rc.N-discarded  -> release vX.Y.Z-rc.N-discarded
#   vX.Y.Z-retracted       -> release vX.Y.Z-retracted
#
# Each is the sha-<short> release.yml published for the tag's commit, with
# only images.json's version and createdAt changed: nothing is built here.
# vX.Y.Z and latest are promote.yml's and promote-release.yml's.

name: release-train-assets

on:
  push:
    tags:
      - "v*-rc.*"
      - "v*-pending"
      - "v*-retracted"
  workflow_dispatch:
    inputs:
      tag:
        description: "The release-train tag to publish (vX.Y.Z-rc.N, vX.Y.Z-pending, vX.Y.Z-rc.N-discarded, vX.Y.Z-retracted)"
        required: true
        type: string
      dry_run:
        description: "Plan the release writes without making them"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    name: publish release-train assets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-candidate
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish the tag's release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_ASSETS_DIR: /tmp/release-assets
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi
          # Only the train's own names: never vX.Y.Z or latest, which are
          # promote-release.yml's (release-assets.sh train-tag refuses
          # them too).
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(rc\.[0-9]+(-discarded)?|pending|retracted)$ ]]; then
            echo "release-train-assets: '$tag' is not a release-train tag" >&2
            exit 1
          fi
          args=()
          # A dispatch from any ref but main (or a tag push) plans only, so
          # trying a branch out never writes the repository's releases --
          # the same rule release.yml and promote-release.yml keep.
          case "${GITHUB_REF:-}" in
            refs/heads/main | refs/tags/v*) ;;
            *) INPUT_DRY_RUN=true ;;
          esac
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then
            args+=(--dry-run)
          fi
          bash ./scripts/release-assets.sh "${args[@]}" train-tag "$tag"
