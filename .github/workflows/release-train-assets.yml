# Publishes the release train's names as GitHub release assets
# (docs/release-assets.md) and Docker Hub container images
# (`docker.io/grainai/*`, scripts/release-images.sh) when the train pushes
# their git tags. The train itself -- the grain task
# .grain/templates/release-train.yml files -- runs with RELEASE_IMAGES=off
# and publishes nothing; what it pushes is tags:
#
#   vX.Y.Z-rc.N            -> GitHub Release vX.Y.Z-rc.N (and channel-candidate
#                             when newest rc), plus container images
#                             :vX.Y.Z-rc.N (and :candidate and :rc when newest
#                             rc)
#   vX.Y.Z-pending         -> GitHub Release vX.Y.Z-pending and container
#                             images :vX.Y.Z-pending (stamped vX.Y.Z)
#   vX.Y.Z-rc.N-discarded  -> GitHub Release vX.Y.Z-rc.N-discarded and
#                             :vX.Y.Z-rc.N-discarded image markers
#   vX.Y.Z-retracted       -> GitHub Release vX.Y.Z-retracted and
#                             :vX.Y.Z-retracted image markers
#
# `publish` retags the sha-<short> GitHub release assets with `contents: write`
# alone; `images` runs `scripts/release-images.sh train-tag` with
# `packages: write` and `id-token: write` alone (no `contents: write`, no
# `actions: write`, no `agentd-release` environment), rebuilding only the
# stamped daemon images from the already-tested `:sha-<short>` builds and
# retagging the sandbox images.
#
# An rc (vX.Y.Z-rc.N, not -discarded) also gets the grain CLI its daemon's
# GET /cli/install.sh fetches: the cli job builds scripts/build-cli.sh's
# four archives and checksums.txt from the tag, stamped with the rc as its
# daemon is, holding nothing but `contents: read`; cli-assets uploads them
# once publish has published the rc's release
# (scripts/release-assets.sh cli-publish).
# vX.Y.Z and latest are promote.yml's, promote-release.yml's and
# publish-release.yml's: both `release-assets.sh train-tag` and
# `release-images.sh train-tag` (and the `images` job's own tag check) refuse
# them, so neither a tag push nor a dispatch here promotes a release. Both
# also refuse a tag that has not been pushed -- publishing a release on a
# missing tag creates it -- so a dispatch cannot plant the -discarded or
# -retracted markers release-from-trunk.sh or pkg/upgrade read.

name: release-train-assets

on:
  push:
    tags:
      - "v*-rc.*"
      - "v*-pending"
      - "v*-retracted"
  workflow_dispatch:
    inputs:
      tag:
        description: "The release-train tag to publish (vX.Y.Z-rc.N, vX.Y.Z-pending, vX.Y.Z-rc.N-discarded, vX.Y.Z-retracted)"
        required: true
        type: string
      dry_run:
        description: "Plan the release writes without making them"
        required: false
        default: false
        type: boolean

# Nothing at the workflow level: `contents: write` is held by the jobs
# that run release-assets.sh, and `packages: write` / `id-token: write`
# only by `images`, as in release.yml and promote.yml.
permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  RELEASE_IMAGE_REPO: ${{ vars.RELEASE_IMAGE_REPO }}

jobs:
  publish:
    name: publish release-train assets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-candidate
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish the tag's release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_ASSETS_DIR: /tmp/release-assets
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi
          args=()
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then
            args+=(--dry-run)
          fi
          bash ./scripts/release-assets.sh "${args[@]}" train-tag "$tag"

  # Publishes the train tag's container images to Docker Hub (`docker.io/grainai/*`)
  # via scripts/release-images.sh train-tag: `:vX.Y.Z-rc.N`, `:candidate` and
  # `:rc` on an rc cut, `:vX.Y.Z-rc.N-discarded` on discard, `:vX.Y.Z-pending`
  # on staging, and `:vX.Y.Z-retracted` on rollback. Kept separate from
  # `publish`, `cli-assets` and `agentd-assets` so registry credentials and
  # image-signing keys never sit beside `contents: write` or
  # `AGENTD_RELEASE_SIGNING_KEY`.
  images:
    name: publish release-train images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    concurrency:
      group: ${{ github.workflow }}-images-candidate
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release-train tag and dry-run mode
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi
          # Validate before writing to $GITHUB_ENV (blocks newlines and
          # promoted release tags such as vX.Y.Z or latest at the workflow gate).
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+(-discarded)?|-pending|-retracted)$ ]]; then
            echo "release-train-assets: ${tag@Q} is not a release-train tag (vX.Y.Z-rc.N, vX.Y.Z-rc.N-discarded, vX.Y.Z-pending, vX.Y.Z-retracted)" >&2
            exit 1
          fi

          # Non-release refs (e.g. a workflow_dispatch from a feature branch)
          # always run dry and never receive publishing or signing credentials.
          case "${GITHUB_REF:-}" in
            refs/heads/main|refs/tags/v*-rc.*|refs/tags/v*-pending|refs/tags/v*-retracted)
              is_release_ref=true
              ;;
            *)
              is_release_ref=false
              ;;
          esac

          dry_run="${INPUT_DRY_RUN:-}"
          if [ "$is_release_ref" != "true" ]; then
            dry_run="true"
          elif [ -z "$dry_run" ]; then
            dry_run="false"
          fi
          {
            echo "GRAIN_CI_REPO=${GITHUB_REPOSITORY}"
            echo "GRAIN_CI_COMMIT=${GITHUB_SHA}"
            echo "GRAIN_CI_REF=${tag}"
            echo "TRAIN_TAG=${tag}"
            echo "DRY_RUN=${dry_run}"
          } >> "$GITHUB_ENV"
          echo "Resolved TRAIN_TAG=${tag} DRY_RUN=${dry_run}"

      - name: Authenticate to Google Cloud (WIF)
        if: env.DRY_RUN != 'true' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_EMAIL != ''
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Configure Artifact Registry Docker authentication
        if: env.DRY_RUN != 'true' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_EMAIL != ''
        run: gcloud auth configure-docker us-docker.pkg.dev --quiet

      - name: Configure package-publish credentials
        if: env.DRY_RUN != 'true'
        env:
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_TOKEN }}
          PUBLISH_REGISTRY: ${{ vars.PACKAGE_PUBLISH_REGISTRY }}
        run: bash ./scripts/configure-dockerhub-auth.sh

      - name: Configure optional image-signing key
        if: env.DRY_RUN != 'true'
        env:
          SIGNING_KEY_PEM: ${{ secrets.IMAGE_SIGNING_KEY }}
          SIGNING_KEY_PASS: ${{ secrets.IMAGE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY_PEM:-}" ]; then
            echo "WARNING: IMAGE_SIGNING_KEY secret is not set; release-train images will be published unsigned." >&2
            exit 0
          fi
          if ! command -v cosign >/dev/null 2>&1; then
            cosign_version="v3.1.4"
            if ! curl -4 -fsSL --max-time 60 --retry 2 --retry-max-time 45 --retry-connrefused --retry-all-errors \
              "https://github.com/sigstore/cosign/releases/download/${cosign_version}/cosign-linux-amd64" \
              -o /usr/local/bin/cosign; then
              rm -f /usr/local/bin/cosign
              cosign_image="ghcr.io/sigstore/cosign/cosign:v3.1.4@sha256:0f06154836d2de34f887a5c273506d52ca43edaa1d9e53e6510fa78a48f69c2d"
              docker pull "$cosign_image"
              cid="$(docker create "$cosign_image")"
              docker cp "$cid:/ko-app/cosign" /usr/local/bin/cosign
              docker rm "$cid" >/dev/null
              echo "be06b2d8da722330fa78fd7cd858a74b589b20ab314a7d901e8cefcf387c965d  /usr/local/bin/cosign" | sha256sum -c -
            else
              echo "424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa  /usr/local/bin/cosign" | sha256sum -c -
            fi
            chmod +x /usr/local/bin/cosign
          fi
          key_file="${RUNNER_TEMP}/image-signing.key"
          printf '%s\n' "${SIGNING_KEY_PEM}" > "$key_file"
          chmod 600 "$key_file"
          pass_file="${RUNNER_TEMP}/image-signing.pass"
          printf '%s' "${SIGNING_KEY_PASS:-}" > "$pass_file"
          chmod 600 "$pass_file"
          {
            echo "IMAGE_SIGNING_KEY=${key_file}"
            echo "IMAGE_SIGNING_PASSWORD_FILE=${pass_file}"
          } >> "$GITHUB_ENV"

      - name: Publish the tag's container images
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            bash ./scripts/release-images.sh --dry-run train-tag "${TRAIN_TAG}"
          else
            bash ./scripts/release-images.sh train-tag "${TRAIN_TAG}"
          fi

  cli:
    name: build the rc's grain CLI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      rc: ${{ steps.rc.outputs.rc }}
    steps:
      - name: Resolve the rc and whether it still needs its CLI
        id: rc
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi
          # Only an rc is a release a daemon reports: the markers and a
          # pending release (rebuilt as vX.Y.Z when promoted) carry none.
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "release-train-assets: ${tag@Q} is not an rc; it carries no grain CLI"
            exit 0
          fi
          if curl -fsSIL -o /dev/null "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${tag}/checksums.txt"; then
            echo "release-train-assets: ${tag} already carries the grain CLI"
            exit 0
          fi
          echo "rc=${tag}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.rc.outputs.rc != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Go modules and build cache
        if: steps.rc.outputs.rc != ''
        # zizmor: ignore[cache-poisoning]
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        if: steps.rc.outputs.rc != ''
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build the grain CLI
        if: steps.rc.outputs.rc != ''
        env:
          RELEASE: ${{ steps.rc.outputs.rc }}
        run: |
          set -euo pipefail
          bash ./scripts/build-cli.sh --ref "refs/tags/${RELEASE}" "${RUNNER_TEMP}/release-cli"
          bash ./scripts/release-assets.sh cli-validate "${RUNNER_TEMP}/release-cli"

      - name: Hand the archives to cli-assets
        if: steps.rc.outputs.rc != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grain-cli
          path: |
            ${{ runner.temp }}/release-cli/*.tar.gz
            ${{ runner.temp }}/release-cli/checksums.txt
          if-no-files-found: error
          retention-days: 1

  cli-assets:
    name: publish the rc's grain CLI
    needs: [publish, cli]
    if: needs.cli.outputs.rc != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # One group per release, shared by promote.yml, promote-release.yml,
    # publish-release.yml and release-train-assets.yml (concurrency groups
    # span a repository's workflows): cli-publish replaces archives left
    # without checksums.txt, so two runs uploading to the same release at
    # once could leave one run's archive beside the other's checksums.txt.
    concurrency:
      group: grain-cli-assets-${{ needs.cli.outputs.rc }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the archives cli built
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: grain-cli
          path: ${{ runner.temp }}/release-cli

      - name: Publish the grain CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_VERSION: ${{ needs.cli.outputs.rc }}
        run: |
          set -euo pipefail
          args=()
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then
            args+=(--dry-run)
          fi
          bash ./scripts/release-assets.sh "${args[@]}" cli-publish "${RELEASE_VERSION}" "${RUNNER_TEMP}/release-cli"

  agentd:
    name: build the rc's grain-agentd
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      rc: ${{ steps.rc.outputs.rc }}
    steps:
      - name: Resolve the rc and whether it still needs grain-agentd
        id: rc
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "release-train-assets: ${tag@Q} is not an rc; it carries no grain-agentd"
            exit 0
          fi
          if curl -fsSIL -o /dev/null "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${tag}/grain-agentd-linux-amd64.manifest.json" &&
             curl -fsSIL -o /dev/null "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${tag}/grain-agentd-linux-arm64.manifest.json"; then
            echo "release-train-assets: ${tag} already carries grain-agentd"
            exit 0
          fi
          echo "rc=${tag}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.rc.outputs.rc != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Go modules and build cache
        if: steps.rc.outputs.rc != ''
        # zizmor: ignore[cache-poisoning]
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        if: steps.rc.outputs.rc != ''
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build grain-agentd
        if: steps.rc.outputs.rc != ''
        env:
          RELEASE: ${{ steps.rc.outputs.rc }}
          AGENTD_RELEASE_PUBLIC_KEY: ${{ vars.AGENTD_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          bash ./scripts/build-agentd.sh --ref "refs/tags/${RELEASE}" "${RUNNER_TEMP}/release-agentd"
          bash ./scripts/release-assets.sh agentd-validate "${RUNNER_TEMP}/release-agentd"

      - name: Hand grain-agentd to agentd-assets
        if: steps.rc.outputs.rc != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grain-agentd
          path: |
            ${{ runner.temp }}/release-agentd/grain-agentd-*
          if-no-files-found: error
          retention-days: 1

  agentd-assets:
    name: publish the rc's grain-agentd
    needs: [publish, agentd]
    if: needs.agentd.outputs.rc != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # AGENTD_RELEASE_SIGNING_KEY is an agentd-release environment secret,
    # released only to the refs that environment's deployment rules allow
    # (docs/agentd-release-signing.md), not a repository secret any
    # workflow on any pushed branch could read.
    environment: agentd-release
    permissions:
      contents: write
    concurrency:
      group: grain-agentd-assets-${{ needs.agentd.outputs.rc }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch grain-agentd built by agentd
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: grain-agentd
          path: ${{ runner.temp }}/release-agentd

      - name: Sign and publish grain-agentd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_VERSION: ${{ needs.agentd.outputs.rc }}
          SIGNING_KEY_PEM: ${{ secrets.AGENTD_RELEASE_SIGNING_KEY }}
          AGENTD_RELEASE_PUBLIC_KEY: ${{ vars.AGENTD_RELEASE_PUBLIC_KEY }}
          ROTATIONS_JSON: ${{ vars.AGENTD_RELEASE_ROTATIONS }}
          REQUIRE_AGENTD_SIGNING: ${{ vars.REQUIRE_AGENTD_SIGNING }}
        run: |
          set -euo pipefail
          key_file=""
          rot_file=""
          cleanup() { rm -f "${key_file}" "${rot_file}"; }
          trap cleanup EXIT
          dry_run="${INPUT_DRY_RUN:-false}"
          # A dry run never writes the signing key to the runner's disk.
          if [ "${dry_run}" != "true" ] && [ -n "${SIGNING_KEY_PEM:-}" ]; then
            key_file="${RUNNER_TEMP}/agentd-signing.key"
            printf '%s\n' "${SIGNING_KEY_PEM}" > "${key_file}"
            chmod 600 "${key_file}"
            export AGENTD_RELEASE_SIGNING_KEY="${key_file}"
          fi
          if [ "${dry_run}" != "true" ] && [ -n "${ROTATIONS_JSON:-}" ]; then
            rot_file="${RUNNER_TEMP}/agentd-rotations.json"
            printf '%s\n' "${ROTATIONS_JSON}" > "${rot_file}"
            export AGENTD_RELEASE_ROTATIONS="${rot_file}"
          fi
          args=()
          if [ "${dry_run}" = "true" ]; then
            args+=(--dry-run)
          fi
          bash ./scripts/release-assets.sh "${args[@]}" agentd-sign "${RUNNER_TEMP}/release-agentd"
          bash ./scripts/release-assets.sh "${args[@]}" agentd-publish "${RELEASE_VERSION}" "${RUNNER_TEMP}/release-agentd"
