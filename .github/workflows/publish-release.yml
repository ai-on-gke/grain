# Publishes a release the continuous release train made
# (design/playbook/releases.playbook.md section 1): the train's grain task
# pushes vX.Y.0 and `latest` onto an rc that qualified, but a task holds no
# package-publish or GitHub token, so this workflow does the rest of what
# promote-release.yml's approve path does, on the tag push:
#
#   1. scripts/release-from-trunk.sh verify vX.Y.0 -- the tag names the rc
#      it was promoted from (Promoted-From:), sits on that rc's own commit,
#      the rc is not dropped, the commit is on main or release/vX.Y.0, and
#      the rc still passes Stage 1 (nightly.yml) and Stage 2
#      (grain/release-qualification, from vars.RELEASE_QUALIFICATION_APP
#      only), and none of the guards that make the train stage an rc for a
#      person instead applies. Anything else fails the run and publishes
#      nothing. A tag with no Promoted-From is not the train's: this
#      workflow publishes nothing for it -- neither images nor a GitHub
#      Release -- because nothing on a tag push can tell a person's approval
#      from any other holder of the train's tag grant;
#   2. release-images.sh promote vX.Y.0: the images re-stamped with the
#      release and tagged :vX.Y.0, and :latest when the git tag latest is on
#      it;
#   3. the GitHub Release, its body written by scripts/release-notes.sh
#      from the newest earlier vX.Y.Z;
#   4. scripts/release-assets.sh promote vX.Y.0: that release's assets --
#      copies of the commit's sha-<12 hex> tarballs and images.json
#      (docs/release-assets.md);
#   5. scripts/release-assets.sh cli-publish vX.Y.0: the grain CLI archives
#      GET /cli/install.sh fetches and their checksums.txt, which the cli
#      job builds from the tag with scripts/build-cli.sh, holding nothing
#      but `contents: read`, and which are published only once publish
#      has verified the tag as the train's.
#
# It runs on nothing but that tag push: no dispatch, no schedule.

name: publish-release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.0"

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  RELEASE_IMAGE_REPO: ${{ vars.RELEASE_IMAGE_REPO }}
  # A promoted commit whose release run a newer merge superseded has no
  # sha- images: release-images.sh dispatches release.yml with
  # commit=<sha> to build, test and publish it, and waits (grain/task-3334).
  RELEASE_ON_DEMAND_BUILD: dispatch

jobs:
  publish:
    name: publish the release the train made
    runs-on: ubuntu-latest
    # Room for an on-demand release build (release.yml's 120 minutes).
    timeout-minutes: 180
    permissions:
      # write, not read: an on-demand build dispatches release.yml.
      actions: write
      checks: read
      contents: write
      packages: write
      id-token: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref_name }}
      cancel-in-progress: false
    outputs:
      train: ${{ steps.verify.outputs.train }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        # setup-node v4 caches nothing unless `cache:` is set (the implicit
        # package-manager cache zizmor warns about arrived in v5), and this
        # step sets none.
        # zizmor: ignore[cache-poisoning]
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify the release is the train's, from a qualified rc
        id: verify
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_CI_SOURCE: github
          RELEASE_QUALIFICATION_APP: ${{ vars.RELEASE_QUALIFICATION_APP }}
        run: |
          set -euo pipefail
          if ! [[ "${RELEASE_VERSION}" =~ ^v[0-9]+\.[0-9]+\.0$ ]]; then
            echo "publish-release: ${RELEASE_VERSION@Q} is not a vX.Y.0 release" >&2
            exit 1
          fi
          status=0
          bash ./scripts/release-from-trunk.sh verify "${RELEASE_VERSION}" || status=$?
          case "$status" in
            0) echo "train=true" >> "$GITHUB_OUTPUT" ;;
            4) echo "train=false" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
          {
            echo "GRAIN_CI_REPO=${GITHUB_REPOSITORY}"
            echo "GRAIN_CI_COMMIT=${GITHUB_SHA}"
            echo "GRAIN_CI_REF=${RELEASE_VERSION}"
            echo "DRY_RUN=false"
          } >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud (WIF)
        if: steps.verify.outputs.train == 'true' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_EMAIL != ''
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Configure Artifact Registry Docker authentication
        if: steps.verify.outputs.train == 'true' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_EMAIL != ''
        run: gcloud auth configure-docker us-docker.pkg.dev --quiet

      - name: Configure package-publish credentials
        if: steps.verify.outputs.train == 'true'
        env:
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_TOKEN }}
          PUBLISH_REGISTRY: ${{ vars.PACKAGE_PUBLISH_REGISTRY }}
        run: bash ./scripts/configure-dockerhub-auth.sh

      - name: Configure optional image-signing key
        if: steps.verify.outputs.train == 'true'
        env:
          SIGNING_KEY_PEM: ${{ secrets.IMAGE_SIGNING_KEY }}
          SIGNING_KEY_PASS: ${{ secrets.IMAGE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY_PEM:-}" ]; then
            echo "WARNING: IMAGE_SIGNING_KEY secret is not set; promoted release images will be published unsigned." >&2
            exit 0
          fi
          if ! command -v cosign >/dev/null 2>&1; then
            cosign_version="v2.6.5"
            curl -fsSL "https://github.com/sigstore/cosign/releases/download/${cosign_version}/cosign-linux-amd64" \
              -o /usr/local/bin/cosign
            echo "c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644  /usr/local/bin/cosign" | sha256sum -c -
            chmod +x /usr/local/bin/cosign
          fi
          key_file="${RUNNER_TEMP}/image-signing.key"
          printf '%s\n' "${SIGNING_KEY_PEM}" > "$key_file"
          chmod 600 "$key_file"
          pass_file="${RUNNER_TEMP}/image-signing.pass"
          printf '%s' "${SIGNING_KEY_PASS:-}" > "$pass_file"
          chmod 600 "$pass_file"
          {
            echo "IMAGE_SIGNING_KEY=${key_file}"
            echo "IMAGE_SIGNING_PASSWORD_FILE=${pass_file}"
          } >> "$GITHUB_ENV"

      - name: Publish the release's images
        if: steps.verify.outputs.train == 'true'
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: bash ./scripts/release-images.sh promote "${RELEASE_VERSION}"

      - name: Write the release notes and the GitHub Release
        if: steps.verify.outputs.train == 'true'
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "publish-release: ${RELEASE_VERSION} already has a GitHub Release"
            exit 0
          fi
          prev="$(git tag -l 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V |
            awk -v v="${RELEASE_VERSION}" '$0 == v { exit } { p = $0 } END { print p }')"
          if [ -z "$prev" ]; then
            prev="$(git rev-list --max-parents=0 "${RELEASE_VERSION}" | tail -n 1)"
          fi
          bash ./scripts/release-notes.sh write --notes "${RUNNER_TEMP}/notes.md" --body "${RUNNER_TEMP}/body.md" \
            "${RELEASE_VERSION}" "$prev" "${RELEASE_VERSION}"
          latest=false
          if [ "$(git rev-parse -q --verify 'refs/tags/latest^{commit}' || true)" = "$(git rev-parse "${RELEASE_VERSION}^{commit}")" ]; then
            latest=true
          fi
          gh release create "${RELEASE_VERSION}" --verify-tag --title "${RELEASE_VERSION}" \
            --notes-file "${RUNNER_TEMP}/body.md" --latest="$latest"

      # The same release as GitHub release assets (scripts/release-assets.sh,
      # release-asset contract v2, docs/release-assets.md): copies of the
      # commit's sha-<12 hex> tarballs and an images.json on the vX.Y.0
      # release just written, marked GitHub's latest release when the git
      # tag latest names it. A release missing any asset fails the run.
      - name: Publish the release's assets
        if: steps.verify.outputs.train == 'true'
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ASSETS_DIR: ${{ runner.temp }}/release-assets
        run: bash ./scripts/release-assets.sh promote "${RELEASE_VERSION}"

  # The release's grain CLI, built from the tag (scripts/build-cli.sh) with
  # the version its daemon reports. It publishes nothing: cli-assets does,
  # and only for a tag publish verified as the train's.
  cli:
    name: build the release's grain CLI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Go modules and build cache
        # zizmor: ignore[cache-poisoning]
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build the grain CLI
        env:
          RELEASE: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "${RELEASE}" =~ ^v[0-9]+\.[0-9]+\.0$ ]]; then
            echo "publish-release: ${RELEASE@Q} is not a vX.Y.0 release" >&2
            exit 1
          fi
          bash ./scripts/build-cli.sh "${RUNNER_TEMP}/release-cli"
          bash ./scripts/release-assets.sh cli-validate "${RUNNER_TEMP}/release-cli"

      - name: Hand the archives to cli-assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grain-cli
          path: |
            ${{ runner.temp }}/release-cli/*.tar.gz
            ${{ runner.temp }}/release-cli/checksums.txt
          if-no-files-found: error
          retention-days: 1

  # Puts what cli built on the vX.Y.0 release publish wrote: the archives,
  # then checksums.txt (scripts/release-assets.sh cli-publish). A release
  # that already carries checksums.txt is left as it is.
  cli-assets:
    name: publish the release's grain CLI
    needs: [publish, cli]
    if: needs.publish.outputs.train == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # One group per release, shared by promote.yml, promote-release.yml,
    # publish-release.yml and release-train-assets.yml (concurrency groups
    # span a repository's workflows): cli-publish replaces archives left
    # without checksums.txt, so two runs uploading to the same release at
    # once could leave one run's archive beside the other's checksums.txt.
    concurrency:
      group: grain-cli-assets-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the archives cli built
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: grain-cli
          path: ${{ runner.temp }}/release-cli

      - name: Publish the grain CLI
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash ./scripts/release-assets.sh cli-publish "${RELEASE_VERSION}" "${RUNNER_TEMP}/release-cli"

  # Per-platform static grain-agentd binaries and manifests (linux/amd64 and
  # linux/arm64), built with `contents: read` and no token, then signed and
  # uploaded by agentd-assets once publish has verified the tag as the train's.
  agentd:
    name: build the release's grain-agentd
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Go modules and build cache
        # zizmor: ignore[cache-poisoning]
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
          key: go-dl-${{ runner.os }}-${{ hashFiles('go.sum', 'third_party/granule/go.sum') }}
          restore-keys: |
            go-dl-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build grain-agentd
        env:
          RELEASE: ${{ github.ref_name }}
          AGENTD_RELEASE_PUBLIC_KEY: ${{ vars.AGENTD_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if ! [[ "${RELEASE}" =~ ^v[0-9]+\.[0-9]+\.0$ ]]; then
            echo "publish-release: ${RELEASE@Q} is not a vX.Y.0 release" >&2
            exit 1
          fi
          bash ./scripts/build-agentd.sh "${RUNNER_TEMP}/release-agentd"
          bash ./scripts/release-assets.sh agentd-validate "${RUNNER_TEMP}/release-agentd"

      - name: Hand grain-agentd to agentd-assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grain-agentd
          path: |
            ${{ runner.temp }}/release-agentd/grain-agentd-*
          if-no-files-found: error
          retention-days: 1

  agentd-assets:
    name: publish the release's grain-agentd
    needs: [publish, agentd]
    if: needs.publish.outputs.train == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # AGENTD_RELEASE_SIGNING_KEY is an agentd-release environment secret,
    # released only to the refs that environment's deployment rules allow
    # (docs/agentd-release-signing.md), not a repository secret any
    # workflow on any pushed branch could read.
    environment: agentd-release
    permissions:
      contents: write
    concurrency:
      group: grain-agentd-assets-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch grain-agentd built by agentd
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: grain-agentd
          path: ${{ runner.temp }}/release-agentd

      - name: Sign and publish grain-agentd
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
          SIGNING_KEY_PEM: ${{ secrets.AGENTD_RELEASE_SIGNING_KEY }}
          AGENTD_RELEASE_PUBLIC_KEY: ${{ vars.AGENTD_RELEASE_PUBLIC_KEY }}
          ROTATIONS_JSON: ${{ vars.AGENTD_RELEASE_ROTATIONS }}
          REQUIRE_AGENTD_SIGNING: ${{ vars.REQUIRE_AGENTD_SIGNING }}
        run: |
          set -euo pipefail
          key_file=""
          rot_file=""
          cleanup() { rm -f "${key_file}" "${rot_file}"; }
          trap cleanup EXIT
          if [ -n "${SIGNING_KEY_PEM:-}" ]; then
            key_file="${RUNNER_TEMP}/agentd-signing.key"
            printf '%s\n' "${SIGNING_KEY_PEM}" > "${key_file}"
            chmod 600 "${key_file}"
            export AGENTD_RELEASE_SIGNING_KEY="${key_file}"
          fi
          if [ -n "${ROTATIONS_JSON:-}" ]; then
            rot_file="${RUNNER_TEMP}/agentd-rotations.json"
            printf '%s\n' "${ROTATIONS_JSON}" > "${rot_file}"
            export AGENTD_RELEASE_ROTATIONS="${rot_file}"
          fi
          bash ./scripts/release-assets.sh agentd-sign "${RUNNER_TEMP}/release-agentd"
          bash ./scripts/release-assets.sh agentd-publish "${RELEASE_VERSION}" "${RUNNER_TEMP}/release-agentd"
