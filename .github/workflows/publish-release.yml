# Publishes a release the continuous release train made
# (design/playbook/releases.playbook.md section 1): the train's grain task
# pushes vX.Y.0 and `latest` onto an rc that qualified, but a task holds no
# package-publish or GitHub token, so this workflow does the rest of what
# promote-release.yml's approve path does, on the tag push:
#
#   1. scripts/release-from-trunk.sh verify vX.Y.0 -- the tag names the rc
#      it was promoted from (Promoted-From:), sits on that rc's own commit,
#      the rc is not dropped, the commit is on main or release/vX.Y.0, and
#      the rc still passes Stage 1 (nightly.yml) and Stage 2
#      (grain/release-qualification, from vars.RELEASE_QUALIFICATION_APP
#      only). Anything else fails the run and publishes nothing. A tag a
#      person's approval pushed (no Promoted-From) is promote-release.yml's
#      to publish, so its images are left alone here;
#   2. release-images.sh promote vX.Y.0: the images re-stamped with the
#      release and tagged :vX.Y.0, and :latest when the git tag latest is on
#      it;
#   3. the GitHub Release, its body written by scripts/release-notes.sh
#      from the newest earlier vX.Y.Z.
#
# It runs on nothing but that tag push: no dispatch, no schedule.

name: publish-release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.0"

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  RELEASE_IMAGE_REPO: ${{ vars.RELEASE_IMAGE_REPO || 'bwsalmon/grain' }}

jobs:
  publish:
    name: publish the release the train made
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      checks: read
      contents: write
      packages: write
      id-token: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify the release is the train's, from a qualified rc
        id: verify
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_CI_SOURCE: github
          RELEASE_QUALIFICATION_APP: ${{ vars.RELEASE_QUALIFICATION_APP }}
        run: |
          set -euo pipefail
          if ! [[ "${RELEASE_VERSION}" =~ ^v[0-9]+\.[0-9]+\.0$ ]]; then
            echo "publish-release: ${RELEASE_VERSION@Q} is not a vX.Y.0 release" >&2
            exit 1
          fi
          status=0
          bash ./scripts/release-from-trunk.sh verify "${RELEASE_VERSION}" || status=$?
          case "$status" in
            0) echo "train=true" >> "$GITHUB_OUTPUT" ;;
            4) echo "train=false" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
          {
            echo "GRAIN_CI_REPO=${GITHUB_REPOSITORY}"
            echo "GRAIN_CI_COMMIT=${GITHUB_SHA}"
            echo "GRAIN_CI_REF=${RELEASE_VERSION}"
            echo "DRY_RUN=false"
          } >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud (WIF)
        if: steps.verify.outputs.train == 'true' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_EMAIL != ''
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Configure Artifact Registry Docker authentication
        if: steps.verify.outputs.train == 'true' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_EMAIL != ''
        run: gcloud auth configure-docker us-docker.pkg.dev --quiet

      - name: Configure package-publish credentials
        if: steps.verify.outputs.train == 'true'
        env:
          GHCR_PAT: ${{ secrets.GHCR_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_REGISTRY: ${{ vars.PACKAGE_PUBLISH_REGISTRY || 'ghcr.io' }}
          PUBLISH_USERNAME: ${{ vars.GHCR_USERNAME || 'bwsalmon' }}
        run: |
          set -euo pipefail
          token="${GHCR_PAT:-}"
          username="${PUBLISH_USERNAME}"
          if [ -z "$token" ]; then
            case "${RELEASE_IMAGE_REPO}" in
              bwsalmon/*)
                echo "::error::GHCR_TOKEN secret is required to publish packages under ghcr.io/${RELEASE_IMAGE_REPO} from ${GITHUB_REPOSITORY}" >&2
                exit 1
                ;;
              *)
                token="${FALLBACK_TOKEN}"
                username="${GITHUB_ACTOR}"
                ;;
            esac
          fi
          echo "::add-mask::${token}"
          {
            echo "PACKAGE_PUBLISH_REGISTRY=${PUBLISH_REGISTRY}"
            echo "PACKAGE_PUBLISH_USERNAME=${username}"
            echo "PACKAGE_PUBLISH_TOKEN=${token}"
          } >> "$GITHUB_ENV"

      - name: Configure optional image-signing key
        if: steps.verify.outputs.train == 'true'
        env:
          SIGNING_KEY_PEM: ${{ secrets.IMAGE_SIGNING_KEY }}
          SIGNING_KEY_PASS: ${{ secrets.IMAGE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY_PEM:-}" ]; then
            echo "WARNING: IMAGE_SIGNING_KEY secret is not set; promoted release images will be published unsigned." >&2
            exit 0
          fi
          if ! command -v cosign >/dev/null 2>&1; then
            cosign_version="v2.4.1"
            curl -fsSL "https://github.com/sigstore/cosign/releases/download/${cosign_version}/cosign-linux-amd64" \
              -o /usr/local/bin/cosign
            chmod +x /usr/local/bin/cosign
          fi
          key_file="${RUNNER_TEMP}/image-signing.key"
          printf '%s\n' "${SIGNING_KEY_PEM}" > "$key_file"
          chmod 600 "$key_file"
          pass_file="${RUNNER_TEMP}/image-signing.pass"
          printf '%s' "${SIGNING_KEY_PASS:-}" > "$pass_file"
          chmod 600 "$pass_file"
          {
            echo "IMAGE_SIGNING_KEY=${key_file}"
            echo "IMAGE_SIGNING_PASSWORD_FILE=${pass_file}"
          } >> "$GITHUB_ENV"

      - name: Publish the release's images
        if: steps.verify.outputs.train == 'true'
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: bash ./scripts/release-images.sh promote "${RELEASE_VERSION}"

      - name: Write the release notes and the GitHub Release
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "publish-release: ${RELEASE_VERSION} already has a GitHub Release"
            exit 0
          fi
          prev="$(git tag -l 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V |
            awk -v v="${RELEASE_VERSION}" '$0 == v { exit } { p = $0 } END { print p }')"
          if [ -z "$prev" ]; then
            prev="$(git rev-list --max-parents=0 "${RELEASE_VERSION}" | tail -n 1)"
          fi
          bash ./scripts/release-notes.sh write --notes "${RUNNER_TEMP}/notes.md" --body "${RUNNER_TEMP}/body.md" \
            "${RELEASE_VERSION}" "$prev" "${RELEASE_VERSION}"
          latest=false
          if [ "$(git rev-parse -q --verify 'refs/tags/latest^{commit}' || true)" = "$(git rev-parse "${RELEASE_VERSION}^{commit}")" ]; then
            latest=true
          fi
          gh release create "${RELEASE_VERSION}" --verify-tag --title "${RELEASE_VERSION}" \
            --notes-file "${RUNNER_TEMP}/body.md" --latest="$latest"
