# GitHub Actions port of .grain/workflows/gcp-smoke.yml on GitHub-hosted
# runners (ubuntu-latest).
#
# Authenticates to Google Cloud via Workload Identity Federation using the
# repository variables GCP_WIF_PROVIDER and GCP_SA_EMAIL (provisioned by
# scripts/setup-gcp-smoke-wif.sh; see docs/github-actions-ci.md).
#
# Scheduled and workflow_dispatch only (never pull_request or push, so required
# PR checks are unaffected). When both variables are unset, the job-level `if:`
# skips the job (and therefore the workflow run) with conclusion `skipped`
# instead of reporting a misleading green `success`. (In GitHub Actions v2, any
# job that runs a step and exits 0 turns the workflow run's overall conclusion
# into `success`; gating at the job level keeps unconfigured runs `skipped`,
# while a half-configured pair runs the first step, emits a `::warning`, and
# fails.)

name: gcp-smoke

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ZONE: us-central1-a

jobs:
  smoke:
    name: GCE and GKE lifecycle
    if: vars.GCP_WIF_PROVIDER != '' || vars.GCP_SA_EMAIL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-smoke-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Check GCP Workload Identity Federation variables
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_SA_EMAIL: ${{ vars.GCP_SA_EMAIL }}
        run: |
          set -euo pipefail
          if [ -z "$GCP_WIF_PROVIDER" ] || [ -z "$GCP_SA_EMAIL" ]; then
            echo "::warning title=gcp-smoke unconfigured::Both repository variables GCP_WIF_PROVIDER and GCP_SA_EMAIL must be set (run scripts/setup-gcp-smoke-wif.sh <project>; see docs/github-actions-ci.md)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Configure gcloud project
        env:
          GCP_SA_EMAIL: ${{ vars.GCP_SA_EMAIL }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          project="$GCP_PROJECT_ID"
          if [ -z "$project" ]; then
            project="$(printf '%s' "$GCP_SA_EMAIL" | sed -n 's/.*@\([^.]*\)\.iam\.gserviceaccount\.com$/\1/p')"
          fi
          if [ -z "$project" ]; then
            echo "::warning title=gcp-smoke missing project::Could not infer GCP project from GCP_SA_EMAIL; set repository variable GCP_PROJECT_ID."
            exit 1
          fi
          gcloud config set project "$project"
          echo "active account: $(gcloud config get-value account), project: $(gcloud config get-value project)"

      - name: Install GKE prerequisites
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list
          if ! command -v gke-gcloud-auth-plugin >/dev/null 2>&1 || ! command -v kubectl >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y kubectl google-cloud-cli-gke-gcloud-auth-plugin \
              || sudo DEBIAN_FRONTEND=noninteractive apt-get install -y kubectl google-cloud-sdk-gke-gcloud-auth-plugin
          fi
          kubectl version --client
          gke-gcloud-auth-plugin --version

      - name: GCE VM lifecycle
        run: |
          set -euo pipefail
          args=(--iap)
          if [ "${SERVICE_ACCOUNT_SHAPE:-self}" = "default" ]; then
            args+=(--service-account=default)
          fi
          ./scripts/gce-vm-smoke.sh "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/gce-smoke.log"

      - name: GKE cluster lifecycle
        run: |
          set -euo pipefail
          args=()
          if [ "${SERVICE_ACCOUNT_SHAPE:-self}" = "default" ]; then
            args+=(--node-service-account=default)
          fi
          ./scripts/gke-cluster-smoke.sh "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/gke-smoke.log"

      - name: Delete anything left behind
        if: always() && steps.auth.outcome == 'success'
        run: |
          set -uo pipefail
          cutoff=7200
          now="$(date -u +%s)"
          our_vm=""
          if [ -f "$RUNNER_TEMP/gce-smoke.log" ]; then
            our_vm="$(sed -n 's/^=== create \(gce-smoke-[0-9]*-[0-9]*\) .*/\1/p' "$RUNNER_TEMP/gce-smoke.log" | head -n 1)"
          fi
          our_cluster=""
          if [ -f "$RUNNER_TEMP/gke-smoke.log" ]; then
            our_cluster="$(sed -n 's/^=== create cluster \(gke-smoke-[0-9]*-[0-9]*\) .*/\1/p' "$RUNNER_TEMP/gke-smoke.log" | head -n 1)"
          fi
          ours_or_stale() {
            local name="$1" ours="$2" created_ts="$3" created
            if [ -n "$ours" ] && [ "$name" = "$ours" ]; then
              return 0
            fi
            created="$(date -u -d "$created_ts" +%s)" || return 1
            [ $(( now - created )) -ge "$cutoff" ]
          }
          gcloud compute instances list \
            --filter='labels.purpose=gce-vm-smoke' \
            --format='value(name,zone.basename(),creationTimestamp)' |
          while read -r name zone created; do
            [ -n "$name" ] || continue
            if ours_or_stale "$name" "$our_vm" "$created"; then
              echo "sweeping VM $name ($created)"
              gcloud compute instances delete "$name" --zone="$zone" --quiet || true
            fi
          done

          gcloud container clusters list \
            --filter='resourceLabels.purpose=gke-cluster-smoke' \
            --format='value(name,location,createTime)' |
          while read -r name zone created; do
            [ -n "$name" ] || continue
            if ours_or_stale "$name" "$our_cluster" "$created"; then
              echo "sweeping cluster $name ($created)"
              gcloud container clusters delete "$name" --zone="$zone" --quiet || true
            fi
          done
