[package]
name = "vhost-user-extents-rs"
version = "0.1.0"
edition = "2021"
publish = false
description = "Experimental read-only vhost-user-blk server for granule's extent layout, on rust-vmm"

[dependencies]
libc = "0.2"
vhost = { version = "0.18", features = ["vhost-user-backend"] }
vhost-user-backend = "0.24"
virtio-bindings = "0.2.7"
virtio-queue = "0.18"
vm-memory = { version = "0.18", features = ["backend-mmap", "backend-atomic"] }
vmm-sys-util = "0.15"

[profile.release]
debug = 1
