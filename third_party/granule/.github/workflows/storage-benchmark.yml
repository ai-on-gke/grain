name: Storage benchmark

# Runs benchmarks/storage/gce-bench.sh: the storage backend comparison
# (native host, flat disk.img, QCOW2, boot-assembled and vhost-user-blk
# extents) on a dedicated n2-standard-16 GCE VM, so the numbers are not
# shared with whatever else a runner is doing. The results are printed
# between STORAGE-BENCH-* markers in the job log;
# benchmarks/results/storage/ holds the last set that was checked in. The
# GitHub Actions port of .grain/workflows/storage-benchmark.yml.
#
# On demand only: a run builds the guest from scratch and benchmarks nine
# backends, about 35 minutes of a 16-vCPU VM (5 to build the guest, 5 to
# derive the extent images, 20 to benchmark). Like gce-build.yml it
# authenticates to GCP through Workload Identity Federation
# (vars.GCP_WIF_PROVIDER, vars.GCP_SA_EMAIL), is skipped with a notice
# until those are set, and has no pull_request trigger.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gcp-credentials:
    name: GCP credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: are GCP_WIF_PROVIDER and GCP_SA_EMAIL set
        id: check
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_SA_EMAIL: ${{ vars.GCP_SA_EMAIL }}
        run: |
          if [ -n "$GCP_WIF_PROVIDER" ] && [ -n "$GCP_SA_EMAIL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            msg="Repository variables GCP_WIF_PROVIDER and GCP_SA_EMAIL are not both set, so the storage benchmark is skipped, not run. See docs/github-actions-ci.md."
            echo "::notice title=storage benchmark skipped::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  storage-benchmark:
    name: storage benchmark on a dedicated GCE VM
    needs: [gcp-credentials]
    if: needs.gcp-credentials.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: install gcloud if the runner has none
        run: |
          set -euo pipefail
          if command -v gcloud >/dev/null; then
            gcloud --version | head -n 1
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-transport-https ca-certificates curl gnupg openssh-client
          curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg |
            sudo gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" |
            sudo tee /etc/apt/sources.list.d/google-cloud-sdk.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq google-cloud-cli
          gcloud --version | head -n 1

      # GCE_KEY_FILE names nothing on purpose: see gce-build.yml.
      - name: storage benchmark on a dedicated GCE VM
        env:
          GCE_KEY_FILE: /nonexistent/no-service-account-key
          GCE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: benchmarks/storage/gce-bench.sh
