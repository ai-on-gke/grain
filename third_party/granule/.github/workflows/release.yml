name: release

# Publishes the guest images to GHCR when a release is published. The
# GitHub Actions port of .grain/workflows/release.yml, whose job held
# grain's package-publish capability; here that is the job's
# `packages: write` and its GITHUB_TOKEN. See docs/github-actions-ci.md.
#
# GITHUB_TOKEN can push to ghcr.io/gke-labs/granule/* only where each
# package grants this repository write access (it does by default for a
# package this repository's workflows created; one first pushed by a
# person's token needs "Manage Actions access" set on the package). Where
# that cannot be arranged, set the GHCR_TOKEN secret to a token with
# write:packages, and GHCR_USERNAME to its owner, and it is used instead.
on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: publish guest images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Three guest builds, kernel and all, outgrow a hosted runner's
      # ~14 GB free; drop toolchains this job never uses.
      - name: free disk
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          docker image prune -af >/dev/null || true
          df -h /

      - name: Publish guest images to GHCR
        env:
          GHCR_USER: ${{ secrets.GHCR_TOKEN != '' && vars.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: deploy/publish-images.sh --no-grain-sandbox guests
