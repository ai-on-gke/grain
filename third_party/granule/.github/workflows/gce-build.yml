name: GCE build

# Builds granule's images on a stock Debian VM on Google Compute Engine,
# with docker installed from Docker's own repository, so that a build which
# has quietly come to depend on its CI host fails here rather than in front
# of the first person to run deploy/publish-images.sh on their own machine.
# test/gce-build.sh is the whole of it and runs the same by hand. The GitHub
# Actions port of .grain/workflows/gce-build.yml; see
# docs/github-actions-ci.md.
#
# On every push, like grain CI's: the build is the test, and a build that
# only breaks off-host is broken by a commit. It costs one VM for the length
# of three guest builds (about ten minutes on the default e2-standard-8).
#
# Not on pull_request. The job authenticates to GCP and runs scripts out of
# the tree under test, so whatever triggers it can run code of its choosing
# beside that credential. A push needs write access to this repository; a
# pull request from a fork needs none, and must not be able to reach GCP by
# editing test/gce-build.sh. Branches pushed here (every grain task branch)
# are built by the push trigger, so dropping pull_request loses only the
# merge-result build.
#
# Credentials are keyless: Workload Identity Federation through
# vars.GCP_WIF_PROVIDER and vars.GCP_SA_EMAIL. Until both are set the build
# job is skipped, with a notice saying so, rather than passing.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gcp-credentials:
    name: GCP credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: are GCP_WIF_PROVIDER and GCP_SA_EMAIL set
        id: check
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_SA_EMAIL: ${{ vars.GCP_SA_EMAIL }}
        run: |
          if [ -n "$GCP_WIF_PROVIDER" ] && [ -n "$GCP_SA_EMAIL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            msg="Repository variables GCP_WIF_PROVIDER and GCP_SA_EMAIL are not both set, so the GCE build is skipped, not run. See docs/github-actions-ci.md."
            echo "::notice title=GCE build skipped::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  gce-build:
    name: images build on a GCE VM
    needs: [gcp-credentials]
    if: needs.gcp-credentials.outputs.configured == 'true'
    runs-on: ubuntu-latest
    # A cold build of all three guests measured under ten minutes on the
    # VM, plus about a minute to create it and install docker. The rest is
    # for a slow mirror. The VM deletes itself after GCE_MAX_RUN even if
    # this job is cancelled before the script's own cleanup runs.
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: install gcloud if the runner has none
        run: |
          set -euo pipefail
          if command -v gcloud >/dev/null; then
            gcloud --version | head -n 1
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-transport-https ca-certificates curl gnupg openssh-client
          curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg |
            sudo gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" |
            sudo tee /etc/apt/sources.list.d/google-cloud-sdk.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq google-cloud-cli
          gcloud --version | head -n 1

      # GCE_KEY_FILE names nothing on purpose. The script activates any
      # readable file at $GOOGLE_APPLICATION_CREDENTIALS as a
      # service-account key, and the auth step above puts a Workload
      # Identity Federation credential there, which is not one; with no
      # key file the script uses gcloud's active login, which that same
      # step configured.
      - name: build granule's images on a stock GCE VM
        env:
          GCE_KEY_FILE: /nonexistent/no-service-account-key
          GCE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: test/gce-build.sh guests
