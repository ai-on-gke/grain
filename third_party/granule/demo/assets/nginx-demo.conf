# The one file the demo guest's nginx serves, on the port its Dockerfile
# EXPOSEs. Port 8080 rather than 80 so that the demo's `granule vm run
# ... curl` line is visibly reaching the guest's own configuration and
# not a distribution default.
server {
    # IPv4 only: the reference guest's kernel is built without IPv6, so
    # the "listen [::]:8080" a Debian nginx site normally carries makes
    # this a machine that boots with a failed unit on it (nginx: [emerg]
    # socket() [::]:8080 failed (97: Address family not supported by
    # protocol)). Worth knowing before you customize a guest: what the
    # distribution assumes about a machine is not always true of this one.
    listen 8080 default_server;

    root /var/www/html;
    index index.nginx-debian.html index.html;

    server_name _;

    location / {
        try_files $uri $uri/ =404;
    }

    # A liveness endpoint that says which machine answered, which is the
    # useful thing when several of these are running one per container in
    # the same pod.
    location = /whoami {
        default_type text/plain;
        return 200 "granule demo guest\n";
    }
}
