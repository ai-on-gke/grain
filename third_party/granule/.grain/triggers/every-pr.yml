# Path trigger giving every grain-opened pull request on this repository
# a general code review (.grain/templates/pr-review.yml).
#
# This is a gating trigger rather than a `.grain/review.yml` default
# review. A default review is filed once per task, as a stacked review
# told to push fixes; a gating trigger's review is one per pull request
# head and review template, posts findings without pushing, and after a
# push re-reads only the new commits. See "Gating reviews" in grain's
# docs/declarations.md. Do not add a .grain/review.yml beside this file,
# or every change would be reviewed twice.
#
# Gating, with human: on-findings: a clean review gives the change its
# auto-merge back, and findings hold the merge as questions to the
# change's owner. Review tasks, merge-queue fix tasks and tasks a trigger
# filed are never judged, so a review of a review is never filed.
on: pull_request
paths: ["**"]
template: pr-review
gate: true
human: on-findings
auto-approve: true
