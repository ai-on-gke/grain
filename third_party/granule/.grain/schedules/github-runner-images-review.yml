name: GitHub runner images review
base: main
# Files a system:workflow-review:github-runner-images triage task for
# every red, timed-out or startup_failure run of
# .github/workflows/github-runner-images.yml on main. It replaces the
# review grain filed from .grain/workflows/github-runner-images.yml's
# weekly schedule.
trigger:
  github_workflow_run:
    workflow: github-runner-images.yml
    conclusions: [failure, timed_out, startup_failure]
    branches: [main]
overlap: skip
