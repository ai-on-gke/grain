name: CHV_DISK_DIRECT benchmark

# Runs benchmarks/storage/gce-bench.sh --disk-direct on a dedicated
# n2-standard-16 GCE VM: the fio suite on the raw disk.img and on the qcow2
# overlay with CHV_DISK_DIRECT=on and off, then test/oom-pagecache.sh for
# each disk and setting, twice. It took 26 minutes: 5 to build the guest, 5
# of fio and 13 for the eight oom-pagecache runs. The results are in the job log
# between STORAGE-BENCH-* and OOM-PAGECACHE-* markers; the last set that
# was checked in is in benchmarks/storage/disk-direct.md.
#
# On demand only, and with no pull_request trigger, because it holds the
# gcp-key capability like storage-benchmark.yml. grain ci run-job only finds
# push-triggered workflows, so the run behind disk-direct.md added a push
# trigger for its own branch and then removed it again.
on:
  workflow_dispatch:

jobs:
  disk-direct:
    name: CHV_DISK_DIRECT on vs off on a dedicated GCE VM
    capabilities:
      - https://grain.dev/capabilities/gcp#gcp-key
    timeout-minutes: 90
    steps:
      - name: install gcloud if the runner has none
        run: |
          set -euo pipefail
          if command -v gcloud >/dev/null; then
            gcloud --version | head -n 1
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-transport-https ca-certificates curl gnupg openssh-client
          curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg |
            sudo gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" |
            sudo tee /etc/apt/sources.list.d/google-cloud-sdk.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq google-cloud-cli
          gcloud --version | head -n 1

      - name: CHV_DISK_DIRECT on vs off on a dedicated GCE VM
        run: GCE_MAX_RUN=3h benchmarks/storage/gce-bench.sh --disk-direct
