name: Install walkthrough - shared host, re-run, upgrade and rollback
title: Weekly walkthrough of an install's re-run, upgrade, channel switch, rollback and host mode
base: main
auto-merge: true
capabilities:
  - https://grain.dev/capabilities/gcp#gcp-key
body: |
  Walk an operator through installing Grain with `scripts/setup.sh` and
  `grain init`, then re-running, upgrading, switching channel, rolling
  back and uninstalling it, on throwaway VMs, and report what regressed
  since last week. This runs every week
  (`.grain/schedules/install-walkthrough-shared-host.yml`;
  `docs/test-plans/install-walkthroughs.md` is the plan). Task 4345 was the
  first run, and `docs/test-runs/2026-10-16-install-upgrade-walkthrough.md`
  is its report.

  This build is single-tenant only (docs/single-tenant-reset.md): there
  is no `-tenancy` flag, no `GRAIN_TENANCY`, no admin account and no
  second user or team, and a host shared between users is no longer a
  shape it supports. The file keeps its old name so that its schedule and
  last week's report still line up; what it walks is a single-tenant
  install's lifecycle, which the single-tenant walkthrough does not cover.
  Last week's report may still list multi-user flows: record those as
  dropped, not as regressions.

  ## 1. Read last week's report first

  - Find the newest `docs/test-runs/*-install-upgrade-walkthrough.md` and
    read its results table, its bugs and its "Not covered" list.
  - For each bug it filed, check whether the fix has landed on `main`.
    Those flows are the ones to look at hardest: a fixed bug that comes
    back is the most important thing this run can find.

  ## 2. Environment

  - Create throwaway VMs in `grain-sandbox-dev` with the `gcp-key`
    credential at `~/.gcp-service-account.json`: Debian 12 (`debian-12`),
    `e2-standard-2`, a 30 GB disk, every one labelled
    `purpose=grain-walkthrough` and `grain-task=<this task's id>`, named
    `grain-wt-<task id>[-host|-init]`: one for container mode, one for host
    mode and one for `grain init`. Open tcp:4242 only to this sandbox's own
    egress IP, with a firewall rule carrying the same name prefix. This
    sandbox is "the other machine": reach the VMs by external IP and by
    external name.
  - **Delete every VM and the firewall rule at the end, even on failure.**
    Set up the deletion first (a `trap` in the driving script), and confirm
    with `gcloud compute instances list --filter=labels.purpose=grain-walkthrough`
    that nothing of this run is left. Also delete any
    `purpose=grain-walkthrough` VM in the project older than 6 hours: an
    earlier run's leftover.
  - Install from `GRAIN_CHANNEL=main`. Use `scripts/setup.sh` from
    `origin/main` as an operator gets it from a clone (`git archive`,
    copied over). Record the image digests of `main` and `latest` and the
    commits they were built from. If `ghcr.io/bwsalmon/grain/grain:main` is
    behind `origin/main`, say so at the top of the report.
  - Screenshots with Playwright from this sandbox, through the VM's
    external address (`NODE_EXTRA_CA_CERTS=/usr/local/share/ca-certificates/grain-ca.crt`
    for the browser download).

  ## 3. The flow

  0. `sudo ./scripts/setup.sh` exactly as the README says (the file must be
     executable).
  1. Fresh install, container mode, `GRAIN_CHANNEL=main`: the daemon is up,
     the readiness report signs you in with the access code, and the
     access-code page works from another machine.
  2. Re-run unchanged: channel, address, allowed hosts, access code and
     tasks are identical (diff a state snapshot before and after).
  3. Channel switch and upgrade: install `GRAIN_CHANNEL=latest` fresh on a
     clean VM or after an uninstall, file a couple of tasks, then switch to
     `GRAIN_CHANNEL=main`. Everything survives, and the readiness report
     says how to sign in after the switch. Where `latest` predates the
     single-tenant engine (v1.9.0 does), setup.sh says so and sets it up
     as multi-tenant; check what the switch to `main` does with that
     install's accounts, and that the report says it before anything
     goes. Where an agent credential is available, check a running task
     across the upgrade.
  4. An old-style unit still passing `-tenancy` on `main`: the daemon
     starts, names it among the flags it ignores, and the access code
     still gets you in.
  5. Roll back to `latest`: at equal schema nothing is lost and the drift
     warning is clear; across a schema change (simulate one with
     `.schema_version` if the two builds agree) the readiness report must
     say what will happen before data goes.
  6. Host mode (`GRAIN_INSTALL_MODE=host`): fresh install, a bare re-run
     (it must stay host mode and keep the access code), and an upgrade.
  7. `grain init` fresh install: its steps (no tenancy or admin steps)
     and exit code, and a table of its defaults against setup.sh's.
  8. Access by external name: the 421, and whether following its advice
     fixes it.
  9. Uninstall as documented, and list what is left (images, data, users,
     masked targets, units).

  Explore beyond these flows where something looks wrong.

  ## 4. Bugs

  - **File a bug task for each failure**, one per bug, with the exact
    reproduction, what you saw and what you expected. Before filing, check
    whether last week's run or anyone else already filed it, and add to
    that task instead of filing it again. Put regressions, data loss and
    upgrade-breaking bugs at the front of the queue.
  - A fix that is small, safe and scoped may land in this task with a
    regression test; say so in the report.

  ## 5. Output

  - Write `docs/test-runs/YYYY-MM-DD-install-upgrade-walkthrough.md`: the
    VMs, the commits and images tested, the flows, the results table, the
    bugs (with task numbers) and what was not covered. Commit only small
    screenshots that show a bug.
  - **Call out regressions first**: open the report, and the closing
    comment, with a "Since last week" section comparing every flow's result
    with the previous report's: what newly fails, what was fixed, what
    still fails.
  - **Close with a pass/fail table** in `comment_on_issue`: one row per
    flow, with PASS, FAIL, PARTIAL or NOT RUN, last week's result beside it,
    and the bug task for each failure. Then confirm that every VM and the
    firewall rule are deleted.
