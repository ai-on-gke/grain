name: Release qualification - Independent merging & conflict clusters
title: "Qualify {{rc_tag}}: independent clean-and-green merging, gates and conflict clusters"
base: main
auto-merge: false
# Stage 2 of release-candidate qualification
# (design/playbook/releases.playbook.md §2). Filed by grain's
# release-qualification reconciler (pkg/orchestrator/releasequalification.go)
# with rc_tag and rc_sha filled in, and judged by it objectively: the run
# passes only if it opens no pull request, proposes nothing outside its own
# scratch branch, leaves no scratch branch or fixture task behind, and ends
# its closing note with the footer the body asks for.
fields:
  - name: rc_tag
    label: Release candidate tag (vX.Y.Z-rc.N)
  - name: rc_sha
    label: Release candidate commit (full sha)
# The scratch branch this template's body tells its runs to create from
# rc_sha and delete when done (qualification/<this task id>). Create and
# delete only: no force, so an existing qualification branch can be
# fast-forwarded but never rewritten, and main itself stays out of reach.
push:
  - ref: refs/heads/qualification/*
    delete: true
body: |
  Verify that grain merges pull requests the way
  `design/design/merging.design.md` says: each one merges as soon as it is
  clean, green on its own head and through its gates, independently of every
  other pull request. There is no ordering, no queue head, no batching and no
  bisection. Batching and bisection were retired, so do not test for them.

  You are qualifying release candidate `{{rc_tag}}` at commit `{{rc_sha}}`.
  Check it out (`git fetch origin tag {{rc_tag}} && git checkout --detach {{rc_sha}}`)
  and judge that commit, not `main`'s tip.

  ## Scratch branch

  Every experiment runs on a scratch branch cut from the candidate, never on
  `main`, `candidate` or this task's own branch:

  - Create it: `git push origin {{rc_sha}}:refs/heads/qualification/<this task id>`.
  - File any fixture task (a change for the merge queue to merge, a staged
    failure, its repair) with `propose_task` and
    `branch: qualification/<this task id>`. Fixtures on that branch are the
    experiment. Anything you propose on any other branch is a defect report,
    and fails qualification.
  - Before you finish, close or finish every fixture task you filed, then
    delete the branch: `git push origin :refs/heads/qualification/<this task id>`.
    A scratch branch or a live fixture task left behind fails qualification.

  ## 1. Independent clean-and-green merges

  - File three non-conflicting fixture changes against the scratch branch at
    once.
  - Confirm each merges on its own as soon as it is clean, green on its own
    head and reviewed, and that none waits on another's state. Use
    `query_merge_queue` and `list_grain_tasks` to see each pull request's own
    blocker. There should be no queue position.
  - Make one of the three slow or red (a failing test in that fixture only).
    Confirm the other two still merge, and that the red one gets its normal
    repair and is then closed unmerged.
  - Confirm `max_merges_per_repo` throttles merges without ordering them.

  ## 2. Gates hold only their own pull request

  - Confirm a fixture still awaiting its second-agent review does not merge,
    and does not hold any other fixture.

  ## 3. Conflict clusters

  - File three fixtures that each edit the same lines of one file on the
    scratch branch, so that once the first lands the other two conflict with
    it.
  - Confirm the two conflicting pull requests form one cluster with at most
    one repair in flight, given to the oldest member. When that repair lands,
    the last pull request should be judged again against the new tip.
  - Confirm the cluster costs about one repair per pull request, not N².

  ## 4. Base-branch CI after the merge

  - Confirm the scratch branch's post-merge CI runs on the tips the merges
    left, and that a red scratch branch does not stop green fixtures merging
    there.

  ## 5. Report

  - Summarize each step's observed merges, blockers, repairs and timings in
    the closing note.

  ## What makes this a pass

  The verdict is read mechanically, not from your prose:

  - Do not push to this task's own branch and do not open a pull request.
    Any pull request fails qualification, including a real fix. Report a bug
    you find in the closing note with `Qualification-Verdict: FAIL`. The
    pipeline steward files the fix.
  - Finish with `comment_on_issue` (or `nothing_needed`), never
    `ask_question`.
  - End the closing note with exactly these three lines, the commit in full:

    ```text
    Qualification-Verdict: PASS
    Qualified-Tag: {{rc_tag}}
    Qualified-Commit: {{rc_sha}}
    ```

    Use `FAIL` when anything above did not behave as described. Use `INFRA`
    only when the environment stopped you (sandbox, git proxy, model quota,
    a daemon restart), and name the error. INFRA is re-run, not judged.
