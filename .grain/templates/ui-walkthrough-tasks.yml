name: UI walkthrough - intake, inbox, task lifecycle
title: Walk through task intake, inbox, and lifecycle UI
base: main
auto-merge: true
body: |
  Thoroughly exercise the operator workflow from incoming work through
  task disposition -- the Inbox, the New task sheet, the task list and
  the task page at `/next/` -- in a real browser against a real server.

  ## Coverage

  - Inbox (`/next/inbox`, from the rail with its count, and as bare
    `/next/`): the tabs (All, Asked, Releases & scripts, Merges,
    Proposals, Blocked & alerts, Paused, Unread) with counts that match
    the rail's Inbox count (acknowledged alerts left out), the queue rows
    and the inspector beside them ("Why this needs a person", and "The
    change" diff beside a Submit or proposal decision -- a huge diff
    truncated with a link, no empty pane for a task with no branch),
    questions, access-request reasons and alert bodies rendered as capped
    Markdown with "Show full <noun>"/"Show less", the Reply/Acknowledge
    row in the dock and a half-typed reply surviving a refresh, the
    Inbox keys help, and a deep link's highlight showing at once and
    fading. Confirm a row arriving over `/api/events` appears without a
    reload, a cold `/api/tasks` failure never reads as an empty Inbox
    ("Could not read tasks" only once reads keep failing, backing off
    while they do), and a viewer role sees the queue read-only.
  - Act from the Inbox: approve a proposal (and Approve all), answer a
    parked question, Approve / Approve short soak / Reject a pending
    release, approve or deny a local-script call, Submit a submittable
    changelist (kept out of Submit all), confirm a base-branch repair
    asks before it may merge without a human, and on each stuck row press
    the control its sub-case names (Run now, Cancel, Undefer or Retry
    merge) -- confirming each row leaves its tab and the task lands in
    the expected state.
  - New task sheet (`c`, the rail's New task, the Create menu's New task
    and Task from template, the phone's New task button): repository
    (only the deployment's configured repositories, a missing repo refused
    by name), title, description, attachments, base branch (and a
    `<fork-owner>:<branch>` fork head, malformed ones refused while Create
    stays disabled), Task priority (whole number ≥ 1, `1e3` normalized),
    Owner and Reviewers, auto-merge, Don't port, This fixes a red base
    branch, Keep running, grants (`GrantsPicker` with canonical
    `https://grain.dev/capabilities/api` references, capability policy
    verdicts, and `Escape` inside Add grant… closing only the menu), custom
    fields, and More options (Found in release `vX.Y.Z` with malformed
    values refused under the field, the model picker offering only
    advertised models, network and resources). File it queued and as a
    proposal, file from a template (its priority carried; a template with
    input fields asks for them first), confirm blocker feedback names
    what stops Create, and that `Escape` keeps the draft. `/new?field.<name>=`
    links have no `/next/` page yet: exercise them on the classic `/new`
    (with the notice naming values a `settings/new-task-form.yml` left
    out).
  - Tasks (`/next/tasks`, `/next/tasks/<id>` redirecting to the task
    page): the tabs (Backlog, Needs approval, Running, Asked, Submit &
    land, Deferred, Closed with Merged / Not merged / All), `/` and `?q=`
    search, Order (Run order, Priority, Oldest, Newest), grouping (None,
    Workstream, Repository), the repository chip (case-insensitive repo
    matching), the ready and blocked counts, the broken-base banner and
    backlog dispatch notice, Backlog reordering and each row's `⋮` menu,
    and closed-task paging and server-side search. Open a row into the
    side pane (`?task=` surviving reload, the resizer and split toggle,
    "moved" and next-task notices), and use Back/Forward. On the rows,
    confirm the state, Merging, priority chip, live sub-case chip with its
    reason on hover, `imported` and external PR `owner/repo#N` chips,
    "held for approval by <task>" chip, `keep_running` marker and a
    durable task's rollover banner. A failed task-list read says so before
    and after the first load rather than showing an empty list.
  - Selection bar on `/next/tasks`: tick rows (and Select all), then
    Approve, Run selected now, Close (asking first, with partial failures
    reported in the right plural), Reopen on the Closed tab, Bring back on
    the Deferred tab, and the More menu's Submit, Retry merge, Bulk edit
    (priority, base, auto-merge) and capability attach/detach. Confirm
    four calls run at a time with progress and Stop, rows that failed or
    were never sent stay ticked, offers follow the role, and with the
    pipeline in manual mode (set on the classic System → Pipeline, which
    has no `/next/` page yet) waiting rows carry "Paused — waits for Run
    now" until started.
  - Task page (`/next/task/<id>`, reached from the Inbox, the Tasks pane,
    Agents, Workstreams and links): its header actions -- Approve, Run
    now, Pause (confirming at once) and Pause immediately (asking before
    discarding unpushed work), Resume, Stop and Retry, Defer and Defer
    until… (a date picker waking at the start of the day in the display
    zone) and Bring back, Close and Reopen (the timeline naming who or
    why, wrapping long reasons on a phone), Re-run CI and Re-run failed
    jobs, Retry merge, Submit and Force merge… (needing full access) --
    and the Edit task panel (title, description, repo, base, priority,
    owner, external ref, reviewers, keep running, custom fields,
    auto-merge, Admission, Hosting, goal with `on_limit` kept on re-save,
    and dependencies whose chips name task and state on hover). Confirm
    each asks first where it should and the page follows without a
    reload.
  - Task page tabs: Conversation (Markdown with Mermaid diagrams --
    including fences in lists and blockquotes, legible on a phone, and an
    invalid one falling back -- attached images in the full-screen viewer,
    `#comment=<id>` deep links paging into a long conversation, a pending
    secret box, a `request_access` card with its reason as Markdown,
    `Grant all` vs `Grant M of N` and `Deny` with its required reason, a
    host-script approval with its stdin preview, a config-change card's
    Approve & merge config gated on `settings:write`, and a parked
    question); Runs (attempts, per-run and total token usage, transcripts
    and capability audit, the live transcript, a `resume_later` park
    reason); Changes and CI (the diff, CI verdict and links into
    `/next/ci/runs/<id>`); Workstream (the tree it belongs to, its done
    count, the current task as plain text); and Details (the Prompt pane
    in Markdown above Attributes, stacking at narrow splits, and Committed
    context).
  - Gates and holds on the task page: the merge rules its repository
    requires with the rule behind each, the security-review gate,
    human-review (`Release hold`) and path-trigger holds with their review
    links, owed approvals, a findings-blocked gate's Accept findings…
    dialog (offered only while it can act, with its reason recorded), the
    review-gate override, the overlap re-check where shown, a durable
    task's rollover banner, and a changelist's presubmit, review and
    behind badges with the reason Submit is disabled.

  ## Walkthrough protocol

  - Build and start this repository's real `grain demo` server over a
    throwaway embedded store, open its built frontend in an actual
    Playwright browser, and interact through visible UI controls. Do not
    substitute a source review, a jsdom-only test, or an API-only
    exercise for the walkthrough.
  - Prefer the Gemini-backed model and tooling when this sandbox carries
    a key at `/home/debian/.gemini-api-key`; never print, log or commit
    it. A repository-declared template carries no capabilities of its
    own, so what the sandbox holds is whatever this deployment already
    gives tasks in this repository.
  - Walk the new UI at `/next/` first: it is the new experience, and the
    classic UI at `/` is being deprecated ("Two UIs" in `PROMPT.md`).
    `ui-ng/src/app/shell/nav.ts` (the rail) and
    `ui-ng/src/app/app.routes.ts` (every route) say which pages have
    moved over -- a page in neither, such as Boards, is classic-only;
    walk each step on its `/next/` page where one exists, and on the
    classic page only where it does not yet. Note in the report
    which UI each step ran against, and which steps have no `/next/`
    page yet. Fix a classic page only where it is broken for users
    today, and fix the same page in `ui-ng/` too. New regression
    coverage goes in a `ui-ng/e2e/` spec (run with
    `make test-e2e-ng`), not a classic one; keep the
    classic specs passing and don't delete them.
  - Explore beyond the scripted cases in `ui/e2e`. Check browser console
    errors, failed network requests, loading/empty/error states,
    keyboard reachability, and destructive-action confirmations relevant
    to this area.
  - Confirm mutations by returning to the screen, reloading and
    deep-linking where applicable, and observing the persisted result.
    Stub only an unavailable external or system boundary; keep the real
    server, frontend, browser and user gestures in the loop, and
    document every stub.
  - Record the commit tested, the environment, the exact steps, the
    outcomes and every stub in a dated report under `docs/test-runs/`,
    named `YYYY-MM-DD-task-intake-inbox-lifecycle.md`. Do not commit
    screenshots or generated browser artifacts.
  - For each bug found: capture a deterministic reproduction; fix it in
    this task when the correction is safe and scoped; add regression
    coverage at the strongest practical level; and run the relevant
    tests. If the fix is unsafe, materially separate, or needs
    infrastructure this sandbox does not have, propose a focused
    follow-up task with `branch: "main"` carrying the reproduction,
    the evidence and the expected behaviour.
