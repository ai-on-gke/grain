name: Install walkthrough - leftover VM sweep
title: Delete install-walkthrough VMs left behind in grain-sandbox-dev
base: main
auto-merge: true
capabilities:
  - https://grain.dev/capabilities/gcp#gcp-key
body: |
  The weekly install walkthroughs (`docs/test-plans/install-walkthroughs.md`)
  each create throwaway VMs in `grain-sandbox-dev` labelled
  `purpose=grain-walkthrough` and delete them when they finish. A run that is
  cancelled or loses its sandbox cannot. This sweep is the safety net.

  1. With the `gcp-key` credential at `~/.gcp-service-account.json`
     (`gcloud auth activate-service-account --key-file ...`), list every
     instance in `grain-sandbox-dev` with the label
     `purpose=grain-walkthrough`, in every zone, with its name, zone,
     creation time and `grain-task` label.
  2. Delete each one created more than 6 hours ago. Leave younger ones
     alone: a walkthrough may still be using them.
  3. Delete the firewall rules named after a deleted VM
     (`grain-wt-<task id>...`) as well, and any disks the deletion left
     unattached.
  4. Touch nothing without that label, whatever it is called.

  Push nothing. Close with `comment_on_issue`: a table of what was deleted
  (name, zone, age, the task its label names) and what was left and why,
  and a note of any run that left something behind, since that is a bug in
  that walkthrough's cleanup. If there was nothing to delete, end with
  `nothing_needed` saying so. If the credential cannot list or delete
  instances, say which account it was (`client_email`) and which role it
  lacks.
