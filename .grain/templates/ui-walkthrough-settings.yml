name: UI walkthrough - Settings, its layout, lock and save model, Preferences, Access, CLI, Audit, General, Config repo, Models, Tasks, Agents, Memory and Context
title: Walk through Settings -- its layout, lock and save model, Preferences, Access, CLI, Audit, General, Config repo, Models, Tasks, Agents and Memory -- and Context
base: main
auto-merge: true
body: |
  Thoroughly exercise Settings at `/next/settings` -- its layout,
  filter, save, role and config-repo lock model, and the Preferences,
  Access, Audit, CLI, General, Config repo, Models, Tasks, Agents and
  Memory sections -- plus the Context page, in a real browser against a
  real server. Settings' Git, Hosts, Capabilities (including Deployment
  credentials), Hub, Engine, CI, Sandboxes and Caches sections are the
  infrastructure walkthrough's; Settings → Upgrade, Fleet, CI and Agents
  are the operations walkthrough's; Settings → Repositories is the repos
  walkthrough's.

  ## Coverage

  - Layout and paths: open Settings from the rail's Settings
    destination, the `,` shortcut and the account popover; walk its groups
    (Models & Compute, Repositories & Code, Work & Agents, Access &
    Security, Instance & Preferences) and confirm each section rides in
    the URL (`/next/settings/<section>`, `#<card>` scrolling to its card,
    old section names and old `settings/connections` links landing on
    Models, on a phone too) through reload and Back/Forward. Confirm old
    links land where they should: `/next/admin` and `/next/admin/<tab>`
    on their section, `/next/system/executors` on Hosts,
    `/next/system/integrations` on Capabilities' `#credentials`,
    `/next/system/upgrade` and `/next/system/caches` on their sections,
    `/next/config` and `/next/settings/config-repo/<file>` on the config
    repo viewer (`?path=`), and `/next/memory` on Context. Press `/` and
    confirm the filter it focuses narrows Settings, and that a miss says
    so.
  - Save, role and lock model: a switch or select commits on change and a
    text or number box on blur or Enter, while multi-line and composite
    cards wait for their own Save; confirm the saving/unsaved/failed
    state, that leaving a dirty section asks first and a reload does not
    silently drop an unsaved draft, that a field reads back what the
    server answered, that an out-of-range number is refused by name
    before it is sent, and that a restart-pending setting says so. With
    the UI lock on (Deployment identity & UI lock) or an external config
    repo, confirm config-managed sections render read-only with a way into
    the config repo viewer; with a role lacking a section's write scope,
    confirm it renders read-only, and that scope-gated cards wait for the
    access config before loading.
  - Preferences (Browser preferences): appearance (and the `t`
    shortcut), time zone (every printed time across tasks and Settings
    follows it, and with none chosen the browser's zone), and task
    timeline order; confirm nothing deployment-wide is saved from here.
  - Access, Audit and CLI: the RBAC allowlist and roles (per-row role,
    read-only without `access:write`, Add validating `user:`, `group:`
    and `serviceAccount:` entries with the role it offers one the server
    accepts, a Reason where required, and removal -- of your own account
    or the last entry above all -- asking first), External agent tokens
    (`gma_`), and the account popover's identity, role and scopes
    matching; the Audit log viewer (configuration changes without secret
    values, credential access, secret resolutions, empty and error
    states); and CLI (`/next/settings/cli`): the workstation installer
    (not the host installer), sign-in and agent-skill commands and their
    Copy buttons, usable under an external config repo.
  - General and Config repo: Deployment identity & UI lock (environment
    name, the lock disabled when there is no config repo), Broadcast
    message to active tasks (against throwaway tasks), and the updates
    mode; StateRepo synchronization (sync status and Sync), Remote
    repository & KMS secret key, the Config repository file viewer
    (`?path=`, file preview), and the failing-sync row in the Inbox
    pointing back here.
  - Models: provider connections (New connection, Test, Edit,
    Enable/Disable, Remove asking first, clearing a stored secret asking
    first, Refresh hidden without access and no refresh time for a
    provider that never answered), credentials stored vs ambient and a
    Codex connection's own ChatGPT subscription login (uploaded, its
    status read after switching, clearing asking first), Run on host
    placement, the default model and reasoning effort, on-demand model
    discovery feeding the pickers in New task, sessions, schedules and
    templates, the Token budget & usage guardrails card (weekly quota
    beside the interval, paused reset times on the local clock with the
    zone named), and resuming a paused connection or model.
  - Tasks and Agents: Task approval, merge queue & gates (approved and
    auto-merge by default, default grants via `GrantsPicker`, or read-only
    when locked, and the unreviewed follow-up depth and per-task limits),
    Quality control & PR rollout (off by default); Agent turn limits &
    default grants, Standing console sessions and Accept external agents.
    Save, reload and confirm a new task picks them up. Task fields (and
    the "still carries a value this field no longer offers" link) and
    Task branches have no `/next/` control yet: check them on the classic
    Settings → Tasks and Settings → Agents.
  - Memory and Context: the Memory section (deployment and per-repository
    notes, a reversible correction saved and read back, leaving with an
    unsaved edit asking first), and the Context page (`/next/context`,
    from the rail): Standing Instructions (editor and preview modes, saved
    by Save memory), Memory Documents (Packs) with search, scope,
    create/edit of a throwaway document and its prompt index summary,
    and the Namespace Browser (scheme, grep, render modes), with the
    list/editor resizer and an unsaved-edit guard.
  - Stub the GitHub, identity, upgrade, model-provider and config-repo
    boundaries (the model provider where a connection test reaches it)
    only where the demo lacks them, retaining the real Grain server and
    browser UI, and document each intercepted route.

  ## Walkthrough protocol

  - Build and start this repository's real `grain demo` server over a
    throwaway embedded store, open its built frontend in an actual
    Playwright browser, and interact through visible UI controls. Do not
    substitute a source review, a jsdom-only test, or an API-only
    exercise for the walkthrough.
  - Prefer the Gemini-backed model and tooling when this sandbox carries
    a key at `/home/debian/.gemini-api-key`; never print, log or commit
    it. A repository-declared template carries no capabilities of its
    own, so what the sandbox holds is whatever this deployment already
    gives tasks in this repository.
  - Walk the new UI at `/next/` first: it is the new experience, and the
    classic UI at `/` is being deprecated ("Two UIs" in `PROMPT.md`).
    `ui-ng/src/app/shell/nav.ts` (the rail) and
    `ui-ng/src/app/app.routes.ts` (every route) say which pages have
    moved over -- a page in neither, such as Boards, is classic-only;
    walk each step on its `/next/` page where one exists, and on the
    classic page only where it does not yet. Note in the report
    which UI each step ran against, and which steps have no `/next/`
    page yet. Fix a classic page only where it is broken for users
    today, and fix the same page in `ui-ng/` too. New regression
    coverage goes in a `ui-ng/e2e/` spec (run with
    `make test-e2e-ng`), not a classic one; keep the
    classic specs passing and don't delete them.
  - Explore beyond the scripted cases in `ui/e2e`. Check browser console
    errors, failed network requests, loading/empty/error states,
    keyboard reachability, and destructive-action confirmations relevant
    to this area.
  - Confirm mutations by returning to the screen, reloading and
    deep-linking where applicable, and observing the persisted result.
    Stub only an unavailable external or system boundary; keep the real
    server, frontend, browser and user gestures in the loop, and
    document every stub.
  - Record the commit tested, the environment, the exact steps, the
    outcomes and every stub in a dated report under `docs/test-runs/`,
    named `YYYY-MM-DD-user-system-settings.md`. Do not commit
    screenshots or generated browser artifacts.
  - For each bug found: capture a deterministic reproduction; fix it in
    this task when the correction is safe and scoped; add regression
    coverage at the strongest practical level; and run the relevant
    tests. If the fix is unsafe, materially separate, or needs
    infrastructure this sandbox does not have, propose a focused
    follow-up task with `branch: "main"` carrying the reproduction,
    the evidence and the expected behaviour.
