name: UI walkthrough - repositories, merge queue, releases
title: Walk through repository, merge queue, and release UI
base: main
auto-merge: true
body: |
  Thoroughly exercise the repository-centric operator workflow -- the
  Repos list, the repository page and its tabs, merge queue and gate
  policy, branches and releases -- on `/next/`, in a real browser against
  a real server.

  ## Coverage

  - Repos (`/next/repos`, from the rail and a direct URL): each
    repository with its open work by state (task-less stranded
    repositories not counted as open work), counts, search and sort,
    long names, and the Add form (its title kept on the first line,
    locked while an add is in flight, on screen at phone width). Follow a
    repository into its page and a count into the `?repo=`-narrowed
    `/next/tasks` (case-insensitive, and a removed repository still
    counting its remaining tasks), then return with browser navigation.
  - Repository page tabs (`/next/repos/<owner>/<name>/<tab>`, and
    `/next/repos/<host>/<owner>/<name>` for a non-default host): Overview,
    CI & Workflows, Merge Queue, Agents & Grants, Branches, Releases and
    Advanced through reload and Back/Forward, the selected tab kept in
    view on a phone, and a classic `/repos/<owner>/<name>/settings/<tab>`
    pasted under `/next/` landing on the same tab. Reach them also from
    Settings → Repositories (`/next/settings/repositories`), whose rows
    show base branch, Declarations, CI mode and Git connection. File a
    task from the repository page and confirm the repository is
    preselected.
  - Overview, CI & Workflows, and Agents & Grants: the summary, recent CI
    and GitHub issue import (enable, queue-at-once with its trust warning,
    source repository, label, the Every (minutes) interval, and Import
    issues now reporting read/imported/skipped counts or that it could
    not list the source); CI mode (only the modes the server accepts),
    Watch default branch, CI workflows and CI capabilities (the shared
    grants picker saving per change, the built-in `release` server's
    methods and capability policy verdicts for this repository); Default
    capabilities, Standing prompt extension beside its read-only
    deployment and `.grain/settings.yml` layers, and Sandbox setup
    command. Upstream repository (fork-to-upstream pull requests) has no
    `/next/` control yet: check it on the classic repo page's Agents tab.
    Confirm a refused setting's banner clears once it saves cleanly,
    config-repo-locked or role-restricted settings render read-only with
    their reason, saved values read back after reload, and leaving with an
    unsaved edit asks first while other saves on the page (ownership,
    import, plan) keep it.
  - Merge Queue (the "Merge queue & gate policy" card): Merge on green
    (its copy making no ordering claim), Require branch up to date before
    merge, and Base-branch repairs bypass human review gates (asking for
    confirmation when turned on, here and on Settings → Repositories, and
    not when turned off); Unfixable checks and the overlap re-check panel
    are still classic-only (the classic repo page's Merge queue tab).
    Switch CI mode between
    GitHub, grain and none and toggle work ownership, and confirm the
    warning that nothing judges the base branch appears on Overview and
    Releases, links to CI mode, clears once fixed, and is re-read when
    moving straight from one repository's page to another's.
  - Branches: the Repository branches table (branch and HEAD) and Create
    branch (New branch name, From ref, disabled without the route's
    scope). Comparing branches has no `/next/` page yet: on the classic
    repo page pick a base and head from the repository's own branches and
    open `/repos/<owner>/<name>/compare/<base>...<head>` (names with
    slashes or `#` included), inspecting the diff, a direct link and
    reload, and an unknown ref.
  - Releases: releases with status, history and task links, direct URLs
    (an unknown release falling back to the newest with an in-place
    explanation), create and edit (a refused name reported inline on its
    box), Cut RC and Promote RC (Promote asks first; the reason shown when
    either is off), release trains, Work ownership (the standing-work
    switch and three-valued per-item overrides across schedules and the
    release) and the Qualification plan editor (Promote automatically
    once…, its config-repo read-only notice and unsaved-edit guard).
  - Advanced: `.grain/` declarations (the switch reading the
    repository's own declarations, with their sync status), Trigger
    files, Extra push refs, the read-only Ports table when paired branches
    exist, and Remove repository (refusing the config repo and anything
    that would strand tasks); tables stay inside a phone's width.
  - If GitHub-derived branches, issue import, release state, or train
    execution is unavailable in the demo, intercept only that external
    boundary with realistic success, empty, loading and failure
    responses; do not replace Grain's own API or its UI.

  ## Walkthrough protocol

  - Build and start this repository's real `grain demo` server over a
    throwaway embedded store, open its built frontend in an actual
    Playwright browser, and interact through visible UI controls. Do not
    substitute a source review, a jsdom-only test, or an API-only
    exercise for the walkthrough.
  - Prefer the Gemini-backed model and tooling when this sandbox carries
    a key at `/home/debian/.gemini-api-key`; never print, log or commit
    it. A repository-declared template carries no capabilities of its
    own, so what the sandbox holds is whatever this deployment already
    gives tasks in this repository.
  - Walk the new UI at `/next/` first: it is the new experience, and the
    classic UI at `/` is being deprecated ("Two UIs" in `PROMPT.md`).
    `ui-ng/src/app/shell/nav.ts` (the rail) and
    `ui-ng/src/app/app.routes.ts` (every route) say which pages have
    moved over -- a page in neither, such as Boards, is classic-only;
    walk each step on its `/next/` page where one exists, and on the
    classic page only where it does not yet. Note in the report
    which UI each step ran against, and which steps have no `/next/`
    page yet. Fix a classic page only where it is broken for users
    today, and fix the same page in `ui-ng/` too. New regression
    coverage goes in a `ui-ng/e2e/` spec (run with
    `make test-e2e-ng`), not a classic one; keep the
    classic specs passing and don't delete them.
  - Explore beyond the scripted cases in `ui/e2e`. Check browser console
    errors, failed network requests, loading/empty/error states,
    keyboard reachability, and destructive-action confirmations relevant
    to this area.
  - Confirm mutations by returning to the screen, reloading and
    deep-linking where applicable, and observing the persisted result.
    Stub only an unavailable external or system boundary; keep the real
    server, frontend, browser and user gestures in the loop, and
    document every stub.
  - Record the commit tested, the environment, the exact steps, the
    outcomes and every stub in a dated report under `docs/test-runs/`,
    named `YYYY-MM-DD-repository-release-memory-ui.md`. Do not commit
    screenshots or generated browser artifacts.
  - For each bug found: capture a deterministic reproduction; fix it in
    this task when the correction is safe and scoped; add regression
    coverage at the strongest practical level; and run the relevant
    tests. If the fix is unsafe, materially separate, or needs
    infrastructure this sandbox does not have, propose a focused
    follow-up task with `branch: "main"` carrying the reproduction,
    the evidence and the expected behaviour.
