name: UI walkthrough - repositories, merge queue, releases
title: Walk through repository, merge queue, and release UI
base: main
auto-merge: true
body: |
  Thoroughly exercise the repository-centric operator workflow, in a
  real browser against a real server.

  ## Coverage

  - Open Repos from the rail and from a direct URL; inspect counts,
    search/sort, long-name layout (confirming the Blocked chip stays
    visible first on busy rows, Add repo locks while an add is in flight
    and stays on screen at phone width), and reorder repositories through
    pointer and keyboard/tap affordances.
  - Open a repo row and return to the list. Follow its task count into
    the filtered task list (confirming case-insensitive repo matching and
    that a removed repository's page still counts its remaining tasks,
    including closed work), then return with browser navigation.
  - File a task from the repo page and verify repo preselection and
    persistence.
  - Walk the repo page's tabs (Overview, CI, Merge queue, Agents,
    Branches, Releases, Advanced), each of which rides in the URL as
    `/repos/<owner>/<name>/settings/<tab>` (keeping the selected tab in
    view on a phone) through reload and Back/Forward, and reach them
    also from Settings → Repositories, whose rows show each repository's
    base branch, declarations, CI mode and git connection. Inspect and
    safely edit: on Overview, the summary, issue-import status, overlap
    re-check card and recent CI runs; on CI, CI mode, Watch default
    branch, CI workflows and CI capabilities (including the built-in
    `release` server's methods and capability policy verdicts judged for
    that repo); on Agents, Default capabilities, Upstream repository for
    fork-to-upstream pull requests, Prompt extension (alongside the
    read-only deployment and `.grain/settings.yml` layers), Setup command,
    and GitHub issue import (enable switch, queue-at-once switch with its
    trust warning, source repository, label, interval, and Import issues
    now reporting read/imported/skipped counts and saying it read nothing
    when the source repository cannot be listed); on Branches, Add branch;
    on Advanced, declaration syncing, trigger files, extra push refs and
    warnings, the read-only Ports table when paired branches exist, and
    Remove repository (refusing config-repo removal or stranding).
    Confirm a refused repo setting's banner clears as soon as that
    setting saves cleanly, config-repo-locked or role-restricted repo
    settings render read-only with their explanation, reload and verify
    saved values, and confirm leaving with an unsaved workflow,
    issue-import, upstream-repo, prompt or setup edit asks first.
  - Merge queue: switch the repository's CI mode between GitHub, grain
    and none (and toggle work ownership) and verify the base-gate
    warnings on the overview and the Releases pane appear, refresh
    without a reload, read correctly, link straight to CI Mode and clear
    once fixed; edit the merge queue settings (Require branches up to
    date, Merge when green and clean -- confirming its copy makes no
    ordering claim -- Base-branch repair PRs may merge without a human --
    confirming turning it on asks for confirmation on both Repo → Merge
    queue and Settings → Repositories while turning it off does not --
    and Unfixable checks); inspect the merge queue's overlap re-check
    panel (standing chip, elapsed time against max age, CI run and task
    links) on the repo page and on the task page.
  - Compare branches: pick a base and head on the repo page and open the
    pull request page (`/repos/<owner>/<name>/compare/<base>...<head>`,
    including branch names with slashes or `#`),
    choosing from the repository's own branches; inspect the diff, a
    direct link and reload, and an unknown ref. (Repository memory is on
    Settings → Memory, covered by the settings walkthrough.)
  - Walk through Releases: Work ownership (the Standing work on this
    deployment switch and per-item overrides across schedules and the
    release) alongside releases, qualification plans (including their
    unsaved-edit guard and config-repo read-only notice) and release
    trains, including direct URLs (and an unknown release URL falling
    back to the newest release with an in-place explanation),
    status/history, task links, create/edit controls (confirming a
    refused release name is reported inline on its box and clears on
    edit or create rather than lingering as a toast), Cut new RC and
    Promote current RC (and the reason shown when either is greyed out),
    and whatever validation and confirmations the demo exposes.
  - If GitHub-derived branches, issue import, release state, or train
    execution is unavailable in the demo, intercept only that external
    boundary with realistic success, empty, loading and failure
    responses; do not replace Grain's own API or its React UI.

  ## Walkthrough protocol

  - Build and start this repository's real `grain demo` server over a
    throwaway embedded store, open its built frontend in an actual
    Playwright browser, and interact through visible UI controls. Do not
    substitute a source review, a jsdom-only test, or an API-only
    exercise for the walkthrough.
  - Prefer the Gemini-backed model and tooling when this sandbox carries
    a key at `/home/debian/.gemini-api-key`; never print, log or commit
    it. A repository-declared template carries no capabilities of its
    own, so what the sandbox holds is whatever this deployment already
    gives tasks in this repository.
  - Walk the new UI at `/next/` first: it is the new experience, and the
    classic UI at `/` is being deprecated ("Two UIs" in `PROMPT.md`).
    `ui-ng/src/app/shell/nav.ts` (the rail) and
    `ui-ng/src/app/app.routes.ts` (every route) say which pages have
    moved over -- a page in neither, such as Boards, is classic-only;
    walk each step on its `/next/` page where one exists, and on the
    classic page only where it does not yet. Note in the report
    which UI each step ran against, and which steps have no `/next/`
    page yet. Fix a classic page only where it is broken for users
    today, and fix the same page in `ui-ng/` too. New regression
    coverage goes in a `ui-ng/e2e/` spec (run with
    `make test-e2e-ng`), not a classic one; keep the
    classic specs passing and don't delete them.
  - Explore beyond the scripted cases in `ui/e2e`. Check browser console
    errors, failed network requests, loading/empty/error states,
    keyboard reachability, and destructive-action confirmations relevant
    to this area.
  - Confirm mutations by returning to the screen, reloading and
    deep-linking where applicable, and observing the persisted result.
    Stub only an unavailable external or system boundary; keep the real
    server, frontend, browser and user gestures in the loop, and
    document every stub.
  - Record the commit tested, the environment, the exact steps, the
    outcomes and every stub in a dated report under `docs/test-runs/`,
    named `YYYY-MM-DD-repository-release-memory-ui.md`. Do not commit
    screenshots or generated browser artifacts.
  - For each bug found: capture a deterministic reproduction; fix it in
    this task when the correction is safe and scoped; add regression
    coverage at the strongest practical level; and run the relevant
    tests. If the fix is unsafe, materially separate, or needs
    infrastructure this sandbox does not have, propose a focused
    follow-up task with `branch: "main"` carrying the reproduction,
    the evidence and the expected behaviour.
