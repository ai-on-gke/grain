name: UI walkthrough - responsive shell, Director and live sessions
title: Walk through the responsive shell, the Director drawer and live-session UI
base: main
auto-merge: true
body: |
  Thoroughly exercise the shared `/next/` shell and the live interaction
  surfaces -- the rail, the phone bar, the Create menu, keyboard
  shortcuts, Help, the account popover, Customize navigation, the
  Director drawer and Sessions -- across desktop, tablet and phone
  layouts, in a real browser against a real server.

  ## Coverage

  - At representative desktop, iPad/tablet and narrow phone widths
    (including resizing between them), use the real navigation controls
    to visit every rail destination (Inbox, Workstreams, Tasks, Agents,
    Sessions, Processes, CI, Repos, Telemetry, Context, Fleet, Settings),
    a task page, a repository's tabs, a session, every Settings group and
    every Fleet tab, and confirm the links to pages with no `/next/`
    counterpart (classic Boards, comparing branches, `/new?field.` links)
    reach the classic page. Old `/next/t/<team>/...` links open their
    team-less page, and there is no team anywhere.
  - The rail on desktop and tablet: the grain mark (home to the Inbox),
    each destination with its tooltip and selected state, the Inbox count
    and live indicator, the More menu with its hidden count, New task and
    the Create menu (New task, Start a workstream, New session, Task from
    template, Run a suite, New schedule, New board), Next up (what runs
    next, with its queue-empty, blocked and paused notes and Open the
    backlog), the Director and Help buttons, the theme toggle, the avatar's
    account popover (identity, role and scope chips, the single-key
    shortcuts switch, Customize navigation and Sign out), and the build
    stamp opening Settings → Upgrade. Confirm the compact rail at tablet
    width keeps every control reachable and that navigation progress shows
    while a page loads, with a stalled origin never freezing the page.
  - On a phone: the bottom bar (Inbox, Tasks, Sessions and More), the More
    sheet (not rising past the top of the screen, with Customize
    navigation), the New task button (absent on Sessions, where the
    composer sits), and dialogs and side sheets staying inside a 390 px
    screen without horizontal page overflow.
  - Customize navigation (from the rail, the account popover and the More
    sheet): reorder and hide destinations, Save, Cancel and Reset, and
    confirm the change reaches every other open tab.
  - Keyboard and accessibility: the single-key shortcuts (`c` New task,
    `/` filter this view, `?` Help, `0` account, `,` Settings, `t` theme,
    `d` Director, and the number keys for destinations), ignored while
    typing and switched off from the account popover or Help (WCAG
    2.1.4); Help's Shortcuts, Glossary and About tabs; focus restoration
    when a dialog or inner menu closes (including `Escape` in Add grant…
    closing only the menu), accessible names, keyboard-only and
    touch paths, reduced motion turning transitions off, and light and
    dark WCAG AA contrast. Check role-gated rendering for a viewer role
    without write scopes and the WebKit path where supported.
  - Banners and feedback: the global dispatch banner above the page when
    dispatch is paused or a quota exhausted, the snackbar with its action
    and secondary action, and error states for a failed read -- none of
    them covering the rail or page controls, with sticky actions, nested
    scrolling, long names, Markdown and tables, orientation changes,
    Back/Forward, deep links and hard reloads all behaving, and no hidden
    or clipped controls or accidental background scrolling.
  - Director drawer (the Director button, `d`, and `/next/director`
    landing on `/next/sessions/director`): open it from every page, keep
    its context as you navigate (and toggle that context), widen it and go
    full screen, converse and Stop, shape a task in place (the draft
    callout, Shape task with Director, and opening the draft task, whose
    change shows on its page), and close it with `Escape`, focus trapped
    while open and returned on close.
  - Sessions (`/next/sessions`, `/next/sessions/<id>`): New session (from
    the Create menu and the page) with its composer focused, name, a model
    picker offering only configured models, and Pin; send the first
    message (shown at once as sending) and queue follow-ups while it
    starts; inspect the chat log, activity and status; edit the session's
    capability toggles and repositories (Reads all saved on the session,
    settings saved between runs, the apply-now banner, Adopt shipped
    defaults when missing); open the workspace canvas (Docs, an HTML
    preview and its source, the Memory editor and pin, and a plan card
    with its launch, proposal approval and tree), Start a fresh chat
    clean and with handover, and Delete with its confirmation. Confirm a
    failed sessions read says so rather than "No sessions yet", a deep
    link to a deleted session lists the sessions, no team is offered or
    printed, and the list width and resizer hold at each width.
  - Interactive task chat on `/next/task/<id>` (an `Interactive console`
    task): send and render messages, inline `request_access`, host-script
    and config-change approval cards, Pause and Resume, and the live
    transcript's reconnect behaviour.
  - The demo may not provide session managers, live streams, banners or
    device metrics. Intercept only those external or live boundaries,
    with realistic incremental, disconnect, empty and error states; keep
    navigation, Angular rendering, browser layout and the real Grain
    server in the loop. Do not weaken the exercise into screenshot-only
    inspection.

  ## Walkthrough protocol

  - Build and start this repository's real `grain demo` server over a
    throwaway embedded store, open its built frontend in an actual
    Playwright browser, and interact through visible UI controls. Do not
    substitute a source review, a jsdom-only test, or an API-only
    exercise for the walkthrough.
  - Prefer the Gemini-backed model and tooling when this sandbox carries
    a key at `/home/debian/.gemini-api-key`; never print, log or commit
    it. A repository-declared template carries no capabilities of its
    own, so what the sandbox holds is whatever this deployment already
    gives tasks in this repository.
  - Walk the new UI at `/next/` first: it is the new experience, and the
    classic UI at `/` is being deprecated ("Two UIs" in `PROMPT.md`).
    `ui-ng/src/app/shell/nav.ts` (the rail) and
    `ui-ng/src/app/app.routes.ts` (every route) say which pages have
    moved over -- a page in neither, such as Boards, is classic-only;
    walk each step on its `/next/` page where one exists, and on the
    classic page only where it does not yet. Note in the report
    which UI each step ran against, and which steps have no `/next/`
    page yet. Fix a classic page only where it is broken for users
    today, and fix the same page in `ui-ng/` too. New regression
    coverage goes in a `ui-ng/e2e/` spec (run with
    `make test-e2e-ng`), not a classic one; keep the
    classic specs passing and don't delete them.
  - Explore beyond the scripted cases in `ui/e2e`. Check browser console
    errors, failed network requests, loading/empty/error states,
    keyboard reachability, and destructive-action confirmations relevant
    to this area.
  - Confirm mutations by returning to the screen, reloading and
    deep-linking where applicable, and observing the persisted result.
    Stub only an unavailable external or system boundary; keep the real
    server, frontend, browser and user gestures in the loop, and
    document every stub.
  - Record the commit tested, the environment, the exact steps, the
    outcomes and every stub in a dated report under `docs/test-runs/`,
    named `YYYY-MM-DD-responsive-navigation-live-sessions.md`. Do not
    commit screenshots or generated browser artifacts.
  - For each bug found: capture a deterministic reproduction; fix it in
    this task when the correction is safe and scoped; add regression
    coverage at the strongest practical level; and run the relevant
    tests. If the fix is unsafe, materially separate, or needs
    infrastructure this sandbox does not have, propose a focused
    follow-up task with `branch: "main"` carrying the reproduction,
    the evidence and the expected behaviour.
