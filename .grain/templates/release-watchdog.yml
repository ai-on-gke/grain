name: Release watchdog
title: Verify latest base branch release status and health
base: main
auto-merge: true
nothing-needed: close
capabilities:
  - {capability: "https://grain.dev/capabilities/api#ci-read", with: {repo: ai-on-gke/grain}}
  - "https://grain.dev/capabilities/api#self-debug"
  - {capability: "https://grain.dev/capabilities/api#suites:read", with: {repo: ai-on-gke/grain}}
  - {capability: "https://grain.dev/capabilities/api#releases:read", with: {repo: ai-on-gke/grain}}
body: |
  Inspect the release pipeline status for base branches (particularly `main`), verifying that
  the latest base-branch release succeeded and is not lagging behind `main` or stalled.

  ## 1. Check release status

  - Check recent CI runs for release workflows (e.g. `.grain/workflows/release.yml`) using `list_ci_runs`.
  - Check the latest commits on `main` against the latest successful release commit.
  - Check whether any release run has failed, errored, timed out, or stalled.

  ## 2. Check release-candidate qualification

  Releases go out continuously from `main` (`design/playbook/releases.playbook.md`):
  the release train cuts `vX.Y.0-rc.N` from the newest known-good commit, qualifies
  it in two stages -- Stage 1 `nightly.yml` on the rc, then Stage 2, the
  `release-qualification` suite, whose verdict is check run
  `grain/release-qualification` on the rc's commit -- and then releases it itself
  (tags `vX.Y.0` and moves `latest`, in a tick of `.grain/schedules/release-train.yml`
  every 20 minutes), or stages `vX.Y.0-pending` for a person's Approve when it
  may not (a major bump, breaking changes, `RELEASE_AUTO_PROMOTE=false`).
  There is no staging soak and no 24-hour wait: a healthy
  rc is qualified in about 60-90 minutes. `.grain/workflows/release.yml` runs on
  every merge to `main`, so a green, current release run there says nothing about
  whether a release candidate is advancing. Check that from git and the rc's runs:

  - `git fetch origin --tags`, then list the newest rc, discarded, pending,
    retracted and release tags with their dates
    (`git for-each-ref --sort=-creatordate --count=10 --format='%(refname:short) %(creatordate:iso) %(objectname:short)' 'refs/tags/v*'`)
    and the commit `latest` points at.
  - For the newest `vX.Y.0-rc.N` with no `-discarded` marker, no `vX.Y.0-pending`
    and no `vX.Y.0`, it is still qualifying (or, once both stages passed,
    waiting out `RELEASE_MIN_INTERVAL_MINUTES`: the train says `promotion_waits=`). Report how long it has been since
    it was cut, and where it is:
    - Stage 1: the `nightly.yml` run on the rc tag (`list_ci_runs` with
      `provider: github-actions`, `workflow: nightly.yml` and `ref: <rc tag>`),
      its conclusion, and whether a job was re-run.
    - Stage 2: `grain ci checks <rc sha> --name grain/release-qualification`
      (status, conclusion and when it started and finished).
  - **Qualification lead time.** An rc qualifying for more than 4 hours, or one
    whose Stage 1 or Stage 2 has not started 30 minutes after the stage before
    it finished, is stalled: say which stage it is in and why, and propose a task
    (`branch: "main"`) to find out, unless one is already open or the reconciler
    has already raised `pipeline.release-infra-stalled:<rc tag>` for it.
  - **No rc while `main` moves.** With nothing qualifying, nothing pending, and
    `origin/main` more than `RELEASE_MIN_INTERVAL_MINUTES` (`scripts/release.conf`)
    plus 2 hours past the newest release with `feat:` or `fix:` commits since
    (`git log --oneline <latest>..origin/main`), the train is not cutting: check
    the newest `release-train.yml` runs and say what they reported
    (`release_waits=`, `rc_held=`, no LKG commit).
  - **A starved train tick.** A release-train task (tagged
    `schedule:<the release-train schedule's id>`) that has been `queued` for
    more than 1 hour without ever starting holds every tick after it
    (`overlap: skip`), so the train stops for as long as it waits. Report the
    task, how long it has waited and its priority. Check that grain raised
    `pipeline.schedule-starved:<schedule id>` for it and raised its
    priority (`docs/schedules.md`). If it has not, raise a warning yourself
    with
    `grain notify --severity warning --subject release-train-starved --title "Release train tick #<id> queued <duration> without starting"`.
  - **A red rc.** For each `vX.Y.0-rc.N-discarded` in the last 24 hours, report
    the attempt number and whether `pipeline.rc-failed:<rc tag>` triage or
    `[rc-blocker <rc tag>]` tasks exist (`grain task list` / `grain task read`,
    `grain api GET /api/notifications`); three failed attempts on one version
    should already have raised `pipeline.release-escalated:<version>`. The
    pipeline steward owns red rcs (`docs/pipeline-steward.md`): report, do not
    file fixes for them here.
  - **Flake retries.** Count the rc qualification jobs and items that failed once
    and passed on their one retry in the last 24 hours (Stage 1 jobs with a second
    attempt, Stage 2 items run twice in `grain api GET /api/suite-runs`). Two or
    more is over the flake budget (playbook section 3): name them, and check that
    `pipeline.flake-budget` has been raised for each and that a de-flake or
    quarantine task is open.
  - **A new release** (`vX.Y.0` in the last 24 hours): check that
    `publish-release.yml` ran on its tag and succeeded (images promoted, GitHub
    Release written). A train-made `vX.Y.0` with no published release is a fault.
  - **A pending release** (`vX.Y.0-pending` with no `vX.Y.0`) waits on a person's
    Approve, because the train may not release it. Report its age and why it was
    staged; it is not a fault.
  - **A retracted release** (`vX.Y.Z-retracted`) is a rollback a person made.
    Report any from the last 7 days, and check that `latest` does not point at a
    retracted release and that a fix-forward task exists for it.

  ## 2b. Check `main`'s nightly and live suites

  A release candidate is only cut from a `main` commit whose `tests.yml` and
  `release.yml` are green, and `nightly.yml` is the first stage of its
  qualification, so a `nightly.yml` that is red or not running on `main` is a
  red rc waiting to happen.
  This repository's CI is GitHub Actions (`ci_mode: github`), so `nightly`,
  `gcp-smoke`, `live-agent` and `live-frameworks` are GitHub Actions workflows,
  not grain CI runs: their list rows
  carry no YAML job ids, and a `job:` filter such as `go-long` never matches them.
  Query them by workflow file instead:

  - `list_ci_runs` with `repo: ai-on-gke/grain`, `ref: main`,
    `provider: github-actions`, `workflow: nightly.yml` and `since: 26h`
    (`grain ci list --repo ai-on-gke/grain --ref main --provider github-actions --workflow nightly.yml --since 26h`),
    and the same with `workflow: gcp-smoke.yml`, and with `workflow: live-agent.yml`
    and `workflow: live-frameworks.yml` (`since: 36h`). Report the newest run's
    conclusion and URL for each. A live suite with no run on `main` for more than
    36 hours has stopped firing (or the `live-models` environment lost a secret
    and every run fails at "Require the live-models secrets"); report it with
    subject `pipeline.live-suite-missing:ai-on-gke/grain`.
  - **If `nightly.yml` has no run on `main` in the last 26 hours**, its schedule has
    stopped firing (or the workflow was disabled). Raise it, whatever else you find:

        grain notify --subject pipeline.nightly-missing:ai-on-gke/grain --severity warning \
          --title "nightly.yml has not run on main in 26h" \
          --body "<the newest nightly.yml run you could find, its date, and what you checked>"

    The `pipeline.*` subject also wakes the pipeline steward. Do the same for
    `gcp-smoke.yml` with subject `pipeline.gcp-smoke-missing:ai-on-gke/grain`.
  - A red, `timed_out` or `startup_failure` `nightly.yml` run is triaged by the
    `nightly-ci-review` schedule (`.grain/schedules/nightly-ci-review.yml`), which
    files a review task for every such run; check that one exists for the newest
    red run rather than filing another.

  For `live-secrets-repo`, which still runs in grain CI, find the newest
  concluded grain CI run on `main` (`list_ci_runs` with `ref: main`,
  `provider: grain`, `since: 36h` and `job: live-secrets-repo`), and report its
  verdict. No run on `main` for more than 30 hours means its schedule is not
  firing; that is a fault to report.

  - Do not repair a red suite here unless it is a release pipeline fault: its own
    review task owns it. Propose a task (`branch: "main"`) only for a `regression`
    that neither the review task nor anything else has filed.

  ## 3. Diagnose and repair if stalled or failed

  - If a release run has failed or errored:
    - Inspect the job and step logs using `get_ci_log`.
    - Identify the root cause (workflow definition, build script, test failure, or configuration).
    - Repair the issue on a fix branch or propose repair tasks with `branch: "main"`.
  - If the release pipeline is lagging significantly behind `main` or has stalled:
    - Determine why the release run did not trigger or complete.
    - Propose or perform corrective action.

  ## 4. Verify and report

  - If fixes were applied on this task's branch, commit with descriptive
    messages, push the branch, and wait for CI checks to pass (`grain pr open`
    and `grain ci wait`).
  - Otherwise (no branch pushed on this task -- whether everything is healthy
    or faults were handled via `grain notify` and `propose_task`), close with
    `nothing_needed` (never `comment_on_issue`, which parks a branchless task
    in `awaiting_reply` and holds the 6-hour `overlap: skip` schedule) passing
    the full pipeline health and triage summary as its `reason`: the newest
    release and rc, the rc's stage and age, the flake retries and retractions
    you counted, and any notifications raised or follow-up tasks proposed. If
    a fault needs a person's direct action and no `pipeline.*` notification
    already covers it, raise `grain notify --severity warning` before calling
    `nothing_needed`.
