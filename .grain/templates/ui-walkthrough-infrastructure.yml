name: UI walkthrough - Settings' connections and infrastructure sections
title: Walk through Settings -- Git, Hosts, Capabilities, Hub, Engine, CI, Sandboxes and Caches
base: main
auto-merge: true
body: |
  Thoroughly exercise the Settings sections that connect grain to
  outside systems and tune the machines it runs on -- Git, Hosts,
  Capabilities (including Deployment credentials), Hub, Engine, CI,
  Sandboxes and Caches at `/next/settings/<section>` -- in a real browser
  against a real server. Settings' layout, filter, save and lock model
  and its other sections (Models, Preferences, Access, CLI, Audit, Config
  repo, General, Agents, Tasks, Memory) are the settings walkthrough's;
  the live sandbox, host, cache and CI status on Fleet and the CI page is
  the operations walkthrough's.

  ## Coverage

  - Git (`/next/settings/git`): Agent Git identity & host, and the Git
    connections & tokens table; add, test and remove (asking first) a
    throwaway connection on a plain git host (token, and SSH key with its
    known_hosts) and on GitHub as a token and as a GitHub App with its
    scope and proxy, confirming GitHub App is offered only for a GitHub
    host, reusing a stored credential keeps its host kind, naming a
    missing credential is refused with the server's reason, and a fixed
    connection clears its refusal on save. Confirm the no-git-connection
    notice in the New task sheet and on `/next/repos` names tokens and SSH
    keys and links here.
  - Hosts (`/next/settings/hostds`; `/next/settings/hosts` and the old
    `/next/system/executors` land here): Enrollment codes & pending hosts
    (the Invite hosts `--join` command, New code with expiry, max uses,
    capacity, labels and allowed principals, Rotate and Revoke), pending
    requests showing the key fingerprint wrapped in its cell rather than a
    pairing code with Accept and Reject, and the Hosts table (edit
    owner/labels/capacity, Rename, Revoke, each host's available
    grain-agentd update, and Delete -- asking first and reporting the
    pauses it cleared -- and Delete all revoked).
  - Capabilities (`/next/settings/capabilities`): Capability servers
    (MCP) with the deprecation notices for retired in-process grants
    (`git-push-any-ref` included), the built-in servers first and
    disable-only (Disable flipping the state chip without a reload),
    `needs-configuring` until configured, placed servers saying "host"
    and warning when their host is away, and a failed server reading as
    failed. Configure a throwaway server through its schema form (Host
    placement on a `run: hostd` server, `gcp` keyless vs key mode), edit,
    rename, test and remove it (asking first), confirm its own secrets stay
    on the server and are cleaned up on Remove, follow a holder link to
    its task, and exercise config-map/secret-map placements and the host
    process server's scripts against throwaway entries only.
  - Capability grant policy, API scope sets and Deployment credentials
    (`#capability-policy`, `#api-scope-sets`, `#credentials`,
    `#other-secrets`, reached in-app by their old names too): edit the
    policy and confirm pickers (New task, templates, schedules, tasks,
    repository defaults) show `denied` and `may_be_refused` verdicts;
    create, edit and remove a throwaway scope set (asking first when
    grants hold it); and in Deployment credentials, the GitHub host, the
    GCP project and service-account pool, and stored secrets -- add, mask,
    replace and remove a throwaway one, retired capability secrets still
    shown, locked mode dimming settings but leaving secrets usable, and
    role gating following `settings:write` and `secrets:write`. Confirm
    the scope-set table and secret rows fit a phone, and that no
    standalone Framework API keys card remains.
  - Hub (`/next/settings/registry`, Registry & Hub): Grain Hub connection
    (status chip, Heartbeat now, last heartbeat, error and scope-conflict
    alerts, advertised repository scopes), Catalog & authentication (Hub
    URL, entry name, `token` vs `oidc` credential source and audience,
    listing, and the encrypted registration token), and Scope overrides
    (adding and removing Primary, Secondary and Exclude repo rules), with
    config-repo lock dimming fields while the token stays editable.
  - Engine, CI and Caches: Engine's polling interval and worker limit and
    the merge queue's per-branch limit with the sandbox commitment note;
    CI runner & retention defaults (queue, history, job cache,
    artifacts); and the proxy and Actions cache maximum sizes. Confirm
    blanks reset to their defaults, out-of-range values are refused by
    name, and values read back after reload.
  - Sandboxes (`/next/settings/sandboxes`): Sandbox backend & sizing (the
    server's own vocabulary and defaults, backends that cannot run here
    disabled with their reason), network and session idle TTL, Sandbox
    budget (fixed ratios and auto overcommit bounds, a cleared overcommit
    or floor box saving grain's default, a hidden refusal cleared), the
    Kubernetes card (defaults, validation, no stale node selector text),
    Custom sandbox image (reverting cleanly on removal), Persistent
    sandboxes, and the probe running a real probe.
  - Stub the git-host, GitHub, capability-server, Hub, secret-validation,
    host-process and Kubernetes boundaries only where the demo lacks
    them, retaining the real Grain server and browser UI, and document
    each intercepted route.

  ## Walkthrough protocol

  - Build and start this repository's real `grain demo` server over a
    throwaway embedded store, open its built frontend in an actual
    Playwright browser, and interact through visible UI controls. Do not
    substitute a source review, a jsdom-only test, or an API-only
    exercise for the walkthrough.
  - Prefer the Gemini-backed model and tooling when this sandbox carries
    a key at `/home/debian/.gemini-api-key`; never print, log or commit
    it. A repository-declared template carries no capabilities of its
    own, so what the sandbox holds is whatever this deployment already
    gives tasks in this repository.
  - Walk the new UI at `/next/` first: it is the new experience, and the
    classic UI at `/` is being deprecated ("Two UIs" in `PROMPT.md`).
    `ui-ng/src/app/shell/nav.ts` (the rail) and
    `ui-ng/src/app/app.routes.ts` (every route) say which pages have
    moved over -- a page in neither, such as Boards, is classic-only;
    walk each step on its `/next/` page where one exists, and on the
    classic page only where it does not yet. Note in the report
    which UI each step ran against, and which steps have no `/next/`
    page yet. Fix a classic page only where it is broken for users
    today, and fix the same page in `ui-ng/` too. New regression
    coverage goes in a `ui-ng/e2e/` spec (run with
    `make test-e2e-ng`), not a classic one; keep the
    classic specs passing and don't delete them.
  - Explore beyond the scripted cases in `ui/e2e`. Check browser console
    errors, failed network requests, loading/empty/error states,
    keyboard reachability, and destructive-action confirmations relevant
    to this area.
  - Confirm mutations by returning to the screen, reloading and
    deep-linking where applicable, and observing the persisted result.
    Stub only an unavailable external or system boundary; keep the real
    server, frontend, browser and user gestures in the loop, and
    document every stub.
  - Record the commit tested, the environment, the exact steps, the
    outcomes and every stub in a dated report under `docs/test-runs/`,
    named `YYYY-MM-DD-connections-infrastructure-settings.md`. Do not
    commit screenshots or generated browser artifacts.
  - For each bug found: capture a deterministic reproduction; fix it in
    this task when the correction is safe and scoped; add regression
    coverage at the strongest practical level; and run the relevant
    tests. If the fix is unsafe, materially separate, or needs
    infrastructure this sandbox does not have, propose a focused
    follow-up task with `branch: "main"` carrying the reproduction,
    the evidence and the expected behaviour.
