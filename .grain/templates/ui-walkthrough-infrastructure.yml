name: UI walkthrough - Settings' connections and infrastructure sections
title: Walk through Settings -- Git, Hosts, Capabilities, Hub, Engine, CI, Sandboxes and Caches
base: main
auto-merge: true
body: |
  Thoroughly exercise the Settings sections that connect grain to
  outside systems and tune the machines it runs on -- Git, Hosts,
  Capabilities (including Deployment credentials), Hub, Engine, CI,
  Sandboxes and Caches -- in a real browser against a real server.
  Settings' layout, filter, save and lock model and its other sections
  (Models, Preferences, Access, CLI, Audit, Config repo, General, Agents,
  Tasks, Memory) are the settings walkthrough's; the live sandbox, cache
  and CI status in System and on the CI page is the operations
  walkthrough's.

  ## Coverage

  - Git (`/settings/git`): the git connections table; add, test and
    remove a throwaway connection on a plain git host (token, and SSH
    key with known hosts, confirming GitHub App is offered only for a
    GitHub host and nameless connections remain distinguishable in Reuse
    authentication from) and on GitHub as a token and as a GitHub App,
    with its scope and proxy; confirm a fixed connection takes down its
    refusal banner on save, Remove asks first, the GitHub host pointer
    opens `Settings → Capabilities#credentials`, and the
    no-git-connection notice in New task and on Repos names tokens and
    SSH keys and links here.
  - Hosts (`/settings/hosts` and `/settings/hostds`): Invite hosts shared
    `--join` snippet (enrollment code chips, New code with expiry/max
    uses/default capacity/default labels/allowed principals, Rotate code
    and Revoke code), Pending host requests (verified enrollee, no
    pairing code, rekey requests, key fingerprint, editable Host
    name/labels/capacity, Accept and Reject), Hosts table (`local`,
    key-bound and legacy token rows showing host address, principal and
    build when connected, Edit owner/labels/capacity including clearing a
    blanked capacity and dismissing resolved errors, Rename, Revoke,
    Delete for revoked hosts behind a confirmation reporting cleared
    pauses, and Delete all revoked listing any skipped), and legacy
    per-host token registration.
  - Capabilities (`/settings/capabilities`, `/settings/capabilities/<id>`,
    and the old `/settings/capability-servers` link): deprecation notices
    for retired in-process grants (`gcp-key`, `model-proxy`, `gemini-key`,
    `release`, `grain-ci`, `bootstrap-playbooks`, `github-sandbox`);
    capability servers with the built-in in-process ones (`grain`, `repo`,
    `gcp`, `github`, `release`, `model-proxy`, `config-map`, `secret-map`,
    `host-process`, `figma`) first, disable-only (confirming Disable
    flips a server's state chip to `disabled` without a reload),
    `needs-configuring` until configured, and `needs-hostd` warning when
    a placed host server's host is away; open `(i)` info popovers by
    click and keyboard (`Enter`/`Space`); configure a throwaway server
    through its schema form (including `Host` placement on a `run: hostd`
    server, `gcp` keyless token vs service-account key mode, and `figma`
    account `Test` and OAuth `Connect Figma` callback instructions where
    exposed), edit, rename and test it in place, confirm its own secrets
    stay on the server rather than under Deployment credentials' Other
    secrets and are cleaned up on Remove, and follow a holder link to a
    task's page. Exercise config-map and secret-map file placements and
    the host process server's host scripts (edit, test, and the version,
    adopted runs and allowlist suggestions it reports), against throwaway
    entries only.
  - Capability policy and API scope sets (`#capability-policy`,
    `#api-scope-sets`): edit the capability policy, save, reload, and
    confirm capability pickers (New task, templates, schedules, tasks and
    repository defaults) reflect `denied` and `may_be_refused` verdicts
    (without blaming policy for `repo#read` being CI-only) and link back
    to `#capability-policy`; create, edit and remove a throwaway API
    scope set (confirming sets declared after startup appear in pickers
    and Remove asks first when grants hold it).
  - Deployment credentials (`#credentials` and `#other-secrets` at the
    foot of `/settings/capabilities`, and old `/settings/credentials`,
    `/settings/legacy-capabilities`, `/settings/secrets`,
    `/admin/integrations` and `/system/integrations` redirects keeping
    the target card clear of the header): the GitHub host, the GCP
    project and legacy service-account pool with links to the `gcp`
    server, and the stored secrets (`SecretsPanel` -- without storing
    real credentials: add, mask, replace and remove a throwaway one,
    confirming server changes refresh the list, retired capability
    secrets remain visible, locked mode dims the settings fields while
    leaving secrets usable, and role gating follows `settings:write` and
    `secrets:write` independently of `capabilities:admin`).
  - Hub (`/settings/registry`): the `Hub connection` card
    (`#registry-status`, status chip across `Not configured` /
    `Connecting` / `Connected` / `Degraded` / `Heartbeat error`,
    `Heartbeat now`, last heartbeat and health summary, error and
    scope-conflict alerts, advertised repository scopes with origin
    chips, Hub URL, Entry name, Credential source `token` vs `oidc` and
    `OIDC audience`, Platform, Display name, Purpose, `Listed in hub
    directory`, and the encrypted `Registration token (grc_…)` secret
    field) and `Scope overrides` (`#registry-scopes`, adding and removing
    `Primary`, `Secondary` and `Exclude repo` rules with optional path
    prefix, and confirming config-repo lock dims fields and selects while
    keeping the registration token editable).
  - Engine: Polling (Poll interval with its blank-means-default `10s`
    placeholder, and Max worker agents) and Merge queue (Max merges per
    repo branch, default `5`, with the sandbox commitment note); verify
    blank-to-reset behaviour and out-of-range validation.
  - CI and Caches: on CI (`/settings/ci`), the CI queue, CI history, CI
    job cache and CI artifacts cards; on Caches (`/settings/caches`), the
    proxy cache and Actions cache maximum sizes; save, reload and verify
    the values read back.
  - Sandboxes (`/settings/sandboxes`): Backend and size (including the
    "None (control plane only)" description and backends that cannot run
    here shown disabled with the reason), network, Session sandbox idle
    TTL, the Sandbox budget with fixed overcommit ratios and the auto
    overcommit bounds (an out-of-range bound refused by name), the disk
    floor (confirming a blank minimum resets to its default), the
    Kubernetes card (its prefilled defaults, field validation and pod
    priority classes) and the custom sandbox image card (contract, mirror
    hints, and cleanly reverting to the default image on removal).
  - Stub the git-host, GitHub, capability-server, Hub, secret-validation,
    host-process and Kubernetes boundaries only where the demo lacks
    them, retaining the real Grain server and browser UI, and document
    each intercepted route.

  ## Walkthrough protocol

  - Build and start this repository's real `grain demo` server over a
    throwaway embedded store, open its built frontend in an actual
    Playwright browser, and interact through visible UI controls. Do not
    substitute a source review, a jsdom-only test, or an API-only
    exercise for the walkthrough.
  - Prefer the Gemini-backed model and tooling when this sandbox carries
    a key at `/home/debian/.gemini-api-key`; never print, log or commit
    it. A repository-declared template carries no capabilities of its
    own, so what the sandbox holds is whatever this deployment already
    gives tasks in this repository.
  - Walk the new UI at `/next/` first: it is the new experience, and the
    classic UI at `/` is being deprecated ("Two UIs" in `PROMPT.md`).
    `ui-ng/src/app/shell/nav.ts` says which destinations have moved
    over; walk each step on its `/next/` page where one exists, and on
    the classic page only where it does not yet. Note in the report
    which UI each step ran against, and which steps have no `/next/`
    page yet. Fix a classic page only where it is broken for users
    today, and fix the same page in `ui-ng/` too. New regression
    coverage goes in a `ui/e2e/next-*.spec.js` spec (listed in
    `ui/package.json`'s `test:e2e:next`), not a classic one; keep the
    classic specs passing and don't delete them.
  - Explore beyond the scripted cases in `ui/e2e`. Check browser console
    errors, failed network requests, loading/empty/error states,
    keyboard reachability, and destructive-action confirmations relevant
    to this area.
  - Confirm mutations by returning to the screen, reloading and
    deep-linking where applicable, and observing the persisted result.
    Stub only an unavailable external or system boundary; keep the real
    server, frontend, browser and user gestures in the loop, and
    document every stub.
  - Record the commit tested, the environment, the exact steps, the
    outcomes and every stub in a dated report under `docs/test-runs/`,
    named `YYYY-MM-DD-connections-infrastructure-settings.md`. Do not
    commit screenshots or generated browser artifacts.
  - For each bug found: capture a deterministic reproduction; fix it in
    this task when the correction is safe and scoped; add regression
    coverage at the strongest practical level; and run the relevant
    tests. If the fix is unsafe, materially separate, or needs
    infrastructure this sandbox does not have, propose a focused
    follow-up task with `branch: "main"` carrying the reproduction,
    the evidence and the expected behaviour.
