name: UI walkthrough - Settings' connections and infrastructure sections
title: Walk through Settings -- Git, Hosts, Capabilities, Legacy capabilities, Engine, CI, Sandboxes and Caches
base: main
auto-merge: true
body: |
  Thoroughly exercise the Settings sections that connect grain to
  outside systems and tune the machines it runs on -- Git, Hosts, Capabilities,
  Legacy capabilities, Engine, CI, Sandboxes and Caches -- in a real
  browser against a real server. Settings' layout, filter, save and lock
  model and its other sections (Models, Preferences, Access, Config repo,
  General, Agents, Tasks, Memory) are the settings walkthrough's; the
  live sandbox, cache and CI status in System and on the CI page is the
  operations walkthrough's.

  ## Coverage

  - Git (`/settings/git`): the git connections table; add, test and
    remove a throwaway connection on a plain git host (token, and SSH
    key with known hosts, confirming GitHub App is offered only for a
    GitHub host and nameless connections remain distinguishable in Reuse
    authentication from) and on GitHub as a token and as a GitHub App,
    with its scope and proxy; confirm Remove asks first, and that the
    no-git-connection notice in New task and on Repos names tokens and
    SSH keys and links here.
  - Hosts (`/settings/hosts` and `/settings/hostds`): Invite hosts shared
    `--join` snippet (enrollment code chips, New code with expiry/max uses/
    default capacity/default labels/allowed principals, Rotate code and
    Revoke code), Pending host requests (verified enrollee, no pairing code, key fingerprint, editable Host name/labels/capacity, Accept
    and Reject), Hosts table (`local`, key-bound and legacy token rows,
    Edit owner/labels/capacity, Rename, Revoke, Delete for revoked hosts
    behind a confirmation, and Delete all revoked listing any skipped),
    and legacy per-host token registration.
  - Capabilities (`/settings/capabilities`, and the old
    `/settings/capability-servers` link): capability servers with the
    built-in ones first, disable-only (confirming Disable flips a
    server's state chip to `disabled` without a reload), and a
    needs-configuring state until configured; open `(i)` info popovers by
    click and keyboard (`Enter`/`Space`); configure a throwaway server
    through its schema form, edit, rename and test it in place, confirm
    its own secrets stay on the server rather than under Legacy
    capabilities' Other secrets and are cleaned up on Remove, and follow
    a holder link to a task's page. Exercise config-map and secret-map
    file placements and the host process server's host scripts (edit,
    test, and the version, adopted runs and allowlist suggestions it
    reports), against throwaway entries only.
  - Capability policy and API scope sets (`#capability-policy`,
    `#api-scope-sets`): edit the capability policy, save, reload, and
    confirm capability pickers (New task, templates, schedules, tasks and
    repository defaults) reflect `denied` and `may_be_refused` verdicts
    and link back to `#capability-policy`; create, edit and remove a
    throwaway API scope set (confirming Remove asks first when grants
    hold it).
  - Legacy capabilities (`/settings/credentials`): the GitHub host, the
    GCP project and service accounts, and the legacy capabilities and
    the secrets each one uses (without storing real credentials: add,
    mask, replace and remove a throwaway one).
  - Engine: Polling (Poll interval with its blank-means-default `10s`
    placeholder, and Max worker agents) and Merge queue (Max merges per
    repo branch, with the sandbox commitment note); verify blank-to-reset
    behaviour and out-of-range validation.
  - CI: the CI queue, CI history, CI job cache and CI artifacts cards;
    save, reload and verify the values read back.
  - Sandboxes: Backend and size (including the "None (control plane
    only)" description and backends that cannot run here shown disabled
    with the reason), network, Session sandbox idle TTL, the Sandbox
    budget with fixed overcommit ratios and the auto overcommit bounds
    (an out-of-range bound refused by name), the disk floor, the
    Kubernetes card (its prefilled defaults, field validation and pod
    priority classes) and the custom sandbox image card (contract and
    mirror hints).
  - Caches: the proxy cache and Actions cache maximum sizes, saved,
    reloaded and read back.
  - Stub the git-host, GitHub, capability-server, secret-validation,
    host-process and Kubernetes boundaries only where the demo lacks
    them, retaining the real Grain server and browser UI, and document
    each intercepted route.

  ## Walkthrough protocol

  - Build and start this repository's real `grain demo` server over a
    throwaway embedded store, open its built frontend in an actual
    Playwright browser, and interact through visible UI controls. Do not
    substitute a source review, a jsdom-only test, or an API-only
    exercise for the walkthrough.
  - Prefer the Gemini-backed model and tooling when this sandbox carries
    a key at `/home/debian/.gemini-api-key`; never print, log or commit
    it. A repository-declared template carries no capabilities of its
    own, so what the sandbox holds is whatever this deployment already
    gives tasks in this repository.
  - Explore beyond the scripted cases in `ui/e2e`. Check browser console
    errors, failed network requests, loading/empty/error states,
    keyboard reachability, and destructive-action confirmations relevant
    to this area.
  - Confirm mutations by returning to the screen, reloading and
    deep-linking where applicable, and observing the persisted result.
    Stub only an unavailable external or system boundary; keep the real
    server, frontend, browser and user gestures in the loop, and
    document every stub.
  - Record the commit tested, the environment, the exact steps, the
    outcomes and every stub in a dated report under `docs/test-runs/`,
    named `YYYY-MM-DD-connections-infrastructure-settings.md`. Do not
    commit screenshots or generated browser artifacts.
  - For each bug found: capture a deterministic reproduction; fix it in
    this task when the correction is safe and scoped; add regression
    coverage at the strongest practical level; and run the relevant
    tests. If the fix is unsafe, materially separate, or needs
    infrastructure this sandbox does not have, propose a focused
    follow-up task with `branch: "main"` carrying the reproduction,
    the evidence and the expected behaviour.
