name: UI walkthrough - Fleet, Agents, CI, Upgrade, alerts and banners
title: Walk through Fleet (Sandboxes, Hosts, Pauses & Controls, Daemon Logs), Agents, CI, Settings → Upgrade, the classic System tabs, alerts and banners
base: main
auto-merge: true
body: |
  Thoroughly exercise the observability and operator-control screens --
  Fleet and its tabs, Agents, the CI page, Settings → Upgrade, the global
  dispatch banner and alerts, and the classic System tabs that have no
  `/next/` page yet -- in a real browser against a real server. The
  settings that tune the same machinery are Settings' (the settings and
  infrastructure walkthroughs).

  ## Coverage

  - Fleet (`/next/fleet`, from the rail): its tabs (Sandboxes, Hosts,
    Pauses & Controls, Daemon Logs) riding in `?tab=` through reload,
    Back/Forward and on a phone, and the old links landing where they
    should -- `/next/system` and `/next/system/health|sandboxes|top` on
    Fleet, `/next/system/logs` and `/next/admin/logs` on Daemon Logs,
    `/next/system/pipeline|power` on Pauses & Controls,
    `/next/system/caches` and `/next/caches` on Settings → Caches,
    `/next/system/metrics` on Telemetry and `/next/system/upgrade` on
    Settings → Upgrade, each keeping its query.
  - Fleet → Sandboxes: Host Process Snapshot (top), Live Task Sandboxes
    (lifetimes and storage in the deployment's time zone, long-table
    scrolling), persistent sandboxes, the Waiting on CI card (tasks parked
    on `resume_later` with waited, waiting for, repository, branch and CI
    mode, refreshing on its own and when a task changes state), and the
    Publishing held / Publishing nothing banners naming what holds a base
    branch; confirm empty, loading and error states.
  - Fleet → Hosts, Pauses & Controls and Daemon Logs: the hosts with
    their state; Pipeline Dispatch Gate (pause and resume, asking first),
    Model Usage-Limit Pauses (reset times, resuming one), Proxy & Actions
    Caches (usage against ceiling and each Flush, asking first, against
    throwaway entries only), and Daemon Lifecycle (Restart grain daemon?
    asking first, and the refusal shown when this deployment cannot
    restart itself); the daemon and unit logs with tail and search. Never
    actually restart or mutate the host; intercept only those POST
    boundaries and verify cancel, success and failure.
  - Classic System tabs with no `/next/` content yet (walk them at
    `/system/<tab>` on the classic UI, since `/next/system/<tab>`
    redirects): Health (the alerts with their links, config-repo backing
    state, settings saved but not applied until a restart linking to their
    `#<field-id>`, the GitHub API budget, daemon health counters, the
    `grain hostd` readiness note and the host-mode install notice),
    Pipeline's manual mode (confirming the alert it raises appears and
    clears), and Power's Reboot host and Shut down host confirmations,
    intercepted as above.
  - Agents (`/next/agents`, from the rail): narrow (All, Working, Setting
    up, Quiet) and group (No grouping, Repository, Model, Host work),
    inspect each card's per-run CPU and sparkline and what it is doing,
    select a card by click and by Enter (stepping in on-screen order),
    open and close the inspector to a full-width card view, use the split
    toggle and resizer, confirm the list has one scroller so the last
    card is reachable, a tablet does not cover the page with a sheet, and
    Contact running agents sends (or cancels) a message; check the
    dispatch notice and loading, empty and failed states.
  - CI (`/next/ci`, `/next/ci/runs/<id>`, from the rail and from task
    links): narrow by provider (All providers, Grain CI, GitHub Actions)
    and outcome, open runs, jobs, steps and log output, reload a direct
    link including a run id the daemon no longer remembers, and inspect
    pending/running/passed/failed/cancelled runs; re-run a concluded run
    (following to the run it starts, with its URL), Cancel run on an open
    one (with its reason), Run workflow, and Quarantine flaky test,
    against throwaway runs only.
  - Settings → Upgrade (`/next/settings/upgrade`, from the build stamp at
    the foot of the rail): the current version, Not available when grain
    cannot upgrade itself, externally managed mode, the target picker and
    release notes (breaking-change warnings), discarded-RC and
    retracted-release warnings, the image source, Start upgrade asking
    first, and cancel or rollback where offered. Never actually upgrade;
    intercept only that boundary.
  - Alerts and banners: on `/next/` alerts arrive in the Inbox's Blocked
    & alerts tab (with their links, an acknowledged alert leaving the
    count) and the global dispatch banner sits above every page when
    dispatch is paused or a model quota is exhausted (its details toggle
    and links into Fleet and Telemetry, staying in step with Fleet's own
    view). Drive (or, where only a live boundary can cause them,
    intercept) the reconciler-down, failing config-repo sync,
    connection pause, pipeline pause and manual mode, setup and
    red-base-branch repair alerts, confirming wording, links and that each
    clears with its cause. The classic shell's alerts bell and its
    disconnected banner (on failed polls and on a daemon that holds
    connections without answering, clearing without a reload) remain to
    check on the classic UI.
  - Stub the host, CI-execution, cache, upgrade and live-connection
    boundaries only where the demo lacks them, retaining the real Grain
    server and browser UI, and document each intercepted route.

  ## Walkthrough protocol

  - Build and start this repository's real `grain demo` server over a
    throwaway embedded store, open its built frontend in an actual
    Playwright browser, and interact through visible UI controls. Do not
    substitute a source review, a jsdom-only test, or an API-only
    exercise for the walkthrough.
  - Prefer the Gemini-backed model and tooling when this sandbox carries
    a key at `/home/debian/.gemini-api-key`; never print, log or commit
    it. A repository-declared template carries no capabilities of its
    own, so what the sandbox holds is whatever this deployment already
    gives tasks in this repository.
  - Walk the new UI at `/next/` first: it is the new experience, and the
    classic UI at `/` is being deprecated ("Two UIs" in `PROMPT.md`).
    `ui-ng/src/app/shell/nav.ts` (the rail) and
    `ui-ng/src/app/app.routes.ts` (every route) say which pages have
    moved over -- a page in neither, such as Boards, is classic-only;
    walk each step on its `/next/` page where one exists, and on the
    classic page only where it does not yet. Note in the report
    which UI each step ran against, and which steps have no `/next/`
    page yet. Fix a classic page only where it is broken for users
    today, and fix the same page in `ui-ng/` too. New regression
    coverage goes in a `ui-ng/e2e/` spec (run with
    `make test-e2e-ng`), not a classic one; keep the
    classic specs passing and don't delete them.
  - Explore beyond the scripted cases in `ui/e2e`. Check browser console
    errors, failed network requests, loading/empty/error states,
    keyboard reachability, and destructive-action confirmations relevant
    to this area.
  - Confirm mutations by returning to the screen, reloading and
    deep-linking where applicable, and observing the persisted result.
    Stub only an unavailable external or system boundary; keep the real
    server, frontend, browser and user gestures in the loop, and
    document every stub.
  - Record the commit tested, the environment, the exact steps, the
    outcomes and every stub in a dated report under `docs/test-runs/`,
    named `YYYY-MM-DD-deployment-operations.md`. Do not commit
    screenshots or generated browser artifacts.
  - For each bug found: capture a deterministic reproduction; fix it in
    this task when the correction is safe and scoped; add regression
    coverage at the strongest practical level; and run the relevant
    tests. If the fix is unsafe, materially separate, or needs
    infrastructure this sandbox does not have, propose a focused
    follow-up task with `branch: "main"` carrying the reproduction,
    the evidence and the expected behaviour.
