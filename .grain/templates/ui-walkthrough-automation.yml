name: UI walkthrough - processes, schedules, templates, suites
title: Walk through Processes -- schedules, templates, suites, suite runs and triggers
base: main
auto-merge: true
body: |
  Thoroughly exercise Grain's recurring and composed-work automation UI
  -- the Processes page and the schedules, templates, suites, suite runs
  and triggers it lists -- end to end, in a real browser against a real
  server.

  ## Coverage

  - Processes: open it from the rail (`/processes`) and check its count
    (confirming SPA navigation refreshes schedules, templates and suites
    alongside triggers and suite runs). Use the kind chips (All,
    Schedules, Workflow schedules, Templates, Suites, Triggers) with
    their counts, search, the toolbar's narrowing and the sort (Next run,
    Last run, Name, Kind, Custom order, with reorder through pointer and
    keyboard/tap). Confirm the narrowing rides in the query (`?kind=`,
    `?q=`) through reload and Back/Forward, that templates and suites
    show the last and next runs derived from the schedules that fire them
    ("on demand" when none does), and that the old `/schedules`,
    `/templates` and `/suites[/<id>]` links land on the matching
    Processes view or item.
  - New: open the header's New menu (Schedule, Template, Suite, and the
    hint that workflow schedules and triggers are declared in a
    repository), and confirm that with the kind chips narrowed to one
    creatable kind New opens that kind directly.
  - Schedules: create both task-filing and suite-running schedules;
    exercise recurrence variants (every N minutes and its ten-minute
    floor, and `git_ref` branch/tag triggers -- confirming forbidden
    watched repos are refused while existing off-target `git_ref`
    schedules show their `Suppressed` warning chip, detail line and
    `"suppressed"` next-run label on `/processes` and can still be
    paused), overlap policy, template/raw task composition,
    repo/base/writes/reads, grants (the Grain API group and capability
    policy verdicts included), Admission (`Standard`, `Bypass queue`,
    `Durable`), Hosting (`Unattended`, `Interactive console`), Keep
    running (`keep_running`), network/custom fields, the searchable agent
    and model picker (only models the deployment's enabled connections
    advertise, and what a model no connection serves looks like),
    validation and composition preview (confirming a saved schedule
    previews its chosen model, a template-backed schedule previews its
    own hosting, and declared capabilities/source chips stay inside their
    value column). Edit, pause, resume, run now, follow a schedule's task
    or suppressed-task link (confirming an unsaved edit asks once before
    leaving), and delete throwaway schedules, verifying confirmations,
    persisted next/last-run presentation, and that the row and its
    template's and suite's rows follow without a reload.
  - Templates: create a fully populated template (its Task priority
    whole-number and `1e3` validation, Admission, Hosting, Keep running,
    interactive switch, capability policy verdicts and searchable model
    picker included); file from it via New task from this template
    (confirming New task opens on that template with its priority carried
    across, whereas a template with input fields opens Use… instead) and
    via Use… (reading the note an interactive template shows there, and
    confirming an unbound template with `Reads` drops the chosen target
    repo from `Reads` rather than failing); edit and reopen it (confirming
    suites referencing it refresh on rename/save and the footer stays one
    line tall and apart at phone width); use it from a schedule and from
    a suite (confirming composition previews show its priority, admission
    and hosting and keep long grant chips inside the pane at phone width);
    test dependency-aware delete behaviour and then remove only throwaway
    data.
  - Suites: create and edit a suite using the searchable Templates
    picker, create a template inline (and confirm a role lacking
    `suites:write` sees suite mutations gated with `+ New template` kept
    in place when refused), exercise run modes/pass
    limits/approval/auto-merge, and delete a throwaway suite with
    confirmation.
  - Start a suite run from both the suite row and the generic Run
    action. Inspect the Suite runs list under Processes,
    scheduled/running/finished/failure presentations (confirming a
    base-less suite run shows "default branch" on its row and pane and
    the status chip stays whole on a narrow row), direct URLs
    (`/processes/suites/runs/<id>`), pass grouping, spawned tasks and
    proposed follow-ups, and task-detail navigation.
  - Repository-declared templates, suites, schedules, workflow schedules
    and triggers (`docs/declarations.md`): confirm that a declared row is
    shown as declared, names the repository and file it came from,
    disables `GrantsPicker` and mutating controls on its overlay, and
    refuses to edit or delete it with an explanation rather
    than failing silently; workflow schedules carry no `System` chip and
    their Run now says it starts the run straight away, and a trigger row
    opens its file on the repository's Advanced tab.
  - The demo may not run real agents. Stub only the agent/execution
    boundary, or seed through the real server's supported store/demo
    path, to obtain realistic run states; every create/edit/run gesture
    and all rendering must still pass through the real browser UI and
    the real Grain server.

  ## Walkthrough protocol

  - Build and start this repository's real `grain demo` server over a
    throwaway embedded store, open its built frontend in an actual
    Playwright browser, and interact through visible UI controls. Do not
    substitute a source review, a jsdom-only test, or an API-only
    exercise for the walkthrough.
  - Prefer the Gemini-backed model and tooling when this sandbox carries
    a key at `/home/debian/.gemini-api-key`; never print, log or commit
    it. A repository-declared template carries no capabilities of its
    own, so what the sandbox holds is whatever this deployment already
    gives tasks in this repository.
  - Walk the new UI at `/next/` first: it is the new experience, and the
    classic UI at `/` is being deprecated ("Two UIs" in `PROMPT.md`).
    `ui-ng/src/app/shell/nav.ts` (the rail) and
    `ui-ng/src/app/app.routes.ts` (every route) say which pages have
    moved over -- a page in neither, such as Boards, is classic-only;
    walk each step on its `/next/` page where one exists, and on the
    classic page only where it does not yet. Note in the report
    which UI each step ran against, and which steps have no `/next/`
    page yet. Fix a classic page only where it is broken for users
    today, and fix the same page in `ui-ng/` too. New regression
    coverage goes in a `ui/e2e/next-*.spec.js` spec (listed in
    `ui/package.json`'s `test:e2e:next`), not a classic one; keep the
    classic specs passing and don't delete them.
  - Explore beyond the scripted cases in `ui/e2e`. Check browser console
    errors, failed network requests, loading/empty/error states,
    keyboard reachability, and destructive-action confirmations relevant
    to this area.
  - Confirm mutations by returning to the screen, reloading and
    deep-linking where applicable, and observing the persisted result.
    Stub only an unavailable external or system boundary; keep the real
    server, frontend, browser and user gestures in the loop, and
    document every stub.
  - Record the commit tested, the environment, the exact steps, the
    outcomes and every stub in a dated report under `docs/test-runs/`,
    named `YYYY-MM-DD-recurring-composed-ui.md`. Do not commit
    screenshots or generated browser artifacts.
  - For each bug found: capture a deterministic reproduction; fix it in
    this task when the correction is safe and scoped; add regression
    coverage at the strongest practical level; and run the relevant
    tests. If the fix is unsafe, materially separate, or needs
    infrastructure this sandbox does not have, propose a focused
    follow-up task with `branch: "main"` carrying the reproduction,
    the evidence and the expected behaviour.
