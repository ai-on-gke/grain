name: UI walkthrough - processes, schedules, templates, suites
title: Walk through Processes -- schedules, templates, suites, suite runs and triggers
base: main
auto-merge: true
body: |
  Thoroughly exercise Grain's recurring and composed-work automation UI
  -- the `/next/processes` page and the schedules, triggers, templates,
  suites, suite runs and repository declarations it lists -- end to end,
  in a real browser against a real server.

  ## Coverage

  - Processes (`/next/processes`, from the rail): its sections
    (Schedules & Triggers, Templates, Suites & Runs, Repo Workflows &
    Declarations) and items riding in the URL
    (`/next/processes/<section>/<id>`) through reload and Back/Forward,
    with the old `/next/schedules`, `/next/templates`, `/next/suites[/<id>]`,
    `/next/processes/schedule/<id>` and `/next/processes/suites/runs/<id>`
    links landing on their item rather than the Inbox. Use the filters
    (Daily, Weekly, Monthly, All; Active, Paused, Event triggers,
    Suppressed; All, Deployment, Repo-declared, Built-in), `?q=` search
    and the sort (Custom order with reorder, Next run, Last run, Name,
    Kind -- a Kind sort on suites reading as custom), the list/inspector
    resizer, and confirm templates and suites show the last and next runs
    derived from the schedules that fire them, SPA navigation refreshes
    the lists, and a failed read says so.
  - New: the header's New menu (Schedule, Template, Suite, and its hint
    that workflow schedules and triggers are declared in a repository)
    and the rail's Create menu (Task from template, Run a suite, New
    schedule), each opening the right dialog or section.
  - Schedules: create task-filing, template-backed and suite-running
    schedules; exercise each recurrence (Every N min with its ten-minute
    floor, Every N hr, Daily, Weekly with its weekday, Monthly, GitHub
    workflow, and Git ref push -- forbidden watched repos refused, while an
    existing off-target `git_ref` schedule shows Suppressed and can still
    be paused), the overlap policy, repository and base, grants with
    policy verdicts, Admission, Hosting, Keep running, the model picker,
    and a refused save naming its reason inside the dialog. In the
    inspector, read the Prompt pane (Markdown) above Configuration and the
    composition preview, and confirm a held schedule says why it is held
    and what its skips became. Edit, pause, resume, run now, follow its
    task link, and delete a throwaway schedule, verifying confirmations
    and that its row and its template's and suite's rows follow without a
    reload.
  - Templates: create a fully populated template (Task priority with
    `1e3` and whole-number validation, Admission, Hosting, Keep running,
    interactive, policy verdicts and model picker); file from it through
    the launch dialog (repository and base, previews using placeholders
    only for required fields, an unbound template with `Reads` dropping
    the chosen target from `Reads`) and through the New task sheet (its
    priority carried across); edit and reopen it, confirming suites that
    use it refresh; read its Prompt pane; test dependency-aware delete
    and then remove only throwaway data.
  - Suites & Runs: create and edit a suite through its Templates picker
    (mode, pass limits, Require approval before each pass, Auto-merge
    passing pull requests), confirm a role lacking `suites:write` sees
    suite mutations gated, and delete a throwaway suite with confirmation.
    Start a run from the suite and from Run a suite (its dialog's
    repository and base), switch to runs, and inspect
    scheduled/running/finished/failed runs, run labels, a base-less run
    reading "default branch", a pass that filed no tasks shown without
    crashing or promising a pass, pass grouping, spawned tasks and
    proposed follow-ups, and navigation into `/next/task/<id>`.
  - Repo Workflows & Declarations: per repository, the declarations
    switch, sync errors, discovered `.grain/` files, the acceptances card,
    and the workflows card with Add workflow. Confirm repository-declared
    templates, suites, schedules, workflow schedules and triggers
    (`docs/declarations.md`) are marked Repo-declared, name their
    repository and file, disable grants and other mutating controls with
    an explanation rather than failing silently, that declared triggers
    appear under Event triggers, and that a workflow schedule's Run now
    says it starts the run straight away.
  - The demo may not run real agents. Stub only the agent/execution
    boundary, or seed through the real server's supported store/demo
    path, to obtain realistic run states; every create/edit/run gesture
    and all rendering must still pass through the real browser UI and
    the real Grain server.

  ## Walkthrough protocol

  - Build and start this repository's real `grain demo` server over a
    throwaway embedded store, open its built frontend in an actual
    Playwright browser, and interact through visible UI controls. Do not
    substitute a source review, a jsdom-only test, or an API-only
    exercise for the walkthrough.
  - Prefer the Gemini-backed model and tooling when this sandbox carries
    a key at `/home/debian/.gemini-api-key`; never print, log or commit
    it. A repository-declared template carries no capabilities of its
    own, so what the sandbox holds is whatever this deployment already
    gives tasks in this repository.
  - Walk the new UI at `/next/` first: it is the new experience, and the
    classic UI at `/` is being deprecated ("Two UIs" in `PROMPT.md`).
    `ui-ng/src/app/shell/nav.ts` (the rail) and
    `ui-ng/src/app/app.routes.ts` (every route) say which pages have
    moved over -- a page in neither, such as Boards, is classic-only;
    walk each step on its `/next/` page where one exists, and on the
    classic page only where it does not yet. Note in the report
    which UI each step ran against, and which steps have no `/next/`
    page yet. Fix a classic page only where it is broken for users
    today, and fix the same page in `ui-ng/` too. New regression
    coverage goes in a `ui-ng/e2e/` spec (run with
    `make test-e2e-ng`), not a classic one; keep the
    classic specs passing and don't delete them.
  - Explore beyond the scripted cases in `ui/e2e`. Check browser console
    errors, failed network requests, loading/empty/error states,
    keyboard reachability, and destructive-action confirmations relevant
    to this area.
  - Confirm mutations by returning to the screen, reloading and
    deep-linking where applicable, and observing the persisted result.
    Stub only an unavailable external or system boundary; keep the real
    server, frontend, browser and user gestures in the loop, and
    document every stub.
  - Record the commit tested, the environment, the exact steps, the
    outcomes and every stub in a dated report under `docs/test-runs/`,
    named `YYYY-MM-DD-recurring-composed-ui.md`. Do not commit
    screenshots or generated browser artifacts.
  - For each bug found: capture a deterministic reproduction; fix it in
    this task when the correction is safe and scoped; add regression
    coverage at the strongest practical level; and run the relevant
    tests. If the fix is unsafe, materially separate, or needs
    infrastructure this sandbox does not have, propose a focused
    follow-up task with `branch: "main"` carrying the reproduction,
    the evidence and the expected behaviour.
