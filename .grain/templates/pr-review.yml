# The general code review every grain-opened pull request on this
# repository gets, filed by .grain/triggers/every-pr.yml (one review per
# pull request head, re-reading only what a later push changed). It posts
# findings and fixes nothing. grain appends the subject of the review and
# its own findings-only and testing rules to this body.
#
# No `network:` key, so the deployment's default applies. `none` would
# fail setup on any host that cannot isolate a sandbox's network
# (orchestrator.sandboxesIsolateNetwork), and it would also block the
# module downloads that a targeted `go test -run` needs.
name: PR review
title: "Review {{pr}}"
body: |
  Review the change in this pull request the way a careful senior
  maintainer of grain would, and post what needs fixing. Read the diff
  (`git diff {{base_sha}}...HEAD` or the pull request's file list) and as
  much of the surrounding code as you need to judge it. Do not review the
  whole repository.

  ## What to check

  - **Correctness and edge cases.** Bugs, off-by-ones, nil and empty
    inputs, races and missing locking, leaked goroutines or handles,
    errors dropped, swallowed or wrapped without context, and behaviour
    on retry, restart or a partial failure.
  - **Tests.** The change has a test, and the test really exercises the
    new behaviour: it would fail without the change, and it does not
    just assert on a mock it set up itself. Flag flaky patterns such as
    `time.Sleep` used for ordering, shared package-level state without
    `t.Cleanup`, port or timing assumptions, and order-dependent
    subtests.
  - **Security.** Credentials and tokens are not logged, put in error
    messages, or written into prompts or tasks. Inputs that cross a trust
    boundary are validated. If the change touches a trust-boundary path,
    grain's security review is already reviewing that head, so do not
    repeat its deep review. Flag only what you notice in passing.
  - **Compatibility.** API, CLI, wire-protocol and config compatibility:
    a field renamed or removed, a default changed, a schema migration
    that cannot be read back. Docs (`docs/`, `design/`, CLI help and
    specs) have to change with the behaviour they describe. Follow the
    repository conventions in `PROMPT.md` and `.grain/settings.yml`,
    for example conventional-commit subjects, no Google-internal tokens
    in core, and "hosts" rather than `hostd` in user-facing text.
  - **Which UI.** Follow "Two UIs" in `PROMPT.md`: `ui-ng/` (served at
    `/next/`) is the new experience and the classic `ui/` is being
    deprecated. Flag a new UI feature built in `ui/` instead of `ui-ng/`
    (unless the feature can't work without it), a classic bug fix that
    leaves the same page broken in `ui-ng/`, new e2e coverage or
    screenshots added for classic pages instead of `/next/`, deleted
    classic tests, and an API change that breaks either UI or leaves
    `ui-ng/src/app/api/generated-routes.ts` out of date.
  - **Beyond the diff.** For every function, type, flag, route, schema or message
    the change alters (on an incremental re-review, in the new commits only),
    find who uses it outside the diff (`git grep -n '<name>'`, including tests,
    `ui/`, `ui-ng/`, `docs/`, `design/spec/`, scripts and `.grain/`) and check
    each caller or consumer still works, or is updated, with the new behaviour --
    including image tags, artifacts or metadata keys a workflow or script reads
    that a publisher really emits. A caller left broken outside the diff is still
    this change's bug.
  - **External contracts.** If the change alters anything another program parses
    or calls -- an MCP tool's input schema, an agent-API or REST body, a CLI flag
    or exit code, a forge API call (GitHub or another git host, including the
    edition's command-backed forge), a model provider request, a VM's metadata
    keys, or the host agent wire protocol -- check it against what that consumer
    accepts, not only grain's own tests: every JSON-schema `array` has `items`,
    `object` properties are typed, and `enum`/`oneOf` are valid for the strictest
    provider (Gemini rejects a whole tool list for one bad schema); every
    documented or wrapped spelling of a field or flag still decodes; keys match
    what the consumer reads (case, prefix, snake_case); and errors come back as
    the documented error rather than a raw decode message.
  - **Multi-host and edition paths.** Tests here run one local host, github.com,
    SQLite or local Postgres, and the open-source build. If the change touches
    hosts, sandboxes, repositories, forges or registries, check what it does with
    a remote or dialling-in host that is slow, lost or not yet connected (never a
    synchronous dial on a request or poll path, and bounded retries), a
    repository on a non-default git host (is the host kept end to end?), the
    kubernetes-granule backend, a hosted VM, and seams the edition layer
    registers through `capability.Register` or `pkg/change`.
  - **Optional dependencies and test shape.** For each new use of a dependency
    that can be absent -- a nil store, client, forge, hub, namespace or edition
    hook -- check the code handles it absent without panicking or silently
    reading nothing, and that a test builds the server or orchestrator with it
    unset. A new test must pass under nightly's `-count=2 -shuffle=on`: reset
    package-level state and restore `log`'s writer in `t.Cleanup` (you may run
    that single test with `-count=2 -shuffle=on`). If the change alters an
    output, grep for tests pinning the old one; if it adds a check or probe,
    confirm the test exercises the real path rather than a stub that always
    passes.
  - **Task lifecycle.** If the change reads or sets task state, deferral, holds,
    wakes, links or comments, walk it through every state the task can be in --
    proposed, queued, running, awaiting_reply, awaiting_submit, completed,
    closed, and reopened from closed -- and the parked ones: deferred,
    `resume_later` on CI, a task or a time, or waiting on a question. Check that
    what it sets is cleared on every exit (early wake, verdict, close, reopen),
    that anything posted while the task was closed or parked still reaches its
    next run, and that two reconcilers cannot both act on the same task.
  - **Migrations and stored data.** If the change edits
    `pkg/model/migrations.go`, a `*_migration.go`, `pkg/staterepo` or a stored
    type: check the migration is idempotent on both SQLite and Postgres (it may
    meet a column, row or value that already exists); that rows written by
    earlier versions still pass validation, state check and import after
    migrating; that dump and import carry every new field and declaration key;
    that a renamed or aliased value never expands into a retired one; and that
    `SchemaVersion` and `pkg/staterepo/dump.go`'s import threshold moved
    together. A migration that cannot be re-run safely needs
    `request_human_review`.
  - **Docs and messages that point somewhere.** When an error, refusal, UI hint,
    CLI help string or doc tells someone to visit a route or page, set a key,
    pass a flag, run a command or edit a file, check that target exists and
    actually grants or changes what the message says (for example, a workflow
    file vs a repository settings page), and that `docs/`, `design/spec/` and CLI
    help move with any behaviour they describe.

  ## Keep the review cheap

  - Do not run broad or full test suites: no `go test ./...`, no `-race`
    across packages, and not the whole of `pkg/ui` or `pkg/orchestrator`.
    Do not run `grain ci wait` or `wait_for_checks` either. The change's
    own GitHub Actions run is the test signal, so read its result with
    `grain pr open` or the check statuses instead of waiting on it or
    running it again.
  - At most, run one narrowly targeted test (`go test ./pkg/<pkg> -run
    <Name>`) when you need it to confirm or refute a specific finding,
    and say in your closing note which test you ran and why.
  - Do not push, commit or open a pull request. Findings go on the pull
    request and the task.

  ## Reporting

  - Record each real problem with `add_review_comment`, on the line it
    is about, saying what is wrong and the fix you recommend.
  - Do not comment on formatting or style that `gofmt`, `go vet`,
    prettier or the repository's linters already enforce. Do not post
    nitpicks or matters of taste either.
  - If nothing needs fixing, call no `add_review_comment` and finish
    with `comment_on_issue` saying plainly "No findings", with a line on
    what you checked. A review with no findings is what lets the change
    merge itself.
