name: UI walkthrough - saved boards, Timeline, Workstreams, Telemetry and visualizations
title: Walk through saved boards, the Timeline, Workstreams, Telemetry and the classic board visualizations
base: main
auto-merge: true
body: |
  Thoroughly exercise saved views and every board presentation -- the
  saved boards and Timeline on `/next/tasks`, Workstreams, Telemetry, and
  the board visualizations that still live only in the classic UI --
  using the seeded demo data and the UI's own creation flows, in a real
  browser against a real server.

  ## Coverage

  - Saved boards on `/next/tasks`: open the Boards menu and apply a
    saved board (it opens with its tab, search, repository and view, and
    Back/Forward step through it); save the current view with Save
    current view as board -- from the menu and from the rail's Create
    menu → New board, confirming the active filters and Timeline mode are
    kept -- and close the save bar with Cancel and `Escape`; delete a
    throwaway board, which asks first. Confirm same-named boards in
    different folders carry distinct names, the menu stays on screen
    with names readable on a phone, a failed `/api/boards` read says the
    boards could not be loaded rather than "No saved boards yet", and a
    viewer role is offered neither save nor delete.
  - Timeline (`/next/tasks?view=timeline`): switch between List and
    Timeline on each tab, group by repository and workstream, inspect
    bars (still-open tasks, a just-filed one included, drawn to now),
    open a task from a bar into the side pane, check the empty state, and
    confirm the view and its narrowing survive a reload and that a board
    saved from the Timeline comes back as the Timeline.
  - Workstreams (`/next/workstreams`, `/next/workstreams/<key>`, and the
    old `/next/topology`): narrow by filer (People, System, All), state
    (Any, Active, Needs person, Blocked, Done), repository and scope,
    confirming the narrowing rides in the URL through reload; inspect the
    lanes (Needs a person, Planning, Running, Blocked, Parked, Done (last
    14d)), open a stream's page ("In this stream", the goal in its
    inspector, `?node=` deep links) and follow rows into
    `/next/task/<id>` and back; start one from the Create menu's Start a
    workstream.
  - Telemetry (`/next/telemetry`; `/next/metrics` and
    `/next/system/metrics` redirect here): change the window (Last week, This week,
    This month; `?window=` surviving reload), narrow by repository and
    contributor, and inspect the throughput, latency, outcomes and tools
    cards, the cycle-time bars, token usage by connection with budgets
    and the weekly quota beside the interval, paused-scope reset times on
    the local clock with the zone named, and loading/empty/error states;
    follow task links and confirm Back returns to the report.
  - Classic Boards (no `/next/` page yet; `/next/boards` falls through to
    the Inbox, so walk `/boards`): the index from the classic rail and
    direct URLs -- folders (same-named boards distinguishable), ordering
    and drag reorder, counts, narrowing, search and sort, Back/Forward
    and reload, and a failed `/api/boards` read explained rather than "No
    boards yet" -- and New board from the classic create menu and the
    index header, following the task or proposal it files; a viewer role
    is offered no New board, Edit board, drag reorder or Add panel / Keep.
  - Classic list, kanban and timeline boards: open task detail from rows,
    cards and bars, edit columns, move cards and columns by mouse and by
    keyboard/tap (move slots naming tasks by id), and confirm state and
    order persist; cards show Merging, the blocked oval, `keep_running`,
    "held for approval" and `imported` chips, a custom-column board
    separates "Asked to submit" from "Asked for a reply" in its "in no
    column" summary, and a timeline board orders Asked after Running and
    keeps its range and lanes through reload.
  - Classic tree and dashboard boards: a `tree` board nests tasks under
    their filer with its narrowing kept through reload; a dashboard's
    whole-board narrowing (no Keep on a throughput panel it would not
    change), add/request, reorder and open panels, panel query scoping,
    links into task lists with Back restoring focus, and
    loading/empty/error panels.
  - Classic report boards: the window (`?window=`) and Refresh, reordering
    the measurement sections (silent ones omitted), repo and query
    scoping, and task references and backlog counts as real links whose
    counts match their lists, with Back restoring focus.
  - Exercise delete and confirmation only where the UI actually exposes
    it, and only against throwaway objects created in this run.

  ## Walkthrough protocol

  - Build and start this repository's real `grain demo` server over a
    throwaway embedded store, open its built frontend in an actual
    Playwright browser, and interact through visible UI controls. Do not
    substitute a source review, a jsdom-only test, or an API-only
    exercise for the walkthrough.
  - Prefer the Gemini-backed model and tooling when this sandbox carries
    a key at `/home/debian/.gemini-api-key`; never print, log or commit
    it. A repository-declared template carries no capabilities of its
    own, so what the sandbox holds is whatever this deployment already
    gives tasks in this repository.
  - Walk the new UI at `/next/` first: it is the new experience, and the
    classic UI at `/` is being deprecated ("Two UIs" in `PROMPT.md`).
    `ui-ng/src/app/shell/nav.ts` (the rail) and
    `ui-ng/src/app/app.routes.ts` (every route) say which pages have
    moved over -- a page in neither, such as Boards, is classic-only;
    walk each step on its `/next/` page where one exists, and on the
    classic page only where it does not yet. Note in the report
    which UI each step ran against, and which steps have no `/next/`
    page yet. Fix a classic page only where it is broken for users
    today, and fix the same page in `ui-ng/` too. New regression
    coverage goes in a `ui-ng/e2e/` spec (run with
    `make test-e2e-ng`), not a classic one; keep the
    classic specs passing and don't delete them.
  - Explore beyond the scripted cases in `ui/e2e`. Check browser console
    errors, failed network requests, loading/empty/error states,
    keyboard reachability, and destructive-action confirmations relevant
    to this area.
  - Confirm mutations by returning to the screen, reloading and
    deep-linking where applicable, and observing the persisted result.
    Stub only an unavailable external or system boundary; keep the real
    server, frontend, browser and user gestures in the loop, and
    document every stub.
  - Record the commit tested, the environment, the exact steps, the
    outcomes and every stub in a dated report under `docs/test-runs/`,
    named `YYYY-MM-DD-saved-boards-and-visualizations.md`. Do not commit
    screenshots or generated browser artifacts.
  - For each bug found: capture a deterministic reproduction; fix it in
    this task when the correction is safe and scoped; add regression
    coverage at the strongest practical level; and run the relevant
    tests. If the fix is unsafe, materially separate, or needs
    infrastructure this sandbox does not have, propose a focused
    follow-up task with `branch: "main"` carrying the reproduction,
    the evidence and the expected behaviour.
