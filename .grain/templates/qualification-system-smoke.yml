name: Release qualification - Full system multi-team & upgrade smoke
title: "Qualify {{rc_tag}}: multi-team UI walkthroughs, state repository sync and deployment health"
base: main
auto-merge: false
# The reconciler files this item last, and only after
# qualification-mergequeue, qualification-ci-diagnostics and
# qualification-base-triage have all passed on the same candidate.
# Stage 2 of release-candidate qualification
# (design/playbook/releases.playbook.md §2). Filed by grain's
# release-qualification reconciler (pkg/orchestrator/releasequalification.go)
# with rc_tag and rc_sha filled in, and judged by it objectively: the run
# passes only if it opens no pull request, proposes nothing outside its own
# scratch branch, leaves no scratch branch or fixture task behind, and ends
# its closing note with the footer the body asks for.
fields:
  - name: rc_tag
    label: Release candidate tag (vX.Y.Z-rc.N)
  - name: rc_sha
    label: Release candidate commit (full sha)
body: |
  Execute full-system end-to-end multi-team UI walkthroughs, state repository
  synchronization soak tests, and deployment health validations against the
  release candidate.

  You are qualifying release candidate `{{rc_tag}}` at commit `{{rc_sha}}`.
  Check it out (`git fetch origin tag {{rc_tag}} && git checkout --detach {{rc_sha}}`)
  and judge that commit, not `main`'s tip.

  Build and run `grain demo` from that commit. This item is filed only after
  `qualification-mergequeue`, `qualification-ci-diagnostics` and
  `qualification-base-triage` have passed on `{rc_tag}`. It needs no
  scratch branch, so create none.

  ## 1. Multi-Team UI Walkthroughs

  - Launch the real `grain demo` server and execute multi-team user journeys using Playwright:
    - Exercise Repositories, Merge Queue, Releases, Tasks, and Settings views.
    - Test permission boundaries, team attribution, and custom field visibility across teams.
    - Validate interactive forms, real-time status updates, and deep links across UI surfaces.

  ## 2. State Repository Sync Soak

  - Subject the synchronized state repository to continuous multi-table read/write operations:
    - Exercise bidirectional reconciliation across `tables/*.json` (`repo_config`, `task`,
      `qualification_config`, `qualification_item`, etc.).
    - Verify data consistency, absence of sync divergence or race conditions, and clean git state.

  ## 3. Deployment Health & Resource Checks

  - Execute `read_deployment_health` and inspect systemd journal logs using `read_grain_log`:
    - Confirm zero unhandled panics, error loops, or reconciler crashes.
    - Validate host RAM, swap, disk utilisation, and standing microVM sandbox counts.
    - Verify that reconciler cycle times remain well within latency thresholds.

  ## 4. Report

  - Deliver the final qualification report for `{rc_tag}` in the closing
    note.

  ## What makes this a pass

  The verdict is read mechanically, not from your prose:

  - Do not push to this task's own branch and do not open a pull request.
    Any pull request fails qualification, including a real fix. Report a bug
    you find in the closing note with `Qualification-Verdict: FAIL`. The
    pipeline steward files the fix.
  - Finish with `comment_on_issue` (or `nothing_needed`), never
    `ask_question`.
  - End the closing note with exactly these three lines, the commit in full:

    ```text
    Qualification-Verdict: PASS
    Qualified-Tag: {{rc_tag}}
    Qualified-Commit: {{rc_sha}}
    ```

    Use `FAIL` when anything above did not behave as described. Use `INFRA`
    only when the environment stopped you (sandbox, git proxy, model quota,
    a daemon restart), and name the error. INFRA is re-run, not judged.
