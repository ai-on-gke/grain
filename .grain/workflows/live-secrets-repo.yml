# pkg/daemon's TestLiveSecretsRepo* against a private repository of its
# own, proving that a deployment's encrypted secrets file reaches
# github.com, comes back onto a rebuilt host, and shares a repository
# with a second deployment without either losing the other's file.
name: live-secrets-repo

on:
  schedule:
    - cron: "53 5 * * *"
  workflow_dispatch:

jobs:
  live-secrets-repo:
    name: secrets repository against a real remote
    capabilities: [github-sandbox]
    sandbox:
      cpus: 4
      memory-mb: 8192
      disk-gb: 20
    timeout-minutes: 20
    cache: false
    steps:
      - name: Require a repository and a credential
        run: |
          repo="${GRAIN_LIVE_SECRETS_REPO:-}"
          if [ -z "$repo" ] && [ -f /home/debian/.github-sandbox-repo ]; then
            repo="$(cat /home/debian/.github-sandbox-repo)"
          fi
          if [ -z "$repo" ]; then
            echo "No GRAIN_LIVE_SECRETS_REPO or /home/debian/.github-sandbox-repo reached this job." >&2
            exit 1
          fi

          token="${GRAIN_LIVE_SECRETS_REPO_TOKEN:-}"
          if [ -z "$token" ] && [ -f /home/debian/.github-sandbox-token ]; then
            token="$(cat /home/debian/.github-sandbox-token)"
          fi
          if [ -z "$token" ]; then
            echo "No GRAIN_LIVE_SECRETS_REPO_TOKEN or /home/debian/.github-sandbox-token reached this job." >&2
            exit 1
          fi
          echo "a repository ($repo) and a credential (${#token} characters) are present"

      - name: The secrets repository against a real remote
        env:
          GRAIN_LIVE_SECRETS_REPO_TEST: "1"
        run: go test ./pkg/daemon/ -run 'TestLiveSecretsRepo' -count=1 -v -timeout 15m
