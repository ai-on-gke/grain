# Make a pending release official, or drop it -- a person's answer to
# "vX.Y.0 is ready to promote" (design/design/release-from-trunk.design.md, §4).
#
# The release train (scripts/release-from-trunk.sh, run daily by
# .grain/workflows/release-train.yml) does everything up to the release
# and stops: a release candidate whose staging soak passes is tagged
# vX.Y.0-pending, its vX.Y.0-stamped images are built and published as
# :vX.Y.0-pending, the release-notes task is filed, and an operator
# notification offers Approve and Reject. This workflow is those two
# buttons, and it is the only thing that pushes vX.Y.0 or moves `latest`.
#
# human: required. Only a person starts it, never an agent and never a
# schedule:
#   - it answers workflow_dispatch and nothing else -- no push, no
#     release, no cron;
#   - it is started by POST /api/releases/{version}/approve or /reject
#     (`grain release approve vX.Y.0`, the Upgrade pane, the
#     notification's own buttons), which refuse any caller that is not a
#     person and set GRAIN_CI_REQUESTED_BY_KIND=human and
#     GRAIN_CI_RELEASE_VERSION on the run -- variables no API caller can
#     set (ci.Request.RequestedByKind is never read from JSON);
#   - every job refuses to run without them, so a dispatch by any other
#     route -- `grain ci run`, POST /api/ci/runs, an agent's run -- fails
#     at its first step and pushes nothing;
#   - .grain/triggers/release-promotion.yml holds every change to this
#     file for a person's Submit; the scripts it runs are held for grain's
#     security review, which checks they cannot move vX.Y.Z or latest
#     but through this approval (release-machinery.yml).
#
# approve refuses a pending release whose recorded staging soak is under
# the minimum (24h less the slack; release-from-trunk.sh writes it on the
# -pending tag, with whether FORCE was used) unless RELEASE_SHORT_SOAK_OK
# is true. Here that comes only from GRAIN_CI_RELEASE_SHORT_SOAK_OK, which
# the approval route sets when the person approving passes short_soak_ok
# (`grain release approve -short-soak-ok`, the SHORT SOAK approval in the
# UI) and which, like the variables above, no API caller and no env:
# block can set. .github/workflows/promote-release.yml takes the same
# answer as its short_soak_ok input.
#
# approve also refuses a release carrying breaking changes that is not the
# major release RELEASE_MAJOR asks for (release-notes.sh check-breaking)
# unless RELEASE_ALLOW_BREAKING names it. Here that comes only from
# GRAIN_CI_RELEASE_ALLOW_BREAKING, which the approval route sets when the
# person approving passes allow_breaking (`grain release approve
# -allow-breaking`) and which no API caller and no env: block can set
# either; the step turns it into RELEASE_ALLOW_BREAKING=<the release>.
# .github/workflows/promote-release.yml takes it as its allow_breaking
# input.
#
# The route selects one job: `promote` for an approval (which brings
# `approve` in front of it), `reject`, or `rollback` (started by
# POST /api/releases/{version}/rollback or `grain release rollback`,
# which set GRAIN_CI_RELEASE_ROLLBACK_TO and
# GRAIN_CI_RELEASE_ROLLBACK_REASON -- variables no API caller and no
# env: block can set). Dispatched whole, all four refuse.
name: promote-release

on:
  workflow_dispatch:

jobs:
  approve:
    name: approve the pending release
    # Each run is a decision, never a replay of one.
    cache: false
    capabilities:
      - {capability: "https://grain.dev/capabilities/repo#write", with: {repo: ai-on-gke/grain}}
      - "https://grain.dev/capabilities/release#package-publish"
    optional-capabilities: ["https://grain.dev/capabilities/release#image-signing"]
    # Approving builds nothing: release-images.sh promote finds the
    # stamped :vX.Y.0-pending images and retags them.
    timeout-minutes: 30
    steps:
      - name: Promote the pending release a person approved
        run: |
          allow_breaking=""
          if [ "${GRAIN_CI_RELEASE_ALLOW_BREAKING:-}" = true ]; then
            allow_breaking="$GRAIN_CI_RELEASE_VERSION"
          fi
          RELEASE_SHORT_SOAK_OK="${GRAIN_CI_RELEASE_SHORT_SOAK_OK:-false}" \
          RELEASE_ALLOW_BREAKING="$allow_breaking" \
            bash ./scripts/release-from-trunk.sh approve "$GRAIN_CI_RELEASE_VERSION"

  promote:
    # .grain/workflows/promote.yml's job, dispatched as the approval's last
    # step the way the orchestrator dispatches it after a release-train
    # run: publish whatever the git `latest` tag now names. After the
    # approve job's own `release-images.sh promote vX.Y.0` it is a few
    # manifest copies onto the tags they already hold.
    name: publish the promoted release as latest
    needs: [approve]
    cache: false
    capabilities: ["https://grain.dev/capabilities/release#package-publish"]
    optional-capabilities: ["https://grain.dev/capabilities/release#image-signing"]
    timeout-minutes: 30
    steps:
      - name: Refuse anybody but a person
        run: |
          if [ "${GRAIN_CI_REQUESTED_BY_KIND:-}" != human ]; then
            echo "promote-release: only a person approves a release" >&2
            exit 1
          fi
      - name: Publish the last promoted release as latest
        run: bash ./scripts/release-images.sh promote

  reject:
    name: reject the pending release
    cache: false
    capabilities:
      - {capability: "https://grain.dev/capabilities/repo#write", with: {repo: ai-on-gke/grain}}
      - "https://grain.dev/capabilities/release#package-publish"
    timeout-minutes: 30
    steps:
      - name: Drop the pending release a person rejected
        run: bash ./scripts/release-from-trunk.sh reject "$GRAIN_CI_RELEASE_VERSION"

  rollback:
    name: roll a promoted release back
    cache: false
    capabilities:
      - {capability: "https://grain.dev/capabilities/repo#write", with: {repo: ai-on-gke/grain}}
      - "https://grain.dev/capabilities/release#package-publish"
    optional-capabilities: ["https://grain.dev/capabilities/release#image-signing"]
    timeout-minutes: 30
    steps:
      - name: Retract the release a person rolled back and re-point latest
        run: |
          if [ "${GRAIN_CI_REQUESTED_BY_KIND:-}" != human ]; then
            echo "promote-release: only a person rolls a release back" >&2
            exit 1
          fi
          RELEASE_ROLLBACK_TO="${GRAIN_CI_RELEASE_ROLLBACK_TO:-}" \
          RELEASE_ROLLBACK_REASON="${GRAIN_CI_RELEASE_ROLLBACK_REASON:-}" \
            bash ./scripts/release-from-trunk.sh rollback --bad "$GRAIN_CI_RELEASE_VERSION"
