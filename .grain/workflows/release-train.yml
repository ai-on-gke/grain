# The release train: release grain continuously from main
# (design/playbook/releases.playbook.md; scripts/release-from-trunk.sh).
#
# Each run does two idempotent things and stops:
#
#   1. judges the release candidate in qualification, if there is one,
#      with candidate-gate.sh check-qualification: Stage 1 is nightly on
#      vX.Y.0-rc.N, Stage 2 the grain/release-qualification check run. A
#      pass stages the release: vX.Y.0-pending is tagged on the rc's
#      commit, its vX.Y.0-stamped images are published as :vX.Y.0-pending
#      (release-images.sh pending), the release-notes task is filed
#      (.grain/templates/release-notes.yml) and an operator notification
#      offers Approve and Reject. A red rc is dropped
#      (vX.Y.0-rc.N-discarded, release-images.sh discard-rc), and after
#      RELEASE_MAX_RC_ATTEMPTS of them the train cuts no more of that
#      version;
#   2. with nothing qualifying, and RELEASE_MIN_INTERVAL_MINUTES past the
#      last release, tags the newest known-good main commit vX.Y.0-rc.N,
#      force-moves refs/heads/candidate onto it and publishes its images
#      as :vX.Y.0-rc.N, :candidate and :rc (release-images.sh rc).
#
# It never pushes vX.Y.0 and never moves `latest`, as a git tag or as an
# image tag: a release becomes official only when a person approves it,
# and .grain/workflows/promote-release.yml -- workflow_dispatch only,
# human: required -- is the one thing that does. Nothing here may call
# `release-from-trunk.sh approve` or `release-images.sh promote`
# (TestTheReleaseTrainNeverPromotesARelease, tests/deploy).
#
# ai-on-gke/grain drives the train from GitHub Actions
# (.github/workflows/release-train.yml), woken by release, nightly and
# grain/release-qualification completions; this copy runs only by hand
# (a repository admin, from the CLI):
#
#     grain ci run -repo ai-on-gke/grain -branch main -event workflow_dispatch \
#       -job .grain/workflows/release-train.yml:train -watch
name: release-train

on:
  # Retired from automatic triggering: ai-on-gke/grain runs the release
  # train on GitHub Actions (.github/workflows/release-train.yml).
  workflow_dispatch:

jobs:
  train:
    name: cut, qualify and stage a release from trunk
    # Every run reads the remote's tags and the CI runs on main and on the
    # rc, none of which is in the tree: a replayed green is not a run.
    cache: false
    # repo-write pushes the rc, -discarded and -pending tags and moves
    # refs/heads/candidate (pkg/gitproxy/ciref.go); release-gate-read is
    # the api:release-gate-read token the script reads main's and the
    # rc's runs through, and files the release-notes task and the
    # release.pending notification with;
    # package-publish publishes the rc and pending images. Signing is
    # optional, as in release.yml: a deployment without a signing key
    # still releases.
    capabilities: ["repo-write:ai-on-gke/grain", release-gate-read, package-publish]
    optional-capabilities: [image-signing]
    # A run can build two sets of daemon images -- the pending release's
    # and the next rc's -- each about as long as promote.yml's one
    # rebuild; every other run is a few API reads and nothing else.
    timeout-minutes: 120
    sandbox:
      cpus: 4
      memory-mb: 16384
      disk-gb: 60
    steps:
      # package-publish answers `release`, `workflow_dispatch` and, like
      # repo-write and release-gate-read, the trusted schedule grain
      # itself fires from this file's cron (docs/ci-capabilities.md). A
      # run can still reach this job with no registry credential -- a
      # repository whose ci_capabilities lack package-publish, or a
      # caller's own `-event schedule` run. Without one the train would
      # push an rc or -pending tag and then fail to publish its images,
      # so it stops here instead, before touching any ref, and the run's
      # review says why.
      - name: Require the publishing credential
        run: |
          if [ ! -s /home/debian/.package-publish-token ] && [ "${RELEASE_IMAGES:-}" != off ]; then
            echo "release-train: no package-publish credential reached this ${GRAIN_CI_EVENT:-} run, so the rc and pending images could not be published; nothing was tagged." >&2
            echo "release-train: check that package-publish is in this repository's ci_capabilities (grain repo ci-capabilities), or run it by dispatch (see the top of this file)." >&2
            exit 1
          fi
      - name: Run the release train
        run: bash ./scripts/release-from-trunk.sh
