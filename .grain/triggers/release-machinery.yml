# Path trigger for the release jobs and the scripts they run
# (design/playbook/releases.playbook.md §0.3). They cut, build, publish and
# tag releases, but cannot make one official -- that is the person's
# approval, or the release train's promotion of a qualified rc
# (scripts/release-from-trunk.sh, release.conf), both release-promotion.yml's
# -- so grain's security review alone
# releases them. The review checks they still cannot move vX.Y.Z or
# `latest` without the approval, widen a workflow's permissions, secrets or
# dispatchers, weaken a person-only check, or raise RELEASE_MAJOR
# (trustboundary's release-machinery); any finding, or a review that cannot
# decide, leaves the change for a person.
on: pull_request
paths:
  - scripts/release-images.sh
  - scripts/release-notes.sh
  - scripts/candidate-gate.sh
  - scripts/patch-tag-guard.sh
  - scripts/build-version.sh
  - scripts/grain-ci-host.sh
  - scripts/buildvcs.sh
  - scripts/configure-dockerhub-auth.sh
  - scripts/release-image-repos.sh
  - scripts/release-train-actions.sh
  - scripts/release-assets.sh
  - scripts/build-cli.sh
  - .github/workflows/rc-qualification.yml
  - .grain/workflows/release.yml
  - .github/workflows/release.yml
  - .grain/workflows/promote.yml
  - .github/workflows/promote.yml
  - .grain/workflows/release-train.yml
  - .github/workflows/release-train.yml
  - .github/workflows/release-train-assets.yml
gate: true
sensitive: true
