name: Live secrets repository
# Runs .grain/workflows/live-secrets-repo.yml (pkg/daemon's
# TestLiveSecretsRepo* against a real private repository) nightly on
# grain CI. This repository is ci_mode: github, so grain drops that
# workflow's own `on: schedule` cron at every firing
# (suppressWorkflowGrainCIOff); the job cannot move to GitHub Actions,
# because its github-sandbox credential is a GitHub write token kept out
# of Actions secrets on purpose. grain-ci: true makes this schedule's
# firing the exception (docs/declarations.md, "Running on grain CI in a
# `ci_mode: github` repository"). The workflow keeps its own cron because
# a schedule can only run a workflow that answers a schedule event.
workflow: live-secrets-repo
grain-ci: true
base: main
# UTC, the workflow's own cron time (53 5 * * *).
daily:
  at: "05:53"
overlap: skip
