# Waivers for the release images' vulnerability gate
# (docs/image-vulnerability-scanning.md; cmd/image-vulns,
# scripts/scan-images.sh).
#
# The gate fails on a CRITICAL or HIGH finding that has a fixed version
# available. An entry here waives one: the vulnerability ids (`id`, or
# `ids` for several that share everything else), the package as Trivy
# names it, the image's leaf name (grain, sandbox, sandbox-k8s, hub, or
# "*"), optionally the target (a binary's path in the image, or "os" for
# its OS packages) -- and why, who owns getting rid of it, and when it
# expires. Every one of reason, owner and expires is required.
#
# An entry applies up to and including its expiry date and not after:
# an expired entry fails the gate again, which is the point -- it is a
# date to look again, not a way to stop looking. No entry may expire more
# than 180 days ahead. Entries that no finding matches any more are
# listed in every report as stale; delete them.
#
# Seeded from the first scan of main's images (2026-11-10). What was
# cheap was fixed in the same change (Debian base digest, kubectl
# v1.37.2, golang.org/x/net); what is below is not, and each group names
# the follow-up task fixing it.
entries:
  # cosign v3.1.4 (Dockerfile COSIGN_IMAGE), the newest release, built with
  # go1.27.1 and golang.org/x/net v0.61.0. The next cosign release built on
  # go1.27.3 with x/net v0.62.0 clears these; bump COSIGN_IMAGE then.
  - image: grain
    package: golang.org/x/net
    target: usr/local/bin/cosign
    reason: cosign v3.1.4, the newest release, vendors golang.org/x/net v0.61.0; take the next cosign release
    owner: release-train
    expires: "2026-12-31"
    followup: "image-vulns follow-up: bump cosign"
    ids: [CVE-2026-78661]
  - image: grain
    package: stdlib
    target: usr/local/bin/cosign
    reason: cosign v3.1.4, the newest release, is built with go1.27.1; take the next cosign release
    owner: release-train
    expires: "2026-12-31"
    followup: "image-vulns follow-up: bump cosign"
    ids: [CVE-2026-111943, CVE-2026-78667, CVE-2026-78669, CVE-2026-97031]
  # kubectl v1.37.2 (Dockerfile KUBECTL_VERSION) is the newest release, and
  # still vendors these; the next patch release should pick them up.
  - image: grain
    package: golang.org/x/net
    target: usr/local/bin/kubectl
    reason: kubectl v1.37.2, the newest release, vendors golang.org/x/net v0.57.0; take the next kubectl patch
    owner: release-train
    expires: "2026-12-31"
    followup: "bump KUBECTL_VERSION to the next 1.37 patch"
    ids: [CVE-2026-78661, CVE-2026-78669]
  - image: grain
    package: golang.org/x/text
    target: usr/local/bin/kubectl
    reason: kubectl v1.37.2, the newest release, vendors golang.org/x/text v0.40.0; take the next kubectl patch
    owner: release-train
    expires: "2026-12-31"
    followup: "bump KUBECTL_VERSION to the next 1.37 patch"
    ids: [CVE-2026-56851]
