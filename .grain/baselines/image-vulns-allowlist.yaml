# Waivers for the release images' vulnerability gate
# (docs/image-vulnerability-scanning.md; cmd/image-vulns,
# scripts/scan-images.sh).
#
# The gate fails on a CRITICAL or HIGH finding that has a fixed version
# available. An entry here waives one: the vulnerability ids (`id`, or
# `ids` for several that share everything else), the package as Trivy
# names it, the image's leaf name (grain, sandbox, sandbox-k8s, hub, or
# "*"), optionally the target (a binary's path in the image, or "os" for
# its OS packages) -- and why, who owns getting rid of it, and when it
# expires. Every one of reason, owner and expires is required.
#
# An entry applies up to and including its expiry date and not after:
# an expired entry fails the gate again, which is the point -- it is a
# date to look again, not a way to stop looking. No entry may expire more
# than 180 days ahead. Entries that no finding matches any more are
# listed in every report as stale; delete them.
#
# Seeded from the first scan of main's images (2026-11-10). What was
# cheap was fixed in the same change (Debian base digest, kubectl
# v1.37.2, golang.org/x/net); what is below is not, and each group names
# the follow-up task fixing it.
entries:
  # cosign v3.1.4 (Dockerfile COSIGN_IMAGE), the newest release, built with
  # go1.27.1 and golang.org/x/net v0.61.0. The next cosign release built on
  # go1.27.3 with x/net v0.62.0 clears these; bump COSIGN_IMAGE then.
  - image: grain
    package: golang.org/x/net
    target: usr/local/bin/cosign
    reason: cosign v3.1.4, the newest release, vendors golang.org/x/net v0.61.0; take the next cosign release
    owner: release-train
    expires: "2026-12-31"
    followup: "image-vulns follow-up: bump cosign"
    ids: [CVE-2026-78661]
  - image: grain
    package: stdlib
    target: usr/local/bin/cosign
    reason: cosign v3.1.4, the newest release, is built with go1.27.1; take the next cosign release
    owner: release-train
    expires: "2026-12-31"
    followup: "image-vulns follow-up: bump cosign"
    ids: [CVE-2026-111943, CVE-2026-78667, CVE-2026-78669, CVE-2026-97031]
  # kubectl v1.37.2 (Dockerfile KUBECTL_VERSION) is the newest release, and
  # still vendors these; the next patch release should pick them up.
  - image: grain
    package: golang.org/x/net
    target: usr/local/bin/kubectl
    reason: kubectl v1.37.2, the newest release, vendors golang.org/x/net v0.57.0; take the next kubectl patch
    owner: release-train
    expires: "2026-12-31"
    followup: "bump KUBECTL_VERSION to the next 1.37 patch"
    ids: [CVE-2026-78661, CVE-2026-78669]
  - image: grain
    package: golang.org/x/text
    target: usr/local/bin/kubectl
    reason: kubectl v1.37.2, the newest release, vendors golang.org/x/text v0.40.0; take the next kubectl patch
    owner: release-train
    expires: "2026-12-31"
    followup: "bump KUBECTL_VERSION to the next 1.37 patch"
    ids: [CVE-2026-56851]
  #
  # The guest's packed root filesystem, scanned as sandbox-rootfs since
  # scripts/scan-images.sh learned to read a pack's disk (2026-11-10). Its
  # Debian packages had nothing fixable outstanding; the bundled tools did,
# and what of those a bump could fix was fixed (Node.js 24 with a newer
# npm, act, kind and actionlint rebuilt on the guest's Go, gcloud's pip).
  # granule's guest agents inside the guest's own root filesystem, built
  # by third_party/granule with go1.22 like the copies in the pack above.
  - image: sandbox-rootfs
    package: stdlib
    target: usr/local/bin/granule-agent
    reason: granule's guest binaries are built with go1.22.12; fix in gke-labs/granule, then re-vendor
    owner: release-train
    expires: "2027-01-15"
    followup: "image-vulns follow-up: rebuild granule's guest binaries on a supported Go"
    ids: [CVE-2025-61726, CVE-2025-61729, CVE-2025-68121, CVE-2026-111943, CVE-2026-25679, CVE-2026-27145, CVE-2026-32280, CVE-2026-32281, CVE-2026-32283, CVE-2026-33811, CVE-2026-33814, CVE-2026-33818, CVE-2026-39820, CVE-2026-39821, CVE-2026-39822, CVE-2026-39836, CVE-2026-42499, CVE-2026-42504, CVE-2026-56853, CVE-2026-56858, CVE-2026-56859, CVE-2026-56860, CVE-2026-56862, CVE-2026-78667, CVE-2026-78669, CVE-2026-97031]
  - image: sandbox-rootfs
    package: stdlib
    target: usr/local/bin/granule-container
    reason: granule's guest binaries are built with go1.22.12; fix in gke-labs/granule, then re-vendor
    owner: release-train
    expires: "2027-01-15"
    followup: "image-vulns follow-up: rebuild granule's guest binaries on a supported Go"
    ids: [CVE-2025-61726, CVE-2025-61729, CVE-2025-68121, CVE-2026-111943, CVE-2026-25679, CVE-2026-27145, CVE-2026-32280, CVE-2026-32281, CVE-2026-32283, CVE-2026-33811, CVE-2026-33814, CVE-2026-33818, CVE-2026-39820, CVE-2026-39821, CVE-2026-39822, CVE-2026-39836, CVE-2026-42499, CVE-2026-42504, CVE-2026-56853, CVE-2026-56858, CVE-2026-56859, CVE-2026-56860, CVE-2026-56862, CVE-2026-78667, CVE-2026-78669, CVE-2026-97031]
  - image: sandbox-rootfs
    package: stdlib
    target: usr/local/bin/granule-mem-agent
    reason: granule's guest binaries are built with go1.22.12; fix in gke-labs/granule, then re-vendor
    owner: release-train
    expires: "2027-01-15"
    followup: "image-vulns follow-up: rebuild granule's guest binaries on a supported Go"
    ids: [CVE-2025-61726, CVE-2025-61729, CVE-2025-68121, CVE-2026-111943, CVE-2026-25679, CVE-2026-27145, CVE-2026-32280, CVE-2026-32281, CVE-2026-32283, CVE-2026-33811, CVE-2026-33814, CVE-2026-33818, CVE-2026-39820, CVE-2026-39821, CVE-2026-39822, CVE-2026-39836, CVE-2026-42499, CVE-2026-42504, CVE-2026-56853, CVE-2026-56858, CVE-2026-56859, CVE-2026-56860, CVE-2026-56862, CVE-2026-78667, CVE-2026-78669, CVE-2026-97031]
  # setuptools as pip lists it in pip/_vendor/vendor.txt, inside
  # google-cloud-cli's bundled Python (Granulefile PIP_VERSION). pip
  # vendors only setuptools' pkg_resources, not the package_index module
  # CVE-2025-47273 is in, and even pip 26.3, the newest, still lists
  # setuptools 70.3.0. The pip upgrade that fixed this tree's msgpack and
  # urllib3 cannot move this one.
  - image: sandbox-rootfs
    package: setuptools
    target: Python
    reason: pip 26.3, the newest, vendors pkg_resources from setuptools 70.3.0 (not package_index, where the CVE is); take the pip release that moves it
    owner: release-train
    expires: "2026-12-31"
    followup: "bump Granulefile PIP_VERSION once pip vendors a fixed setuptools"
    ids: [CVE-2025-47273]
  # The docker-ce and google-cloud-cli apt repositories' newest builds.
  # The guest installs whatever those repositories carry when it is built,
  # so these clear once upstream ships a release built against the fix.
  - image: sandbox-rootfs
    package: stdlib
    target: usr/lib/google-cloud-sdk/bin/gcloud-crc32c
    reason: vendored by the newest docker-ce / google-cloud-cli apt packages; clears when upstream releases
    owner: release-train
    expires: "2026-12-31"
    ids: [CVE-2026-111943]
  - image: sandbox-rootfs
    package: golang.org/x/net
    target: usr/lib/google-cloud-sdk/bin/gke-gcloud-auth-plugin
    reason: vendored by the newest docker-ce / google-cloud-cli apt packages; clears when upstream releases
    owner: release-train
    expires: "2026-12-31"
    ids: [CVE-2026-78661]
  - image: sandbox-rootfs
    package: github.com/moby/go-archive
    target: usr/libexec/docker/cli-plugins/docker-buildx
    reason: vendored by the newest docker-ce / google-cloud-cli apt packages; clears when upstream releases
    owner: release-train
    expires: "2026-12-31"
    ids: [CVE-2026-17106]
  - image: sandbox-rootfs
    package: golang.org/x/net
    target: usr/libexec/docker/cli-plugins/docker-buildx
    reason: vendored by the newest docker-ce / google-cloud-cli apt packages; clears when upstream releases
    owner: release-train
    expires: "2026-12-31"
    ids: [CVE-2026-78661, CVE-2026-78669]
  - image: sandbox-rootfs
    package: golang.org/x/net
    target: usr/libexec/docker/cli-plugins/docker-compose
